<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchères des agents libres</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="encheres.css">
<script src="site-nav.js"></script>
<script src="encheres-donnees.js"></script>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="encheres"></site-header>

  <div class="filter-band ench-band">
    <span class="ench-regles">Départ min. 50 jetons · surenchère +20 · 24 h, relancé à 12 h à chaque mise</span>
    <a class="publish-btn ench-lancer" href="https://publier.lnhq.ca/encheres.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Lancer une enchère
    </a>
  </div>

  <main id="content">
    <div id="loader" class="ench-page">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div>Impossible de charger les enchères.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div class="ench-page ench-disposition" id="page" hidden>
      <!-- Colonne de gauche sur ordinateur ; sous le reste sur téléphone. -->
      <aside class="ench-histo">
        <h2 class="ench-titre">Historique</h2>
        <ol class="ench-fil" id="historique"></ol>
        <p class="ench-vide" id="aucunHistorique" hidden>Aucune mise pour l'instant.</p>
      </aside>

      <div class="ench-principal">
        <section>
          <h2 class="ench-titre">Enchères en cours <span class="ench-compte" id="compteEnCours"></span></h2>
          <div class="ench-grille" id="enCours"></div>
          <p class="ench-vide" id="aucuneEnCours" hidden>Aucune enchère en cours. Lance la première !</p>
        </section>

        <section>
          <h2 class="ench-titre">Jetons des équipes <span class="ench-compte" id="saison"></span></h2>
          <div class="ench-jetons" id="jetons"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
/* LNHQ — enchères des agents libres (lecture seule). On mise sur publier.lnhq.ca. */
const E = window.LNHQ_ENCHERES;
const MISER = 'https://publier.lnhq.ca/encheres.html';
const els = {
  title: document.getElementById('sheetTitle'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  retryBtn: document.getElementById('retryBtn'),
  page: document.getElementById('page'),
  enCours: document.getElementById('enCours'),
  compteEnCours: document.getElementById('compteEnCours'),
  aucuneEnCours: document.getElementById('aucuneEnCours'),
  jetons: document.getElementById('jetons'),
  saison: document.getElementById('saison'),
  historique: document.getElementById('historique'),
  aucunHistorique: document.getElementById('aucunHistorique'),
};
const HISTORIQUE_MAX = 60;
els.title.textContent = 'LNHQ';
let donnees = null;
let ancreSuivie = false;
const noms = new Map();
const quand = new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function logo(code){
  const img = el('img', 'ench-logo');
  img.src = 'Logos/' + code + '.png';
  img.alt = '';
  img.onerror = () => { img.style.visibility = 'hidden'; };
  return img;
}
const nomEquipe = code => noms.get(code) || code;

function carteEnCours(e){
  const carte = el('article', 'ench-carte');
  carte.id = 'e-' + e.id;
  const tete = el('div', 'ench-joueur');
  tete.append(el('strong', null, e.joueur), el('span', null, [e.position, e.ov && e.ov + ' OV'].filter(Boolean).join(' · ')));

  const meneur = el('div', 'ench-meneur');
  const qui = el('div', 'ench-qui');
  qui.append(el('span', 'ench-etiquette', 'En tête'), el('strong', null, nomEquipe(e.equipe)));
  const montant = el('div', 'ench-montant');
  montant.append(el('strong', null, e.mise), el('span', null, 'jetons'));
  meneur.append(logo(e.equipe), qui, montant);

  const chrono = el('div', 'ench-chrono');
  const reste = el('strong', 'ench-reste');
  reste.dataset.fin = e.fin;
  reste.textContent = E.tempsRestant(e.fin);
  chrono.append(el('span', null, 'Fin dans'), reste, el('span', 'ench-fin', quand.format(new Date(e.fin))));

  const pied = el('div', 'ench-pied');
  pied.append(el('span', null, `${e.nb} mise${e.nb > 1 ? 's' : ''} · prochaine : ${e.mise + E.REGLES.surenchere} jetons min.`));
  const bouton = el('a', 'ench-bouton', 'Surenchérir');
  bouton.href = MISER + '?id=' + encodeURIComponent(e.id);
  pied.append(bouton);

  // Dernières mises de cette enchère.
  const hist = donnees.mises.filter(m => m.id === e.id).slice(-4).reverse();
  const liste = el('ol', 'ench-historique');
  hist.forEach(m => {
    const li = el('li');
    li.append(el('span', null, nomEquipe(m.equipe)), el('span', null, m.mise + ' jetons'), el('time', null, quand.format(new Date(m.date))));
    liste.append(li);
  });

  carte.append(tete, meneur, chrono, liste, pied);
  return carte;
}

function render(){
  noms.clear();
  donnees.equipes.forEach(eq => noms.set(eq.code, eq.nom));
  const enCours = donnees.encheres.filter(e => e.statut === 'En cours').sort((a, b) => new Date(a.fin) - new Date(b.fin));
  els.enCours.replaceChildren(...enCours.map(carteEnCours));
  els.aucuneEnCours.hidden = !!enCours.length;
  els.compteEnCours.textContent = enCours.length ? '(' + enCours.length + ')' : '';

  // Jetons : une petite tuile par équipe, dans l'ordre alphabétique (chacun retrouve
  // la sienne au même endroit). Engagés et dépensés seulement s'il y en a.
  els.saison.textContent = donnees.saison ? 'Saison ' + donnees.saison : '';
  els.jetons.replaceChildren(...donnees.equipes.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr')).map(eq => {
    const tuile = el('div', 'ench-tuile' + (eq.disponibles < eq.depart ? ' is-active' : ''));
    tuile.title = `${eq.nom} : ${eq.disponibles} disponibles · ${eq.engages} engagés · ${eq.depenses} dépensés`;
    const texte = el('div', 'ench-tuile-texte');
    texte.append(el('span', 'ench-tuile-nom', eq.nom), el('strong', 'ench-dispo', eq.disponibles));
    const detail = [eq.engages && eq.engages + ' engagés', eq.depenses && eq.depenses + ' dépensés'].filter(Boolean).join(' · ');
    if(detail) texte.append(el('span', 'ench-tuile-detail', detail));
    tuile.append(logo(eq.code), texte);
    return tuile;
  }));

  renderHistorique();

  els.rowCount.textContent = `${enCours.length} enchère${enCours.length > 1 ? 's' : ''} en cours`;
  if(!ancreSuivie && location.hash){
    const cible = document.getElementById(location.hash.slice(1));
    if(cible){ cible.scrollIntoView({ block: 'start' }); cible.classList.add('is-ciblee'); ancreSuivie = true; }
  }
}

// Historique : chaque mise (la première = lancement) et chaque fin d'enchère, du plus récent au plus ancien.
function renderHistorique(){
  const premieres = new Map();
  donnees.mises.forEach(m => {
    const p = premieres.get(m.id);
    if(!p || new Date(m.date) < new Date(p.date)) premieres.set(m.id, m);
  });
  const joueurs = new Map(donnees.encheres.map(e => [e.id, e]));
  const evenements = donnees.mises.map(m => ({
    date: m.date, id: m.id, equipe: m.equipe, type: premieres.get(m.id) === m ? 'lance' : 'mise',
    texte: premieres.get(m.id) === m ? `lance l'enchère sur ${m.joueur}` : `mise sur ${m.joueur}`, montant: m.mise,
  }));
  donnees.encheres.filter(e => e.statut === 'Terminée' || e.statut === 'Annulée').forEach(e => {
    evenements.push(e.statut === 'Annulée'
      ? { date: e.fin, id: e.id, equipe: e.equipe, type: 'annulee', texte: `Enchère sur ${e.joueur} annulée`, montant: null }
      : { date: e.fin, id: e.id, equipe: e.equipe, type: 'fin', texte: `remporte ${e.joueur}`, montant: e.mise });
  });
  evenements.sort((a, b) => new Date(b.date) - new Date(a.date));

  els.historique.replaceChildren(...evenements.slice(0, HISTORIQUE_MAX).map(ev => {
    const li = el('li', 'ench-evt is-' + ev.type);
    // Cible des liens Discord « Enchère terminée » (#e-id).
    if(ev.type === 'fin' || ev.type === 'annulee') li.id = 'e-' + ev.id;
    const corps = el('div', 'ench-evt-corps');
    const phrase = el('span', 'ench-evt-texte');
    if(ev.type !== 'annulee') phrase.append(el('strong', null, nomEquipe(ev.equipe) + ' '));
    phrase.append(ev.type === 'fin' ? '🏁 ' + ev.texte : ev.texte);
    corps.append(phrase, el('time', null, quand.format(new Date(ev.date))));
    li.append(logo(ev.equipe), corps);
    if(ev.montant != null) li.append(el('span', 'ench-evt-montant', ev.montant));
    // Un clic sur une mise d'une enchère encore ouverte mène à sa carte.
    const e = joueurs.get(ev.id);
    if(e && e.statut === 'En cours'){
      li.classList.add('is-lien');
      li.addEventListener('click', () => {
        const carte = document.getElementById('e-' + ev.id);
        if(carte){ carte.scrollIntoView({ behavior: 'smooth', block: 'center' }); carte.classList.add('is-ciblee'); setTimeout(() => carte.classList.remove('is-ciblee'), 1500); }
      });
    }
    return li;
  }));
  els.aucunHistorique.hidden = !!evenements.length;
}

function show(etat){
  els.loader.hidden = etat !== 'loading';
  els.errorBox.hidden = etat !== 'error';
  els.page.hidden = etat !== 'data';
}

async function load({ background = false } = {}){
  if(!background) show('loading');
  try{
    donnees = await E.charger();
    show('data');
    render();
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-CA', { hour: '2-digit', minute: '2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background) show('error');
  }
}

els.retryBtn.addEventListener('click', () => load());
load();
// Comptes à rebours chaque seconde ; données fraîches chaque minute.
setInterval(() => document.querySelectorAll('.ench-reste').forEach(s => { s.textContent = E.tempsRestant(s.dataset.fin); }), 1000);
setInterval(() => { if(!document.hidden) load({ background: true }); }, 60 * 1000);
</script>
</body>
</html>
