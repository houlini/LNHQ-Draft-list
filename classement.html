<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement de la ligue</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css">
<script src="site-nav.js"></script>
<script src="resultats-donnees.js"></script>
<style>
  .cl-page{ padding:16px clamp(12px,3vw,40px) 30px; max-width:980px; margin:0 auto; width:100%; box-sizing:border-box; }
  .cl-titre{
    margin:0 0 10px; font-family:'Oswald', 'IBM Plex Sans', sans-serif; font-weight:500;
    font-size:19px; text-transform:uppercase; letter-spacing:0.02em;
  }
  .cl-titre span{ font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:400; color:var(--ink-muted); text-transform:none; margin-left:6px; }
  .cl-carte{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .cl-table{ width:100%; border-collapse:collapse; font-size:14px; }
  .cl-table th, .cl-table td{ padding:8px 6px; text-align:center; white-space:nowrap; }
  .cl-table thead th{
    background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  .cl-table tbody tr{ border-top:1px solid var(--line); }
  .cl-table tbody tr:nth-child(even){ background:var(--stripe); }
  .cl-table td{ font-family:'IBM Plex Mono', monospace; }
  .cl-table .cl-rang{ width:32px; color:var(--ink-muted); }
  .cl-table .cl-equipe{ text-align:left; font-family:inherit; width:100%; }
  .cl-table .cl-pts{ font-weight:700; color:var(--accent); }
  .cl-equipe a{ display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none; min-width:0; }
  .cl-equipe a:hover .nom-long{ color:var(--accent); text-decoration:underline; }
  .cl-equipe img{ width:24px; height:24px; object-fit:contain; flex-shrink:0; }
  .cl-diff.is-pos{ color:var(--positive); }
  .cl-diff.is-neg{ color:var(--negative); }
  .nom-court{ display:none; }
  .cl-note{ margin:12px 2px 0; font-size:13px; color:var(--ink-muted); line-height:1.5; }
  .cl-etat{ padding:24px; text-align:center; color:var(--ink-muted); }
  @media (max-width:600px){
    .cl-table{ font-size:13px; }
    .cl-table th, .cl-table td{ padding:7px 3px; }
    .cl-cache-mobile{ display:none; }
    .nom-long{ display:none; }
    .nom-court{ display:inline; font-family:'IBM Plex Mono', monospace; font-weight:700; }
  }
</style>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="classement"></site-header>

  <main id="content">
    <div class="cl-page">
      <h2 class="cl-titre">Classement <span id="sousTitre"></span></h2>
      <div class="cl-carte">
        <table class="cl-table">
          <thead>
            <tr>
              <th class="cl-rang" title="Rang">#</th>
              <th class="cl-equipe">Équipe</th>
              <th title="Parties jouées">PJ</th>
              <th title="Victoires">V</th>
              <th title="Défaites">D</th>
              <th title="Défaites en prolongation ou en tirs de barrage">DP</th>
              <th title="Points">PTS</th>
              <th class="cl-cache-mobile" title="Buts pour">BP</th>
              <th class="cl-cache-mobile" title="Buts contre">BC</th>
              <th title="Différentiel">DIFF</th>
            </tr>
          </thead>
          <tbody id="lignes"><tr><td colspan="10" class="cl-etat">Chargement…</td></tr></tbody>
        </table>
      </div>
      <p class="cl-note">
        Victoire = 2 points · défaite en prolongation ou en tirs de barrage (DP) = 1 point.
        Égalité : victoires, puis différentiel, puis buts pour. Les résultats viennent des photos
        de fin de match soumises par les DGs.
      </p>
    </div>
  </main>
</div>

<script>
document.getElementById('sheetTitle').textContent = 'LNHQ';
(function(){
  const tbody = document.getElementById('lignes');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };

  async function charger(){
    const equipes = window.LNHQ_TEAMS || [];
    let resultats;
    try{ resultats = await LNHQ_RESULTATS.chargerResultats(); }
    catch(e){ tbody.replaceChildren(etat('Impossible de charger le classement pour le moment.')); return; }
    const nb = Object.keys(resultats).length;
    document.getElementById('sousTitre').textContent = nb ? `${nb} match${nb > 1 ? 's' : ''} joué${nb > 1 ? 's' : ''}` : 'aucun match joué pour l’instant';
    const parCode = Object.fromEntries(equipes.map(t => [t.code, t]));
    tbody.replaceChildren(...LNHQ_RESULTATS.classement(resultats, equipes.map(t => t.code)).map((e, i) => {
      const t = parCode[e.code] || { name: e.code, slug: '' };
      const tr = el('tr');
      const lien = el('a');
      if(t.slug) lien.href = 'equipe.html?team=' + t.slug;
      const img = el('img'); img.src = 'Logos/' + e.code + '.png'; img.alt = ''; img.loading = 'lazy';
      lien.append(img, el('span', 'nom-long', t.name), el('span', 'nom-court', e.code));
      const tdEquipe = el('td', 'cl-equipe'); tdEquipe.append(lien);
      const diff = el('td', 'cl-diff' + (e.diff > 0 ? ' is-pos' : e.diff < 0 ? ' is-neg' : ''), (e.diff > 0 ? '+' : '') + e.diff);
      tr.append(el('td', 'cl-rang', String(i + 1)), tdEquipe,
        el('td', null, e.pj), el('td', null, e.v), el('td', null, e.d), el('td', null, e.dp),
        el('td', 'cl-pts', e.pts), el('td', 'cl-cache-mobile', e.bp), el('td', 'cl-cache-mobile', e.bc), diff);
      return tr;
    }));
  }
  function etat(texte){
    const tr = el('tr'); const td = el('td', 'cl-etat', texte); td.colSpan = 10; tr.append(td); return tr;
  }
  charger();
})();
</script>
</body>
</html>
