<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LNHQ TV</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css?v=7">
<script src="site-nav.js?v=3"></script>
<style>
  .tv-page{ padding:16px clamp(16px,3vw,40px) 40px; display:flex; flex-direction:column; gap:22px; }

  /* ---------- Lecteur (+ clavardage à droite sur grand écran) ---------- */
  .tv-scene{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:1100px){ .tv-scene.avec-chat{ grid-template-columns:1fr 340px; } }
  .tv-lecteur{ position:relative; aspect-ratio:16 / 9; background:#000; border-radius:var(--radius); overflow:hidden; }
  .tv-lecteur iframe, .tv-chat iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .tv-chat{ position:relative; display:none; border-radius:var(--radius); overflow:hidden; background:var(--surface); border:1px solid var(--line); }
  @media (min-width:1100px){ .tv-scene.avec-chat .tv-chat{ display:block; } }
  .tv-infos{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
  .tv-infos img{ width:36px; height:36px; object-fit:contain; }
  .tv-infos-titre{ flex:1 1 240px; min-width:0; }
  .tv-infos-titre strong{ display:block; font-family:'Oswald', 'IBM Plex Sans', sans-serif; font-weight:500; font-size:19px; color:var(--accent); text-transform:uppercase; }
  .tv-infos-titre span{ display:block; color:var(--ink-muted); font-size:14px; overflow-wrap:anywhere; }
  .tv-lien{ color:var(--accent); font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; }
  .tv-lien:hover{ text-decoration:underline; }
  .tv-vide{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center;
    aspect-ratio:16 / 9; max-height:420px; width:100%;
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); color:var(--ink-muted); padding:20px;
  }
  .tv-vide img{ width:64px; height:64px; opacity:0.6; }

  /* ---------- Listes de chaînes ---------- */
  .tv-groupe h2{
    margin:0 0 10px; font-family:'Oswald', 'IBM Plex Sans', sans-serif; font-weight:500;
    font-size:18px; text-transform:uppercase; letter-spacing:0.02em; display:flex; align-items:center; gap:8px;
  }
  .tv-grille{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .tv-carte{
    all:unset; box-sizing:border-box; cursor:pointer;
    display:flex; gap:12px; align-items:center; padding:12px 14px; min-height:64px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  }
  .tv-carte:hover{ border-color:var(--accent); }
  .tv-carte:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .tv-carte.is-choisie{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--accent-soft); }
  .tv-carte.is-hors-ligne{ opacity:0.72; }
  .tv-carte.is-hors-ligne:hover, .tv-carte.is-hors-ligne.is-choisie{ opacity:1; }
  .tv-carte img{ width:42px; height:42px; object-fit:contain; flex-shrink:0; }
  .tv-carte-corps{ min-width:0; flex:1; }
  .tv-carte-nom{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
  .tv-carte-nom span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tv-carte-detail{ color:var(--ink-muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tv-badge{
    flex-shrink:0; font-size:10.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase;
    padding:2px 7px; border-radius:999px; background:#E03131; color:#fff;
  }
  .tv-badge.is-autre{ background:var(--stripe); color:var(--ink-muted); }
  .tv-point{ width:10px; height:10px; border-radius:50%; background:#E03131; box-shadow:0 0 0 3px rgba(224,49,49,0.25); }
  .tv-compte{ font-weight:400; color:var(--ink-muted); font-family:'IBM Plex Sans', sans-serif; font-size:14px; text-transform:none; }

  /* ---------- Choix de l'affichage : 1, 2 ou 4 streams ---------- */
  .tv-band{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; width:100%; }
  .tv-modes{ display:inline-flex; padding:4px; gap:4px; border-radius:12px; background:rgba(0,0,0,0.12); }
  .tv-modes button{
    display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:0 14px; border:none; border-radius:9px; cursor:pointer;
    background:transparent; color:#fff; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .tv-modes button:hover{ background:rgba(255,255,255,0.15); }
  .tv-modes button[aria-pressed="true"]{ background:var(--nav-dark); }
  .tv-modes svg{ width:18px; height:14px; }

  /* ---------- Plusieurs streams ---------- */
  .tv-multi{ display:grid; grid-template-columns:1fr; gap:10px; align-content:start; }
  @media (min-width:900px){ .tv-multi.mode-2, .tv-multi.mode-4{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .tv-case{ display:flex; flex-direction:column; min-width:0; border-radius:var(--radius); overflow:hidden; background:var(--surface); border:1px solid var(--line); }
  .tv-case.is-chat{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tv-case-tete{
    display:flex; align-items:center; gap:8px; min-height:36px; padding:4px 6px 4px 10px; cursor:pointer;
    font-size:13.5px; font-weight:700; border-bottom:1px solid var(--line);
  }
  .tv-case-tete img{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .tv-case-tete .tv-case-nom{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tv-case-tete .tv-case-detail{ font-weight:400; color:var(--ink-muted); font-size:12.5px; white-space:nowrap; }
  .tv-case-fermer{
    all:unset; cursor:pointer; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:6px; color:var(--ink-muted); font-size:18px; flex-shrink:0;
  }
  .tv-case-fermer:hover{ background:var(--accent-soft); color:var(--ink); }
  .tv-case .tv-lecteur{ border-radius:0; }
  .tv-case-vide{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center;
    aspect-ratio:16 / 9; padding:16px; color:var(--ink-muted); font-size:14px; border:1px dashed var(--line); border-radius:var(--radius);
  }
  @media (min-width:1100px){ .tv-scene.avec-chat .tv-chat{ min-height:420px; } }
  @media (max-width:600px){
    /* Bande plus mince : modes et résumé sur la même ligne. */
    .tv-band{ flex-wrap:nowrap; gap:8px; }
    .tv-modes{ flex:1 1 auto; min-width:0; padding:3px; gap:3px; }
    .tv-modes button{ flex:1; justify-content:center; padding:0 6px; min-height:32px; gap:5px; }
    #resume{ flex-shrink:0; font-size:13px; white-space:nowrap; }
  }
</style>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="tv"></site-header>

  <div class="filter-band">
    <div class="tv-band">
      <div class="tv-modes" role="group" aria-label="Nombre de streams affichés">
        <button type="button" data-mode="1" title="1 stream"><svg viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="18" height="14" rx="2"/></svg>1</button>
        <button type="button" data-mode="2" title="2 streams"><svg viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="8" height="14" rx="2"/><rect x="10" y="0" width="8" height="14" rx="2"/></svg>2</button>
        <button type="button" data-mode="4" title="4 streams"><svg viewBox="0 0 18 14" fill="currentColor"><rect x="0" y="0" width="8" height="6" rx="1.5"/><rect x="10" y="0" width="8" height="6" rx="1.5"/><rect x="0" y="8" width="8" height="6" rx="1.5"/><rect x="10" y="8" width="8" height="6" rx="1.5"/></svg>4</button>
      </div>
      <span id="resume" style="font-weight:700">LNHQ TV</span>
    </div>
  </div>

  <main id="content">
    <div id="loader" style="padding:16px clamp(16px,3vw,40px)">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div id="errorText">Impossible de savoir qui est en direct pour le moment.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div class="tv-page" id="tvPage" hidden>
      <section id="scene"></section>
      <section class="tv-groupe" id="groupeLive" hidden>
        <h2><span class="tv-point"></span>En direct <span class="tv-compte" id="compteLive"></span></h2>
        <div class="tv-grille" id="grilleLive"></div>
      </section>
      <section class="tv-groupe" id="groupeHors" hidden>
        <h2>Hors ligne <span class="tv-compte" id="compteHors"></span></h2>
        <div class="tv-grille" id="grilleHors"></div>
      </section>
      <p class="empty-state" id="aucuneChaine" hidden>Aucune chaîne Twitch pour l'instant : ajoute-les dans la colonne TWITCH de l'onglet DGs du classeur.</p>
    </div>
  </main>
</div>

<script>
/* =========================================================================
   LNHQ TV — chaînes Twitch des DG (colonne TWITCH de l'onglet DGs), lues par
   l'API api.lnhq.ca/twitch (clés Twitch côté serveur, mise à jour chaque minute).
   Une chaîne compte « en direct » si elle diffuse avec le tag LNHQ (ou #LNHQ dans
   le titre). Un clic sur une chaîne change le lecteur ; ?chaine=nom dans l'adresse.
   ========================================================================= */
const API = 'https://api.lnhq.ca/twitch';
const RAFRAICHIR_MS = 60 * 1000;

const els = {
  title: document.getElementById('sheetTitle'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  errorText: document.getElementById('errorText'),
  retryBtn: document.getElementById('retryBtn'),
  page: document.getElementById('tvPage'),
  scene: document.getElementById('scene'),
  resume: document.getElementById('resume'),
  groupeLive: document.getElementById('groupeLive'),
  grilleLive: document.getElementById('grilleLive'),
  compteLive: document.getElementById('compteLive'),
  groupeHors: document.getElementById('groupeHors'),
  grilleHors: document.getElementById('grilleHors'),
  compteHors: document.getElementById('compteHors'),
  aucune: document.getElementById('aucuneChaine'),
};
els.title.textContent = 'LNHQ';

const params = new URLSearchParams(location.search);
const MODES = [1, 2, 4];
function modeInitial(){
  const p = Number(params.get('vue'));
  if(MODES.includes(p)) return p;
  try{ const m = Number(localStorage.getItem('lnhqTvMode')); if(MODES.includes(m)) return m; }catch(e){}
  return 1;
}
const state = {
  chaines: [],
  choisie: (params.get('chaine') || '').toLowerCase(),
  // Le son n'est activé qu'après un clic : les navigateurs bloquent la lecture auto avec son.
  sonActif: false,
  lecteurDe: '',
  // Mode 2 ou 4 : une chaîne par case ('' = case libre), toujours en sourdine.
  mode: modeInitial(),
  cases: (params.get('chaines') || '').toLowerCase().split(',').filter(Boolean),
  fermees: new Set(),   // retirées par le lecteur : pas remises automatiquement
  chat: '',             // case dont le clavardage est affiché
  multi: null,          // éléments de la grille déjà construits (pour ne pas recharger les vidéos)
};
const nombre = new Intl.NumberFormat('fr-CA');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function logo(code, cls){
  const img = el('img', cls);
  img.src = code ? 'Logos/' + code + '.png' : 'logo-lnhq.png';
  img.alt = '';
  img.onerror = () => { img.src = 'logo-lnhq.png'; };
  return img;
}

const enDirect = c => c.live && c.lnhq;

function depuis(iso){
  const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0');
}

function iframe(src, titre){
  const f = el('iframe');
  f.src = src;
  f.title = titre;
  f.allowFullscreen = true;
  f.setAttribute('allow', 'autoplay; fullscreen');
  return f;
}

const hote = location.hostname;
const lecteurSrc = (chaine, muet) => `https://player.twitch.tv/?channel=${chaine}&parent=${hote}&autoplay=true&muted=${muet}`;
const chatSrc = chaine => `https://www.twitch.tv/embed/${chaine}/chat?parent=${hote}` + (matchMedia('(prefers-color-scheme: dark)').matches ? '&darkpopout' : '');
const trouver = chaine => state.chaines.find(x => x.chaine === chaine);

/* ---------- Mode 2 ou 4 streams ----------
   Les cases vides se remplissent avec les directs #LNHQ les plus regardés. Chaque case
   garde sa place : seule une case qui change est reconstruite (les autres vidéos
   continuent sans redémarrer). */
function remplirCases(live){
  const cases = state.cases.slice(0, state.mode).map(c => (trouver(c) ? c : ''));
  while(cases.length < state.mode) cases.push('');
  const libres = live.map(c => c.chaine).filter(c => !cases.includes(c) && !state.fermees.has(c));
  for(let i = 0; i < cases.length && libres.length; i++) if(!cases[i]) cases[i] = libres.shift();
  state.cases = cases;
  if(!cases.includes(state.chat)) state.chat = cases.find(Boolean) || '';
}

function caseVide(){
  const v = el('div', 'tv-case-vide');
  v.append(el('strong', null, 'Case libre'), el('span', null, 'Choisis une chaîne plus bas pour l’afficher ici.'));
  return v;
}

function caseStream(chaine){
  const boite = el('div', 'tv-case');
  boite.dataset.chaine = chaine;
  const tete = el('div', 'tv-case-tete');
  tete.title = 'Afficher le clavardage de cette chaîne';
  tete.addEventListener('click', () => { state.chat = chaine; render(); });
  const fermer = el('button', 'tv-case-fermer', '✕');
  fermer.type = 'button';
  fermer.title = 'Retirer cette chaîne';
  fermer.addEventListener('click', ev => { ev.stopPropagation(); basculer(chaine); });
  tete.append(el('img'), el('span', 'tv-case-nom'), el('span', 'tv-case-detail'), fermer);
  const lecteur = el('div', 'tv-lecteur');
  lecteur.append(iframe(lecteurSrc(chaine, true), 'Lecteur Twitch de ' + chaine));
  boite.append(tete, lecteur);
  return boite;
}

function renderMulti(live){
  remplirCases(live);
  if(!state.multi || state.multi.mode !== state.mode){
    const scene = el('div', 'tv-scene avec-chat');
    const grille = el('div', 'tv-multi mode-' + state.mode);
    const chat = el('div', 'tv-chat');
    scene.append(grille, chat);
    els.scene.replaceChildren(scene);
    state.multi = { mode: state.mode, grille, chat, chatDe: '', places: [] };
    for(let i = 0; i < state.mode; i++){ const v = caseVide(); grille.append(v); state.multi.places.push({ chaine: '', el: v }); }
  }
  const m = state.multi;
  state.cases.forEach((chaine, i) => {
    const place = m.places[i];
    if(place.chaine !== chaine){
      const nouvel = chaine ? caseStream(chaine) : caseVide();
      place.el.replaceWith(nouvel);
      m.places[i] = { chaine, el: nouvel };
    }
    if(!chaine) return;
    // En-tête mis à jour à chaque rafraîchissement (spectateurs, en direct ou non).
    const c = trouver(chaine);
    const tete = m.places[i].el.querySelector('.tv-case-tete');
    const img = tete.querySelector('img');
    const src = c.code ? 'Logos/' + c.code + '.png' : 'logo-lnhq.png';
    if(img.getAttribute('src') !== src){ img.src = src; img.alt = ''; }
    tete.querySelector('.tv-case-nom').textContent = (c.nom || c.chaine) + (c.equipe ? ' · ' + c.equipe : '');
    tete.querySelector('.tv-case-detail').textContent = enDirect(c) ? '🔴 ' + nombre.format(c.spectateurs || 0) : 'Hors ligne';
    m.places[i].el.classList.toggle('is-chat', chaine === state.chat);
  });
  if(m.chatDe !== state.chat){
    m.chatDe = state.chat;
    m.chat.replaceChildren(...(state.chat ? [iframe(chatSrc(state.chat), 'Clavardage Twitch de ' + state.chat)] : []));
  }
  m.chat.style.visibility = state.chat ? '' : 'hidden';
  majAdresse();
}

// Mode multi : un clic sur une chaîne l'ajoute (case libre, sinon la dernière) ou la retire.
function basculer(chaine){
  const i = state.cases.indexOf(chaine);
  if(i >= 0){
    state.cases[i] = '';
    state.fermees.add(chaine);
  }else{
    state.fermees.delete(chaine);
    const libre = state.cases.indexOf('');
    state.cases[libre >= 0 ? libre : state.mode - 1] = chaine;
    state.chat = chaine;
  }
  render();
}

function changerMode(mode){
  if(mode === state.mode) return;
  // On garde la chaîne regardée : elle devient la 1re case (ou la chaîne du mode 1).
  if(mode === 1) state.choisie = state.chat || state.cases.find(Boolean) || state.choisie;
  else if(state.mode === 1 && state.choisie) state.cases = [state.choisie];
  state.mode = mode;
  state.multi = null;
  state.lecteurDe = '';
  try{ localStorage.setItem('lnhqTvMode', String(mode)); }catch(e){}
  render();
}

function majAdresse(){
  const url = new URL(location.href);
  if(state.mode === 1){
    url.searchParams.delete('vue'); url.searchParams.delete('chaines');
    if(state.choisie) url.searchParams.set('chaine', state.choisie);
  }
  else{
    url.searchParams.set('vue', String(state.mode));
    url.searchParams.delete('chaine');
    const liste = state.cases.filter(Boolean);
    if(liste.length) url.searchParams.set('chaines', liste.join(','));
    else url.searchParams.delete('chaines');
  }
  history.replaceState(null, '', url);
}

// Lecteur et clavardage : reconstruits seulement si la chaîne change (sinon la
// vidéo redémarrerait à chaque mise à jour de la liste).
function renderScene(){
  const c = state.chaines.find(x => x.chaine === state.choisie);
  if(!c){
    state.lecteurDe = '';
    const vide = el('div', 'tv-vide');
    vide.append(logo('', ''), el('strong', null, 'Personne n’est en direct avec le tag #LNHQ pour l’instant.'),
      el('span', null, 'Les directs apparaissent ici automatiquement. Choisis une chaîne plus bas pour voir ses anciennes vidéos.'));
    els.scene.replaceChildren(vide);
    return;
  }
  const hote = location.hostname;
  if(state.lecteurDe !== c.chaine){
    state.lecteurDe = c.chaine;
    const scene = el('div', 'tv-scene avec-chat');
    const lecteur = el('div', 'tv-lecteur');
    lecteur.append(iframe(`https://player.twitch.tv/?channel=${c.chaine}&parent=${hote}&autoplay=true&muted=${!state.sonActif}`, 'Lecteur Twitch de ' + c.chaine));
    const chat = el('div', 'tv-chat');
    const sombre = matchMedia('(prefers-color-scheme: dark)').matches ? '&darkpopout' : '';
    chat.append(iframe(`https://www.twitch.tv/embed/${c.chaine}/chat?parent=${hote}${sombre}`, 'Clavardage Twitch de ' + c.chaine));
    scene.append(lecteur, chat);
    const infos = el('div', 'tv-infos');
    infos.id = 'tvInfos';
    els.scene.replaceChildren(scene, infos);
  }
  // Titre, équipe et spectateurs : mis à jour à chaque rafraîchissement.
  const infos = document.getElementById('tvInfos');
  const texte = el('div', 'tv-infos-titre');
  texte.append(el('strong', null, (c.nom || c.chaine) + (c.equipe ? ' · ' + c.equipe : '')),
    el('span', null, enDirect(c) ? `${c.titre || ''}${c.spectateurs != null ? ' — ' + nombre.format(c.spectateurs) + ' spectateurs' : ''}` : 'Hors ligne — anciennes vidéos de la chaîne'));
  const lien = el('a', 'tv-lien', 'Ouvrir sur Twitch ↗');
  lien.href = 'https://www.twitch.tv/' + c.chaine;
  lien.target = '_blank';
  lien.rel = 'noopener';
  infos.replaceChildren(logo(c.code, ''), texte, lien);
}

function carte(c){
  const choisie = state.mode === 1 ? c.chaine === state.choisie : state.cases.includes(c.chaine);
  const b = el('button', 'tv-carte' + (enDirect(c) ? '' : ' is-hors-ligne') + (choisie ? ' is-choisie' : ''));
  b.type = 'button';
  b.setAttribute('aria-pressed', String(choisie));
  const corps = el('div', 'tv-carte-corps');
  const nom = el('div', 'tv-carte-nom');
  nom.append(el('span', null, c.nom || c.chaine));
  if(enDirect(c)) nom.append(el('span', 'tv-badge', 'En direct'));
  else if(c.live) nom.append(el('span', 'tv-badge is-autre', 'En ligne sans #LNHQ'));
  const detail = enDirect(c)
    ? `${nombre.format(c.spectateurs || 0)} spectateurs · depuis ${depuis(c.debut)}${c.titre ? ' · ' + c.titre : ''}`
    : [c.equipe, c.dg].filter(Boolean).join(' · ');
  corps.append(nom, el('div', 'tv-carte-detail', detail));
  b.title = enDirect(c) && c.titre ? c.titre : (c.nom || c.chaine);
  b.append(logo(c.code, ''), corps);
  b.addEventListener('click', () => {
    if(state.mode === 1) choisir(c.chaine);
    else{ basculer(c.chaine); els.scene.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  return b;
}

function choisir(chaine){
  if(chaine === state.choisie) return;
  state.choisie = chaine;
  state.sonActif = true;
  const url = new URL(location.href);
  url.searchParams.set('chaine', chaine);
  history.replaceState(null, '', url);
  render();
  els.scene.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function render(){
  const live = state.chaines.filter(enDirect).sort((a, b) => (b.spectateurs || 0) - (a.spectateurs || 0));
  const hors = state.chaines.filter(c => !enDirect(c)).sort((a, b) => (b.live - a.live) || a.equipe.localeCompare(b.equipe, 'fr'));
  // Par défaut : le direct le plus regardé.
  if(!state.choisie && live.length) state.choisie = live[0].chaine;

  document.querySelectorAll('.tv-modes button').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.mode) === state.mode)));
  if(state.mode === 1){ state.multi = null; renderScene(); majAdresse(); }
  else renderMulti(live);
  els.grilleLive.replaceChildren(...live.map(carte));
  els.grilleHors.replaceChildren(...hors.map(carte));
  els.groupeLive.hidden = !live.length;
  els.groupeHors.hidden = !hors.length;
  els.compteLive.textContent = live.length ? '(' + live.length + ')' : '';
  els.compteHors.textContent = hors.length ? '(' + hors.length + ')' : '';
  els.aucune.hidden = !!state.chaines.length;
  els.resume.textContent = live.length ? `🔴 ${live.length} en direct` : 'Personne en direct';
  els.rowCount.textContent = `${state.chaines.length} chaîne${state.chaines.length > 1 ? 's' : ''}`;
}

function show(etat){
  els.loader.hidden = etat !== 'loading';
  els.errorBox.hidden = etat !== 'error';
  els.page.hidden = etat !== 'data';
}

async function load({ background = false } = {}){
  if(!background) show('loading');
  try{
    const rep = await fetch(API, { cache: 'no-store' });
    const d = await rep.json();
    // Sans clés Twitch (ou Twitch indisponible), la liste des chaînes reste affichée, toutes hors ligne.
    if(!d.chaines) throw new Error(d.erreur || 'http_' + rep.status);
    state.chaines = d.chaines;
    show('data');
    render();
    els.lastUpdated.textContent = d.ok
      ? 'Mis à jour à ' + new Intl.DateTimeFormat('fr-CA', { hour: '2-digit', minute: '2-digit' }).format(new Date())
      : 'Statut des directs indisponible pour le moment';
  }catch(err){
    console.error(err);
    if(!background) show('error');
  }
}

els.retryBtn.addEventListener('click', () => load());
document.querySelectorAll('.tv-modes button').forEach(b => b.addEventListener('click', () => changerMode(Number(b.dataset.mode))));
load();
setInterval(() => { if(!document.hidden) load({ background: true }); }, RAFRAICHIR_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load({ background: true }); });
</script>
</body>
</html>
