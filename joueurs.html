<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents libres</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css?v=9">
<script src="site-nav.js?v=9"></script>
<script src="encheres-donnees.js?v=6"></script>
<script src="sans-contrat.js"></script>
<script src="stats-joueur.js?v=5" defer></script>
<style>
  /* Le tableau occupe toute la largeur du cadre ; il défile horizontalement sur mobile */
  #tableWrap table{ width:100%; }
  #tableWrap th, #tableWrap td{ white-space:nowrap; }
  #tableWrap th:not(:first-child), #tableWrap td:not(:first-child){ text-align:center; }
  #tableWrap td.is-numeric{ font-variant-numeric:tabular-nums; }
  /* Joueur en enchère : pastille sous le nom (équipe en tête, mise, temps restant) */
  .pastille-enchere{
    display:flex; align-items:center; gap:4px; width:max-content; margin-top:3px;
    padding:1px 7px 1px 4px; border-radius:999px; font-size:11.5px; font-weight:600;
    background:var(--accent); color:var(--accent-ink); text-decoration:none;
  }
  .pastille-enchere:hover{ filter:brightness(1.08); }
  .pastille-enchere img{ width:16px; height:16px; object-fit:contain; }
  .pastille-temps{ font-variant-numeric:tabular-nums; }
  .pastille-enchere.is-tirage{ background:#9775FA; color:#fff; }
  #tableWrap tr.a-enchere td:first-child{ box-shadow:inset 3px 0 0 var(--accent); }
  .filtre-encheres{ flex-direction:row; align-items:center; gap:6px; cursor:pointer; font-weight:600; white-space:nowrap; }
  .filtre-encheres input{ width:16px; height:16px; accent-color:var(--nav-dark, #222); }
</style>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="joueurs"></site-header>

  <div class="filter-band">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Rechercher…" aria-label="Rechercher dans les données">
    </div>
    <div class="filter-bar" id="filterBar" hidden></div>
  </div>

  <main id="content">
    <div id="loader">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>


    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div id="errorText">Impossible de charger les données.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" hidden>
      <table>
        <thead><tr id="tableHeadRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div id="noteSansContrat"></div>
    <p class="empty-state" id="emptyState" hidden></p>
  </main>
</div>

<script>
/* =========================================================================
   CONFIGURATION — à adapter à votre Google Sheet
   ========================================================================= */
const CONFIG = {
  // L'ID se trouve dans l'URL de votre feuille :
  // https://docs.google.com/spreadsheets/d/CET_ID_ICI/edit#gid=0
  SHEET_ID: '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A',

  // Agents libres disponibles aux enchères : joueurs de PLAYERSDATABASE dont LNHQ TM (colonne Z) = UFA.
  SHEET: 'PLAYERSDATABASE',
  QUERY: "select B, C, D, G, H, J, K, L, M, N, O, P, Q, R, S, T, U, V, W where Z = 'UFA' order by C desc",

  // Libellés des colonnes de la requête (gviz ne renvoie pas d'en-têtes avec un filtre where).
  // M = années de contrat, N–W = salaire par saison (les saisons vides pour tous sont masquées).
  LABELS: ['JOUEUR', 'OV', 'Âge', 'NAT', 'PO', 'SH', 'Taille', 'Poids', 'Ans',
    '2026-27', '2027-28', '2028-29', '2029-30', '2030-31', '2031-32', '2032-33', '2033-34', '2034-35', '2035-36'],
  PREMIERE_SAISON: 9,

  // Titre affiché en haut du widget.
  TITLE: 'LNHQ',

  // Colonnes à ne jamais afficher : un nombre = position (0 = première colonne de la requête),
  // un texte = nom exact de l'en-tête (insensible à la casse).
  HIDDEN_COLUMNS: [],

  // Colonnes à afficher comme un petit drapeau plutôt que du texte.
  // La cellule doit contenir un code pays à 2 lettres (ex: CA, US, SE, FI, CZ, RU).
  FLAG_COLUMNS: ['NAT'],

  // Colonnes à mettre en évidence (fond orange, texte blanc). Même syntaxe que HIDDEN_COLUMNS.
  // Ici : OV
  HIGHLIGHT_COLUMNS: ['OV'],

  // Colonnes pour lesquelles afficher un menu déroulant de filtre (nom exact de l'en-tête).
  // Les valeurs proposées sont détectées automatiquement dans les données.
  FILTER_COLUMNS: ['PO', 'SH'],

  // Ordre personnalisé des valeurs dans le menu déroulant d'une colonne filtrable
  // (clé = nom exact de l'en-tête ; valeurs non listées passent après, triées alphabétiquement).
  FILTER_VALUE_ORDER: {},

  // Colonne des positions (« C », « C/RW », « LD/RD »…) : menu fixe, et un joueur à plusieurs
  // positions sort sous chacune. Valeur → libellé ; A, D = tous les attaquants / défenseurs.
  POSITION_COLUMN: 'PO',
  POSITION_OPTIONS: [['A', 'Attaquants'], ['C', 'C'], ['LW', 'LW'], ['RW', 'RW'],
    ['D', 'Défenseurs'], ['LD', 'LD'], ['RD', 'RD'], ['G', 'Gardiens']],

  // Renommage du LIBELLÉ AFFICHÉ DANS LE FILTRE seulement (la colonne du tableau garde son vrai nom).
  FILTER_LABELS: {
    PO: 'Position',
    SH: 'Shoot',
  },

  // Colonnes filtrées par curseur "maximum" plutôt que par liste de valeurs (ex: un plafond salarial).
  MAX_FILTER_COLUMNS: [
    { column: '2026-27', label: 'Salaire maximum' },
  ],
};
/* ========================================================================= */

const els = {
  app: document.querySelector('.app'),
  title: document.getElementById('sheetTitle'),
  search: document.getElementById('searchInput'),
  filterBar: document.getElementById('filterBar'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  errorText: document.getElementById('errorText'),
  retryBtn: document.getElementById('retryBtn'),
  tableWrap: document.getElementById('tableWrap'),
  tableHeadRow: document.getElementById('tableHeadRow'),
  tableBody: document.getElementById('tableBody'),
  emptyState: document.getElementById('emptyState'),
};

els.title.textContent = CONFIG.TITLE;

const state = {
  columns: [],   // [{ label, isNumeric }]
  rows: [],      // [{ display: [...], numeric: [...] }]
  filtered: [],
  sortCol: -1,
  sortDir: 1,
  query: '',
  activeFilters: new Map(), // colIndex (brut) -> valeur sélectionnée
  activeMaxFilters: new Map(), // colIndex (brut) -> valeur maximum
  encheres: new Map(),     // « Nom, Prénom » -> enchère en cours (onglet ENCHERES)
  sansContrat: null,       // joueurs « Sans contrat LNH » (contrat fictif LNHQ), voir sans-contrat.js
  seulementEncheres: false,
};

function buildUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json`
    + `&sheet=${encodeURIComponent(CONFIG.SHEET)}&headers=1&tq=${encodeURIComponent(CONFIG.QUERY)}&t=${Date.now()}`;
}

/* ---------- Cache local : affichage instantané au chargement suivant ---------- */
const CACHE_KEY = 'sheetCache_' + CONFIG.SHEET_ID + '_ufa3';

function loadFromCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToCache(table){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ table, ts: Date.now() }));
  }catch(e){ /* stockage indisponible ou plein : on ignore silencieusement */ }
}

async function loadData({ background=false } = {}){
  if(!background) toggle({ loading:true });
  try{
    const res = await fetch(buildUrl());
    if(!res.ok) throw new Error('http_' + res.status);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
    if(!match) throw new Error('format_inattendu');
    const json = JSON.parse(match[1]);
    if(json.status === 'error'){
      throw new Error(json.errors && json.errors[0] && json.errors[0].reason || 'erreur_gviz');
    }
    parseTable(json.table);
    saveToCache(json.table);
    toggle({ loading:false });
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background){
      toggle({ loading:false, error:true });
    }
    // En arrière-plan : on garde les données déjà affichées (issues du cache) et on retentera au prochain chargement.
  }
}

function makeColumnMatcher(list, rawLabels){
  const indices = new Set((list || []).filter(v => typeof v === 'number'));
  const labels = new Set((list || []).filter(v => typeof v === 'string').map(v => v.trim().toLowerCase()));
  return i => indices.has(i) || labels.has(rawLabels[i].trim().toLowerCase());
}

function parseTable(table){
  if(table.cols.length !== CONFIG.LABELS.length) throw new Error('colonnes_inattendues');
  const rawLabels = CONFIG.LABELS.slice();
  state.rawLabels = rawLabels;
  const estSaison = i => i >= CONFIG.PREMIERE_SAISON;

  const lignes = table.rows.map(r => {
    const raw = CONFIG.LABELS.map((_, i) => {
      const cell = (r.c || [])[i];
      if(!cell) return '';
      // Salaires : on reformate la valeur brute (format de la feuille parfois incohérent)
      if(estSaison(i) && typeof cell.v === 'number') return cell.v > 0 ? formatMoney(cell.v) : '';
      return String(cell.f != null ? cell.f : (cell.v != null ? cell.v : '')).trim();
    });
    // "Nom, Prénom" → "Prénom Nom" (l'original sert à repérer l'enchère) ; âge décimal → années complètes
    raw.b = raw[0];
    const v = raw[0].indexOf(',');
    if(v > 0) raw[0] = raw[0].slice(v + 1).trim() + ' ' + raw[0].slice(0, v).trim();
    const age = parseFloat(raw[2]);
    raw[2] = Number.isNaN(age) ? '' : String(Math.floor(age));
    return raw;
  }).filter(raw => raw[0] && raw[0].toUpperCase() !== 'JOUEUR');

  // Saisons sans aucun contrat : colonne masquée
  const saisonsVides = new Set(rawLabels.map((_, i) => i)
    .filter(i => estSaison(i) && lignes.every(raw => !raw[i])));
  const masquee = makeColumnMatcher(CONFIG.HIDDEN_COLUMNS, rawLabels);
  const isHidden = i => masquee(i) || saisonsVides.has(i);
  const isFlag = makeColumnMatcher(CONFIG.FLAG_COLUMNS, rawLabels);
  const isHighlight = makeColumnMatcher(CONFIG.HIGHLIGHT_COLUMNS, rawLabels);

  state.columns = rawLabels
    .map((label, i) => ({
      rawLabel: label,
      label,
      isNumeric: table.cols[i].type === 'number',
      isFlag: isFlag(i),
      isHighlight: isHighlight(i),
    }))
    .filter((_, i) => !isHidden(i));

  state.rows = lignes.map(raw => ({ raw, b: raw.b, display: raw.filter((_, i) => !isHidden(i)) }));

  renderFilterBar();
  applyFilterAndSort();
}

function parseNumericCell(raw){
  if(raw === '' || raw == null) return null;
  const n = parseFloat(String(raw).replace(/[^\d.-]/g, ''));
  return Number.isNaN(n) ? null : n;
}

function formatMoney(n){
  return new Intl.NumberFormat('fr-CA').format(Math.round(n)) + ' $';
}

function renderFilterBar(){
  els.filterBar.innerHTML = '';
  let any = false;

  (CONFIG.FILTER_COLUMNS || []).forEach(name => {
    const colIndex = state.rawLabels.findIndex(
      l => l.trim().toLowerCase() === String(name).trim().toLowerCase()
    );
    if(colIndex === -1) return;
    any = true;

    const order = (CONFIG.FILTER_VALUE_ORDER || {})[name];
    const estPosition = name === CONFIG.POSITION_COLUMN;
    const values = estPosition ? CONFIG.POSITION_OPTIONS.map(o => o[0]) : Array.from(
      new Set(state.rows.map(r => r.raw[colIndex]).filter(v => v !== ''))
    ).sort((a, b) => {
      if(order){
        const ia = order.findIndex(o => o.toLowerCase() === a.trim().toLowerCase());
        const ib = order.findIndex(o => o.toLowerCase() === b.trim().toLowerCase());
        if(ia !== -1 || ib !== -1){
          if(ia === -1) return 1;
          if(ib === -1) return -1;
          return ia - ib;
        }
      }
      return a.localeCompare(b, 'fr-FR');
    });

    const wrap = document.createElement('div');
    wrap.className = 'filter-control';

    const label = document.createElement('label');
    label.textContent = (CONFIG.FILTER_LABELS || {})[name] || state.rawLabels[colIndex];
    label.htmlFor = 'filter-col-' + colIndex;

    const select = document.createElement('select');
    select.id = 'filter-col-' + colIndex;

    const optAll = document.createElement('option');
    optAll.value = '';
    optAll.textContent = 'Tous';
    select.appendChild(optAll);

    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = estPosition ? CONFIG.POSITION_OPTIONS.find(o => o[0] === v)[1] : v;
      if(state.activeFilters.get(colIndex) === v) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener('change', () => {
      if(select.value === '') state.activeFilters.delete(colIndex);
      else state.activeFilters.set(colIndex, select.value);
      render();
    });

    wrap.appendChild(label);
    wrap.appendChild(select);
    els.filterBar.appendChild(wrap);
  });

  (CONFIG.MAX_FILTER_COLUMNS || []).forEach(entry => {
    const colIndex = state.rawLabels.findIndex(
      l => l.trim().toLowerCase() === String(entry.column).trim().toLowerCase()
    );
    if(colIndex === -1) return;

    const numbers = state.rows
      .map(r => parseNumericCell(r.raw[colIndex]))
      .filter(n => n !== null);
    if(!numbers.length) return;
    const dataMin = Math.min(...numbers);
    const dataMax = Math.max(...numbers);
    if(dataMin === dataMax) return;
    any = true;

    const step = Math.max(1, Math.round((dataMax - dataMin) / 100));
    const current = state.activeMaxFilters.has(colIndex) ? state.activeMaxFilters.get(colIndex) : dataMax;

    const wrap = document.createElement('div');
    wrap.className = 'filter-control filter-range';

    const label = document.createElement('label');
    label.textContent = entry.label;
    label.htmlFor = 'filter-max-' + colIndex;

    const input = document.createElement('input');
    input.type = 'range';
    input.id = 'filter-max-' + colIndex;
    input.min = dataMin;
    input.max = dataMax;
    input.step = step;
    input.value = current;

    const valueSpan = document.createElement('span');
    valueSpan.className = 'filter-range-value';
    valueSpan.textContent = formatMoney(current);

    input.addEventListener('input', () => {
      valueSpan.textContent = formatMoney(Number(input.value));
    });
    input.addEventListener('change', () => {
      const v = Number(input.value);
      if(v >= dataMax) state.activeMaxFilters.delete(colIndex);
      else state.activeMaxFilters.set(colIndex, v);
      render();
    });

    wrap.appendChild(label);
    wrap.appendChild(input);
    wrap.appendChild(valueSpan);
    els.filterBar.appendChild(wrap);
  });

  // Case « Enchères en cours » : seulement les joueurs mis aux enchères en ce moment.
  if(state.encheres.size){
    any = true;
    const wrap = document.createElement('label');
    wrap.className = 'filter-control filtre-encheres';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = state.seulementEncheres;
    box.addEventListener('change', () => { state.seulementEncheres = box.checked; render(); });
    wrap.append(box, document.createTextNode(` Enchères en cours (${state.encheres.size})`));
    els.filterBar.appendChild(wrap);
  }

  els.filterBar.hidden = !any;
}

// Codes pays à 3 lettres (norme CIO/IIHF, utilisée dans le hockey) → code ISO à 2 lettres
const NAT_TO_ISO2 = {
  can:'ca', usa:'us', swe:'se', fin:'fi', rus:'ru', cze:'cz', svk:'sk', ger:'de', sui:'ch',
  fra:'fr', den:'dk', nor:'no', lat:'lv', blr:'by', kaz:'kz', aut:'at', ita:'it', svn:'si',
  hun:'hu', pol:'pl', jpn:'jp', kor:'kr', chn:'cn', gbr:'gb', ned:'nl', ukr:'ua', est:'ee',
  ltu:'lt', rou:'ro', cro:'hr', srb:'rs', bul:'bg', esp:'es', aus:'au', nzl:'nz', rsa:'za',
  mex:'mx', bra:'br', arg:'ar', chi:'cl', isl:'is', irl:'ie', bel:'be', por:'pt', gre:'gr',
  tur:'tr', isr:'il', ind:'in', tha:'th', hkg:'hk', tpe:'tw', sgp:'sg', mas:'my', phi:'ph',
  ina:'id', mgl:'mn', geo:'ge', arm:'am', aze:'az', uzb:'uz', kgz:'kg', tkm:'tm', tjk:'tj',
  mda:'md', lux:'lu', mlt:'mt', cyp:'cy', and:'ad', mon:'mc', lie:'li', smr:'sm', bih:'ba',
  mkd:'mk', mne:'me', alb:'al',
};

function appendFlag(container, raw){
  const code = (raw || '').trim().toLowerCase();
  const iso2 = code.length === 2 ? code : NAT_TO_ISO2[code];
  if(iso2 && /^[a-z]{2}$/.test(iso2)){
    const img = document.createElement('img');
    img.src = `https://flagcdn.com/24x18/${iso2}.png`;
    img.alt = raw.toUpperCase();
    img.title = raw.toUpperCase();
    img.width = 24; img.height = 18;
    img.loading = 'lazy';
    img.className = 'flag-icon';
    img.onerror = () => { container.textContent = raw; };
    container.appendChild(img);
  }else{
    container.textContent = raw;
  }
}

// « C/RW » → ['C', 'RW'] ; anciennes valeurs : L → LW, R → RW, D → LD et RD.
function positionsDe(raw){
  return String(raw || '').toUpperCase().split(/[\/,\s]+/).filter(Boolean)
    .flatMap(p => p === 'L' ? ['LW'] : p === 'R' ? ['RW'] : p === 'D' ? ['LD', 'RD'] : [p]);
}
function jouePosition(raw, filtre){
  const pos = positionsDe(raw);
  if(filtre === 'A') return pos.some(p => ['C', 'LW', 'RW'].includes(p));
  if(filtre === 'D') return pos.some(p => ['LD', 'RD'].includes(p));
  return pos.includes(filtre);
}

function applyFilterAndSort(){
  const q = state.query.trim().toLocaleLowerCase('fr-FR');
  let rows = state.rows.filter(r => {
    for(const [colIndex, val] of state.activeFilters){
      if(state.rawLabels[colIndex] === CONFIG.POSITION_COLUMN){
        if(!jouePosition(r.raw[colIndex], val)) return false;
      }else if((r.raw[colIndex] || '') !== val) return false;
    }
    for(const [colIndex, maxVal] of state.activeMaxFilters){
      const v = parseNumericCell(r.raw[colIndex]);
      if(v !== null && v > maxVal) return false;
    }
    if(q && !r.display.some(v => v.toLocaleLowerCase('fr-FR').includes(q))) return false;
    if(state.seulementEncheres && !state.encheres.has(r.b)) return false;
    return true;
  });

  if(state.sortCol >= 0){
    const col = state.sortCol;
    const numeric = state.columns[col] && state.columns[col].isNumeric;
    rows.sort((a, b) => {
      const av = a.display[col] || '';
      const bv = b.display[col] || '';
      if(numeric){
        const an = parseNumericCell(av), bn = parseNumericCell(bv);
        if(an === null || bn === null) return (an === null) - (bn === null); // vides à la fin
        return (an - bn) * state.sortDir;
      }
      return av.localeCompare(bv, 'fr-FR') * state.sortDir;
    });
  }
  state.filtered = rows;
}

function toggle({ loading=false, error=false } = {}){
  els.loader.hidden = !loading;
  els.errorBox.hidden = !error;
  const showData = !loading && !error;
  els.tableWrap.hidden = !showData;
  if(showData) render();
}

function render(){
  applyFilterAndSort();
  renderTableHead();
  renderTableBody();

  const total = state.rows.length;
  const shown = state.filtered.length;
  els.rowCount.textContent = state.query
    ? `${shown} résultat${shown > 1 ? 's' : ''} sur ${total}`
    : `${total} agent${total > 1 ? 's' : ''} libre${total > 1 ? 's' : ''}`;

  els.emptyState.hidden = shown !== 0;
  if(shown === 0){
    els.emptyState.textContent = state.query
      ? `Aucun résultat pour « ${state.query} ».`
      : 'Aucune donnée à afficher.';
  }
}

function renderTableHead(){
  els.tableHeadRow.innerHTML = '';
  state.columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col.label;
    if(col.isHighlight) th.classList.add('col-highlight');
    if(state.sortCol === i){
      const mark = document.createElement('span');
      mark.className = 'sort-mark';
      mark.textContent = state.sortDir === 1 ? '↑' : '↓';
      th.appendChild(mark);
    }
    th.addEventListener('click', () => {
      state.sortDir = (state.sortCol === i) ? -state.sortDir : 1;
      state.sortCol = i;
      render();
    });
    els.tableHeadRow.appendChild(th);
  });
}

function renderTableBody(){
  els.tableBody.innerHTML = '';
  state.filtered.forEach((row, idx) => {
    const tr = document.createElement('tr');
    if(idx < 20) tr.classList.add('row-in');
    if(idx < 20) tr.style.animationDelay = (idx * 25) + 'ms';
    const sansContrat = !!(state.sansContrat && state.sansContrat.cles.has(LNHQ_SANS_CONTRAT.cle(row.b)));
    const aSalaire = row.display.some((v, i) => /^\d{4}-\d{2}$/.test(state.columns[i].rawLabel) && /\d/.test(v));
    row.display.forEach((val, i) => {
      const td = document.createElement('td');
      const col = state.columns[i];
      // Nom → fiche de ratings NHL 27 du joueur (page privée des DG) ; carte au survol.
      const link = i === 0 && row.b ? 'https://dg.lnhq.ca/ratings.html?joueur=' + encodeURIComponent(row.b) + '&equipe=UFA' : null;
      if(link){
        const a = document.createElement('a');
        a.href = link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = val;
        a.className = 'team-link';
        a.title = 'Ses ratings NHL 27';
        td.appendChild(a);
        if(row.b.includes(',')) td.dataset.joueur = row.b;
      }else if(col && col.isFlag){
        appendFlag(td, val);
      }else{
        td.textContent = val;
        if(col && col.isNumeric) td.classList.add('is-numeric');
      }
      if(col && col.isHighlight) td.classList.add('col-highlight');
      // Contrat fictif LNHQ : salaires en rouge avec « * » (le nom s'il n'a aucun salaire)
      if(sansContrat && (/^\d{4}-\d{2}$/.test(col.rawLabel) ? /\d/.test(val) : i === 0 && !aSalaire)){
        LNHQ_SANS_CONTRAT.marquer(i === 0 ? (td.firstChild.nodeType === 1 ? td.firstChild : td) : td);
      }
      if(i === 0 && state.encheres.has(row.b)){
        td.appendChild(pastilleEnchere(state.encheres.get(row.b)));
        tr.classList.add('a-enchere');
      }
      tr.appendChild(td);
    });
    els.tableBody.appendChild(tr);
  });
}

// Légende sous le tableau : « * Sans contrat LNH (contrat fictif LNHQ) : … » (agents libres concernés).
LNHQ_SANS_CONTRAT.charger().then(sc => {
  state.sansContrat = sc;
  const noms = (sc.parEquipe.UFA || []).map(b => { const v = b.indexOf(','); return v > 0 ? b.slice(v + 1).trim() + ' ' + b.slice(0, v).trim() : b; });
  document.getElementById('noteSansContrat').replaceChildren(...(noms.length ? [LNHQ_SANS_CONTRAT.note(noms)] : []));
  if(state.rows.length && !els.tableWrap.hidden) render();
});

/* ---------- Enchères en cours (onglet ENCHERES, via encheres-donnees.js) ---------- */
// Pastille sous le nom : logo de l'équipe en tête, mise, temps restant ; mène à la carte de l'enchère.
function pastilleEnchere(e){
  const a = document.createElement('a');
  a.className = 'pastille-enchere';
  a.href = 'encheres.html#e-' + encodeURIComponent(e.id);
  const equipes = [e.equipe, ...e.egalite];
  a.title = e.statut === 'Tirage' ? `Tirage au sort à venir entre ${equipes.join(', ')} (${e.mise} jetons)`
    : e.egalite.length ? `Égalité à ${e.mise} jetons : ${equipes.join(', ')}` : `Enchère en cours : ${e.equipe} en tête à ${e.mise} jetons`;
  // Égalité : un logo par équipe à égalité.
  equipes.forEach(code => {
    const logo = document.createElement('img');
    logo.src = 'Logos/' + code + '.png';
    logo.alt = code;
    logo.width = 16; logo.height = 16;
    logo.onerror = () => logo.replaceWith(document.createTextNode(code));
    a.append(logo);
  });
  if(e.statut === 'Tirage'){
    a.append(document.createTextNode(` ${e.mise} · tirage au sort à venir`));
    a.classList.add('is-tirage');
    return a;
  }
  const temps = document.createElement('span');
  temps.className = 'pastille-temps';
  temps.dataset.fin = e.fin;
  temps.textContent = LNHQ_ENCHERES.tempsRestant(e.fin);
  a.append(document.createTextNode(` ${e.mise} jetons${e.egalite.length ? ' · égalité' : ''} · `), temps);
  return a;
}
async function chargerEncheres(){
  try{
    const d = await LNHQ_ENCHERES.charger();
    const avant = [...state.encheres.keys()].join('|');
    state.encheres = new Map(d.encheres.filter(e => (e.statut === 'En cours' && new Date(e.fin) > new Date()) || e.statut === 'Tirage').map(e => [e.joueur, e]));
    if(!state.encheres.size) state.seulementEncheres = false;
    if(!state.rows.length) return;
    if([...state.encheres.keys()].join('|') !== avant) renderFilterBar();
    if(!els.tableWrap.hidden) render();
  }catch(e){ /* enchères indisponibles : la liste s'affiche quand même */ }
}
chargerEncheres();
setInterval(chargerEncheres, 60000);
// Avant l'ouverture des enchères : décompte au-dessus de la liste (disparaît à l'heure).
LNHQ_ENCHERES.decompte(document.getElementById('content'), chargerEncheres);
// Compte à rebours des pastilles
setInterval(() => document.querySelectorAll('.pastille-temps').forEach(t => { t.textContent = LNHQ_ENCHERES.tempsRestant(t.dataset.fin); }), 15000);

let searchTimer;
els.search.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    render();
  }, 200);
});

els.retryBtn.addEventListener('click', () => loadData());

const cached = loadFromCache();
if(cached && cached.table){
  parseTable(cached.table);
  toggle({ loading:false });
  els.lastUpdated.textContent = 'Dernières données enregistrées — actualisation en cours…';
  loadData({ background:true });
}else{
  loadData();
}
</script>
