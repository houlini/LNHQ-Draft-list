<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats des joueurs</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css?v=8">
<script src="site-nav.js?v=7"></script>
<style>
  /* Mise en page inspirée de nhl.com/stats : carte blanche, onglets, blocs de meneurs, tableau complet. */
  .st-page{ padding:16px clamp(12px,3vw,40px) 30px; max-width:1400px; margin:0 auto; width:100%; box-sizing:border-box; }
  .st-carte{ background:var(--surface); color:var(--ink); border-radius:var(--radius, 12px); border:1px solid var(--line); padding:clamp(14px,2.4vw,28px); display:flex; flex-direction:column; gap:20px; }
  .st-titre{ margin:0; font-family:'Oswald', sans-serif; font-weight:600; font-size:clamp(28px,4vw,40px); line-height:1; }
  .st-onglets{ display:flex; gap:clamp(14px,3vw,34px); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin-top:-6px; }
  .st-onglets button, .st-onglets a{ flex-shrink:0; padding:12px 2px; border:none; background:none; cursor:pointer; color:var(--ink-muted); font:inherit; font-size:14.5px; font-weight:600; text-decoration:none; border-bottom:3px solid transparent; margin-bottom:-1px; }
  .st-onglets button:hover, .st-onglets a:hover{ color:var(--ink); }
  .st-onglets [aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }

  /* ---------- Accueil : blocs de meneurs ---------- */
  .st-blocs{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:28px 40px; }
  .st-bloc{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .st-bloc-tete{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .st-bloc-tete h3{ margin:0; }
  .st-bloc-tete h3 button{ padding:0; border:none; background:none; cursor:pointer; color:var(--ink); font-family:'Oswald', sans-serif; font-weight:600; font-size:22px; }
  .st-bloc-tete h3 button::after{ content:' ›'; color:var(--accent); }
  .st-bloc-tete h3 button:hover{ color:var(--accent); }
  .st-bloc-tete small{ color:var(--ink-muted); font-size:12.5px; }
  .st-sous{ display:flex; gap:18px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; white-space:nowrap; }
  .st-sous button{ padding:8px 2px; border:none; background:none; cursor:pointer; color:var(--ink-muted); font:inherit; font-size:13.5px; font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .st-sous button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }
  .st-corps{ display:grid; grid-template-columns:minmax(130px, 0.8fr) minmax(0, 1.4fr); gap:18px; align-items:start; padding-top:6px; }
  .st-vedette{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px; }
  .st-photo{ width:clamp(84px,9vw,112px); aspect-ratio:1; border-radius:50%; object-fit:cover; object-position:top; background:var(--stripe); margin-bottom:6px; }
  .st-prenom{ font-size:15px; font-weight:600; line-height:1.15; }
  .st-famille{ font-family:'Oswald', sans-serif; font-size:22px; font-weight:600; line-height:1.1; overflow-wrap:anywhere; }
  .st-equipe{ display:flex; align-items:center; gap:5px; color:var(--ink-muted); font-size:12.5px; margin-top:2px; }
  .st-equipe img{ width:18px; height:18px; object-fit:contain; }
  .st-lib{ margin-top:8px; font-size:11.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); }
  .st-val{ font-family:'Oswald', sans-serif; font-size:clamp(36px,4vw,46px); font-weight:600; line-height:1; color:var(--ink); }
  .st-liste{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .st-liste li{ display:grid; grid-template-columns:30px 20px minmax(0,1fr) auto; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; font-size:14px; cursor:default; }
  .st-liste li + li{ border-top:1px solid var(--line); }
  .st-liste li.is-actif{ background:var(--accent); color:var(--accent-ink); border-top-color:transparent; }
  .st-liste li.is-actif + li{ border-top-color:transparent; }
  .st-liste .rang{ color:inherit; opacity:0.75; font-family:'IBM Plex Mono', monospace; font-size:12.5px; }
  .st-liste img{ width:20px; height:20px; object-fit:contain; }
  .st-liste .nom{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .st-liste .val{ font-family:'IBM Plex Mono', monospace; font-weight:700; }
  .st-tous{ align-self:flex-start; padding:0; border:none; background:none; cursor:pointer; color:var(--accent); font:inherit; font-size:13.5px; font-weight:700; }
  .st-tous:hover{ text-decoration:underline; }
  .st-vide-bloc{ color:var(--ink-muted); font-size:14px; }

  /* ---------- Tableaux complets ---------- */
  .st-filtres{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .st-filtres input, .st-filtres select{ height:40px; padding:0 12px; border-radius:9px; border:1px solid var(--line); font:inherit; font-size:14.5px; background:var(--bg, var(--surface)); color:var(--ink); }
  .st-filtres input{ flex:1 1 220px; min-width:0; }
  .st-seg{ display:inline-flex; padding:3px; gap:3px; border-radius:10px; border:1px solid var(--line); }
  .st-seg button{ min-height:32px; padding:0 12px; border:none; border-radius:7px; cursor:pointer; background:transparent; color:var(--ink-muted); font:inherit; font-weight:700; font-size:12.5px; }
  .st-seg button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); }
  .st-table-wrap{ overflow:auto; border-radius:10px; border:1px solid var(--line); max-height:calc(100vh - 150px); }
  .st-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; white-space:nowrap; }
  .st-table th{ position:sticky; top:0; z-index:2; padding:10px 9px; background:var(--nav-dark); color:var(--nav-ink); font-size:11.5px; letter-spacing:0.04em; text-align:right; cursor:pointer; user-select:none; }
  .st-table th.g{ text-align:left; }
  .st-table th[aria-sort]{ background:var(--accent); color:var(--accent-ink); }
  .st-table th[aria-sort="descending"]::after{ content:' ▼'; font-size:8px; } .st-table th[aria-sort="ascending"]::after{ content:' ▲'; font-size:8px; }
  .st-table td{ padding:8px 9px; border-top:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono', monospace; font-size:13px; background:var(--surface); }
  .st-table td.g{ text-align:left; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; }
  .st-table td.tri{ background:color-mix(in srgb, var(--accent) 10%, var(--surface)); font-weight:700; }
  .st-table tbody tr:nth-child(even) td{ background:var(--stripe); }
  .st-table tbody tr:nth-child(even) td.tri{ background:color-mix(in srgb, var(--accent) 14%, var(--stripe)); }
  .st-table tbody tr:hover td{ background:var(--accent-soft); }
  .st-table .fixe{ position:sticky; left:0; z-index:1; }
  .st-table th.fixe{ z-index:3; }
  .st-table td.rang{ color:var(--ink-muted); font-size:12px; width:1%; }
  .st-joueur a{ color:inherit; text-decoration:none; font-weight:600; }
  .st-joueur a:hover{ color:var(--accent); text-decoration:underline; }
  .st-eq{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Sans', sans-serif; }
  .st-eq img{ width:20px; height:20px; object-fit:contain; }
  .st-pm-pos{ color:var(--positive); } .st-pm-neg{ color:var(--negative); }
  .st-pages{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px; color:var(--ink-muted); }
  .st-pages div{ display:flex; gap:4px; flex-wrap:wrap; }
  .st-pages button{ min-width:36px; height:34px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font:inherit; font-weight:600; }
  .st-pages button[aria-current="page"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .st-pages button:disabled{ opacity:0.4; cursor:default; }
  .st-note{ margin:0; color:var(--ink-muted); font-size:13px; }
  .st-vide{ padding:30px; text-align:center; color:var(--ink-muted); }

  @media (max-width:900px){
    .st-blocs{ grid-template-columns:minmax(0, 1fr); }
  }
  @media (max-width:520px){
    .st-corps{ grid-template-columns:minmax(0, 1fr); gap:10px; }
    .st-vedette{ display:grid; grid-template-columns:72px minmax(0,1fr) auto; grid-template-rows:auto auto auto; text-align:left; align-items:center; column-gap:12px; row-gap:0; }
    .st-vedette .st-photo{ grid-row:1 / 4; width:72px; margin:0; }
    .st-vedette .st-lib{ grid-column:3; grid-row:1; margin:0; text-align:right; }
    .st-vedette .st-val{ grid-column:3; grid-row:2 / 4; text-align:right; font-size:36px; }
    .st-famille{ font-size:19px; }
    .st-filtres input, .st-filtres select{ flex:1 1 100%; }
    .st-seg{ width:100%; box-sizing:border-box; } .st-seg button{ flex:1 1 0; min-width:0; padding:0 4px; }
    .st-table td{ padding:7px 7px; }
  }
</style>
</head>
<body>
<div class="app">
  <site-header class="app-header" current-page="stats"></site-header>

  <main id="content">
    <div id="loader"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    <div class="st-page" id="page" hidden>
      <div class="st-carte">
        <h2 class="st-titre">Statistiques</h2>
        <nav class="st-onglets" role="tablist" aria-label="Sections">
          <button type="button" role="tab" data-onglet="accueil" aria-selected="true">Accueil</button>
          <button type="button" role="tab" data-onglet="patineurs" aria-selected="false">Patineurs</button>
          <button type="button" role="tab" data-onglet="gardiens" aria-selected="false">Gardiens</button>
          <a href="classement.html">Équipes</a>
        </nav>

        <section class="st-blocs" id="vueAccueil"></section>

        <section id="vueTableau" hidden>
          <div class="st-filtres" style="margin-bottom:14px">
            <input type="search" id="recherche" placeholder="Rechercher un joueur…" aria-label="Rechercher un joueur" autocomplete="off">
            <select id="equipe" aria-label="Équipe"><option value="">Toutes les équipes</option></select>
            <div class="st-seg" id="segPosition" role="group" aria-label="Position">
              <button type="button" data-po="" aria-pressed="true">Tous</button>
              <button type="button" data-po="A" aria-pressed="false">Attaquants</button>
              <button type="button" data-po="D" aria-pressed="false">Défenseurs</button>
            </div>
          </div>
          <div class="st-table-wrap"><table class="st-table" id="table"></table></div>
          <div class="st-pages" id="pages" style="margin-top:12px"></div>
        </section>

        <p class="st-note" id="note"></p>
      </div>
    </div>
    <p class="st-vide" id="vide" hidden>Aucune statistique importée pour l’instant.</p>
  </main>
</div>

<script>
/* =========================================================================
   Stats des joueurs, à la manière de nhl.com/stats :
   - Accueil : blocs de meneurs (vedette + 10 premiers, égalités « T3 ») ;
   - Patineurs / Gardiens : tableau complet, tri par colonne, filtres, pages de 50.
   Données : onglets publics STATS_JOUEURS et STATS_GARDIENS (importés par un
   dirigeant depuis publier.lnhq.ca/stats-import.html), photos via IDS_LNH.
   L'adresse garde l'état : ?onglet=patineurs&tri=b&po=D (et ?joueur=Nom, Prénom).
   ========================================================================= */
const SHEET_ID = '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A';
const EQUIPES = new Map((window.LNHQ_TEAMS || []).map(t => [t.code, t]));
const $ = id => document.getElementById(id);
document.getElementById('sheetTitle').textContent = 'LNHQ';
const els = { rowCount: document.getElementById('rowCount') };
const PAR_PAGE = 50;

// Colonnes des tableaux. asc : plus bas = meilleur (tri croissant au 1er clic) ; calc : colonne calculée.
const COLS_P = [
  { cle: 'pj', titre: 'PJ', aide: 'Parties jouées' },
  { cle: 'b', titre: 'B', aide: 'Buts' },
  { cle: 'a', titre: 'A', aide: 'Passes' },
  { cle: 'p', titre: 'PTS', aide: 'Points' },
  { cle: 'pm', titre: '+/-', aide: 'Différentiel' },
  { cle: 'pun', titre: 'PUN', aide: 'Minutes de pénalité' },
  { cle: 'ppj', titre: 'P/PJ', aide: 'Points par match', calc: j => (num(j.pj) > 0 && j.p !== '') ? (num(j.p) / num(j.pj)).toFixed(2) : '' },
  { cle: 'ban', titre: 'BAN', aide: 'Buts en avantage numérique' },
  { cle: 'pan', titre: 'PAN', aide: 'Points en avantage numérique' },
  { cle: 'bin', titre: 'BIN', aide: 'Buts en infériorité numérique' },
  { cle: 'pin', titre: 'PIN', aide: 'Points en infériorité numérique' },
  { cle: 'bg', titre: 'BG', aide: 'Buts gagnants' },
  { cle: 't', titre: 'T', aide: 'Tirs' },
  { cle: 'pct', titre: '%T', aide: '% de tirs convertis' },
  { cle: 'tgm', titre: 'TG/M', aide: 'Temps de glace moyen par match' },
  { cle: 'mjg', titre: 'MJG', aide: 'Mises au jeu gagnées' },
  { cle: 'mjt', titre: 'MJ', aide: 'Mises au jeu prises' },
  { cle: 'pmj', titre: '%MJ', aide: '% de mises au jeu gagnées' },
  { cle: 'me', titre: 'MÉ', aide: 'Mises en échec' },
  { cle: 'tbl', titre: 'TBL', aide: 'Tirs bloqués' },
  { cle: 'rev', titre: 'REV', aide: 'Revirements (rondelles perdues)', asc: true },
  { cle: 'rec', titre: 'REC', aide: 'Récupérations (rondelles volées)' },
];
const COLS_G = [
  { cle: 'pj', titre: 'PJ', aide: 'Parties jouées' },
  { cle: 'v', titre: 'V', aide: 'Victoires' },
  { cle: 'd', titre: 'D', aide: 'Défaites', asc: true },
  { cle: 'dp', titre: 'DP', aide: 'Défaites en prolongation ou en fusillade', asc: true },
  { cle: 'bl', titre: 'BL', aide: 'Blanchissages' },
  { cle: 'parr', titre: '%ARR', aide: 'Pourcentage d’arrêts' },
  { cle: 'moy', titre: 'MOY', aide: 'Moyenne de buts accordés par match', asc: true },
  { cle: 'arr', titre: 'ARR', aide: 'Arrêts' },
  { cle: 'tc', titre: 'TC', aide: 'Tirs contre' },
  { cle: 'bc', titre: 'BC', aide: 'Buts contre', asc: true },
  { cle: 'min', titre: 'MIN', aide: 'Minutes jouées' },
  { cle: 'pun', titre: 'PUN', aide: 'Minutes de pénalité' },
  { cle: 'b', titre: 'B', aide: 'Buts' },
  { cle: 'a', titre: 'A', aide: 'Passes' },
  { cle: 'p', titre: 'PTS', aide: 'Points' },
];
// Entête de l'onglet → clé (lues par leur nom : l'ordre de l'onglet peut changer).
const entetes = cols => Object.assign({ 'Joueur': 'joueur', 'Nom': 'nom', 'Équipe': 'equipe', 'PO': 'po', 'P': 'p', 'Importé le': 'importe' },
  Object.fromEntries(cols.filter(c => c.cle !== 'p' && !c.calc).map(c => [c.titre, c.cle])));

// Blocs de l'accueil (comme les blocs « Skaters / Goalies / Defensemen » de la LNH).
const BLOCS = [
  { titre: 'Patineurs', lot: 'P', stats: [['p', 'Points'], ['b', 'Buts'], ['a', 'Passes']] },
  { titre: 'Gardiens', lot: 'G', qualif: true, stats: [['moy', 'Moyenne', { asc: true }], ['parr', '% d’arrêts'], ['bl', 'Blanchissages'], ['v', 'Victoires']] },
  { titre: 'Défenseurs', lot: 'P', po: 'D', stats: [['p', 'Points'], ['b', 'Buts'], ['a', 'Passes']] },
  { titre: 'Jeu physique', lot: 'P', stats: [['me', 'Mises en échec'], ['tbl', 'Tirs bloqués'], ['rec', 'Récupérations']] },
];
const lots = { P: [], G: [] };
let ids = new Map();
const etat = { onglet: 'accueil', tri: { cle: 'p', sens: -1 }, page: 0, texte: '', equipe: '', po: '' };

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
const logo = c => { const i = el('img'); i.src = 'Logos/' + c + '.png'; i.alt = ''; i.loading = 'lazy'; i.onerror = () => { i.style.visibility = 'hidden'; }; return i; };
const sansAccents = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const groupe = po => { const p = String(po || '').split('/')[0].toUpperCase(); return /^(LD|RD|D)$/.test(p) ? 'D' : p === 'G' ? 'G' : 'A'; };
// « McDavid, Connor » → { prenom: 'Connor', famille: 'McDavid' } ; sinon le nom abrégé de l'export (« C. McDavid »).
const parties = j => {
  const n = j.nom || '', v = n.indexOf(',');
  if(v > 0) return { prenom: n.slice(v + 1).trim(), famille: n.slice(0, v).trim() };
  const p = j.joueur.indexOf(' ');
  return p > 0 ? { prenom: j.joueur.slice(0, p), famille: j.joueur.slice(p + 1) } : { prenom: '', famille: j.joueur };
};
const nomAffiche = j => { const x = parties(j); return (x.prenom + ' ' + x.famille).trim(); };
const num = v => {
  const s = String(v), t = /^(\d+):(\d{2})$/.exec(s);   // « 21:12 » (temps de glace) → minutes
  if(t) return +t[1] + t[2] / 60;
  const n = parseFloat(s.replace('%', '').replace(',', '.')); return isNaN(n) ? null : n;
};
const valeur = (j, c) => c.calc ? c.calc(j) : j[c.cle];
const affiche = (k, v) => k === 'pm' && num(v) > 0 ? '+' + v : v;
// Gardiens qualifiés (meneurs %ARR / MOY) : au moins 40 % des matchs du plus utilisé.
const seuilGardiens = () => Math.max(1, Math.round(0.4 * Math.max(0, ...lots.G.map(j => num(j.pj) || 0))));
const photoDe = j => { const id = ids.get(j.nom); return id ? `https://assets.nhle.com/mugs/nhl/latest/${id}.png` : j.equipe ? 'Logos/' + j.equipe + '.png' : 'logo-lnhq.png'; };

async function gviz(params){
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&${params}&t=${Date.now()}`);
  return JSON.parse((await res.text()).match(/setResponse\(([\s\S]*)\);\s*$/)[1]).table;
}

async function charger(){
  try{
    const [t, tg, idsT] = await Promise.all([gviz('sheet=STATS_JOUEURS'), gviz('sheet=STATS_GARDIENS').catch(() => null), gviz('sheet=IDS_LNH').catch(() => null)]);
    const v = (c, i) => c[i] && c[i].v != null ? String(c[i].v).trim() : '';
    let importe = '';
    const lire = (tab, cols) => {
      const lab = tab ? tab.cols.map(c => (c.label || '').trim()) : [];
      if(lab[0] !== 'Joueur' || lab[1] !== 'Nom') return [];
      const ent = entetes(cols), cles = lab.map(l => ent[l]);
      return tab.rows.map(r => {
        const c = r.c || [], j = {};
        cols.forEach(x => { j[x.cle] = ''; });
        cles.forEach((k, i) => { if(k) j[k] = v(c, i); });
        importe = importe || j.importe;
        return j;
      }).filter(j => j.joueur && j.pj !== '0' && j.pj !== '');   // aucun match joué : rien à montrer
    };
    lots.P = lire(t, COLS_P); lots.G = lire(tg, COLS_G);
    if(!lots.P.length && !lots.G.length){ $('loader').hidden = true; $('vide').hidden = false; return; }
    if(idsT && (idsT.cols[0] || {}).label === 'Joueur') idsT.rows.forEach(r => { const c = r.c || []; const n = c[0] && c[0].v, i = c[1] && c[1].v; if(n && /^\d{6,8}$/.test(String(i))) ids.set(String(n), String(i)); });
    document.querySelector('[data-onglet="gardiens"]').hidden = !lots.G.length;
    const codes = [...new Set(lots.P.concat(lots.G).map(j => j.equipe).filter(Boolean))].sort((a, b) => ((EQUIPES.get(a) || {}).name || a).localeCompare((EQUIPES.get(b) || {}).name || b, 'fr'));
    codes.forEach(c => $('equipe').append(new Option((EQUIPES.get(c) || {}).name || c, c)));
    const d = importe ? new Date(importe) : null;
    $('note').textContent = (d && !isNaN(d) ? 'Stats importées le ' + new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(d) + '. ' : '')
      + 'Les buts de fusillade ne sont pas comptés.';
    lireAdresse();
    $('loader').hidden = true; $('page').hidden = false;
    rendre();
  }catch(e){
    console.error(e);
    $('loader').hidden = true; $('vide').hidden = false; $('vide').textContent = 'Impossible de charger les stats pour le moment.';
  }
}

/* ---------- Accueil : blocs de meneurs ---------- */
const choixBloc = BLOCS.map(() => 0);   // sous-onglet actif de chaque bloc
function classement(bloc, k, o = {}){
  const seuil = seuilGardiens();
  const second = bloc.lot === 'G' ? 'pj' : 'p';
  const liste = lots[bloc.lot].filter(j => num(j[k]) != null && (!bloc.po || groupe(j.po) === bloc.po)
    && (!bloc.qualif || ['v', 'bl'].includes(k) || num(j.pj) >= seuil));
  liste.sort((a, b) => (num(a[k]) - num(b[k])) * (o.asc ? 1 : -1) || num(b[second]) - num(a[second]));
  // Rangs avec égalités : « T3 » quand plusieurs joueurs ont la même valeur.
  return liste.slice(0, 10).map((j, i, l) => {
    const premier = liste.findIndex(x => num(x[k]) === num(j[k]));
    const egal = liste.filter(x => num(x[k]) === num(j[k])).length > 1;
    return { j, rang: (egal ? 'T' : '') + (premier + 1) };
  });
}
function rendreBloc(bloc, b){
  const art = el('article', 'st-bloc');
  if(!lots[bloc.lot].length) return null;
  const tete = el('div', 'st-bloc-tete'), h = el('h3'), lien = el('button', null, bloc.titre);
  lien.type = 'button';
  const [k, titreStat, o = {}] = bloc.stats[choixBloc[b]];
  lien.addEventListener('click', () => allerTableau(bloc, k, o));
  h.append(lien); tete.append(h);
  if(bloc.qualif) tete.append(el('small', null, `(au moins ${seuilGardiens()} matchs)`));
  const sous = el('div', 'st-sous'); sous.setAttribute('role', 'tablist');
  bloc.stats.forEach(([, t], i) => {
    const bt = el('button', null, t); bt.type = 'button'; bt.setAttribute('role', 'tab'); bt.setAttribute('aria-selected', String(i === choixBloc[b]));
    bt.addEventListener('click', () => { choixBloc[b] = i; art.replaceWith(rendreBloc(bloc, b)); });
    sous.append(bt);
  });
  const corps = el('div', 'st-corps');
  const rangs = classement(bloc, k, o);
  if(!rangs.length){ art.append(tete, sous, el('p', 'st-vide-bloc', 'Aucun joueur pour l’instant.')); return art; }
  const vedette = el('div', 'st-vedette');
  // Vedette : le premier ; survoler un nom de la liste la change (comme sur nhl.com).
  const montrer = ({ j }, li) => {
    const x = parties(j), ph = el('img', 'st-photo'); ph.alt = ''; ph.src = photoDe(j); ph.onerror = () => { ph.onerror = null; ph.src = 'logo-lnhq.png'; };
    const eq = el('span', 'st-equipe'); if(j.equipe) eq.append(logo(j.equipe)); eq.append(document.createTextNode([j.equipe, j.po].filter(Boolean).join(' • ')));
    const noms = el('div'); noms.append(el('div', 'st-prenom', x.prenom), el('div', 'st-famille', x.famille), eq);
    vedette.replaceChildren(ph, noms, el('span', 'st-lib', titreStat), el('strong', 'st-val', affiche(k, j[k])));
    liste.querySelectorAll('li').forEach(l => l.classList.toggle('is-actif', l === li));
  };
  const liste = el('ol', 'st-liste');
  rangs.forEach(r => {
    const li = el('li'); li.tabIndex = 0;
    li.append(el('span', 'rang', r.rang + '.'), r.j.equipe ? logo(r.j.equipe) : el('span'), el('span', 'nom', nomAffiche(r.j)), el('span', 'val', affiche(k, r.j[k])));
    li.addEventListener('pointerenter', () => montrer(r, li));
    li.addEventListener('focus', () => montrer(r, li));
    liste.append(li);
  });
  corps.append(vedette, liste);
  const tous = el('button', 'st-tous', 'Tous les meneurs ›'); tous.type = 'button';
  tous.addEventListener('click', () => allerTableau(bloc, k, o));
  art.append(tete, sous, corps, tous);
  montrer(rangs[0], liste.firstChild);
  liste.addEventListener('pointerleave', () => montrer(rangs[0], liste.firstChild));
  return art;
}
function allerTableau(bloc, k, o){
  etat.onglet = bloc.lot === 'G' ? 'gardiens' : 'patineurs';
  etat.tri = { cle: k, sens: o.asc ? 1 : -1 };
  etat.po = bloc.po || ''; etat.page = 0;
  rendre();
  $('page').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- Tableaux ---------- */
function filtres(lot){
  const q = sansAccents(etat.texte);
  return lots[lot].filter(j => (!etat.equipe || j.equipe === etat.equipe) && (lot === 'G' || !etat.po || groupe(j.po) === etat.po)
    && (!q || sansAccents(j.joueur + ' ' + j.nom).includes(q)));
}
function rendreTableau(){
  const lot = etat.onglet === 'gardiens' ? 'G' : 'P', COLS = lot === 'G' ? COLS_G : COLS_P;
  $('segPosition').hidden = lot === 'G';
  document.querySelectorAll('[data-po]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.po === etat.po)));
  const cols = COLS.filter(c => lots[lot].some(j => valeur(j, c) !== ''));
  const col = COLS.find(c => c.cle === etat.tri.cle) || COLS[1];
  const second = lot === 'G' ? 'pj' : 'p';
  const tries = filtres(lot).sort((a, b) => {
    const x = num(valeur(a, col)), y = num(valeur(b, col));
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    return (x - y) * etat.tri.sens || (num(b[second]) || 0) - (num(a[second]) || 0);
  });
  const pages = Math.max(1, Math.ceil(tries.length / PAR_PAGE));
  etat.page = Math.min(etat.page, pages - 1);
  const debut = etat.page * PAR_PAGE, morceau = tries.slice(debut, debut + PAR_PAGE);
  const thead = el('thead'), tr = el('tr');
  tr.append(el('th', 'g', '#'), el('th', 'g fixe', 'Joueur'), el('th', 'g', 'Équipe'), el('th', 'g', 'PO'));
  cols.forEach(c => {
    const th = el('th', null, c.titre); th.title = c.aide; th.tabIndex = 0;
    if(col.cle === c.cle) th.setAttribute('aria-sort', etat.tri.sens < 0 ? 'descending' : 'ascending');
    const changer = () => { etat.tri = etat.tri.cle === c.cle ? { cle: c.cle, sens: -etat.tri.sens } : { cle: c.cle, sens: c.asc ? 1 : -1 }; etat.page = 0; rendre(); };
    th.addEventListener('click', changer);
    th.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); changer(); } });
    tr.append(th);
  });
  thead.append(tr);
  const tbody = el('tbody');
  morceau.forEach((j, i) => {
    const r = el('tr');
    const td = el('td', 'g fixe st-joueur'), t = EQUIPES.get(j.equipe);
    const lien = el(t ? 'a' : 'span', null, nomAffiche(j));
    if(t) lien.href = 'equipe.html?team=' + t.slug + (j.nom ? '&joueur=' + encodeURIComponent(j.nom) : '');
    td.append(lien);
    const eq = el('td', 'g'), sp = el('span', 'st-eq'); if(j.equipe){ sp.append(logo(j.equipe), document.createTextNode(j.equipe)); } else sp.textContent = '—'; eq.append(sp);
    r.append(el('td', 'rang', String(debut + i + 1)), td, eq, el('td', 'g', j.po));
    cols.forEach(c => {
      const v = valeur(j, c), cell = el('td', col.cle === c.cle ? 'tri' : '', affiche(c.cle, v));
      if(c.cle === 'pm' && num(v)) cell.classList.add(num(v) > 0 ? 'st-pm-pos' : 'st-pm-neg');
      r.append(cell);
    });
    tbody.append(r);
  });
  if(!morceau.length){ const r = el('tr'), td = el('td', 'g', 'Aucun joueur pour ces filtres.'); td.colSpan = cols.length + 4; r.append(td); tbody.append(r); }
  $('table').replaceChildren(thead, tbody);
  // Pagination
  const nav = el('div');
  const bouton = (txt, p, actif) => { const b = el('button', null, txt); b.type = 'button'; b.disabled = p < 0 || p >= pages; if(actif) b.setAttribute('aria-current', 'page'); b.addEventListener('click', () => { etat.page = p; rendre(); $('table').parentElement.scrollTo({ top: 0 }); }); return b; };
  nav.append(bouton('‹', etat.page - 1));
  for(let p = 0; p < pages; p++) if(p === 0 || p === pages - 1 || Math.abs(p - etat.page) <= 1) nav.append(bouton(String(p + 1), p, p === etat.page));
    else if(Math.abs(p - etat.page) === 2) nav.append(el('span', null, '…'));
  nav.append(bouton('›', etat.page + 1));
  $('pages').replaceChildren(el('span', null, tries.length ? `${debut + 1}–${debut + morceau.length} sur ${tries.length}` : ''), pages > 1 ? nav : el('span'));
  if(els.rowCount) els.rowCount.textContent = `Stats des ${lot === 'G' ? 'gardiens' : 'patineurs'} — ${tries.length}`;
}

/* ---------- Onglets et adresse ---------- */
function rendre(){
  document.querySelectorAll('[data-onglet]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.onglet === etat.onglet)));
  const accueil = etat.onglet === 'accueil';
  $('vueAccueil').hidden = !accueil; $('vueTableau').hidden = accueil;
  if(accueil){
    $('vueAccueil').replaceChildren(...BLOCS.map(rendreBloc).filter(Boolean));
    if(els.rowCount) els.rowCount.textContent = 'Stats des joueurs';
  }else rendreTableau();
  const p = new URLSearchParams();
  if(!accueil){ p.set('onglet', etat.onglet); p.set('tri', etat.tri.cle); if(etat.po) p.set('po', etat.po); }
  if(etat.texte) p.set('joueur', etat.texte);
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
}
function lireAdresse(){
  const p = new URLSearchParams(location.search);
  const onglet = p.get('onglet'), joueur = p.get('joueur');
  if(['patineurs', 'gardiens'].includes(onglet)) etat.onglet = onglet;
  // Arrivée depuis la carte d'un joueur (stats.html?joueur=Nom, Prénom) : son tableau, recherche préremplie.
  if(joueur){ etat.texte = joueur; $('recherche').value = joueur; if(etat.onglet === 'accueil') etat.onglet = lots.G.some(j => j.nom === joueur) ? 'gardiens' : 'patineurs'; }
  const cols = etat.onglet === 'gardiens' ? COLS_G : COLS_P, tri = cols.find(c => c.cle === p.get('tri'));
  etat.tri = tri ? { cle: tri.cle, sens: tri.asc ? 1 : -1 } : etat.onglet === 'gardiens' ? { cle: 'v', sens: -1 } : { cle: 'p', sens: -1 };
  if(['A', 'D'].includes(p.get('po'))) etat.po = p.get('po');
}

document.querySelectorAll('[data-onglet]').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.onglet === etat.onglet) return;
  etat.onglet = b.dataset.onglet; etat.page = 0; etat.po = '';
  etat.tri = etat.onglet === 'gardiens' ? { cle: 'v', sens: -1 } : { cle: 'p', sens: -1 };
  rendre();
}));
$('recherche').addEventListener('input', () => { etat.texte = $('recherche').value; etat.page = 0; rendre(); });
$('equipe').addEventListener('change', () => { etat.equipe = $('equipe').value; etat.page = 0; rendre(); });
document.querySelectorAll('[data-po]').forEach(b => b.addEventListener('click', () => { etat.po = b.dataset.po; etat.page = 0; rendre(); }));
charger();
</script>
