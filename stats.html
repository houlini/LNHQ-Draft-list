<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats des joueurs</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css?v=7">
<script src="site-nav.js?v=6"></script>
<style>
  .st-page{ padding:16px clamp(12px,3vw,40px) 30px; max-width:1400px; margin:0 auto; width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:18px; }
  .st-filtres{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .st-filtres input, .st-filtres select{
    height:40px; padding:0 12px; border-radius:9px; border:none; font:inherit; font-size:14.5px; background:var(--surface); color:var(--ink);
  }
  .st-filtres input{ flex:1 1 200px; min-width:0; }
  .st-seg{ display:inline-flex; padding:4px; gap:4px; border-radius:11px; background:rgba(0,0,0,0.16); }
  .st-seg button{ min-height:32px; padding:0 12px; border:none; border-radius:8px; cursor:pointer; background:transparent; color:var(--accent-ink); font:inherit; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.03em; }
  .st-seg button[aria-pressed="true"]{ background:var(--nav-dark); color:var(--nav-ink); }

  /* Meneurs */
  .st-meneurs{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; }
  .st-meneur{ position:relative; overflow:hidden; padding:14px 16px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); }
  .st-meneur h3{ margin:0 0 10px; font-family:'Oswald', sans-serif; font-weight:500; font-size:15px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted); }
  .st-premier{ display:flex; align-items:center; gap:12px; min-height:64px; }
  .st-photo{ width:64px; height:64px; flex-shrink:0; border-radius:50%; object-fit:cover; object-position:top; background:var(--stripe); border:3px solid var(--accent); }
  .st-premier div{ flex:1; min-width:0; }
  .st-premier b{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:16px; line-height:1.2; }
  .st-premier small{ display:flex; align-items:center; gap:5px; margin-top:2px; color:var(--ink-muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st-premier small img{ width:18px; height:18px; object-fit:contain; }
  .st-valeur{ flex-shrink:0; font-family:'Oswald', sans-serif; font-weight:500; font-size:40px; line-height:1; color:var(--accent); }
  .st-suivants{ list-style:none; margin:10px 0 0; padding:8px 0 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px; font-size:13.5px; }
  .st-suivants li{ display:flex; align-items:center; gap:6px; }
  .st-suivants img{ width:18px; height:18px; object-fit:contain; }
  .st-suivants span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st-suivants b{ font-family:'IBM Plex Mono', monospace; }

  /* Tableau */
  .st-table-wrap{ overflow:auto; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface); max-height:calc(100vh - 160px); }
  .st-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:14px; white-space:nowrap; }
  .st-table th{ position:sticky; top:0; z-index:2; padding:9px 10px; background:var(--accent); color:var(--accent-ink); font-size:12px; text-transform:uppercase; letter-spacing:0.04em; text-align:right; cursor:pointer; user-select:none; }
  .st-table th.g{ text-align:left; }
  .st-table th[aria-sort]{ background:var(--nav-dark); color:var(--nav-ink); }
  .st-table th[aria-sort="descending"]::after{ content:' ▼'; font-size:9px; } .st-table th[aria-sort="ascending"]::after{ content:' ▲'; font-size:9px; }
  .st-table td{ padding:7px 10px; border-top:1px solid var(--line); text-align:right; font-family:'IBM Plex Mono', monospace; font-size:13.5px; }
  .st-table td.g{ text-align:left; font-family:'IBM Plex Sans', sans-serif; font-size:14px; }
  .st-table td.tri{ background:color-mix(in srgb, var(--accent) 9%, transparent); font-weight:700; }
  .st-table tbody tr:nth-child(even) td{ background-color:var(--stripe); }
  .st-table tbody tr:nth-child(even) td.tri{ background:color-mix(in srgb, var(--accent) 14%, var(--stripe)); }
  .st-table tbody tr:hover td{ background:var(--accent-soft); }
  /* 1re colonne (rang + joueur) figée pendant le défilement horizontal */
  .st-table .fixe{ position:sticky; left:0; z-index:1; background:var(--surface); }
  .st-table th.fixe{ z-index:3; background:var(--accent); }
  .st-table th.fixe[aria-sort]{ background:var(--nav-dark); }
  .st-joueur{ display:flex; align-items:center; gap:8px; }
  .st-rang{ width:24px; text-align:right; color:var(--ink-muted); font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .st-joueur img{ width:22px; height:22px; object-fit:contain; flex-shrink:0; }
  .st-joueur a{ color:inherit; text-decoration:none; font-weight:600; }
  .st-joueur a:hover{ color:var(--accent); text-decoration:underline; }
  .st-pos{ color:var(--ink-muted); font-size:12px; font-family:'IBM Plex Sans', sans-serif; }
  .st-pm-pos{ color:var(--positive); } .st-pm-neg{ color:var(--negative); }
  .st-note{ margin:0; color:var(--ink-muted); font-size:13px; }
  .st-vide{ padding:30px; text-align:center; color:var(--ink-muted); }
  @media (max-width:600px){
    .st-filtres input, .st-filtres select{ flex:1 1 100%; height:38px; }
    .st-seg{ width:100%; } .st-seg button{ flex:1; }
    .st-valeur{ font-size:34px; } .st-photo{ width:56px; height:56px; }
    .st-table{ font-size:13px; } .st-table td{ padding:6px 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <site-header class="app-header" current-page="stats"></site-header>

  <div class="filter-band">
    <div class="st-filtres">
      <input type="search" id="recherche" placeholder="Rechercher un joueur…" aria-label="Rechercher un joueur" autocomplete="off">
      <select id="equipe" aria-label="Équipe"><option value="">Toutes les équipes</option></select>
      <div class="st-seg" role="group" aria-label="Position">
        <button type="button" data-po="" aria-pressed="true">Tous</button>
        <button type="button" data-po="A" aria-pressed="false">Attaquants</button>
        <button type="button" data-po="D" aria-pressed="false">Défenseurs</button>
      </div>
    </div>
  </div>

  <main id="content">
    <div id="loader"><div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    <div class="st-page" id="page" hidden>
      <section class="st-meneurs" id="meneurs"></section>
      <div class="st-table-wrap"><table class="st-table" id="table"></table></div>
      <p class="st-note" id="note"></p>
    </div>
    <p class="st-vide" id="vide" hidden>Aucune statistique importée pour l’instant.</p>
  </main>
</div>

<script>
/* =========================================================================
   Stats des joueurs : onglet public STATS_JOUEURS (importé par un dirigeant,
   après vérification, depuis publier.lnhq.ca/stats-import.html).
   Tri par colonne, filtres équipe / position, recherche ; meneurs en haut.
   ========================================================================= */
const SHEET_ID = '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A';
const EQUIPES = new Map((window.LNHQ_TEAMS || []).map(t => [t.code, t]));
const $ = id => document.getElementById(id);
document.getElementById('sheetTitle').textContent = 'LNHQ';
const els = { rowCount: document.getElementById('rowCount'), lastUpdated: document.getElementById('lastUpdated') };

// Colonnes de l'onglet → affichage. num : valeur numérique (tri) ; une colonne vide partout est masquée.
const COLS = [
  { cle: 'pj', titre: 'PJ', aide: 'Parties jouées' },
  { cle: 'b', titre: 'B', aide: 'Buts' },
  { cle: 'a', titre: 'A', aide: 'Passes' },
  { cle: 'p', titre: 'PTS', aide: 'Points' },
  { cle: 'pm', titre: '+/-', aide: 'Différentiel' },
  { cle: 'pun', titre: 'PUN', aide: 'Minutes de pénalité' },
  { cle: 't', titre: 'T', aide: 'Tirs' },
  { cle: 'pct', titre: '%T', aide: '% de tirs convertis' },
  { cle: 'bg', titre: 'BG', aide: 'Buts gagnants' },
  { cle: 'ban', titre: 'BAN', aide: 'Buts en avantage numérique' },
  { cle: 'pan', titre: 'PAN', aide: 'Points en avantage numérique' },
  { cle: 'bin', titre: 'BIN', aide: 'Buts en infériorité numérique' },
  { cle: 'pin', titre: 'PIN', aide: 'Points en infériorité numérique' },
  { cle: 'tgm', titre: 'TG/M', aide: 'Temps de glace moyen par match' },
  { cle: 'mjg', titre: 'MJG', aide: 'Mises au jeu gagnées' },
  { cle: 'mjt', titre: 'MJ', aide: 'Mises au jeu prises' },
  { cle: 'pmj', titre: '%MJ', aide: '% de mises au jeu gagnées' },
  { cle: 'me', titre: 'MÉ', aide: 'Mises en échec' },
  { cle: 'tbl', titre: 'TBL', aide: 'Tirs bloqués' },
  { cle: 'rev', titre: 'REV', aide: 'Revirements (rondelles perdues)' },
  { cle: 'rec', titre: 'REC', aide: 'Récupérations (rondelles volées)' },
];
// Entête de l'onglet → clé (les colonnes sont lues par leur nom, l'ordre peut changer).
const ENTETES = Object.assign({ 'Joueur': 'joueur', 'Nom': 'nom', 'Équipe': 'equipe', 'PO': 'po', 'P': 'p', 'Importé le': 'importe' },
  Object.fromEntries(COLS.filter(c => c.cle !== 'p').map(c => [c.titre, c.cle])));
const MENEURS = [['p', 'Points'], ['b', 'Buts'], ['a', 'Passes'], ['pm', 'Plus/moins']];
let joueurs = [], ids = new Map(), tri = { cle: 'p', sens: -1 }, filtre = { texte: '', equipe: '', po: '' };

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
const logo = c => { const i = el('img'); i.src = 'Logos/' + c + '.png'; i.alt = ''; i.loading = 'lazy'; i.onerror = () => { i.style.visibility = 'hidden'; }; return i; };
const sansAccents = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const groupe = po => { const p = String(po || '').split('/')[0].toUpperCase(); return /^(LD|RD|D)$/.test(p) ? 'D' : p === 'G' ? 'G' : 'A'; };
const nomAffiche = j => { if(!j.nom) return j.joueur; const v = j.nom.indexOf(','); return v > 0 ? j.nom.slice(v + 1).trim() + ' ' + j.nom.slice(0, v).trim() : j.nom; };
const num = v => {
  const s = String(v), t = /^(\d+):(\d{2})$/.exec(s);   // « 21:12 » (temps de glace) → minutes
  if(t) return +t[1] + t[2] / 60;
  const n = parseFloat(s.replace('%', '').replace(',', '.')); return isNaN(n) ? null : n;
};

async function gviz(params){
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&${params}&t=${Date.now()}`);
  const json = JSON.parse((await res.text()).match(/setResponse\(([\s\S]*)\);\s*$/)[1]);
  return json.table;
}

async function charger(){
  try{
    const [t, idsT] = await Promise.all([gviz('sheet=STATS_JOUEURS'), gviz('sheet=IDS_LNH').catch(() => null)]);
    const lab = t.cols.map(c => (c.label || '').trim());
    if(lab[0] !== 'Joueur' || lab[1] !== 'Nom'){ $('loader').hidden = true; $('vide').hidden = false; return; }
    const v = (c, i) => c[i] && c[i].v != null ? String(c[i].v).trim() : '';
    let importe = '';
    const cles = lab.map(l => l === 'PTS' ? 'p' : ENTETES[l]);
    joueurs = t.rows.map(r => {
      const c = r.c || [], j = {};
      COLS.forEach(x => { j[x.cle] = ''; });
      cles.forEach((k, i) => { if(k) j[k] = v(c, i); });
      importe = importe || j.importe;
      return j;
    }).filter(j => j.joueur && j.pj !== '0');   // 0 match joué : rien à montrer
    if(idsT && (idsT.cols[0] || {}).label === 'Joueur') idsT.rows.forEach(r => { const c = r.c || []; const n = c[0] && c[0].v, i = c[1] && c[1].v; if(n && /^\d{6,8}$/.test(String(i))) ids.set(String(n), String(i)); });
    // Équipes présentes
    const codes = [...new Set(joueurs.map(j => j.equipe).filter(Boolean))].sort((a, b) => ((EQUIPES.get(a) || {}).name || a).localeCompare((EQUIPES.get(b) || {}).name || b, 'fr'));
    codes.forEach(c => $('equipe').append(new Option((EQUIPES.get(c) || {}).name || c, c)));
    const d = importe ? new Date(importe) : null;
    $('note').textContent = (d && !isNaN(d) ? 'Stats importées le ' + new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(d) + '. ' : '')
      + 'Les buts de fusillade ne sont pas comptés. Clique sur une colonne pour trier.';
    $('loader').hidden = true; $('vide').hidden = true; $('page').hidden = false;
    rendre();
  }catch(e){
    console.error(e);
    $('loader').hidden = true; $('vide').hidden = false; $('vide').textContent = 'Impossible de charger les stats pour le moment.';
  }
}

function filtres(){
  const q = sansAccents(filtre.texte);
  return joueurs.filter(j => (!filtre.equipe || j.equipe === filtre.equipe) && (!filtre.po || groupe(j.po) === filtre.po)
    && (!q || sansAccents(j.joueur + ' ' + j.nom).includes(q)));
}

function rendreMeneurs(liste){
  $('meneurs').replaceChildren(...MENEURS.filter(([k]) => joueurs.some(j => j[k] !== '')).map(([k, titre]) => {
    const tries = liste.filter(j => num(j[k]) != null).sort((a, b) => num(b[k]) - num(a[k]) || num(b.p) - num(a.p)).slice(0, 4);
    const c = el('article', 'st-meneur');
    c.append(el('h3', null, titre));
    if(!tries.length){ c.append(el('p', 'st-note', '—')); return c; }
    const [p, ...suiv] = tries;
    const pr = el('div', 'st-premier');
    const id = ids.get(p.nom);
    const photo = el('img', 'st-photo'); photo.alt = '';
    photo.src = id ? `https://assets.nhle.com/mugs/nhl/latest/${id}.png` : (p.equipe ? 'Logos/' + p.equipe + '.png' : 'logo-lnhq.png');
    photo.onerror = () => { photo.src = 'logo-lnhq.png'; };
    const txt = el('div');
    const sm = el('small'); if(p.equipe) sm.append(logo(p.equipe)); sm.append(document.createTextNode([p.equipe, p.po].filter(Boolean).join(' · ')));
    txt.append(el('b', null, nomAffiche(p)), sm);
    pr.append(photo, txt, el('span', 'st-valeur', (k === 'pm' && num(p[k]) > 0 ? '+' : '') + p[k]));
    const ul = el('ul', 'st-suivants');
    suiv.forEach((j, i) => { const li = el('li'); li.append(el('span', 'st-rang', String(i + 2))); if(j.equipe) li.append(logo(j.equipe)); li.append(el('span', null, nomAffiche(j)), el('b', null, (k === 'pm' && num(j[k]) > 0 ? '+' : '') + j[k])); ul.append(li); });
    c.append(pr, ul);
    return c;
  }));
}

function rendre(){
  const liste = filtres();
  rendreMeneurs(liste);
  const cols = COLS.filter(c => joueurs.some(j => j[c.cle] !== ''));
  const tries = liste.slice().sort((a, b) => {
    const x = num(a[tri.cle]), y = num(b[tri.cle]);
    if(x == null && y == null) return 0; if(x == null) return 1; if(y == null) return -1;
    return (x - y) * tri.sens || (num(b.p) || 0) - (num(a.p) || 0);
  });
  const thead = el('thead'), tr = el('tr');
  const thJ = el('th', 'g fixe', 'Joueur'); tr.append(thJ, el('th', 'g', 'PO'));
  cols.forEach(c => {
    const th = el('th', null, c.titre); th.title = c.aide; th.tabIndex = 0;
    if(tri.cle === c.cle) th.setAttribute('aria-sort', tri.sens < 0 ? 'descending' : 'ascending');
    const changer = () => { tri = tri.cle === c.cle ? { cle: c.cle, sens: -tri.sens } : { cle: c.cle, sens: -1 }; rendre(); };
    th.addEventListener('click', changer);
    th.addEventListener('keydown', ev => { if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); changer(); } });
    tr.append(th);
  });
  thead.append(tr);
  const tbody = el('tbody');
  tries.forEach((j, i) => {
    const r = el('tr');
    const td = el('td', 'g fixe'), box = el('div', 'st-joueur');
    box.append(el('span', 'st-rang', String(i + 1)));
    if(j.equipe) box.append(logo(j.equipe));
    const t = EQUIPES.get(j.equipe);
    const lien = el(t ? 'a' : 'span', null, nomAffiche(j));
    if(t) lien.href = 'equipe.html?team=' + t.slug + (j.nom ? '&joueur=' + encodeURIComponent(j.nom) : '');
    box.append(lien);
    td.append(box);
    r.append(td, el('td', 'g st-pos', j.po));
    cols.forEach(c => {
      const cell = el('td', tri.cle === c.cle ? 'tri' : '', c.cle === 'pm' && num(j.pm) > 0 ? '+' + j.pm : j[c.cle]);
      if(c.cle === 'pm' && num(j.pm)) cell.classList.add(num(j.pm) > 0 ? 'st-pm-pos' : 'st-pm-neg');
      r.append(cell);
    });
    tbody.append(r);
  });
  if(!tries.length){ const r = el('tr'), td = el('td', 'g', 'Aucun joueur pour ces filtres.'); td.colSpan = cols.length + 2; r.append(td); tbody.append(r); }
  $('table').replaceChildren(thead, tbody);
  if(els.rowCount) els.rowCount.textContent = `Stats des joueurs — ${tries.length} joueur${tries.length > 1 ? 's' : ''}`;
}

$('recherche').addEventListener('input', () => { filtre.texte = $('recherche').value; rendre(); });
$('equipe').addEventListener('change', () => { filtre.equipe = $('equipe').value; rendre(); });
document.querySelectorAll('[data-po]').forEach(b => b.addEventListener('click', () => {
  filtre.po = b.dataset.po;
  document.querySelectorAll('[data-po]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  rendre();
}));
charger();
</script>
</body>
</html>
