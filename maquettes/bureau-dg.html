    <div class="bu-scene" id="scene" hidden>
      <img class="bu-fond" src="maquettes/bureau-dg-fond.webp" alt="" width="1672" height="941">
      <button type="button" class="bu-objet bu-del" data-objet="resultats" aria-label="Bandeau : résultats de la ligue"><div class="bu-ecran" id="o-del"></div></button>
      <button type="button" class="bu-objet bu-chandail" data-objet="fiche" aria-label="Chandail : fiche de l'équipe et du DG"><span class="bu-ecusson" id="o-ecusson"></span></button>
      <button type="button" class="bu-objet bu-vertical" data-objet="meneurs" aria-label="Écran vertical : meneurs de l'équipe"><div class="bu-ecran" id="o-meneurs"></div></button>
      <button type="button" class="bu-objet bu-tele" data-objet="tele" aria-label="Grand écran : classement et prochain match"><div class="bu-ecran" id="o-tele"></div></button>
      <button type="button" class="bu-objet bu-tableau" data-objet="cartable" aria-label="Tableau magnétique : alignement"><div class="bu-contenu" id="o-tableau"></div></button>
      <button type="button" class="bu-objet bu-calendrier" data-objet="calendrier" aria-label="Calendrier mural"><div class="bu-contenu" id="o-calendrier"></div></button>
      <button type="button" class="bu-objet bu-babillard" data-objet="babillard" aria-label="Babillard : annonces et nouvelles"><div class="bu-contenu" id="o-babillard"></div></button>

      <button type="button" class="bu-objet bu-manette" data-objet="console" aria-label="Manette : soumettre un résultat"></button>
      <button type="button" class="bu-objet bu-chemise" data-objet="chemise" aria-label="Chemise : rapport de dépistage"><div class="bu-contenu" id="o-chemise"></div></button>
      <span class="bu-tasse" id="o-tasse"></span>
    </div>

    <!-- Téléphone : les objets en pile (la scène ne tiendrait pas). -->

    <!-- Objet ouvert en plein écran. -->
    <div class="bu-zoom" id="zoom" hidden>
      <div class="bu-zoom-fond" id="zoomFond"></div>
      <div class="bu-zoom-objet" id="zoomObjet" role="dialog" aria-modal="true">
        <button type="button" class="bu-fermer" id="zoomFermer" aria-label="Revenir au bureau">✕</button>
        <div class="bu-zoom-corps" id="zoomCorps"></div>
      </div>
    </div>

    <!-- Contenus détaillés (réutilisés de la maquette du centre d'équipe). -->
    <div id="reserve" hidden>
      <section class="ce-panneau" id="p-alignement"></section>
      <section class="ce-panneau" id="p-affrontements"></section>
      <section class="ce-panneau" id="p-transactions"></section>
      <section class="ce-panneau" id="p-agents"></section>
      <aside id="gauche"></aside><aside id="droite"></aside>
    </div>
  </main>
</div>

<dialog class="ce-modal" id="modal">
  <h2>C'est quoi ton équipe ?</h2>
  <p>Le centre s'ouvrira sur elle à chaque visite (gardé dans ce navigateur).</p>

</dialog>

<!-- Masque de gardien (aimant du 2e gardien) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="masque" viewBox="0 0 64 64">
    <path d="M32 3C18 3 10 13 10 27c0 15 9 30 22 34 13-4 22-19 22-34C54 13 46 3 32 3z" fill="#f8f9fa" stroke="#212529" stroke-width="2.5"/>
    <path d="M32 3C24 3 17 7 14 14l36 0C47 7 40 3 32 3z" fill="var(--ce-couleur, #E8590C)"/>
    <path d="M17 27h30M17 35h30M17 43h30M24 24v26M32 24v30M40 24v26" stroke="#343a40" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M14 22l8-2M50 22l-8-2" stroke="#212529" stroke-width="2"/>
  </symbol>
</svg>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const R = window.LNHQ_RESULTATS, G = window.LNHQ_GARDIENS;
  const EQUIPES = new Map((window.LNHQ_TEAMS || []).map(t => [t.code, t]));
  const nom = c => (EQUIPES.get(c) || {}).name || c;
  const logoSrc = c => 'Logos/' + c + '.png';
  const COULEURS = {
    ANA: ['#F47A38', '#0D0D0D'], BOS: ['#FFB81C', '#000000'], BUF: ['#FCB514', '#002654'], CGY: ['#C8102E', '#4B0009'],
    CAR: ['#CC0000', '#000000'], CHI: ['#CF0A2C', '#000000'], COL: ['#6F263D', '#041E42'], CBJ: ['#CE1126', '#002654'],
    DAL: ['#006847', '#111111'], DET: ['#CE1126', '#000000'], EDM: ['#FF4C00', '#041E42'], FLA: ['#C8102E', '#041E42'],
    LAK: ['#8C9396', '#000000'], MIN: ['#A6192E', '#154734'], MTL: ['#AF1E2D', '#192168'], NSH: ['#FFB81C', '#041E42'],
    NJD: ['#CE1126', '#000000'], NYI: ['#F47D30', '#00539B'], NYR: ['#CE1126', '#001E60'], OTT: ['#C52032', '#000000'],
    PHI: ['#F74902', '#000000'], PIT: ['#FCB514', '#000000'], SJS: ['#006D75', '#000000'], SEA: ['#99D9D9', '#001628'],
    STL: ['#FCB514', '#002F87'], TBL: ['#0057B8', '#000000'], TOR: ['#003E7E', '#000000'], UTA: ['#69B3E7', '#000000'],
    VAN: ['#00843D', '#041C2C'], VGK: ['#B4975A', '#101820'], WSH: ['#C8102E', '#041E42'], WPG: ['#004C97', '#041E42'],
  };
  const canaux = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const texteSur = hex => { const [r, g, b] = canaux(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#12181F' : '#FFFFFF'; };
  const melange = (hex, t, vers) => '#' + canaux(hex).map(v => Math.round(v + ((vers === 'blanc' ? 255 : 0) - v) * t).toString(16).padStart(2, '0')).join('');

  function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function logo(c, cls){ const i = el('img', cls); i.src = logoSrc(c); i.alt = ''; i.onerror = () => { i.style.visibility = 'hidden'; }; return i; }
  function masque(cls){ const ns = 'http://www.w3.org/2000/svg'; const s = document.createElementNS(ns, 'svg'); s.setAttribute('class', cls); s.setAttribute('viewBox', '0 0 64 64'); const u = document.createElementNS(ns, 'use'); u.setAttribute('href', '#masque'); s.append(u); return s; }
  function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('is-visible'); clearTimeout(toast.m); toast.m = setTimeout(() => e.classList.remove('is-visible'), 3600); }

  /* ---------- Dates ---------- */
  const parse = s => { const [a, m, j] = String(s).slice(0, 10).split('-').map(Number); return new Date(a, m - 1, j); };
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const lundi = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
  const AUJ = iso(new Date());
  const fJour = new Intl.DateTimeFormat('fr-CA', { weekday: 'long', day: 'numeric', month: 'short' });
  const fCourt = new Intl.DateTimeFormat('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' });
  const fMois = new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short' });
  const ecartJours = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  function heureTexte(h){ const m = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(h || ''); if(!m) return h || ''; let H = Number(m[1]) % 12; if(/pm/i.test(m[3] || '')) H += 12; else if(!m[3]) H = Number(m[1]); return H + ' h ' + m[2]; }

  /* ---------- État ---------- */
  let matchs = [], resultats = {}, decl = {}, periodes = [], classement = [];
  let equipe = (new URLSearchParams(location.search).get('equipe') || '').toUpperCase();
  try{ if(!EQUIPES.has(equipe)) equipe = localStorage.getItem('ce_equipe') || ''; }catch(e){}
  let vue = 'equipe', semaines = [], semaine = '';
  let theme = 'planchette';
  try{ theme = localStorage.getItem('ce_theme') || 'planchette'; }catch(e){}
  const simulees = {};   // déclarations simulées : 'MTL|2' → numéro du match
  let mode = 'public';   // 'public' (visiteur, n'importe quelle équipe) ou 'dg' (DG connecté de cette équipe)
  let onglet = 'apercu';
  const estDG = () => mode === 'dg' && !!equipe;

  async function charger(){
    const url = 'https://docs.google.com/spreadsheets/d/1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A/gviz/tq?tqx=out:json&gid=1528349633&headers=0&t=' + Date.now();
    const [texte, res, d] = await Promise.all([fetch(url).then(r => r.text()), R.chargerResultats(), G.chargerDeclarations()]);
    const table = JSON.parse(texte.match(/setResponse\(([\s\S]*)\);\s*$/)[1]).table;
    const lignes = table.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? String(c.v) : '')) : ''));
    resultats = res; decl = d;
    const mg = G.lireCalendrier(lignes);
    periodes = G.periodes(mg);
    matchs = mg.map(m => {
      const r = res[m.num];
      const ligne = lignes.find(l => String(l[0]).trim() === m.num) || [];
      const sv = r ? r.butsV : Number(ligne[5]), sd = r ? r.butsD : Number(ligne[6]);
      const joue = r ? true : (String(ligne[5]).trim() !== '' && String(ligne[6]).trim() !== '' && !isNaN(sv) && !isNaN(sd));
      return { num: m.num, date: m.date, heure: m.heure, v: m.codeVisiteur, d: m.codeDomicile, periode: m.periode, semaine: lundi(m.date),
        joue, bv: joue ? sv : null, bd: joue ? sd : null, fin: r ? r.fin : '' };
    }).filter(m => m.v && m.d);
    classement = R.classement(res, [...EQUIPES.keys()]);
    semaines = [...new Set(matchs.map(m => m.semaine))].sort();
  }

  /* ---------- Équipe ---------- */
  function appliquerCouleurs(){
    const [p, f] = COULEURS[equipe] || ['#E8590C', '#2D333B'];
    const r = document.documentElement.style;
    const sombre = matchMedia('(prefers-color-scheme: dark)').matches;
    r.setProperty('--accent', p); r.setProperty('--accent-ink', texteSur(p));
    r.setProperty('--accent-soft', sombre ? melange(p, 0.75, 'noir') : melange(p, 0.85, 'blanc'));
    r.setProperty('--nav-dark', f); r.setProperty('--nav-ink', texteSur(f));
    r.setProperty('--ce-couleur', p); r.setProperty('--ce-sombre', f);
    $('equipeLogo').src = logoSrc(equipe); $('equipeLogo').hidden = !equipe;
    $('equipeNom').textContent = equipe ? nom(equipe) : 'Choisir mon équipe';
  }
  function choisirEquipe(c){
    equipe = c;
    try{ localStorage.setItem('ce_equipe', c); }catch(e){}
    $('modal').close();
    // Choisir une équipe ouvre son centre (et non la vue « Toute la ligue »).
    vue = 'equipe';
    alignement = null;
    document.querySelectorAll('[data-vue]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.vue === 'equipe')));
    appliquerCouleurs();
    semaine = semaineCourante();
    rendreTout();
  }
  function ouvrirModal(){
    const g = $('grilleEquipes');
    g.replaceChildren(...[...EQUIPES.values()].sort((a, b) => a.name.localeCompare(b.name, 'fr')).map((t, i) => {
      const b = el('button'); b.type = 'button'; b.style.setProperty('--i', i);
      b.append(logo(t.code), el('span', null, t.name));
      b.addEventListener('click', () => choisirEquipe(t.code));
      return b;
    }));
    $('modal').showModal();
  }

  /* ---------- Calculs ---------- */
  const mesMatchs = () => matchs.filter(m => m.v === equipe || m.d === equipe);
  const resultatPour = m => { const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv; return pour > contre ? 'v' : m.fin ? 'p' : 'd'; };
  function semaineCourante(){
    const l = lundi(AUJ);
    const liste = vue === 'equipe' && equipe ? [...new Set(mesMatchs().map(m => m.semaine))].sort() : semaines;
    return liste.find(s => s >= l) || liste[liste.length - 1] || l;
  }
  function declaration(code, periode){
    if(simulees[code + '|' + periode]) return { match: simulees[code + '|' + periode], simulee: true };
    return decl[code + '|' + periode] || null;
  }

  /* =========================================================================
     Rendu
     ========================================================================= */
  function rendreTout(){
    $('chargement').hidden = true;
    const avecEquipe = vue === 'equipe' && equipe;
    $('hero').hidden = !avecEquipe;
    $('onglets').hidden = !avecEquipe;
    if(!avecEquipe) onglet = 'apercu';
    document.querySelectorAll('[data-onglet]').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.onglet === onglet));
      // Barre défilante sur téléphone : l'onglet actif reste visible.
      if(b.dataset.onglet === onglet){ const barre = $('onglets'); barre.scrollTo({ left: b.offsetLeft - (barre.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' }); }
    });
    $('grille').hidden = onglet !== 'apercu';
    ['alignement', 'affrontements', 'transactions', 'agents'].forEach(o => { $('p-' + o).hidden = onglet !== o; });
    $('droite').hidden = !avecEquipe;
    $('gauche').hidden = !avecEquipe;
    $('grille').classList.toggle('is-ligue', !avecEquipe);
    // Plus de gros « prochain match » : la semaine (et les matchs en retard) est au centre.
    $('hero').hidden = true;
    if(onglet === 'apercu'){
      if(avecEquipe) rendreDroite();
      rendreSemaine(null);
    }else{
      ({ alignement: rendreAlignement, affrontements: rendreAffrontements, transactions: rendreTransactions, agents: rendreAgents })[onglet]();
    }
  }

  /* =========================================================================
     Données supplémentaires (lecture seule) : chargées une fois, au besoin.
     ========================================================================= */
  const memo = {};
  const unefois = (cle, fn) => memo[cle] || (memo[cle] = fn().catch(e => { delete memo[cle]; throw e; }));
  async function gvizTable(params){
    const res = await fetch('https://docs.google.com/spreadsheets/d/1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A/gviz/tq?tqx=out:json&headers=1&' + params + '&t=' + Date.now());
    return JSON.parse((await res.text()).match(/setResponse\(([\s\S]*)\);\s*$/)[1]).table;
  }
  const cellules = t => t.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? String(c.f) : c.v != null ? String(c.v) : '') : ''));
  const dateGviz = v => { const m = /^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/.exec(v || ''); return m ? new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0)) : null; };
  const millions = n => (n / 1e6).toLocaleString('fr-CA', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + ' M$';
  const prenomNom = b => { const v = b.indexOf(','); return v > 0 ? b.slice(v + 1).trim() + ' ' + b.slice(0, v).trim() : b; };
  // Tous les joueurs sous contrat d'une équipe (pour le marché et les offres fictives).
  const tousLesJoueurs = () => unefois('joueurs', async () => {
    const t = await gvizTable('sheet=PLAYERSDATABASE&tq=' + encodeURIComponent("select B, C, H, Z, AB, N where Z <> '' and Z <> 'UFA' and H <> 'CHOIX'"));
    return t.rows.map(r => (r.c || [])).map(c => ({ id: c[0] ? String(c[0].v) : '', ov: c[1] ? Number(c[1].v) || 0 : 0, po: c[2] ? String(c[2].v) : '',
      equipe: c[3] ? String(c[3].v).toUpperCase() : '', espoir: c[4] ? c[4].v === true : false, salaire: c[5] ? Number(c[5].v) || 0 : 0 }))
      .filter(j => j.id && EQUIPES.has(j.equipe));
  });
  // Tirage « au hasard » mais stable (la maquette montre toujours les mêmes exemples).
  const graine = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  function exemplesMarche(joueurs){
    return [...EQUIPES.keys()].filter(c => graine(c) % 3 !== 0).flatMap(c => {
      const liste = joueurs.filter(j => j.equipe === c && !j.espoir).sort((a, b) => b.ov - a.ov);
      if(liste.length < 8) return [];
      const j = liste[4 + graine(c) % Math.max(1, liste.length - 8)];
      return [{ ...j, note: ['Ouvert à toute offre', 'Cherche un défenseur droitier', 'Contre un choix de 1re ronde', 'Pour libérer de l’espace', 'Cherche un centre'][graine(c + j.id) % 5] }];
    });
  }
  const miniJoueur = (j, droite) => {
    const r = el('div', 'ce-mini');
    const ov = el('span', 'ce-ov', String(j.ov || '–'));
    ov.style.setProperty('--c', (COULEURS[j.equipe] || ['#555'])[0]);
    const n = el('span', 'n'); n.append(el('b', null, prenomNom(j.id)), el('small', null, [j.po, j.espoir ? 'espoir' : j.salaire ? millions(j.salaire) : ''].filter(Boolean).join(' · ')));
    r.append(ov, n);
    if(droite) r.append(droite);
    return r;
  };

  /* ---------- Annonces de la ligue + dernière nouvelle (non lue) ---------- */

    const punaises = ['#E03131', '#1C7ED6', '#2F9E44', '#E0A800'];

      const l = el('a', 'ce-papier ' + cls); l.href = (cls.includes('nouvelle') ? '?fil=nouvelles' : '?fil=annonces') + '#n-' + x.id; l.target = '_blank';
      l.style.setProperty('--r', [-2.2, 1.6, -0.8, 2.4][i % 4] + 'deg');
      l.style.setProperty('--punaise', punaises[i % 4]);
      if(etiquette) l.append(etiquette);
      l.append(el('b', null, x.titre), el('small', null, [x.equipe, x.date ? fCourt.format(x.date) : ''].filter(Boolean).join(' · ')), el('p', null, extrait(x.texte)));

  /* ---------- Alignement (Daily Faceoff) : lecture ; DG : échanger deux cartes ---------- */
  let alignement = null;   // { code, compo, choisie }
  async function rendreAlignement(){
    const p = $('p-alignement');
    const A = window.LNHQ_ALIGNEMENT;
    if(!alignement || alignement.code !== equipe){
      p.replaceChildren(el('p', 'ce-chargement', 'On place les joueurs sur la glace…'));
      const [joueurs, sauvegarde] = await Promise.all([A.chargerJoueurs(equipe), A.chargerSauvegarde(equipe)]);
      alignement = { code: equipe, compo: A.composer(joueurs, sauvegarde), choisie: '', modifie: sauvegarde ? sauvegarde.modifie : '' };
    }
    const titre = el('h2', 'ce-titre-sec', 'Alignement · ' + nom(equipe));
    titre.append(el('small', null, estDG() ? 'Touche un joueur puis un autre pour les échanger.' : (alignement.modifie ? 'Enregistré par le DG' : 'Alignement automatique (par position et overall)')));
    if(estDG()) titre.append(el('span', 'ce-dg-seul', '🔑 Mode DG'));
    const zone = el('div', 'al-zone' + (estDG() ? ' al-modifiable' : ''));
    zone.style.padding = '0';
    const [p1, f1] = COULEURS[equipe] || ['#E8590C', '#1b1f24'];
    zone.style.setProperty('--al-couleur', p1); zone.style.setProperty('--al-sombre', melange(f1, 0.35, 'noir'));
    const contenu = el('div');
    zone.append(contenu);
    const dessiner = () => A.rendre(contenu, alignement.compo, estDG() ? { surCarte: (cle, carte) => {
      carte.tabIndex = 0; carte.setAttribute('role', 'button');
      carte.classList.toggle('is-choisie', cle === alignement.choisie);
      carte.addEventListener('click', () => toucher(cle));
    } } : {});
    const joueurDe = cle => cle.startsWith('R:') ? alignement.compo.reservistes.find(j => 'R:' + j.id === cle) : alignement.compo.places[cle];
    function toucher(cle){
      const a = alignement.choisie;
      if(!a){ if(joueurDe(cle)) alignement.choisie = cle; dessiner(); return; }
      if(a === cle){ alignement.choisie = ''; dessiner(); return; }
      const ra = a.startsWith('R:'), rb = cle.startsWith('R:');
      const c = alignement.compo;
      if(ra && rb){ alignement.choisie = cle; dessiner(); return; }
      if(!ra && !rb){ [c.places[a], c.places[cle]] = [c.places[cle], c.places[a]]; }
      else{
        const place = ra ? cle : a, res = ra ? a : cle;
        const entrant = joueurDe(res), sortant = c.places[place];
        c.reservistes = c.reservistes.filter(j => j !== entrant);
        if(sortant) c.reservistes.push(sortant);
        c.places[place] = entrant;
        A.trierReservistes(c.reservistes);
      }
      alignement.choisie = '';
      dessiner();
      toast('Maquette : échange fait (sur le vrai site, bouton « Enregistrer »).');
    }
    dessiner();
    p.replaceChildren(titre, zone);
  }

  /* ---------- Face-à-face : les 3 prochains adversaires ---------- */
  function rendreAffrontements(){
    const p = $('p-affrontements');
    const prochains = mesMatchs().filter(m => !m.joue).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num)).slice(0, 3);
    const titre = el('h2', 'ce-titre-sec', 'Face-à-face'); titre.append(el('small', null, 'Les prochains adversaires, la série et la comparaison de la saison'));
    const grille = el('div', 'ce-cartes2');
    const stats = R.statsEquipes(resultats, [...EQUIPES.keys()]);
    const st = c => stats.find(s => s.code === c) || {};
    const fiche = c => { const t = classement.find(x => x.code === c); return t ? `${t.v}-${t.d}-${t.dp} · ${t.pts} pts` : ''; };
    prochains.forEach((m, i) => {
      const adv = m.v === equipe ? m.d : m.v;
      const c = el('article', 'ce-duel');
      c.style.setProperty('--adv', (COULEURS[adv] || ['#555'])[0]);
      c.style.animation = `aimant-pose .5s ${i * 0.12}s cubic-bezier(.2,.9,.3,1.25) both`;
      const tete = el('div', 'ce-duel-tete');
      const cote = code => { const d = el('div', 'c'); d.append(logo(code), el('b', null, nom(code)), el('small', null, fiche(code))); return d; };
      const mil = el('div', 'm', m.v === equipe ? '@' : 'vs'); mil.append(el('span', null, fCourt.format(parse(m.date))), el('span', null, heureTexte(m.heure)));
      tete.append(cote(equipe), mil, cote(adv));
      const corps = el('div', 'ce-duel-corps');
      const entre = matchs.filter(x => x.joue && ((x.v === equipe && x.d === adv) || (x.d === equipe && x.v === adv)));
      const serie = el('div', 'ce-serie-liste');
      if(!entre.length) serie.append(el('span', null, 'Premier duel de la saison'));
      entre.forEach(x => { const r = resultatPour(x); const s = el('span'); s.append(el('span', 'ce-badge ' + r, r === 'v' ? 'V' : r === 'p' ? 'DP' : 'D'), document.createTextNode(` ${x.v === equipe ? x.bv : x.bd}-${x.v === equipe ? x.bd : x.bv} · ${fMois.format(parse(x.date))}`)); serie.append(s); });
      corps.append(serie);
      const a = st(equipe), b = st(adv);
      const ligne = (lib, va, vb, fmt, plusHautMieux = true) => {
        if(va == null || vb == null) return;
        const max = Math.max(va, vb) || 1;
        const r = el('div', 'ce-comp');
        const mieuxA = plusHautMieux ? va > vb : va < vb, mieuxB = plusHautMieux ? vb > va : vb < va;
        const g = el('div', 'bar g'), s1 = el('span'); s1.style.width = (100 * va / max) + '%'; g.append(s1);
        const d = el('div', 'bar d'), s2 = el('span'); s2.style.width = (100 * vb / max) + '%'; d.append(s2);
        r.append(el('b', mieuxA ? 'is-mieux' : '', fmt(va)), g, el('span', 'l', lib), d, el('b', mieuxB ? 'is-mieux' : '', fmt(vb)));
        corps.append(r);
      };
      const un = v => v.toFixed(1), pct = v => Math.round(v) + '%';
      ligne('Buts pour', a.bpMoy, b.bpMoy, un);
      ligne('Buts contre', a.bcMoy, b.bcMoy, un, false);
      ligne('Tirs', a.tirsMoy, b.tirsMoy, un);
      ligne('Avantage num.', a.anPct, b.anPct, pct);
      ligne('Désavantage', a.dnPct, b.dnPct, pct);
      ligne('Mises au jeu', a.mjPct, b.mjPct, pct);
      c.append(tete, corps);
      grille.append(c);
    });
    if(!prochains.length) grille.append(el('p', 'ce-vide', 'Plus de match à venir.'));
    p.replaceChildren(titre, grille);
  }

    if(estDG()){

      const s = section('Se terminent bientôt (ligue)', autres, 'autre', 'Aucune autre enchère en cours.');
      s.querySelector('h3').append(el('span', 'ce-dg-seul', '🔑 Mode DG'));
      const lancer = el('button', 'ce-bouton is-principal', '+ Lancer une enchère'); lancer.type = 'button';
      lancer.addEventListener('click', () => toast('Maquette : ouvrirait la liste des agents libres pour lancer une enchère.'));
      s.append(lancer);
      blocs.push(s);
    }
    p.replaceChildren(...blocs);
  }

  function rendreHero(){
    const h = $('hero');
    const prochain = mesMatchs().filter(m => !m.joue).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num))[0];
    h.replaceChildren();
    if(!prochain){ h.append(el('div', 'ce-hero-etiquette', 'Saison terminée')); return; }
    const adv = prochain.v === equipe ? prochain.d : prochain.v;
    h.style.setProperty('--adv-couleur', (COULEURS[adv] || ['#555'])[0]);
    const fiche = c => { const t = classement.find(x => x.code === c); return t ? `${t.v}-${t.d}-${t.dp} · ${t.pts} pts` : ''; };
    const cote = (c, cls) => { const d = el('div', 'ce-cote ' + cls); d.append(logo(c), el('b', null, nom(c)), el('small', null, fiche(c))); return d; };
    const ecart = ecartJours(AUJ, prochain.date);
    const quand = el('div', 'ce-quand', ecart === 0 ? 'Ce soir' : ecart === 1 ? 'Demain' : ecart < 0 ? 'En retard' : 'Dans ' + ecart + ' jours');
    quand.append(el('small', null, fJour.format(parse(prochain.date)) + (prochain.heure ? ' · ' + heureTexte(prochain.heure) : '') + ' · ' + (prochain.v === equipe ? 'à l’étranger' : 'à domicile')));
    const milieu = el('div', 'ce-milieu');
    milieu.append(el('div', 'ce-rondelle'), quand);
    const corps = el('div', 'ce-hero-corps');
    corps.append(cote(equipe, 'is-gauche'), milieu, cote(adv, 'is-droite'));
    // Série entre les deux équipes cette saison.
    const entre = matchs.filter(m => m.joue && ((m.v === equipe && m.d === adv) || (m.d === equipe && m.v === adv)));
    const gagnes = entre.filter(m => resultatPour(m) === 'v').length;
    const pied = el('div', 'ce-hero-pied');
    pied.append(el('span', 'ce-serie', entre.length ? `Série cette saison : ${gagnes}-${entre.length - gagnes} ${gagnes >= entre.length - gagnes ? 'pour ' + nom(equipe) : 'pour ' + nom(adv)}` : 'Premier duel de la saison'));
    const soum = el('a', 'ce-btn is-principal', '📷 Soumettre le résultat');
    soum.href = '#'; soum.addEventListener('click', ev => { ev.preventDefault(); toast('Maquette : ouvrirait la soumission du match nº ' + prochain.num + ', déjà rempli.'); });
    const tv = el('a', 'ce-btn', '📺 LNHQ TV'); tv.href = '../tv.html';
    if(estDG()) pied.append(soum);
    pied.append(tv);
    h.append(el('div', 'ce-hero-etiquette', 'Prochain match · nº ' + prochain.num), corps, pied);
  }

  // Semaine (ou toute la ligue) sur la planchette / le tableau, avec animation de page.
  function rendreSemaine(sens){
    const liste = vue === 'equipe' && equipe ? [...new Set(mesMatchs().map(m => m.semaine))].sort() : semaines;
    if(!liste.includes(semaine)) semaine = semaineCourante();
    const i = liste.indexOf(semaine);
    $('prec').disabled = i <= 0; $('suiv').disabled = i >= liste.length - 1;
    $('blocAuj').hidden = semaine === semaineCourante();
    const fin = parse(semaine); fin.setDate(fin.getDate() + 6);
    const titre = $('titreSemaine');
    titre.textContent = 'Semaine ' + (semaines.indexOf(semaine) + 1);
    titre.append(el('small', null, fMois.format(parse(semaine)) + ' au ' + fMois.format(fin) + (semaine === lundi(AUJ) ? ' · cette semaine' : '')));

    const feuille = el('div', 'ce-feuille');
    if(vue === 'equipe' && equipe) feuilleEquipe(feuille); else feuilleLigue(feuille);
    const pile = $('feuilles');
    const ancienne = pile.querySelector('.ce-feuille:not(.sort-suiv):not(.sort-prec)');
    if(!ancienne || !sens){ pile.replaceChildren(feuille); return; }
    // Planchette, semaine suivante : la feuille du dessus est arrachée sous la pince.
    if(theme === 'planchette' && sens > 0 && !reduit){
      arracher(ancienne);
      feuille.classList.add('entre-suiv');
      pile.replaceChildren(feuille);
      return;
    }
    if(sens < 0) document.querySelectorAll('.ce-reste').forEach(r => r.remove());   // la page revient : plus de bout déchiré
    if(theme === 'tableau'){
      const brosse = el('div', 'ce-brosse ' + (sens > 0 ? 'va-gauche' : 'va-droite'));
      $('support').append(brosse);
      brosse.addEventListener('animationend', () => brosse.remove());
    }
    ancienne.classList.add(sens > 0 ? 'sort-suiv' : 'sort-prec');
    feuille.classList.add(sens > 0 ? 'entre-suiv' : 'entre-prec');
    if(sens > 0) pile.prepend(feuille); else pile.append(feuille);
    setTimeout(() => ancienne.remove(), 700);
  }

  /* Arrachage : bord déchiré tiré au hasard sous la pince. La feuille (sans sa bande du haut)
     tombe en tournoyant ; la bande déchirée reste coincée dans la pince jusqu'au prochain
     changement. */
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasard = (a, b) => a + Math.random() * (b - a);
  function arracher(ancienne){
    const support = $('support');
    const s = support.getBoundingClientRect(), a = ancienne.getBoundingClientRect();
    // Ligne de déchirure : juste sous la pince, irrégulière, avec quelques accrocs.
    const base = hasard(40, 46), points = [];
    for(let x = 0; x < 100; x += hasard(1.2, 3.4)){
      let y = base + hasard(-3.5, 3.5) + Math.sin(x / hasard(5, 9)) * 2.2;
      if(Math.random() < 0.08) y += hasard(4, 9);   // accroc : la déchirure plonge
      points.push([x, y]);
    }
    points.push([100, base + hasard(-3, 3)]);
    const ligne = points.map(([x, y]) => `${x.toFixed(1)}% ${y.toFixed(1)}px`);
    // Bout resté dans la pince (remplace le précédent).
    support.querySelectorAll('.ce-reste').forEach(r => r.remove());
    const reste = el('div', 'ce-feuille ce-reste');
    const hReste = Math.max(...points.map(p => p[1])) + 2;
    Object.assign(reste.style, { left: (a.left - s.left) + 'px', top: (a.top - s.top) + 'px', width: a.width + 'px', height: hReste + 'px', padding: '0',
      clipPath: `polygon(0 0, 100% 0, ${ligne.slice().reverse().join(', ')})` });
    // La feuille arrachée : même place, sans la bande du haut, puis elle tombe.
    support.append(ancienne);
    ancienne.classList.add('ce-arrachee');
    Object.assign(ancienne.style, { left: (a.left - s.left) + 'px', top: (a.top - s.top) + 'px', width: a.width + 'px', height: a.height + 'px',
      clipPath: `polygon(${ligne.join(', ')}, 100% 100%, 0 100%)` });
    support.append(reste);
    const versDroite = Math.random() < 0.6 ? 1 : -1;
    const chute = ancienne.animate([
      { transform: 'translate(0, 0) rotate(0deg)', filter: 'drop-shadow(0 2px 3px rgba(0,0,0,.2))' },
      { transform: `translate(${2 * versDroite}px, 7px) rotate(${0.8 * versDroite}deg)`, offset: 0.1 },          // on tire
      { transform: `translate(${-2 * versDroite}px, 4px) rotate(${-0.5 * versDroite}deg)`, offset: 0.18 },      // ça résiste
      { transform: `translate(${22 * versDroite}px, 46px) rotate(${6 * versDroite}deg)`, offset: 0.36, filter: 'drop-shadow(0 18px 18px rgba(0,0,0,.35))' },
      { transform: `translate(${hasard(120, 220) * versDroite}px, ${a.height + 260}px) rotate(${hasard(22, 38) * versDroite}deg)`, opacity: 0, filter: 'drop-shadow(0 40px 30px rgba(0,0,0,.3))' },
    ], { duration: 1250 * (window.__ralenti || 1), easing: 'cubic-bezier(.4,0,.75,.55)', fill: 'forwards' });
    ancienne.style.transformOrigin = versDroite > 0 ? '15% 0' : '85% 0';
    chute.finished.then(() => ancienne.remove(), () => ancienne.remove());
  }

  // Série de la saison contre un adversaire (matchs joués).
  function serieContre(adv){
    const entre = matchs.filter(x => x.joue && ((x.v === equipe && x.d === adv) || (x.d === equipe && x.v === adv)));
    if(!entre.length) return '1er duel';
    const v = entre.filter(x => resultatPour(x) === 'v').length;
    return `Série ${v}-${entre.length - v}`;
  }

  function aimantMatch(m, i, per, dejaDecl){
    const adv = m.v === equipe ? m.d : m.v;
    const retard = !m.joue && m.date < AUJ;
    const a = el('article', 'ce-aimant' + (m.joue ? ' is-joue' : '') + (m.date === AUJ && !m.joue ? ' is-auj' : '') + (retard ? ' is-retard' : ''));
    a.style.setProperty('--i', i);
    a.style.setProperty('--r', ((i % 3) - 1) * 1.3 + 'deg');
    a.dataset.num = m.num;
    const advBloc = el('div', 'ce-adv');
    advBloc.append(el('small', null, m.v === equipe ? '@' : 'vs'), logo(adv));
    a.append(el('span', 'ce-jour', fCourt.format(parse(m.date))), advBloc, el('span', 'ce-adv-nom', nom(adv)));
    if(m.joue){
      const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv, r = resultatPour(m);
      const s = el('div', 'ce-score');
      s.append(el('span', null, pour + '-' + contre), el('span', 'ce-badge ' + r, r === 'v' ? 'V' : r === 'p' ? 'DP' : 'D'));
      if(m.fin) s.append(el('span', 'ce-heure', R.FINS[m.fin]));
      a.append(s);
    }else{
      a.append(el('span', 'ce-heure', heureTexte(m.heure) || 'Heure à venir'));
      if(estDG()){
        const b = el('button', 'ce-action', retard ? 'Soumettre (en retard)' : 'Soumettre');
        b.type = 'button';
        b.addEventListener('click', () => toast('Maquette : ouvrirait la soumission du match nº ' + m.num + ' (' + nom(m.v) + ' @ ' + nom(m.d) + ').'));
        a.append(b);
      }
    }
    a.append(el('span', 'ce-serie-mini', serieContre(adv)));
    if(retard) a.append(el('span', 'ce-tampon', 'En retard'));
    // 2e gardien : masque posé si ce match est déclaré ; sinon cible de dépôt possible (DG).
    const d = declaration(equipe, m.periode);
    if(d && String(d.match) === m.num) a.append(masque('ce-masque-pose'));
    if(estDG() && per && m.periode === per.num && !m.joue && !dejaDecl) a.classList.add('est-cible');
    return a;
  }

  /* Planchette : la semaine écrite au stylo sur les lignes du papier. Score au feutre rouge,
     résultat encerclé ; match à jouer = « ___ – ___ » au crayon ; retard noté dans la marge. */
  function ligneManuscrite(m, i, per, dejaDecl){
    const adv = m.v === equipe ? m.d : m.v;
    const retard = !m.joue && m.date < AUJ;
    const li = el('li', (m.date === AUJ && !m.joue ? 'is-auj' : '') + (retard ? ' is-retard' : ''));
    li.style.setProperty('--i', i);
    li.dataset.num = m.num;
    const jour = parse(m.date);
    li.append(el('span', 'j', ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][jour.getDay()] + ' ' + jour.getDate()),
      el('span', 'o', m.v === equipe ? '@' : 'vs'), logo(adv), el('span', 'n', nom(adv)), el('span', 'pt'));
    if(m.joue){
      const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv, r = resultatPour(m);
      li.append(el('span', 'sc', pour + ' – ' + contre), el('span', 'res ' + r, r === 'v' ? 'V' : r === 'p' ? 'DP' : 'D'));
      li.append(el('span', 'x', m.fin ? R.FINS[m.fin] : serieContre(adv)));
    }else{
      li.append(el('span', 'sc a-faire', '___ – ___'));
      if(estDG()){
        const b = el('button', 'ecrire', '✎ inscrire'); b.type = 'button';
        b.addEventListener('click', () => toast('Maquette : ouvrirait la soumission du match nº ' + m.num + ' (photo de l’écran de fin).'));
        li.append(b);
      }else li.append(el('span', 'x', heureTexte(m.heure)));
    }
    if(retard) li.append(el('span', 'note', 'en retard !'));
    const d = declaration(equipe, m.periode);
    if(d && String(d.match) === m.num){ const mq = masque('mq'); mq.setAttribute('aria-label', '2e gardien'); li.append(mq); }
    if(estDG() && per && m.periode === per.num && !m.joue && !dejaDecl) li.classList.add('est-cible');
    return li;
  }
  function feuilleManuscrite(f){
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', 'Semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const per = periodes.find(p => p.fin >= AUJ);
    const dejaDecl = per && declaration(equipe, per.num);
    let i = 0;
    if(semaine === lundi(AUJ)){
      const retards = mesMatchs().filter(m => !m.joue && m.date < semaine).sort((a, b) => a.date.localeCompare(b.date));
      if(retards.length){
        f.append(el('p', 'ce-sous-titre-main', '⚠ À rattraper (' + retards.length + ')'));
        const ol = el('ol', 'ce-lignes');
        retards.forEach(m => ol.append(ligneManuscrite(m, i++, per, dejaDecl)));
        f.append(ol, el('p', 'ce-sous-titre-main is-semaine', 'Cette semaine'));
      }
    }
    const liste = mesMatchs().filter(m => m.semaine === semaine).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    if(!liste.length){ f.append(el('p', 'ce-repos', 'Pas de match cette semaine — repos !')); return; }
    const ol = el('ol', 'ce-lignes');
    liste.forEach(m => ol.append(ligneManuscrite(m, i++, per, dejaDecl)));
    f.append(ol);
  }

  function feuilleEquipe(f){
    if(theme === 'planchette') return feuilleManuscrite(f);
    const liste = mesMatchs().filter(m => m.semaine === semaine).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', theme === 'tableau' ? 'Plan de match de la semaine'
      : 'Semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const per = periodes.find(p => p.fin >= AUJ);
    const dejaDecl = per && declaration(equipe, per.num);
    // Matchs en retard des semaines passées : rappelés en haut de la semaine en cours.
    if(semaine === lundi(AUJ)){
      const retards = mesMatchs().filter(m => !m.joue && m.date < semaine).sort((a, b) => a.date.localeCompare(b.date));
      if(retards.length){
        const bloc = el('div', 'ce-retards');
        bloc.append(el('h4', null, `À rattraper (${retards.length})`));
        const g = el('div', 'ce-matchs');
        retards.forEach((m, i) => g.append(aimantMatch(m, i, per, dejaDecl)));
        bloc.append(g);
        f.append(bloc);
      }
    }
    if(!liste.length){ f.append(el('p', 'ce-vide', 'Pas de match cette semaine. Repos !')); return; }
    const grille = el('div', 'ce-matchs');
    liste.forEach((m, i) => grille.append(aimantMatch(m, i, per, dejaDecl)));
    f.append(grille);
  }

  function feuilleLigue(f){
    const liste = matchs.filter(m => m.semaine === semaine);
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', theme === 'tableau' ? 'Toute la ligue'
      : 'La ligue — semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const jours = new Map();
    liste.forEach(m => { if(!jours.has(m.date)) jours.set(m.date, []); jours.get(m.date).push(m); });
    const g = el('div', 'ce-jours');
    let k = 0;
    [...jours].sort().forEach(([date, ms]) => {
      const b = el('div', 'ce-jour-bloc');
      b.append(el('h3', null, fJour.format(parse(date)) + (date === AUJ ? ' · aujourd’hui' : '')));
      ms.forEach(m => {
        const l = el('div', 'ce-ligne-match' + (equipe && (m.v === equipe || m.d === equipe) ? ' is-mien' : ''));
        l.style.setProperty('--i', k++);
        const sv = el('span', 's' + (m.joue && m.bv > m.bd ? ' g' : ''), m.joue ? String(m.bv) : '');
        const sd = el('span', 's' + (m.joue && m.bd > m.bv ? ' g' : ''), m.joue ? String(m.bd) : '');
        const dv = declaration(m.v, m.periode), dd = declaration(m.d, m.periode);
        l.append(logo(m.v), el('span', 'n', nom(m.v)), sv, el('span', 'a', m.joue ? '' : '@'), sd, el('span', 'n r', nom(m.d)), logo(m.d));
        if((dv && String(dv.match) === m.num) || (dd && String(dd.match) === m.num)) l.title = '2e gardien : ' + [dv && String(dv.match) === m.num ? nom(m.v) : '', dd && String(dd.match) === m.num ? nom(m.d) : ''].filter(Boolean).join(', ');
        b.append(l);
      });
      g.append(b);
    });
    if(!liste.length) g.append(el('p', 'ce-vide', 'Aucun match cette semaine.'));
    f.append(g);
  }

  // Aperçu : à gauche le tableau indicateur et le 2e gardien ; à droite le babillard.
  function rendreDroite(){
    $('gauche').replaceChildren(carteForme(), carteGardien());
    const d = $('droite');
    const attente = el('div', 'ce-babillard'); attente.append(el('p', 'ce-vide', 'On punaise les annonces…'));
    d.replaceChildren(attente);
    carteAnnonces().then(c => attente.replaceWith(c)).catch(() => attente.remove());
  }

  /* ---------- 2e gardien : le demi-cercle du gardien, sur la glace ---------- */
  function carteGardien(){
    const c = el('section', 'ce-creuse');
    const per = periodes.find(p => p.fin >= AUJ) || periodes[periodes.length - 1];
    if(!per){ c.append(el('p', null, 'Aucune période.')); return c; }
    const total = Math.max(1, ecartJours(per.debut, per.fin) + 1), passe = Math.min(total, Math.max(0, ecartJours(per.debut, AUJ) + 1));
    const reste = Math.max(0, ecartJours(AUJ, per.fin));
    // Horloge de période (style tableau d'aréna).
    const tete = el('header', 'ce-creuse-tete');
    const titre = el('div'); titre.append(el('b', null, '2e gardien'), el('small', null, fMois.format(parse(per.debut)) + ' → ' + fMois.format(parse(per.fin))));
    const horloge = el('div', 'ce-horloge');
    horloge.append(el('span', 'p', 'PÉR. ' + per.num), el('span', 'j', String(reste).padStart(2, '0')), el('span', 'u', reste === 1 ? 'jour' : 'jours'));
    if(reste <= 3) horloge.classList.add('is-urgent');
    tete.append(titre, horloge);
    const jauge = el('div', 'ce-jauge'); const rempli = el('span'); rempli.style.width = (100 * passe / total) + '%'; jauge.append(rempli);
    // La glace : ligne des buts, demi-cercle bleu, filet ; le masque y est posé si c'est déclaré.
    const glace = el('div', 'ce-glace');
    glace.innerHTML = '<svg class="ce-patinoire" viewBox="0 0 300 120" aria-hidden="true" preserveAspectRatio="xMidYMax meet">'
      + '<line x1="0" y1="112" x2="300" y2="112" stroke="#E03131" stroke-width="3"/>'
      + '<path d="M95 112 A55 55 0 0 1 205 112 Z" fill="#a5d8ff" fill-opacity=".55" stroke="#E03131" stroke-width="2"/>'
      + '<path d="M128 112 V122 M172 112 V122" stroke="#E03131" stroke-width="3"/>'
      + '<rect x="128" y="112" width="44" height="10" fill="url(#filet)"/>'
      + '<defs><pattern id="filet" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0 L5 5 M5 0 L0 5" stroke="#868e96" stroke-width=".7"/></pattern></defs></svg>';
    const dcl = declaration(equipe, per.num);
    const statut = el('div', 'ce-creuse-statut');
    if(dcl){
      const m = matchs.find(x => x.num === String(dcl.match));
      const mq = masque('ce-masque ce-masque-glace'); glace.append(mq);
      statut.classList.add('is-fait');
      statut.append(el('b', null, (dcl.simulee ? 'Déclaré (simulation)' : 'Déclaré') + ' ✔'),
        el('small', null, m ? fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' + nom(m.d) : 'vs ' + nom(m.v)) : 'Match nº ' + dcl.match));
    }else if(estDG()){
      const mq = masque('ce-masque ce-masque-glace is-pret');
      mq.setAttribute('role', 'button'); mq.setAttribute('tabindex', '0'); mq.setAttribute('aria-label', 'Glisser le masque sur un match pour déclarer le 2e gardien');
      brancherGlisser(mq, per);
      glace.append(mq);
      statut.classList.toggle('is-urgent', reste <= 3);
      statut.append(el('b', null, 'À déclarer'), el('small', null, 'Glisse le masque sur un match encadré en vert.'));
    }else{
      statut.classList.toggle('is-urgent', reste <= 3);
      statut.append(el('b', null, 'Pas encore déclaré'), el('small', null, 'Le DG le déclare en mode DG.'));
    }
    const faites = [...EQUIPES.keys()].filter(code => declaration(code, per.num)).length;
    const ligue = el('p', 'ce-creuse-ligue'); ligue.append(el('b', null, faites + '/' + EQUIPES.size), document.createTextNode(' équipes ont déclaré'));
    c.append(tete, jauge, glace, statut, ligue);
    return c;
  }

  /* ---------- Fiche : le tableau indicateur de l'aréna ---------- */
  function carteForme(){
    const c = el('section', 'ce-indicateur');
    const t = classement.find(x => x.code === equipe) || { v: 0, d: 0, dp: 0, pts: 0, pj: 0, bp: 0, bc: 0 };
    const tete = el('header');
    tete.append(logo(equipe), el('span', null, nom(equipe).toUpperCase()));
    const div = R.CONFERENCES.flatMap(cf => cf.divisions).find(dv => dv.equipes.includes(equipe));
    const rang = div ? R.classement(resultats, div.equipes).findIndex(x => x.code === equipe) + 1 : 0;
    const joues = mesMatchs().filter(m => m.joue).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    let serie = 0, type = '';
    for(let i = joues.length - 1; i >= 0; i--){ const r = resultatPour(joues[i]) === 'v' ? 'V' : 'D'; if(!type) type = r; if(r !== type) break; serie++; }
    const pj = Math.max(1, t.pj);
    const cases = el('div', 'ce-led-grille');
    const caseLed = (lib, val, cls) => { const d = el('div', 'ce-led-case' + (cls ? ' ' + cls : '')); d.append(el('span', 'ce-led', String(val)), el('small', null, lib)); cases.append(d); };
    caseLed('V', t.v, 'is-grand'); caseLed('D', t.d, 'is-grand'); caseLed('DP', t.dp, 'is-grand'); caseLed('PTS', t.pts, 'is-grand is-rouge');
    caseLed(div ? 'Rang div.' : 'Rang', rang ? rang + (rang === 1 ? 'er' : 'e') : '–');
    caseLed('Série', serie ? type + serie : '–');
    caseLed('BP / m', (t.bp / pj).toFixed(1));
    caseLed('BC / m', (t.bc / pj).toFixed(1));
    const lampes = el('div', 'ce-lampes');
    joues.slice(-10).forEach((m, i) => { const r = resultatPour(m); const l = el('i', r); l.style.setProperty('--i', i); l.title = fCourt.format(parse(m.date)) + ' · ' + (r === 'v' ? 'victoire' : r === 'p' ? 'défaite en prol.' : 'défaite'); lampes.append(l); });
    c.append(tete, cases, el('small', 'ce-lampes-titre', '10 derniers matchs'), lampes);
    return c;
  }

  /* ---------- Glisser le masque sur un match (2e gardien) ---------- */
  function brancherGlisser(m, per){
    let fantome = null, cible = null;
    const cibles = () => [...document.querySelectorAll('.est-cible')];
    m.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if(!cibles().length){ toast('Aucun de tes matchs de la période ' + per.num + ' n’est dans cette semaine : change de semaine.'); return; }
      cibles().forEach(c => c.classList.add('is-cible'));
      fantome = masque('ce-masque is-glisse');
      document.body.append(fantome);
      bouger(ev);
      m.style.opacity = '0.25';
      window.addEventListener('pointermove', bouger);
      window.addEventListener('pointerup', lacher, { once: true });
    });
    m.addEventListener('keydown', ev => {
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      const c = cibles()[0];
      if(c) declarer(c.dataset.num, per); else toast('Aucun de tes matchs de la période dans cette semaine.');
    });
    function bouger(ev){
      fantome.style.left = (ev.clientX - 34) + 'px'; fantome.style.top = (ev.clientY - 34) + 'px';
      const sous = document.elementFromPoint(ev.clientX, ev.clientY);
      const c = sous && sous.closest('.est-cible');
      if(c !== cible){ if(cible) cible.classList.remove('is-survol'); cible = c; if(cible) cible.classList.add('is-survol'); }
    }
    function lacher(){
      window.removeEventListener('pointermove', bouger);
      m.style.opacity = '';
      document.querySelectorAll('.is-cible, .is-survol').forEach(c => c.classList.remove('is-cible', 'is-survol'));
      if(cible){
        // Le masque « vole » jusqu'au coin du match.
        const r = cible.getBoundingClientRect();
        fantome.animate([{ left: fantome.style.left, top: fantome.style.top }, { left: (r.left + 6) + 'px', top: (r.top + 6) + 'px', transform: 'scale(.6) rotate(0deg)' }], { duration: 280, easing: 'cubic-bezier(.3,1.4,.5,1)' })
          .finished.then(() => { fantome.remove(); declarer(cible.dataset.num, per); cible = null; });
      }else{ fantome.remove(); }
    }
  }
  function declarer(num, per){
    simulees[equipe + '|' + per.num] = num;
    const m = matchs.find(x => x.num === num);
    rendreDroite();
    rendreSemaine(null);
    toast('Maquette : 2e gardien déclaré pour le match du ' + fCourt.format(parse(m.date)) + ' (rien n’est enregistré).');
  }

  /* =========================================================================
     BUREAU DU DG : la scène (aperçus réels sur chaque objet) et le zoom.
     Les fonctions ci-dessous remplacent celles de la maquette du centre d'équipe
     (mêmes noms : la dernière déclaration l'emporte).

  let zoomActuel = '';
  let moisZoom = '';                 // 'AAAA-MM' du grand calendrier
  const estPetit = () => matchMedia('(max-width: 899px)').matches;
  const NOMS_MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const ETIQUETTES = { calendrier: 'Calendrier', tele: 'Classement · prochain match · LNHQ TV', console: 'Console · soumettre un résultat', babillard: 'Annonces de la ligue',
    cartable: 'Alignement', ordinateur: 'Courriel · transactions', postit: '2e gardien', cellulaire: 'Enchères', chemise: 'Dépistage',
    resultats: 'Résultats de la ligue', meneurs: 'Meneurs · stats', plafond: 'Plafond salarial', effectif: 'Effectif · ratings', fiche: 'Fiche de l’équipe et du DG' };
  const chargerDirect = () => unefois('direct', () => fetch('https://api.lnhq.ca/twitch').then(r => r.json()).catch(() => ({ chaines: [] })));
  const chargerFils = () => unefois('fils', () => Promise.all(['ANNONCES', 'NOUVELLES'].map(async s => {
    const t = await gvizTable('sheet=' + s);
    return t.rows.map(r => r.c || []).map(c => ({ date: dateGviz(c[0] && c[0].v), titre: c[3] ? String(c[3].v) : '', texte: c[4] ? String(c[4].v) : '',
      visible: c[6] ? c[6].v === true : false, id: c[9] ? String(c[9].v) : '', equipe: c[1] ? String(c[1].v) : '', type: c[2] ? String(c[2].v) : '' }))
      .filter(x => x.visible && x.titre).sort((a, b) => (b.date || 0) - (a.date || 0));
  })));
  const chargerEncheres = () => unefois('encheres', () => Promise.all([LNHQ_ENCHERES.charger(), LNHQ_ENCHERES.agentsLibres(), LNHQ_ENCHERES.espacesPlafond().catch(() => ({}))]));
  const prochainMatch = () => mesMatchs().filter(m => !m.joue && m.date >= AUJ).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num))[0];
  const retards = () => mesMatchs().filter(m => !m.joue && m.date < AUJ).sort((a, b) => a.date.localeCompare(b.date));
  const periodeCourante = () => periodes.find(p => p.fin >= AUJ) || periodes[periodes.length - 1];

  function rendreTout(){
    if(!equipe){
      $('chargement').textContent = 'Choisis ton équipe pour entrer dans son bureau.';

  // Données de l'équipe : stats de la saison, joueurs sous contrat, espace sous le plafond.
  const chargerStats = () => unefois('stats', () => window.LNHQ_STATS_JOUEUR.charger());
  const chargerEspaces = () => unefois('espaces', () => LNHQ_ENCHERES.espacesPlafond().catch(() => ({})));
  const nombre = v => Number(String(v == null ? '' : v).replace(',', '.')) || 0;
  const nomCourt = n => { const v = n.indexOf(','); return v > 0 ? n.slice(v + 1).trim().charAt(0) + '. ' + n.slice(0, v).trim() : n; };
  const famille = n => { const v = n.indexOf(','); return v > 0 ? n.slice(0, v).trim() : n; };
  async function statsEquipe(){
    const { stats } = await chargerStats();
    const l = [...stats.values()].filter(j => j.equipe === equipe);
    return {
      patineurs: l.filter(j => !j.gardien).sort((a, b) => nombre(b.p) - nombre(a.p) || nombre(b.b) - nombre(a.b)),
      gardiens: l.filter(j => j.gardien).sort((a, b) => nombre(b.pj) - nombre(a.pj)),
    };
  }
  async function contratsEquipe(){
    const [joueurs, espaces] = await Promise.all([tousLesJoueurs(), chargerEspaces()]);
    const miens = joueurs.filter(j => j.equipe === equipe);
    const masse = miens.filter(j => !j.espoir).reduce((s, j) => s + j.salaire, 0);
    const espace = espaces[equipe] != null ? espaces[equipe] : null;
    return { miens, masse, espace, plafond: espace != null ? masse + espace : null };
  }

  // Bandeau DEL : derniers résultats de la ligue (le contenu est doublé pour boucler sans saut).
  function apercuDel(box){
    const joues = matchs.filter(m => m.joue).sort((a, b) => b.date.localeCompare(a.date) || Number(b.num) - Number(a.num)).slice(0, 16);
    const d = el('div', 'del-defile');
    if(!joues.length){ d.textContent = 'LNHQ · la saison commence bientôt'; box.replaceChildren(d); return; }
    const items = () => joues.map(m => {
      const s = el('span', m.v === equipe || m.d === equipe ? 'mien' : '');
      const gv = m.bv > m.bd;
      const cote = (t, g) => g ? el('b', null, t) : document.createTextNode(t);
      const score = el('em'); score.append(cote(m.v + ' ' + m.bv, gv), document.createTextNode(' – '), cote(m.bd + ' ' + m.d, !gv));
      s.append(el('i', null, fMois.format(parse(m.date)).toUpperCase()), score);
      if(m.fin) s.append(el('i', null, R.FINS[m.fin] || m.fin));
      return s;
    });
    d.append(...items(), ...items());
    d.style.setProperty('--duree', joues.length * 4 + 's');
    box.replaceChildren(d);

  // Tableau magnétique : trios, paires et gardien écrits au marqueur.
  async function chargerAlignement(){

      alignement = { code: equipe, compo: A.composer(joueurs, sauvegarde), choisie: '', modifie: sauvegarde ? sauvegarde.modifie : '' };

  const NOM_MOIS_CAP = m => NOMS_MOIS[m].charAt(0).toUpperCase() + NOMS_MOIS[m].slice(1);

  // Calendrier du mois (zoom) : logo de l'adversaire et score au marqueur ; aujourd'hui encerclé ; retards surlignés.
  function grilleMois(annee, mois, grand){
    const premier = new Date(annee, mois, 1);
    const debut = new Date(premier); debut.setDate(1 - (premier.getDay() + 6) % 7);
    const parDate = new Map(mesMatchs().map(m => [m.date, m]));
    const cases = [];
    const nbSemaines = Math.ceil(((premier.getDay() + 6) % 7 + new Date(annee, mois + 1, 0).getDate()) / 7);
    for(let k = 0; k < nbSemaines * 7; k++){
      const d = new Date(debut); d.setDate(debut.getDate() + k);
      const cle = iso(d), m = parDate.get(cle);
      const c = el('div', grand ? '' : 'cal-case');
      if(d.getMonth() !== mois) c.classList.add('hors');
      if(cle === AUJ) c.classList.add('auj');
      c.append(el('i', null, String(d.getDate())));
      if(m){
        const adv = m.v === equipe ? m.d : m.v;
        c.append(logo(adv));
        if(m.joue){ const r = resultatPour(m); const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv; c.append(el('b', r, pour + '-' + contre)); }
        else if(cle < AUJ) c.classList.add('retard');
        else if(grand) c.append(el('small', null, (m.v === equipe ? '@ ' : 'vs ') + heureTexte(m.heure)));
        c.title = fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' : 'vs ') + nom(adv);
      }
      cases.push(c);
    }
    return cases;
  }

  // Tablette : anneau du plafond salarial.
  async function apercuPlafond(box){

    if(!estDG()){ notif('🔒', 'Téléphone du DG'); return; }
    const [d] = await chargerEncheres();
    const eq = d.equipes.find(x => x.code === equipe) || { disponibles: 0 };
    const misees = new Set(d.mises.filter(m => m.equipe === equipe).map(m => m.id));
    const ouvertes = d.encheres.filter(e => e.statut === 'En cours');
    const battue = ouvertes.find(e => misees.has(e.id) && e.equipe !== equipe && !e.egalite.includes(equipe));
    if(battue) notif('Dépassé', famille(battue.joueur) + ' · ' + battue.mise, 'alerte');
    const tete = ouvertes.filter(e => e.equipe === equipe).length;

  /* ---------- Zoom : l'objet ouvert en plein écran ---------- */
  const reduitZoom = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let origineZoom = null;
  let generationZoom = 0;   // une fermeture en cours ne doit pas refermer un objet ouvert entre-temps
  function ouvrirZoom(type, depuis){
    generationZoom++;
    zoomActuel = type;
    origineZoom = depuis || null;
    const z = $('zoom'), o = $('zoomObjet');
    o.className = 'bu-zoom-objet is-' + type;
    z.hidden = false;
    remplirZoom(type);
    if(depuis && !reduitZoom){
      const a = depuis.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.4 }, { transform: 'none', opacity: 1 }],
        { duration: 450, easing: 'cubic-bezier(.2,.85,.25,1)' });
    }
    $('zoomFermer').focus();
  }
  function fermerZoom(){
    if(!zoomActuel) return;
    const z = $('zoom'), o = $('zoomObjet');
    const gen = generationZoom;
    const fin = () => { if(gen !== generationZoom) return; z.hidden = true; zoomActuel = ''; $('reserve').append(...$('zoomCorps').querySelectorAll('.ce-panneau')); if(origineZoom) origineZoom.focus(); };
    if(origineZoom && !reduitZoom && origineZoom.offsetParent){
      const a = origineZoom.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.2 }],
        { duration: 320, easing: 'cubic-bezier(.5,0,.75,0)' }).finished.then(fin, fin);
    }else fin();
  }

      onglets.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b.dataset.o === quoi));
      $('reserve').append(...zone.querySelectorAll('.ce-panneau'));
      if(quoi === 'marche'){ zone.replaceChildren(panneau('p-transactions', rendreTransactions)); return; }
      const liste = el('div', 'bmail-liste'), lecture = el('div', 'bmail-lecture');
      const ouvrir = (c, bouton) => {
        liste.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b === bouton));
        const h = el('h3', 'ce-titre-sec', c.titre); h.style.fontSize = '20px';
        const p = el('p', null, c.apercu);
        const act = el('div', 'ce-actions');
        const action = (texte, cls, msg) => { const b = el('button', 'ce-bouton ' + cls, texte); b.type = 'button'; b.addEventListener('click', () => toast('Maquette : ' + msg)); act.append(b); };
        if(c.type === 'offre'){ action('Ouvrir l’offre', 'is-principal', 'ouvrirait l’offre (Accepter, Contre-offre, Refuser).'); action('Refuser', 'is-danger', 'offre refusée.'); }
        if(c.type === 'retard') action('Soumettre le résultat', 'is-principal', 'ouvrirait la soumission du match nº ' + c.num + '.');
        if(c.type === 'gardien') action('Déclarer mon 2e gardien', 'is-principal', 'ouvrirait le post-it du 2e gardien.');
        lecture.replaceChildren(h, p, act);
      };
      courriels().forEach((c, i) => {
        const b = el('button', c.nonlu ? 'nonlu' : ''); b.type = 'button';
        const t = el('span'); t.append(el('b', null, c.titre), el('small', null, c.apercu));
        b.append(c.de === 'LNHQ' ? Object.assign(el('img'), { src: 'logo-lnhq.png', alt: '' }) : logo(c.de), t);
        b.addEventListener('click', () => ouvrir(c, b));
        liste.append(b);
        if(!i) setTimeout(() => ouvrir(c, b));
      });
      const boite = el('div', 'bmail'); boite.append(liste, lecture);
      zone.replaceChildren(boite);
    };
    if(estDG()){
      const b1 = el('button', null, '📧 Courriel'); b1.type = 'button'; b1.dataset.o = 'courriel'; b1.addEventListener('click', () => montrer('courriel'));
      const b2 = el('button', null, '🔁 Marché et transactions'); b2.type = 'button'; b2.dataset.o = 'marche'; b2.addEventListener('click', () => montrer('marche'));
      onglets.append(b1, b2);
      blocs.push(titreZoom('Ordinateur', 'mode DG'), onglets, zone);
      montrer('courriel');
    }else{
      blocs.push(titreZoom('Transactions', 'marché et historique (public)'), zone);
      montrer('marche');
    }
    return blocs;
  }

  function zoomPostit(){
    const per = periodeCourante();
    const blocs = [titreZoom('2e gardien', per ? 'période ' + per.num + ' · ' + fMois.format(parse(per.debut)) + ' → ' + fMois.format(parse(per.fin)) : '')];
    if(!per) return blocs;
    blocs.push(carteGardien());
    const ol = el('ol', 'ce-lignes'); ol.style.marginTop = '14px';
    const dcl = declaration(equipe, per.num);
    mesMatchs().filter(m => m.periode === per.num).sort((a, b) => a.date.localeCompare(b.date)).forEach((m, i) => {
      const li = el('li'); li.style.setProperty('--i', i);
      const adv = m.v === equipe ? m.d : m.v;
      li.append(el('span', 'j', (dcl && String(dcl.match) === m.num ? '☑ ' : '☐ ') + fCourt.format(parse(m.date))), el('span', 'o', m.v === equipe ? '@' : 'vs'), logo(adv), el('span', 'n', nom(adv)), el('span', 'pt'));
      if(estDG() && !dcl && !m.joue){
        const b = el('button', 'ecrire', 'déclarer celui-ci'); b.type = 'button';
        b.addEventListener('click', () => declarer(m.num, per));
        li.append(b);
      }
      ol.append(li);
    });
    blocs.push(ol);
    return blocs;
  }

  function zoomConsole(){
    const blocs = [titreZoom('Console', estDG() ? 'Soumettre un résultat' : 'Derniers résultats')];
    const tuiles = el('div', 'jeu-tuiles');
    const tuile = (m, etat) => {
      const adv = m.v === equipe ? m.d : m.v;
      const b = el('button', 'jeu-tuile'); b.type = 'button';
      const lg = el('div', 'logos'); lg.append(logo(m.v), el('span', null, '@'), logo(m.d));
      b.append(lg, el('b', null, nom(m.v) + ' @ ' + nom(m.d)), el('small', null, fCourt.format(parse(m.date)) + (m.joue ? ' · ' + m.bv + '-' + m.bd : ' · ' + heureTexte(m.heure))));
      if(etat) b.append(el('span', 'etat' + (etat === 'Joué' ? ' ok' : ''), etat));
      b.addEventListener('click', () => toast(m.joue ? 'Maquette : ouvrirait la fiche du match (stats et photo).' : estDG() ? 'Maquette : ouvrirait la soumission du match nº ' + m.num + ' (photo de l’écran de fin).' : 'Seul le DG peut soumettre un résultat.'));
      tuiles.append(b);
    };
    if(estDG()){ retards().forEach(m => tuile(m, 'En retard')); mesMatchs().filter(m => !m.joue && m.date >= AUJ).slice(0, 3).forEach(m => tuile(m, m.date === AUJ ? 'Ce soir' : '')); }
    mesMatchs().filter(m => m.joue).slice(-4).reverse().forEach(m => tuile(m, 'Joué'));
    blocs.push(tuiles);
    return blocs;
  }

  // 2e gardien déclaré (simulation) depuis le post-it.
  function declarer(num, per){
    simulees[equipe + '|' + per.num] = num;
    const m = matchs.find(x => x.num === num);
    if(!estPetit()) rendreScene(); else rendrePile();
    if(zoomActuel) remplirZoom(zoomActuel);
    toast('Maquette : 2e gardien déclaré pour le ' + fCourt.format(parse(m.date)) + ' (rien n’est enregistré).');
  }

  // Ouvrir un objet (scène ou pile), fermer le zoom.
  document.addEventListener('click', ev => {
    const o = ev.target.closest('[data-objet]');
    if(o && o.dataset.objet !== 'fenetre' && !ev.target.closest('#zoom')) ouvrirZoom(o.dataset.objet, o);
  });
  $('zoomFermer').addEventListener('click', fermerZoom);
  $('zoomFond').addEventListener('click', fermerZoom);
  document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && zoomActuel) fermerZoom(); });

  // Fichier ouvert directement (aperçu, double-clic) : les scripts du site ne peuvent pas se charger.
  if(!/^https?:$/.test(location.protocol) || !window.LNHQ_TEAMS){
    $('chargement').textContent = 'Ouvre la maquette par le serveur : http://localhost:8766/maquettes/bureau-dg.html';
    return;
  }
  const titreSite = document.getElementById('sheetTitle');
  if(titreSite) titreSite.textContent = 'LNHQ';
  document.title = 'Centre d’équipe — maquette';
  appliquerTheme();
  appliquerCouleurs();
  charger().then(() => {
    if(!equipe){ vue = 'ligue'; document.querySelectorAll('[data-vue]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.vue === 'ligue'))); ouvrirModal(); }
    semaine = semaineCourante();
    rendreTout();
  }).catch(err => { console.error(err); $('chargement').textContent = 'Impossible de lire le calendrier pour le moment.'; });
})();
</script>
</body>
</html>
