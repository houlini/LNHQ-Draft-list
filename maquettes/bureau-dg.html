  // Dépistage : le prochain adversaire (ou celui d'un match en retard) comparé à nous.
  const adversaireDe = m => m.v === equipe ? m.d : m.v;
  const prochainsAdversaires = () => [...retards(), ...mesMatchs().filter(m => !m.joue && m.date >= AUJ).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num))];
  // Part (0-100) de la barre qui revient à « nous » : plus grande quand on est meilleur.
  const partNous = (nous, eux, sens) => { if(nous == null || eux == null || nous + eux === 0) return 50; return 100 * (sens > 0 ? nous : eux) / (nous + eux); };
  async function apercuDepistage(box){
    const m = prochainsAdversaires()[0];
    const tete = el('div', 'dep-tete'); tete.append(el('span', null, 'Dépistage'), el('small', null, m ? (m.date < AUJ ? 'match en retard' : 'prochain adversaire') : ''));

    const id = el('div', 'dep-adv'); const quand = m.date === AUJ ? 'ce soir' : fCourt.format(parse(m.date));
    id.append(logo(adv), el('b', null, nom(adv)), el('small', null, fiche(t) + ' · ' + quand + (m.v === equipe ? ' (visiteur)' : ' (domicile)') + ' · ' + serieContre(adv)));
    const se = R.statsEquipes(resultats, [...EQUIPES.keys()]);
    const nous = se.find(s => s.code === equipe) || {}, eux = se.find(s => s.code === adv) || {};
    const barres = el('div', 'dep-barres');
    CATS_EQUIPE.slice(0, 4).forEach(([lib, cle, sens, f]) => {
      const a = nous[cle], b = eux[cle];
      const r = el('div', 'dep-barre'), i = el('i'); i.style.setProperty('--p', partNous(a, b, sens).toFixed(0));
      const ecart = a != null && b != null ? sens * (a - b) : 0;
      r.append(el('span', null, lib.replace(/ \(.*\)/, '').replace('Avantage num.', 'Avantage')), el('b', ecart > 0 ? 'mieux' : '', a != null ? f(a) : '–'), i, el('b', ecart < 0 ? 'mieux' : '', b != null ? f(b) : '–'));
      barres.append(r);
    });
    box.replaceChildren(tete, id, barres);
  }

  // Paramètres de l'annexe A utiles au cartable : effectif min/max, limite d'espoirs, plancher salarial.
  async function limitesLigue(){
    const { parametres } = await chargerReglements().catch(() => ({ parametres: [] }));
    const val = re => { const p = parametres.find(x => re.test(x.libelle)); return p ? p.valeur : ''; };
    const entier = t => { const m = /\d[\d\s]*/.exec(t); return m ? Number(m[0].replace(/\s/g, '')) : null; };
    return { min: entier(val(/^Minimum de joueurs/i)), max: entier(val(/^Maximum de joueurs/i)), espoirs: entier(val(/^Espoirs/i)), plancher: entier(val(/^Plancher/i)) };
  }

  // Alertes du DG : offre reçue, match en retard, 2e gardien pas déclaré, enchère dépassée.
  // urgent = rouge ; les autres allument le cellulaire en orange.
  async function alertesDG(){
    if(!estDG()) return [];
    const l = [];
    courriels().filter(c => c.type === 'offre' && c.nonlu).forEach(c => l.push({ icone: '🔁', titre: 'Offre de transaction', court: 'Offre', texte: nom(c.de) + ' · ' + c.apercu, objet: 'ordinateur', bouton: 'Voir l’offre', urgent: true }));
    retards().forEach(m => l.push({ icone: '⏰', titre: 'Match en retard', court: 'Retard', texte: fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' : 'vs ') + nom(m.v === equipe ? m.d : m.v), objet: 'console', bouton: 'Soumettre', urgent: true }));
    const per = periodeCourante();
    if(per && !declaration(equipe, per.num)) l.push({ icone: '🥅', titre: '2e gardien pas déclaré', court: '2e gardien', texte: 'Période ' + per.num + ' · fin le ' + fMois.format(parse(per.fin)), objet: 'postit', bouton: 'Déclarer', urgent: false });
    try{
      const [d] = await chargerEncheres();
      const misees = new Set(d.mises.filter(m => m.equipe === equipe).map(m => m.id));
      d.encheres.filter(e => e.statut === 'En cours' && misees.has(e.id) && e.equipe !== equipe && !e.egalite.includes(equipe))
        .forEach(e => l.push({ icone: '💰', titre: 'Enchère dépassée', court: 'Enchère', texte: prenomNom(e.joueur) + ' · ' + e.mise + ' par ' + e.equipe, objet: 'agents', bouton: 'Relancer', urgent: false }));
    }catch(e){ console.warn(e); }
    return l;
  }
  // Cellulaire : éteint s'il n'y a rien ; allumé et pulsant quand une alerte attend.
  async function apercuCellulaire(box){
    const cell = box.closest('.bu-cell');

  /* ---------- Téléphone : la pile d'objets ---------- */

  /* ---------- Zoom : l'objet ouvert en plein écran ---------- */
  const reduitZoom = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let origineZoom = null;
  let generationZoom = 0;   // une fermeture en cours ne doit pas refermer un objet ouvert entre-temps
  function ouvrirZoom(type, depuis){
    generationZoom++;
    zoomActuel = type;
    origineZoom = depuis || null;
    const z = $('zoom'), o = $('zoomObjet');
    o.className = 'bu-zoom-objet is-' + type;
    z.hidden = false;
    remplirZoom(type);
    if(depuis && !reduitZoom){
      const a = depuis.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.4 }, { transform: 'none', opacity: 1 }],
        { duration: 450, easing: 'cubic-bezier(.2,.85,.25,1)' });
    }
    $('zoomFermer').focus();
  }
  function fermerZoom(){
    if(!zoomActuel) return;
    const z = $('zoom'), o = $('zoomObjet');
    const gen = generationZoom;
    const fin = () => { if(gen !== generationZoom) return; z.hidden = true; zoomActuel = ''; $('reserve').append(...$('zoomCorps').querySelectorAll('.ce-panneau')); if(origineZoom) origineZoom.focus(); };
    if(origineZoom && !reduitZoom && origineZoom.offsetParent){
      const a = origineZoom.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.2 }],
        { duration: 320, easing: 'cubic-bezier(.5,0,.75,0)' }).finished.then(fin, fin);
    }else fin();
  }
  function titreZoom(texte, sous){
    const h = el('h2', 'bu-zoom-titre'); h.append(logo(equipe), el('span', null, texte));
    if(sous) h.append(el('small', null, sous));
    return h;
  }
  function panneau(id, rendre){
    const p = $(id); p.hidden = false;
    rendre();
    return p;
  }
  function remplirZoom(type){
    const corps = $('zoomCorps');
    $('reserve').append(...corps.querySelectorAll('.ce-panneau'));
    corps.scrollTop = 0;
    const contenu = ({
      calendrier: zoomCalendrier,
      tele: zoomTele,
      reglements: zoomReglements,
      cartable: zoomCartable,
      ordinateur: zoomOrdinateur,
      postit: zoomPostit,
      cellulaire: zoomCellulaire,
      depistage: zoomDepistage,
      console: zoomConsole,
      resultats: zoomResultats,
      meneurs: zoomMeneurs,
      effectif: zoomEffectif,
      fiche: zoomFiche,
    })[type]();
    corps.replaceChildren(...contenu);
  }

  function zoomCalendrier(){
    if(!moisZoom) moisZoom = AUJ.slice(0, 7);
    const [a, m] = moisZoom.split('-').map(Number);
    const nav = el('div', 'gcal-nav');
    const bouton = (txt, sens) => { const b = el('button', null, txt); b.type = 'button'; b.addEventListener('click', () => { const d = new Date(a, m - 1 + sens, 1); moisZoom = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); remplirZoom('calendrier'); if(!$('scene').hidden) apercuCalendrier($('o-calendrier')); }); return b; };
    nav.append(bouton('‹', -1), el('b', null, NOM_MOIS_CAP(m - 1) + ' ' + a), bouton('›', 1));
    const g = el('div', 'gcal');
    ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].forEach(j => g.append(el('div', 'js', j)));
    grilleMois(a, m - 1, true).forEach(c => g.append(c));
    const r = retards();
    const blocs = [titreZoom('Calendrier', nom(equipe)), nav, g];
    if(r.length){ const p = el('p', 'ce-note', '⚠ En retard : ' + r.map(x => fCourt.format(parse(x.date)) + ' ' + (x.v === equipe ? '@ ' : 'vs ') + nom(x.v === equipe ? x.d : x.v)).join(' · ')); blocs.push(p); }
    return blocs;
  }

  // Télé (zoom) : les directs de la ligue, puis tout le fil (annonces, nouvelles, transactions).
  function zoomTele(){
    const tv = el('section', 'ce-carte');
    tv.append(el('h3', null, '📺 En direct'), el('p', 'ce-vide', 'On syntonise…'));
    directsLigue().then(live => {
      tv.lastChild.remove();
      if(!live.length){ tv.append(el('p', 'ce-vide', 'Aucun match en direct pour l’instant.')); return; }
      const g = el('div', 'tv-live'); g.dataset.n = String(Math.min(4, live.length)); g.style.cssText = `--n:${Math.min(2, live.length)};font-size:16px;container-type:inline-size;aspect-ratio:16/9`;
      live.slice(0, 4).forEach(c => {
        const a = el('a', 'tv-flux'); a.href = 'tv.html?chaine=' + encodeURIComponent(c.chaine); a.style.color = '#fff';
        if(c.vignette) a.style.backgroundImage = `url("${c.vignette}")`;
        const qui = el('div', 'tv-qui'); qui.append(logo(c.code), el('b', null, c.dg || c.nom || c.chaine), el('small', null, c.titre || ''));
        a.append(el('span', 'tv-direct', '● DIRECT'), el('span', 'tv-vues', '👁 ' + (c.spectateurs || 0)), qui);
        g.append(a);
      });
      tv.append(g);
    });
    const fil = el('div', 'ce-liste'); fil.style.marginTop = '16px';
    fil.append(el('p', 'ce-vide', 'On imprime le fil…'));
    filLigue().then(l => {
      fil.replaceChildren(...l.slice(0, 25).map(x => {
        const [lib, coul] = CATS_FIL[x.type];
        const c = el('section', 'ce-carte');
        const cat = el('span', 'tv-cat', lib); cat.style.cssText = `--cat:${coul};font-size:11px;padding:2px 8px;display:inline-block;color:#fff`;
        const h = el('h3'); h.append(el('span', null, x.titre), el('small', null, x.date ? fCourt.format(x.date) : ''));
        c.append(cat, h);
        if(x.type === 'transaction') recus(x.details).forEach(([code, m]) => { const p = el('p'); p.append(avecLogo(code, ' ' + nom(code) + ' reçoit : ' + m.map(y => y.joueur ? prenomNom(y.joueur) : (y.type || 'choix')).join(', '))); c.append(p); });
        else if(sansBalises(x.texte)) c.append(el('p', null, sansBalises(x.texte).slice(0, 400)));
        return c;
      }));
      if(!l.length) fil.replaceChildren(el('p', 'ce-vide', 'Rien de neuf dans la ligue.'));
    }).catch(() => fil.replaceChildren(el('p', 'ce-vide', 'Fil indisponible pour le moment.')));
    return [titreZoom('LNHQ TV', 'directs et fil de la ligue'), tv, fil];
  }

  // Cellulaire (zoom) : les alertes avec leur action, puis les enchères des agents libres.
  function zoomCellulaire(){
    const zone = el('div', 'z-alertes');
    zone.append(el('p', 'ce-vide', estDG() ? 'On vérifie les notifications…' : '🔒 Les alertes sont réservées au DG.'));
    if(estDG()) alertesDG().then(l => {
      if(!l.length){ zone.replaceChildren(el('p', 'ce-vide', 'Aucune alerte. Tout est à jour ✔')); return; }
      zone.replaceChildren(...l.map(a => {
        const c = el('div', 'z-alerte'); c.style.setProperty('--a', a.urgent ? '#e03131' : '#e8590c');
        const t = el('div'); t.append(el('b', null, a.titre), el('small', null, a.texte));
        const b = el('button', 'ce-bouton is-principal', a.bouton); b.type = 'button';
        b.addEventListener('click', () => { if(a.objet === 'agents') $('p-agents').scrollIntoView({ behavior: 'smooth' }); else ouvrirZoom(a.objet); });
        c.append(el('i', null, a.icone), t, b);
        return c;
      }));
    });
    return [titreZoom('Alertes', estDG() ? 'cellulaire du DG' : ''), zone, panneau('p-agents', rendreAgents)];
  }

  function zoomOrdinateur(){
    const blocs = [];
    const onglets = el('div', 'bmail-onglets');
    const zone = el('div');
    const montrer = quoi => {
      onglets.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b.dataset.o === quoi));
      $('reserve').append(...zone.querySelectorAll('.ce-panneau'));
      if(quoi === 'marche'){ zone.replaceChildren(panneau('p-transactions', rendreTransactions)); return; }
      const liste = el('div', 'bmail-liste'), lecture = el('div', 'bmail-lecture');
      const ouvrir = (c, bouton) => {
        liste.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b === bouton));
        const h = el('h3', 'ce-titre-sec', c.titre); h.style.fontSize = '20px';
        const p = el('p', null, c.apercu);
        const act = el('div', 'ce-actions');
        const action = (texte, cls, msg) => { const b = el('button', 'ce-bouton ' + cls, texte); b.type = 'button'; b.addEventListener('click', () => toast('Maquette : ' + msg)); act.append(b); };
        if(c.type === 'offre'){ action('Ouvrir l’offre', 'is-principal', 'ouvrirait l’offre (Accepter, Contre-offre, Refuser).'); action('Refuser', 'is-danger', 'offre refusée.'); }
        if(c.type === 'retard') action('Soumettre le résultat', 'is-principal', 'ouvrirait la soumission du match nº ' + c.num + '.');
        if(c.type === 'gardien') action('Déclarer mon 2e gardien', 'is-principal', 'ouvrirait le post-it du 2e gardien.');
        lecture.replaceChildren(h, p, act);
      };
      courriels().forEach((c, i) => {
        const b = el('button', c.nonlu ? 'nonlu' : ''); b.type = 'button';
        const t = el('span'); t.append(el('b', null, c.titre), el('small', null, c.apercu));
        b.append(c.de === 'LNHQ' ? Object.assign(el('img'), { src: 'logo-lnhq.png', alt: '' }) : logo(c.de), t);
        b.addEventListener('click', () => ouvrir(c, b));
        liste.append(b);
        if(!i) setTimeout(() => ouvrir(c, b));
      });
      const boite = el('div', 'bmail'); boite.append(liste, lecture);
      zone.replaceChildren(boite);
    };
    if(estDG()){
      const b1 = el('button', null, '📧 Courriel'); b1.type = 'button'; b1.dataset.o = 'courriel'; b1.addEventListener('click', () => montrer('courriel'));
      const b2 = el('button', null, '🔁 Marché et transactions'); b2.type = 'button'; b2.dataset.o = 'marche'; b2.addEventListener('click', () => montrer('marche'));
      onglets.append(b1, b2);
      blocs.push(titreZoom('Ordinateur', 'mode DG'), onglets, zone);
      montrer('courriel');
    }else{
      blocs.push(titreZoom('Transactions', 'marché et historique (public)'), zone);
      montrer('marche');
    }
    return blocs;
  }

  function zoomPostit(){
    const per = periodeCourante();
    const blocs = [titreZoom('2e gardien', per ? 'période ' + per.num + ' · ' + fMois.format(parse(per.debut)) + ' → ' + fMois.format(parse(per.fin)) : '')];
    if(!per) return blocs;
    blocs.push(carteGardien());
    const ol = el('ol', 'ce-lignes'); ol.style.marginTop = '14px';
    const dcl = declaration(equipe, per.num);
    mesMatchs().filter(m => m.periode === per.num).sort((a, b) => a.date.localeCompare(b.date)).forEach((m, i) => {
      const li = el('li'); li.style.setProperty('--i', i);
      const adv = m.v === equipe ? m.d : m.v;
      li.append(el('span', 'j', (dcl && String(dcl.match) === m.num ? '☑ ' : '☐ ') + fCourt.format(parse(m.date))), el('span', 'o', m.v === equipe ? '@' : 'vs'), logo(adv), el('span', 'n', nom(adv)), el('span', 'pt'));
      if(estDG() && !dcl && !m.joue){
        const b = el('button', 'ecrire', 'déclarer celui-ci'); b.type = 'button';
        b.addEventListener('click', () => declarer(m.num, per));
        li.append(b);
      }
      ol.append(li);
    });
    blocs.push(ol);
    return blocs;
  }

  function zoomConsole(){
    const blocs = [titreZoom('Console', estDG() ? 'Soumettre un résultat' : 'Derniers résultats')];
    const tuiles = el('div', 'jeu-tuiles');
    const tuile = (m, etat) => {
      const adv = m.v === equipe ? m.d : m.v;
      const b = el('button', 'jeu-tuile'); b.type = 'button';
      const lg = el('div', 'logos'); lg.append(logo(m.v), el('span', null, '@'), logo(m.d));
      b.append(lg, el('b', null, nom(m.v) + ' @ ' + nom(m.d)), el('small', null, fCourt.format(parse(m.date)) + (m.joue ? ' · ' + m.bv + '-' + m.bd : ' · ' + heureTexte(m.heure))));
      if(etat) b.append(el('span', 'etat' + (etat === 'Joué' ? ' ok' : ''), etat));
      b.addEventListener('click', () => toast(m.joue ? 'Maquette : ouvrirait la fiche du match (stats et photo).' : estDG() ? 'Maquette : ouvrirait la soumission du match nº ' + m.num + ' (photo de l’écran de fin).' : 'Seul le DG peut soumettre un résultat.'));
      tuiles.append(b);
    };
    if(estDG()){ retards().forEach(m => tuile(m, 'En retard')); mesMatchs().filter(m => !m.joue && m.date >= AUJ).slice(0, 3).forEach(m => tuile(m, m.date === AUJ ? 'Ce soir' : '')); }
    mesMatchs().filter(m => m.joue).slice(-4).reverse().forEach(m => tuile(m, 'Joué'));
    blocs.push(tuiles);
    return blocs;
  }

  // 2e gardien déclaré (simulation) depuis le post-it.
  function declarer(num, per){
    simulees[equipe + '|' + per.num] = num;
    const m = matchs.find(x => x.num === num);
    if(!estPetit()) rendreScene(); else rendrePile();
    if(zoomActuel) remplirZoom(zoomActuel);
    toast('Maquette : 2e gardien déclaré pour le ' + fCourt.format(parse(m.date)) + ' (rien n’est enregistré).');
  }

  // Ouvrir un objet (scène ou pile), fermer le zoom.
  document.addEventListener('click', ev => {
    const o = ev.target.closest('[data-objet]');
    if(o && o.dataset.objet !== 'fenetre' && !ev.target.closest('#zoom')) ouvrirZoom(o.dataset.objet, o);
  });
  $('zoomFermer').addEventListener('click', fermerZoom);
  $('zoomFond').addEventListener('click', fermerZoom);
  document.addEventListener('keydown', ev => {
    if(ev.key === 'Escape' && zoomActuel) fermerZoom();
    // Le calendrier mural est un div (il contient ses boutons de mois) : Entrée l'ouvre comme les autres objets.
    if(ev.key === 'Enter' && ev.target.matches('div[data-objet]')) ouvrirZoom(ev.target.dataset.objet, ev.target);
  });

  // Fichier ouvert directement (aperçu, double-clic) : les scripts du site ne peuvent pas se charger.
  if(!/^https?:$/.test(location.protocol) || !window.LNHQ_TEAMS){
    $('chargement').textContent = 'Ouvre la maquette par le serveur : http://localhost:8766/maquettes/bureau-dg.html';
    return;
  }
  const titreSite = document.getElementById('sheetTitle');
  if(titreSite) titreSite.textContent = 'LNHQ';
  document.title = 'Centre d’équipe — maquette';
  appliquerTheme();
  appliquerCouleurs();
  charger().then(() => {
    if(!equipe){ vue = 'ligue'; document.querySelectorAll('[data-vue]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.vue === 'ligue'))); ouvrirModal(); }
    semaine = semaineCourante();
    rendreTout();
  }).catch(err => { console.error(err); $('chargement').textContent = 'Impossible de lire le calendrier pour le moment.'; });
})();
</script>
</body>
</html>
