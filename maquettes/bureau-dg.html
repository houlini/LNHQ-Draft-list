  // Alignement (auto ou enregistré) d'une équipe quelconque, gardé en mémoire.
  const alignements = new Map();
  function alignementDe(code){
    if(!alignements.has(code)){
      const A = window.LNHQ_ALIGNEMENT;
      alignements.set(code, Promise.all([A.chargerJoueurs(code), A.chargerSauvegarde(code)]).then(([j, s]) => A.composer(j, s))
        .catch(e => { alignements.delete(code); throw e; }));
    }
    return alignements.get(code);
  }
  // Trios, paires et gardien partant : overall moyen et noms de famille.
  function lignesOv(compo){
    const groupe = (lib, ids) => {
      const j = ids.map(id => compo.places[id]).filter(Boolean);
      return { lib, ov: j.length ? j.reduce((s, x) => s + x.ov, 0) / j.length : null, noms: j.map(x => x.famille).join(' · '), joueurs: j };
    };
    return [1, 2, 3, 4].map(n => groupe('Trio ' + n, ['A' + n + 'G', 'A' + n + 'C', 'A' + n + 'D']))
      .concat([1, 2, 3].map(n => groupe('Paire ' + n, ['D' + n + 'G', 'D' + n + 'D'])), [groupe('Gardien', ['G1'])]);
  }
  // Plan de match : suggestions de matchups (ratings) et de tactique (stats), les plus marquantes d'abord.
  function remplirPlan(box, se, adv, m, N, E){
    const idees = [];   // [poids, icône, texte]

    const pjE = (se.find(s => s.code === adv) || {}).pj || 0, haut = x => x && x.n > 3 && x.rang <= Math.ceil(x.n / 4), bas = x => x && x.n > 3 && x.rang > x.n - Math.ceil(x.n / 4);
    const domicile = m.d === equipe;
    if(N && E){
      const best = l => l.filter(x => x.ov != null).sort((a, b) => b.ov - a.ov)[0], pire = l => l.filter(x => x.ov != null).sort((a, b) => a.ov - b.ov)[0];
      const triosE = E.slice(0, 4), pairesE = E.slice(4, 7), triosN = N.slice(0, 4), pairesN = N.slice(4, 7);
      const tE = best(triosE), pN = best(pairesN), pE = pire(pairesE), tN = best(triosN);
      if(tE && pN) idees.push([3, '🛡️', `Leur ${tE.lib.toLowerCase()} (${tE.noms}, ${dec(tE.ov, 1)}) est leur menace : opposez-lui votre ${pN.lib.toLowerCase()} (${pN.noms}, ${dec(pN.ov, 1)}).`]);
      if(pE && tN) idees.push([3, '🎯', `Ciblez leur ${pE.lib.toLowerCase()} (${pE.noms}, ${dec(pE.ov, 1)}) avec votre ${tN.lib.toLowerCase()} (${dec(tN.ov, 1)})` + (!m.date ? '.' : domicile ? ' : à domicile, vous avez le dernier changement.' : ' : sur la route, sautez sur la glace après leurs changements.')]);
      const prof = (l, a, b) => moyenne(l.slice(a, b), x => x.ov);
      const fond = (prof(N, 2, 4) || 0) - (prof(E, 2, 4) || 0);
      if(fond >= 1.5) idees.push([2, '🔄', `Votre profondeur est meilleure (trios 3-4 : ${signe(fond, 1)} d'overall) : roulez 4 trios et usez-les.`]);
      else if(fond <= -1.5) idees.push([2, '⏱️', `Leur profondeur est meilleure (trios 3-4 : ${signe(-fond, 1)}) : raccourcissez le banc en fin de match.`]);
      const gN = N[7], gE = E[7];
      if(gN.ov != null && gE.ov != null && Math.abs(gN.ov - gE.ov) >= 2) idees.push([2, '🥅', gN.ov > gE.ov ? `Avantage devant le filet : ${gN.noms} (${gN.ov}) contre ${gE.noms} (${gE.ov}).` : `Leur gardien ${gE.noms} (${gE.ov}) est meilleur que le vôtre (${gN.ov}) : générez du trafic et des rebonds.`]);
    }

    const AN = ['anPct', 1], DN = ['dnPct', 1], PEN = ['penalitesMoy', -1], MJ = ['mjPct', 1], ARR = ['arrPct', 1], TIR = ['tirPct', 1], PT = ['partTirs', 1], POS = ['possession', 1], MEE = ['misesMoy', 1], TC = ['tirsContreMoy', -1];
    if(bas(eux(PEN))) idees.push([2.5, '🚨', `Ils sont indisciplinés (${dec(eux(PEN).val, 1)} min/PJ, ${ordinal(eux(PEN).rang)}) : jouez vite vers le filet pour provoquer des pénalités` + (haut(nous(AN)) ? ` ; votre avantage numérique (${ordinal(nous(AN).rang)}) en profitera.` : '.')]);
    if(haut(eux(AN))) idees.push([2.5, '🧊', `Leur avantage numérique frappe (${pct(eux(AN).val)}, ${ordinal(eux(AN).rang)}) : discipline avant tout` + (bas(nous(PEN)) ? `, vous êtes ${ordinal(nous(PEN).rang)} en pénalités.` : '.')]);
    if(bas(eux(DN))) idees.push([2, '⚡', `Leur désavantage est fragile (${pct(eux(DN).val)}, ${ordinal(eux(DN).rang)}) : chaque pénalité obtenue vaut cher.`]);
    if(bas(eux(ARR))) idees.push([2, '🏒', `Leurs gardiens arrêtent ${pct(eux(ARR).val)} des tirs (${ordinal(eux(ARR).rang)}) : tirez de partout, le volume paiera.`]);
    if(haut(eux(ARR))) idees.push([1.5, '🏒', `Leurs gardiens sont solides (${pct(eux(ARR).val)}, ${ordinal(eux(ARR).rang)}) : cherchez les tirs de l'enclave et les rebonds, pas la quantité.`]);
    if(bas(eux(PT)) || bas(eux(POS))) idees.push([2, '🔥', `Ils subissent le jeu (part des tirs ${eux(PT) ? pct(eux(PT).val) : '–'}, possession ${eux(POS) ? pct(eux(POS).val) : '–'}) : échec avant agressif pour les garder dans leur zone.`]);
    if(haut(eux(PT)) && haut(eux(POS))) idees.push([2, '🧱', `Ils contrôlent la rondelle (possession ${pct(eux(POS).val)}, ${ordinal(eux(POS).rang)}) : bloc défensif compact et contre-attaques rapides.`]);

    if(pdo && pdo.n > 3 && pdo.val <= 98) idees.push([1.5, '🍀', `PDO de ${dec(pdo.val, 1)} : ils jouent mieux que leur fiche (malchance) ; méfiez-vous du réveil.`]);
    const leurs = matchsDe(adv), recents = leurs.slice(-5);
    if(recents.length >= 3 && leurs.length >= 6){
      const dR = moyenne(recents, g => g.pour - g.contre), dS = moyenne(leurs, g => g.pour - g.contre);
      if(dR - dS >= 1) idees.push([1.5, '📈', `En forme : différentiel de ${signe(dR, 1)} par match sur leurs ${recents.length} derniers (saison ${signe(dS, 1)}).`]);
      if(dR - dS <= -1) idees.push([1.5, '📉', `En chute : différentiel de ${signe(dR, 1)} par match sur leurs ${recents.length} derniers (saison ${signe(dS, 1)}) ; frappez tôt.`]);
    }
    const l = el('ol', 'dz-plan-liste');

  // Chandail du cadre : le DG choisit le chandail retiré (couleurs de l'époque, non modifiables) ; les autres voient son choix.
  function carteChandail(){
    const ch = chandailDe(equipe), c = el('section', 'ce-carte fiche-chandail');
    c.append(el('h3', null, 'Chandail retiré'));
    const apercu = el('div', 'fc-apercu');
    apercu.style.setProperty('--corps', ch.corps); apercu.style.setProperty('--bandes', ch.bandes); apercu.style.setProperty('--ligne', ch.ligne);
    const etiquette = el('span'); etiquette.append(document.createTextNode(ch.joueur || 'Aucun chandail retiré'));
    if(ch.joueur) etiquette.append(el('small', null, ch.annee >= ANNEE_ACTUELLE ? 'Chandail actuel' : 'Chandail de ' + (ch.annee - 1) + '-' + ch.annee));
    const logoEp = Object.assign(el('img', 'fc-logo'), { src: logoEpoque(equipe, ch.annee, false), alt: '' });   // fiche sur fond clair
    apercu.append(el('b', null, ch.numero || '–'), etiquette, logoEp);
    c.append(apercu);
    if(!estDG()) return c;
    const f = el('form', 'fc-form');
    const champ = (lib, input, cls) => { const l = el('label', cls); l.append(el('span', null, lib), input); return l; };
    // Joueur retiré de l'équipe (son chandail d'époque), ou un autre joueur : nom, numéro et époque libres.
    const liste = RETIRES[equipe] || [];
    const choix = el('select');
    liste.forEach((r, k) => { const o = el('option', null, `${r[0]} · nº ${r[1]} · ${r[2]}-${r[3]}`); o.value = k; choix.append(o); });
    const autre = el('option', null, 'Autre joueur…'); autre.value = -1; choix.append(autre);
    choix.value = String(ch.retire);
    const joueur = Object.assign(el('input'), { type: 'text', value: ch.retire >= 0 ? '' : ch.joueur, maxLength: 28, placeholder: 'Nom du joueur' });
    const numero = Object.assign(el('input'), { type: 'text', value: ch.retire >= 0 ? '' : ch.numero, maxLength: 2, inputMode: 'numeric', pattern: '[0-9]{0,2}', placeholder: '9' });
    const epoque = el('select');
    epoquesDe(equipe).forEach(([a, lib]) => { const o = el('option', null, lib); o.value = a; epoque.append(o); });
    epoque.value = String(ch.retire >= 0 ? ANNEE_ACTUELLE : [...epoque.options].map(o => Number(o.value)).filter(a => a <= ch.annee).pop() || ANNEE_ACTUELLE);
    const libres = [champ('Joueur', joueur, 'fc-libre'), champ('Numéro', numero, 'fc-libre'), champ('Époque du chandail', epoque, 'fc-libre')];
    // Vue dans le cadre : de face (logo de l'époque) ou de dos (nom et numéro).
    const vue = el('select');
    [['dos', 'De dos : nom et numéro'], ['face', 'De face : logo']].forEach(([v, lib]) => { const o = el('option', null, lib); o.value = v; vue.append(o); });
    vue.value = ch.vue;
    f.append(champ('Chandail retiré', choix, 'fc-choix'), ...libres, champ('Vue dans le cadre', vue, 'fc-choix'));
    // Les couleurs ne se choisissent pas : c'est toujours le vrai chandail de l'époque.
    const majChoix = () => { libres.forEach(l => { l.hidden = choix.value !== '-1'; }); };
    choix.addEventListener('change', majChoix);
    majChoix();
    const enr = Object.assign(el('button', 'ce-bouton is-principal', 'Enregistrer'), { type: 'submit' });
    const defaut = Object.assign(el('button', 'ce-bouton', 'Par défaut'), { type: 'button' });
    const actions = el('div', 'fc-actions'); actions.append(enr, defaut, el('small', null, 'Maquette : gardé sur cet appareil.'));
    f.append(actions);
    const appliquer = () => { ['o-ecusson', 'o-tasse'].forEach(id => sansErreur(peindreSurface(id, equipe))); remplirZoom('fiche'); };
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const retire = Number(choix.value), n = numero.value.replace(/\D/g, '').slice(0, 2);
      const v = retire >= 0 ? { retire } : { retire, joueur: joueur.value.trim(), numero: n, annee: Number(epoque.value) };
      v.vue = vue.value;
      try{ localStorage.setItem(cleChandail(equipe), JSON.stringify(v)); }catch(e){}
      toast('Chandail retiré enregistré.'); appliquer();
    });
    defaut.addEventListener('click', () => { try{ localStorage.removeItem(cleChandail(equipe)); }catch(e){} appliquer(); });
    c.append(f);
    return c;
  }

  /* ---------- Zoom : l'objet ouvert en plein écran ---------- */
  const reduitZoom = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let origineZoom = null;
  let generationZoom = 0;   // une fermeture en cours ne doit pas refermer un objet ouvert entre-temps

  // Vraie page du site pour chaque objet : [titre, adresse]. La télé dépend de la colonne cliquée.
  const DG = 'https://dg.lnhq.ca/';
  function pageObjet(type, cible){

    if(type === 'tele'){

      cartable: estDG() ? ['Alignement', DG + 'alignement.html'] : ['Alignement', 'equipe.html?team=' + slug(equipe) + '&vue=alignement'],
      effectif: ['Masse salariale', 'masse.html'],

  // Un match du calendrier : joué → sa fiche (score, stats, photo) ; à venir → le rapport de dépistage complet.
  let matchZoom = '';
  function ouvrirMatch(num, depuis){
    const m = matchs.find(x => x.num === num);
    if(!m) return;
    if(m.joue){ matchZoom = num; ouvrirZoom('match', depuis); }
    else{ advDepistage = adversaireDe(m); ouvrirZoom('depistage', depuis); }
  }
  function zoomMatch(){
    const m = matchs.find(x => x.num === matchZoom), r = resultats[matchZoom];
    if(!m || !r) return [titreZoom('Match', ''), el('p', 'ce-vide', 'Résultat introuvable.')];
    const cote = (code, buts, gagnant) => { const d = el('div', 'zm-equipe' + (gagnant ? ' gagnant' : '')); d.append(logo(code), el('span', null, nom(code)), el('b', null, String(buts))); return d; };
    const tete = el('div', 'zm-tete'), milieu = el('div', 'zm-milieu', 'Final' + (r.fin ? ' · ' + (R.FINS[r.fin] || r.fin) : ''));
    milieu.append(el('small', null, fJour.format(parse(m.date)) + ' · match nº ' + m.num));
    tete.append(cote(r.visiteur, r.butsV, r.butsV > r.butsD), milieu, cote(r.domicile, r.butsD, r.butsD > r.butsV));
    const blocs = [titreZoom('Résultat', serieContre(adversaireDe(m))), tete];
    const corps = el('tbody');
    R.STATS.forEach(s => {
      const [v, d] = (r.stats || {})[s.cle] || ['', ''];
      if(v === '' && d === '') return;
      const tr = el('tr'); tr.append(el('td', null, v), el('th', null, s.nom), el('td', null, d)); corps.append(tr);
    });
    if(corps.children.length){ const t = el('table', 'zm-stats'); t.append(corps); blocs.push(t); }
    if(r.photo){
      const lien = Object.assign(el('a', 'zm-photo'), { href: r.photo, target: '_blank', rel: 'noopener' });
      lien.append(Object.assign(el('img'), { src: r.photo, alt: 'Photo de l’écran de fin de match', loading: 'lazy' }));
      blocs.push(lien);
    }else blocs.push(el('p', 'ce-vide', 'Pas de photo soumise pour ce match.'));
    return blocs;

  // Panneau « page » : la page du site dans un cadre ; sur le même site, son en-tête est caché (le bureau
  // reste derrière, ✕ ou Échap pour y revenir).
  function remplirPage([titre, url]){
    const barre = el('div', 'bu-page-barre');
    barre.append(el('b', null, titre), Object.assign(el('a', null, 'Ouvrir la page ↗'), { href: url, target: '_blank', rel: 'noopener' }));
    const cadre = el('iframe', 'bu-page-cadre'); cadre.title = titre; cadre.src = url;
    cadre.addEventListener('load', () => {
      try{
        const d = cadre.contentDocument;
        const st = d.createElement('style');
        st.textContent = 'site-header, .app-header, .ce-maquette{ display:none !important; }';
        d.head.append(st);
        d.addEventListener('keydown', ev => { if(ev.key === 'Escape') fermerZoom(); });
      }catch(e){ /* autre domaine (dg.lnhq.ca) : la page garde son en-tête */ }
    });
    $('zoomCorps').replaceChildren(barre, cadre);
  }
  function ouvrirZoom(type, depuis, page){
    // Pages DG (dg.lnhq.ca) sans être connecté : ouvertes dans l'onglet, pas dans le panneau — la
    // connexion Discord refuse de s'afficher dans un cadre. Le bouton Retour ramène au bureau.
    // En mode DG (déjà connecté), elles s'ouvrent dans le panneau comme les autres.
    if(page && page[1].startsWith(DG) && !estDG()){ location.href = page[1]; return; }
    generationZoom++;
    zoomActuel = type;
    pageOuverte = !!page;
    origineZoom = depuis || null;
    const z = $('zoom'), o = $('zoomObjet');
    o.className = 'bu-zoom-objet ' + (page ? 'is-page' : 'is-' + type);
    z.hidden = false;
    $('reserve').append(...$('zoomCorps').querySelectorAll('.ce-panneau'));
    if(page) remplirPage(page); else remplirZoom(type);
    if(depuis && !reduitZoom){
      const a = depuis.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.4 }, { transform: 'none', opacity: 1 }],
        { duration: 450, easing: 'cubic-bezier(.2,.85,.25,1)' });
    }
    $('zoomFermer').focus();
  }
  function fermerZoom(){
    if(!zoomActuel) return;
    const z = $('zoom'), o = $('zoomObjet');
    const gen = generationZoom;
    const fin = () => {
      if(gen !== generationZoom) return;
      z.hidden = true; zoomActuel = '';
      $('reserve').append(...$('zoomCorps').querySelectorAll('.ce-panneau'));
      if(pageOuverte){ $('zoomCorps').replaceChildren(); pageOuverte = false; }   // décharge la page
      if(origineZoom) origineZoom.focus();
    };
    if(origineZoom && !reduitZoom && origineZoom.offsetParent){
      const a = origineZoom.getBoundingClientRect(), b = o.getBoundingClientRect();
      o.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width}, ${a.height / b.height})`, opacity: 0.2 }],
        { duration: 320, easing: 'cubic-bezier(.5,0,.75,0)' }).finished.then(fin, fin);
    }else fin();
  }
  function titreZoom(texte, sous){

  function remplirZoom(type){

      meneurs: zoomMeneurs,

    })[type]();
    corps.replaceChildren(...contenu);
  }

      const liste = el('div', 'bmail-liste'), lecture = el('div', 'bmail-lecture');
      const ouvrir = (c, bouton) => {
        liste.querySelectorAll('button').forEach(b => b.classList.toggle('actif', b === bouton));
        const h = el('h3', 'ce-titre-sec', c.titre); h.style.fontSize = '20px';
        const p = el('p', null, c.apercu);
        const act = el('div', 'ce-actions');
        const action = (texte, cls, msg) => { const b = el('button', 'ce-bouton ' + cls, texte); b.type = 'button'; b.addEventListener('click', () => toast('Maquette : ' + msg)); act.append(b); };
        if(c.type === 'offre'){ action('Ouvrir l’offre', 'is-principal', 'ouvrirait l’offre (Accepter, Contre-offre, Refuser).'); action('Refuser', 'is-danger', 'offre refusée.'); }
        if(c.type === 'retard') action('Soumettre le résultat', 'is-principal', 'ouvrirait la soumission du match nº ' + c.num + '.');
        if(c.type === 'gardien') action('Déclarer mon 2e gardien', 'is-principal', 'ouvrirait le post-it du 2e gardien.');
        lecture.replaceChildren(h, p, act);
      };
      courriels().forEach((c, i) => {
        const b = el('button', c.nonlu ? 'nonlu' : ''); b.type = 'button';
        const t = el('span'); t.append(el('b', null, c.titre), el('small', null, c.apercu));
        b.append(c.de === 'LNHQ' ? Object.assign(el('img'), { src: 'logo-lnhq.png', alt: '' }) : logo(c.de), t);
        b.addEventListener('click', () => ouvrir(c, b));
        liste.append(b);
        if(!i) setTimeout(() => ouvrir(c, b));
      });
      const boite = el('div', 'bmail'); boite.append(liste, lecture);
      zone.replaceChildren(boite);
    };
    if(estDG()){
      const b1 = el('button', null, '📧 Courriel'); b1.type = 'button'; b1.dataset.o = 'courriel'; b1.addEventListener('click', () => montrer('courriel'));
      const b2 = el('button', null, '🔁 Marché et transactions'); b2.type = 'button'; b2.dataset.o = 'marche'; b2.addEventListener('click', () => montrer('marche'));
      onglets.append(b1, b2);
      blocs.push(titreZoom('Ordinateur', 'mode DG'), onglets, zone);
      montrer('courriel');
    }else{
      blocs.push(titreZoom('Transactions', 'marché et historique (public)'), zone);
      montrer('marche');
    }
    return blocs;
  }

  function zoomPostit(){
    const per = periodeCourante();
    const blocs = [titreZoom('2e gardien', per ? 'période ' + per.num + ' · ' + fMois.format(parse(per.debut)) + ' → ' + fMois.format(parse(per.fin)) : '')];
    if(!per) return blocs;
    blocs.push(carteGardien());
    const ol = el('ol', 'ce-lignes'); ol.style.marginTop = '14px';
    const dcl = declaration(equipe, per.num);
    mesMatchs().filter(m => m.periode === per.num).sort((a, b) => a.date.localeCompare(b.date)).forEach((m, i) => {
      const li = el('li'); li.style.setProperty('--i', i);
      const adv = m.v === equipe ? m.d : m.v;
      li.append(el('span', 'j', (dcl && String(dcl.match) === m.num ? '☑ ' : '☐ ') + fCourt.format(parse(m.date))), el('span', 'o', m.v === equipe ? '@' : 'vs'), logo(adv), el('span', 'n', nom(adv)), el('span', 'pt'));
      if(estDG() && !dcl && !m.joue){
        const b = el('button', 'ecrire', 'déclarer celui-ci'); b.type = 'button';
        b.addEventListener('click', () => declarer(m.num, per));
        li.append(b);
      }
      ol.append(li);
    });
    blocs.push(ol);
    return blocs;
  }

  function zoomConsole(){
    const blocs = [titreZoom('Console', estDG() ? 'Soumettre un résultat' : 'Derniers résultats')];
    const tuiles = el('div', 'jeu-tuiles');
    const tuile = (m, etat) => {
      const adv = m.v === equipe ? m.d : m.v;
      const b = el('button', 'jeu-tuile'); b.type = 'button';
      const lg = el('div', 'logos'); lg.append(logo(m.v), el('span', null, '@'), logo(m.d));
      b.append(lg, el('b', null, nom(m.v) + ' @ ' + nom(m.d)), el('small', null, fCourt.format(parse(m.date)) + (m.joue ? ' · ' + m.bv + '-' + m.bd : ' · ' + heureTexte(m.heure))));
      if(etat) b.append(el('span', 'etat' + (etat === 'Joué' ? ' ok' : ''), etat));
      b.addEventListener('click', () => toast(m.joue ? 'Maquette : ouvrirait la fiche du match (stats et photo).' : estDG() ? 'Maquette : ouvrirait la soumission du match nº ' + m.num + ' (photo de l’écran de fin).' : 'Seul le DG peut soumettre un résultat.'));
      tuiles.append(b);
    };
    if(estDG()){ retards().forEach(m => tuile(m, 'En retard')); mesMatchs().filter(m => !m.joue && m.date >= AUJ).slice(0, 3).forEach(m => tuile(m, m.date === AUJ ? 'Ce soir' : '')); }
    mesMatchs().filter(m => m.joue).slice(-4).reverse().forEach(m => tuile(m, 'Joué'));
    blocs.push(tuiles);
    return blocs;
  }

  // 2e gardien déclaré (simulation) depuis le post-it.
  function declarer(num, per){
    simulees[equipe + '|' + per.num] = num;
    const m = matchs.find(x => x.num === num);
    if(!estPetit()) rendreScene(); else rendrePile();
    if(zoomActuel && !pageOuverte) remplirZoom(zoomActuel);
    toast('Maquette : 2e gardien déclaré pour le ' + fCourt.format(parse(m.date)) + ' (rien n’est enregistré).');
  }

  // Ouvrir un objet (scène ou pile), fermer le zoom.
  document.addEventListener('click', ev => {
    // Un match du calendrier (mural ou agrandi) : sa fiche ou le rapport de dépistage.
    const caseMatch = ev.target.closest('.bu-calendrier [data-num], .gcal [data-num]');
    if(caseMatch){ ouvrirMatch(caseMatch.dataset.num, caseMatch); return; }
    const o = ev.target.closest('[data-objet]');
    if(o && o.dataset.objet !== 'fenetre' && !ev.target.closest('#zoom')){
      if(o.dataset.objet === 'depistage') advDepistage = '';   // la tablette ouvre toujours sur le prochain adversaire
      ouvrirZoom(o.dataset.objet, o, pageObjet(o.dataset.objet, ev.target));
    }
  });
  $('zoomFermer').addEventListener('click', fermerZoom);
  $('zoomFond').addEventListener('click', fermerZoom);
  document.addEventListener('keydown', ev => {
    if(ev.key === 'Escape' && zoomActuel) fermerZoom();
    // Le calendrier mural est un div (il contient ses boutons de mois) : Entrée l'ouvre comme les autres objets.
    if(ev.key === 'Enter' && ev.target.matches('div[data-objet]')) ouvrirZoom(ev.target.dataset.objet, ev.target, pageObjet(ev.target.dataset.objet, ev.target));
  });

  // Fichier ouvert directement (aperçu, double-clic) : les scripts du site ne peuvent pas se charger.
  if(!/^https?:$/.test(location.protocol) || !window.LNHQ_TEAMS){
    $('chargement').textContent = 'Ouvre la maquette par le serveur : http://localhost:8766/maquettes/bureau-dg.html';
    return;
  }
  const titreSite = document.getElementById('sheetTitle');
  if(titreSite) titreSite.textContent = 'LNHQ';
  document.title = 'Centre d’équipe — maquette';
  appliquerTheme();
  appliquerCouleurs();
  charger().then(() => {
    if(!equipe){ vue = 'ligue'; document.querySelectorAll('[data-vue]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.vue === 'ligue'))); ouvrirModal(); }
    semaine = semaineCourante();
    rendreTout();
    if(new URLSearchParams(location.search).has('chandails')) apercuDesChandails(new URLSearchParams(location.search).get('chandails'));
  }).catch(err => { console.error(err); $('chargement').textContent = 'Impossible de lire le calendrier pour le moment.'; });
})();
</script>
</body>
</html>
