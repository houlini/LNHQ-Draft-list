  function rendreHero(){
    const h = $('hero');
    const prochain = mesMatchs().filter(m => !m.joue).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num))[0];
    h.replaceChildren();
    if(!prochain){ h.append(el('div', 'ce-hero-etiquette', 'Saison terminée')); return; }
    const adv = prochain.v === equipe ? prochain.d : prochain.v;
    h.style.setProperty('--adv-couleur', (COULEURS[adv] || ['#555'])[0]);
    const fiche = c => { const t = classement.find(x => x.code === c); return t ? `${t.v}-${t.d}-${t.dp} · ${t.pts} pts` : ''; };
    const cote = (c, cls) => { const d = el('div', 'ce-cote ' + cls); d.append(logo(c), el('b', null, nom(c)), el('small', null, fiche(c))); return d; };
    const ecart = ecartJours(AUJ, prochain.date);
    const quand = el('div', 'ce-quand', ecart === 0 ? 'Ce soir' : ecart === 1 ? 'Demain' : ecart < 0 ? 'En retard' : 'Dans ' + ecart + ' jours');
    quand.append(el('small', null, fJour.format(parse(prochain.date)) + (prochain.heure ? ' · ' + heureTexte(prochain.heure) : '') + ' · ' + (prochain.v === equipe ? 'à l’étranger' : 'à domicile')));
    const milieu = el('div', 'ce-milieu');
    milieu.append(el('div', 'ce-rondelle'), quand);
    const corps = el('div', 'ce-hero-corps');
    corps.append(cote(equipe, 'is-gauche'), milieu, cote(adv, 'is-droite'));
    // Série entre les deux équipes cette saison.
    const entre = matchs.filter(m => m.joue && ((m.v === equipe && m.d === adv) || (m.d === equipe && m.v === adv)));
    const gagnes = entre.filter(m => resultatPour(m) === 'v').length;
    const pied = el('div', 'ce-hero-pied');
    pied.append(el('span', 'ce-serie', entre.length ? `Série cette saison : ${gagnes}-${entre.length - gagnes} ${gagnes >= entre.length - gagnes ? 'pour ' + nom(equipe) : 'pour ' + nom(adv)}` : 'Premier duel de la saison'));
    const soum = el('a', 'ce-btn is-principal', '📷 Soumettre le résultat');
    soum.href = '#'; soum.addEventListener('click', ev => { ev.preventDefault(); toast('Maquette : ouvrirait la soumission du match nº ' + prochain.num + ', déjà rempli.'); });
    const tv = el('a', 'ce-btn', '📺 LNHQ TV'); tv.href = '../tv.html';
    if(estDG()) pied.append(soum);
    pied.append(tv);
    h.append(el('div', 'ce-hero-etiquette', 'Prochain match · nº ' + prochain.num), corps, pied);
  }

  // Semaine (ou toute la ligue) sur la planchette / le tableau, avec animation de page.
  function rendreSemaine(sens){
    const liste = vue === 'equipe' && equipe ? [...new Set(mesMatchs().map(m => m.semaine))].sort() : semaines;
    if(!liste.includes(semaine)) semaine = semaineCourante();
    const i = liste.indexOf(semaine);
    $('prec').disabled = i <= 0; $('suiv').disabled = i >= liste.length - 1;
    $('blocAuj').hidden = semaine === semaineCourante();
    const fin = parse(semaine); fin.setDate(fin.getDate() + 6);
    const titre = $('titreSemaine');
    titre.textContent = 'Semaine ' + (semaines.indexOf(semaine) + 1);
    titre.append(el('small', null, fMois.format(parse(semaine)) + ' au ' + fMois.format(fin) + (semaine === lundi(AUJ) ? ' · cette semaine' : '')));

    const feuille = el('div', 'ce-feuille');
    if(vue === 'equipe' && equipe) feuilleEquipe(feuille); else feuilleLigue(feuille);
    const pile = $('feuilles');
    const ancienne = pile.querySelector('.ce-feuille:not(.sort-suiv):not(.sort-prec)');
    if(!ancienne || !sens){ pile.replaceChildren(feuille); return; }
    // Planchette, semaine suivante : la feuille du dessus est arrachée sous la pince.
    if(theme === 'planchette' && sens > 0 && !reduit){
      arracher(ancienne);
      feuille.classList.add('entre-suiv');
      pile.replaceChildren(feuille);
      return;
    }
    if(sens < 0) document.querySelectorAll('.ce-reste').forEach(r => r.remove());   // la page revient : plus de bout déchiré
    if(theme === 'tableau'){
      const brosse = el('div', 'ce-brosse ' + (sens > 0 ? 'va-gauche' : 'va-droite'));
      $('support').append(brosse);
      brosse.addEventListener('animationend', () => brosse.remove());
    }
    ancienne.classList.add(sens > 0 ? 'sort-suiv' : 'sort-prec');
    feuille.classList.add(sens > 0 ? 'entre-suiv' : 'entre-prec');
    if(sens > 0) pile.prepend(feuille); else pile.append(feuille);
    setTimeout(() => ancienne.remove(), 700);
  }

  /* Arrachage : bord déchiré tiré au hasard sous la pince. La feuille (sans sa bande du haut)
     tombe en tournoyant ; la bande déchirée reste coincée dans la pince jusqu'au prochain
     changement. */
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasard = (a, b) => a + Math.random() * (b - a);
  function arracher(ancienne){
    const support = $('support');
    const s = support.getBoundingClientRect(), a = ancienne.getBoundingClientRect();
    // Ligne de déchirure : juste sous la pince, irrégulière, avec quelques accrocs.
    const base = hasard(40, 46), points = [];
    for(let x = 0; x < 100; x += hasard(1.2, 3.4)){
      let y = base + hasard(-3.5, 3.5) + Math.sin(x / hasard(5, 9)) * 2.2;
      if(Math.random() < 0.08) y += hasard(4, 9);   // accroc : la déchirure plonge
      points.push([x, y]);
    }
    points.push([100, base + hasard(-3, 3)]);
    const ligne = points.map(([x, y]) => `${x.toFixed(1)}% ${y.toFixed(1)}px`);
    // Bout resté dans la pince (remplace le précédent).
    support.querySelectorAll('.ce-reste').forEach(r => r.remove());
    const reste = el('div', 'ce-feuille ce-reste');
    const hReste = Math.max(...points.map(p => p[1])) + 2;
    Object.assign(reste.style, { left: (a.left - s.left) + 'px', top: (a.top - s.top) + 'px', width: a.width + 'px', height: hReste + 'px', padding: '0',
      clipPath: `polygon(0 0, 100% 0, ${ligne.slice().reverse().join(', ')})` });
    // La feuille arrachée : même place, sans la bande du haut, puis elle tombe.
    support.append(ancienne);
    ancienne.classList.add('ce-arrachee');
    Object.assign(ancienne.style, { left: (a.left - s.left) + 'px', top: (a.top - s.top) + 'px', width: a.width + 'px', height: a.height + 'px',
      clipPath: `polygon(${ligne.join(', ')}, 100% 100%, 0 100%)` });
    support.append(reste);
    const versDroite = Math.random() < 0.6 ? 1 : -1;
    const chute = ancienne.animate([
      { transform: 'translate(0, 0) rotate(0deg)', filter: 'drop-shadow(0 2px 3px rgba(0,0,0,.2))' },
      { transform: `translate(${2 * versDroite}px, 7px) rotate(${0.8 * versDroite}deg)`, offset: 0.1 },          // on tire
      { transform: `translate(${-2 * versDroite}px, 4px) rotate(${-0.5 * versDroite}deg)`, offset: 0.18 },      // ça résiste
      { transform: `translate(${22 * versDroite}px, 46px) rotate(${6 * versDroite}deg)`, offset: 0.36, filter: 'drop-shadow(0 18px 18px rgba(0,0,0,.35))' },
      { transform: `translate(${hasard(120, 220) * versDroite}px, ${a.height + 260}px) rotate(${hasard(22, 38) * versDroite}deg)`, opacity: 0, filter: 'drop-shadow(0 40px 30px rgba(0,0,0,.3))' },
    ], { duration: 1250 * (window.__ralenti || 1), easing: 'cubic-bezier(.4,0,.75,.55)', fill: 'forwards' });
    ancienne.style.transformOrigin = versDroite > 0 ? '15% 0' : '85% 0';
    chute.finished.then(() => ancienne.remove(), () => ancienne.remove());
  }

  // Série de la saison contre un adversaire (matchs joués).
  function serieContre(adv){
    const entre = matchs.filter(x => x.joue && ((x.v === equipe && x.d === adv) || (x.d === equipe && x.v === adv)));
    if(!entre.length) return '1er duel';
    const v = entre.filter(x => resultatPour(x) === 'v').length;
    return `Série ${v}-${entre.length - v}`;
  }

  function aimantMatch(m, i, per, dejaDecl){
    const adv = m.v === equipe ? m.d : m.v;
    const retard = !m.joue && m.date < AUJ;
    const a = el('article', 'ce-aimant' + (m.joue ? ' is-joue' : '') + (m.date === AUJ && !m.joue ? ' is-auj' : '') + (retard ? ' is-retard' : ''));
    a.style.setProperty('--i', i);
    a.style.setProperty('--r', ((i % 3) - 1) * 1.3 + 'deg');
    a.dataset.num = m.num;
    const advBloc = el('div', 'ce-adv');
    advBloc.append(el('small', null, m.v === equipe ? '@' : 'vs'), logo(adv));
    a.append(el('span', 'ce-jour', fCourt.format(parse(m.date))), advBloc, el('span', 'ce-adv-nom', nom(adv)));
    if(m.joue){
      const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv, r = resultatPour(m);
      const s = el('div', 'ce-score');
      s.append(el('span', null, pour + '-' + contre), el('span', 'ce-badge ' + r, r === 'v' ? 'V' : r === 'p' ? 'DP' : 'D'));
      if(m.fin) s.append(el('span', 'ce-heure', R.FINS[m.fin]));
      a.append(s);
    }else{
      a.append(el('span', 'ce-heure', heureTexte(m.heure) || 'Heure à venir'));
      if(estDG()){
        const b = el('button', 'ce-action', retard ? 'Soumettre (en retard)' : 'Soumettre');
        b.type = 'button';
        b.addEventListener('click', () => toast('Maquette : ouvrirait la soumission du match nº ' + m.num + ' (' + nom(m.v) + ' @ ' + nom(m.d) + ').'));
        a.append(b);
      }
    }
    a.append(el('span', 'ce-serie-mini', serieContre(adv)));
    if(retard) a.append(el('span', 'ce-tampon', 'En retard'));
    // 2e gardien : masque posé si ce match est déclaré ; sinon cible de dépôt possible (DG).
    const d = declaration(equipe, m.periode);
    if(d && String(d.match) === m.num) a.append(masque('ce-masque-pose'));
    if(estDG() && per && m.periode === per.num && !m.joue && !dejaDecl) a.classList.add('est-cible');
    return a;
  }

  /* Planchette : la semaine écrite au stylo sur les lignes du papier. Score au feutre rouge,
     résultat encerclé ; match à jouer = « ___ – ___ » au crayon ; retard noté dans la marge. */
  function ligneManuscrite(m, i, per, dejaDecl){
    const adv = m.v === equipe ? m.d : m.v;
    const retard = !m.joue && m.date < AUJ;
    const li = el('li', (m.date === AUJ && !m.joue ? 'is-auj' : '') + (retard ? ' is-retard' : ''));
    li.style.setProperty('--i', i);
    li.dataset.num = m.num;
    const jour = parse(m.date);
    li.append(el('span', 'j', ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'][jour.getDay()] + ' ' + jour.getDate()),
      el('span', 'o', m.v === equipe ? '@' : 'vs'), logo(adv), el('span', 'n', nom(adv)), el('span', 'pt'));
    if(m.joue){
      const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv, r = resultatPour(m);
      li.append(el('span', 'sc', pour + ' – ' + contre), el('span', 'res ' + r, r === 'v' ? 'V' : r === 'p' ? 'DP' : 'D'));
      li.append(el('span', 'x', m.fin ? R.FINS[m.fin] : serieContre(adv)));
    }else{
      li.append(el('span', 'sc a-faire', '___ – ___'));
      if(estDG()){
        const b = el('button', 'ecrire', '✎ inscrire'); b.type = 'button';
        b.addEventListener('click', () => toast('Maquette : ouvrirait la soumission du match nº ' + m.num + ' (photo de l’écran de fin).'));
        li.append(b);
      }else li.append(el('span', 'x', heureTexte(m.heure)));
    }
    if(retard) li.append(el('span', 'note', 'en retard !'));
    const d = declaration(equipe, m.periode);
    if(d && String(d.match) === m.num){ const mq = masque('mq'); mq.setAttribute('aria-label', '2e gardien'); li.append(mq); }
    if(estDG() && per && m.periode === per.num && !m.joue && !dejaDecl) li.classList.add('est-cible');
    return li;
  }
  function feuilleManuscrite(f){
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', 'Semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const per = periodes.find(p => p.fin >= AUJ);
    const dejaDecl = per && declaration(equipe, per.num);
    let i = 0;
    if(semaine === lundi(AUJ)){
      const retards = mesMatchs().filter(m => !m.joue && m.date < semaine).sort((a, b) => a.date.localeCompare(b.date));
      if(retards.length){
        f.append(el('p', 'ce-sous-titre-main', '⚠ À rattraper (' + retards.length + ')'));
        const ol = el('ol', 'ce-lignes');
        retards.forEach(m => ol.append(ligneManuscrite(m, i++, per, dejaDecl)));
        f.append(ol, el('p', 'ce-sous-titre-main is-semaine', 'Cette semaine'));
      }
    }
    const liste = mesMatchs().filter(m => m.semaine === semaine).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    if(!liste.length){ f.append(el('p', 'ce-repos', 'Pas de match cette semaine — repos !')); return; }
    const ol = el('ol', 'ce-lignes');
    liste.forEach(m => ol.append(ligneManuscrite(m, i++, per, dejaDecl)));
    f.append(ol);
  }

  function feuilleEquipe(f){
    if(theme === 'planchette') return feuilleManuscrite(f);
    const liste = mesMatchs().filter(m => m.semaine === semaine).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', theme === 'tableau' ? 'Plan de match de la semaine'
      : 'Semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const per = periodes.find(p => p.fin >= AUJ);
    const dejaDecl = per && declaration(equipe, per.num);
    // Matchs en retard des semaines passées : rappelés en haut de la semaine en cours.
    if(semaine === lundi(AUJ)){
      const retards = mesMatchs().filter(m => !m.joue && m.date < semaine).sort((a, b) => a.date.localeCompare(b.date));
      if(retards.length){
        const bloc = el('div', 'ce-retards');
        bloc.append(el('h4', null, `À rattraper (${retards.length})`));
        const g = el('div', 'ce-matchs');
        retards.forEach((m, i) => g.append(aimantMatch(m, i, per, dejaDecl)));
        bloc.append(g);
        f.append(bloc);
      }
    }
    if(!liste.length){ f.append(el('p', 'ce-vide', 'Pas de match cette semaine. Repos !')); return; }
    const grille = el('div', 'ce-matchs');
    liste.forEach((m, i) => grille.append(aimantMatch(m, i, per, dejaDecl)));
    f.append(grille);
  }

  function feuilleLigue(f){
    const liste = matchs.filter(m => m.semaine === semaine);
    const dimanche = parse(semaine); dimanche.setDate(dimanche.getDate() + 6);
    f.append(el('h3', 'ce-feuille-titre', theme === 'tableau' ? 'Toute la ligue'
      : 'La ligue — semaine du ' + parse(semaine).getDate() + ' au ' + fMois.format(dimanche)));
    const jours = new Map();
    liste.forEach(m => { if(!jours.has(m.date)) jours.set(m.date, []); jours.get(m.date).push(m); });
    const g = el('div', 'ce-jours');
    let k = 0;
    [...jours].sort().forEach(([date, ms]) => {
      const b = el('div', 'ce-jour-bloc');
      b.append(el('h3', null, fJour.format(parse(date)) + (date === AUJ ? ' · aujourd’hui' : '')));
      ms.forEach(m => {
        const l = el('div', 'ce-ligne-match' + (equipe && (m.v === equipe || m.d === equipe) ? ' is-mien' : ''));
        l.style.setProperty('--i', k++);
        const sv = el('span', 's' + (m.joue && m.bv > m.bd ? ' g' : ''), m.joue ? String(m.bv) : '');
        const sd = el('span', 's' + (m.joue && m.bd > m.bv ? ' g' : ''), m.joue ? String(m.bd) : '');
        const dv = declaration(m.v, m.periode), dd = declaration(m.d, m.periode);
        l.append(logo(m.v), el('span', 'n', nom(m.v)), sv, el('span', 'a', m.joue ? '' : '@'), sd, el('span', 'n r', nom(m.d)), logo(m.d));
        if((dv && String(dv.match) === m.num) || (dd && String(dd.match) === m.num)) l.title = '2e gardien : ' + [dv && String(dv.match) === m.num ? nom(m.v) : '', dd && String(dd.match) === m.num ? nom(m.d) : ''].filter(Boolean).join(', ');
        b.append(l);
      });
      g.append(b);
    });
    if(!liste.length) g.append(el('p', 'ce-vide', 'Aucun match cette semaine.'));
    f.append(g);
  }

  // Aperçu : à gauche le tableau indicateur et le 2e gardien ; à droite le babillard.
  function rendreDroite(){
    $('gauche').replaceChildren(carteForme(), carteGardien());
    const d = $('droite');
    const attente = el('div', 'ce-babillard'); attente.append(el('p', 'ce-vide', 'On punaise les annonces…'));
    d.replaceChildren(attente);
    carteAnnonces().then(c => attente.replaceWith(c)).catch(() => attente.remove());
  }

  /* ---------- 2e gardien : le demi-cercle du gardien, sur la glace ---------- */
  function carteGardien(){
    const c = el('section', 'ce-creuse');
    const per = periodes.find(p => p.fin >= AUJ) || periodes[periodes.length - 1];
    if(!per){ c.append(el('p', null, 'Aucune période.')); return c; }
    const total = Math.max(1, ecartJours(per.debut, per.fin) + 1), passe = Math.min(total, Math.max(0, ecartJours(per.debut, AUJ) + 1));
    const reste = Math.max(0, ecartJours(AUJ, per.fin));
    // Horloge de période (style tableau d'aréna).
    const tete = el('header', 'ce-creuse-tete');
    const titre = el('div'); titre.append(el('b', null, '2e gardien'), el('small', null, fMois.format(parse(per.debut)) + ' → ' + fMois.format(parse(per.fin))));
    const horloge = el('div', 'ce-horloge');
    horloge.append(el('span', 'p', 'PÉR. ' + per.num), el('span', 'j', String(reste).padStart(2, '0')), el('span', 'u', reste === 1 ? 'jour' : 'jours'));
    if(reste <= 3) horloge.classList.add('is-urgent');
    tete.append(titre, horloge);
    const jauge = el('div', 'ce-jauge'); const rempli = el('span'); rempli.style.width = (100 * passe / total) + '%'; jauge.append(rempli);
    // La glace : ligne des buts, demi-cercle bleu, filet ; le masque y est posé si c'est déclaré.
    const glace = el('div', 'ce-glace');
    glace.innerHTML = '<svg class="ce-patinoire" viewBox="0 0 300 120" aria-hidden="true" preserveAspectRatio="xMidYMax meet">'
      + '<line x1="0" y1="112" x2="300" y2="112" stroke="#E03131" stroke-width="3"/>'
      + '<path d="M95 112 A55 55 0 0 1 205 112 Z" fill="#a5d8ff" fill-opacity=".55" stroke="#E03131" stroke-width="2"/>'
      + '<path d="M128 112 V122 M172 112 V122" stroke="#E03131" stroke-width="3"/>'
      + '<rect x="128" y="112" width="44" height="10" fill="url(#filet)"/>'
      + '<defs><pattern id="filet" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0 L5 5 M5 0 L0 5" stroke="#868e96" stroke-width=".7"/></pattern></defs></svg>';
    const dcl = declaration(equipe, per.num);
    const statut = el('div', 'ce-creuse-statut');
    if(dcl){
      const m = matchs.find(x => x.num === String(dcl.match));
      const mq = masque('ce-masque ce-masque-glace'); glace.append(mq);
      statut.classList.add('is-fait');
      statut.append(el('b', null, (dcl.simulee ? 'Déclaré (simulation)' : 'Déclaré') + ' ✔'),
        el('small', null, m ? fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' + nom(m.d) : 'vs ' + nom(m.v)) : 'Match nº ' + dcl.match));
    }else if(estDG()){
      const mq = masque('ce-masque ce-masque-glace is-pret');
      mq.setAttribute('role', 'button'); mq.setAttribute('tabindex', '0'); mq.setAttribute('aria-label', 'Glisser le masque sur un match pour déclarer le 2e gardien');
      brancherGlisser(mq, per);
      glace.append(mq);
      statut.classList.toggle('is-urgent', reste <= 3);
      statut.append(el('b', null, 'À déclarer'), el('small', null, 'Glisse le masque sur un match encadré en vert.'));
    }else{
      statut.classList.toggle('is-urgent', reste <= 3);
      statut.append(el('b', null, 'Pas encore déclaré'), el('small', null, 'Le DG le déclare en mode DG.'));
    }
    const faites = [...EQUIPES.keys()].filter(code => declaration(code, per.num)).length;
    const ligue = el('p', 'ce-creuse-ligue'); ligue.append(el('b', null, faites + '/' + EQUIPES.size), document.createTextNode(' équipes ont déclaré'));
    c.append(tete, jauge, glace, statut, ligue);
    return c;
  }

  /* ---------- Fiche : le tableau indicateur de l'aréna ---------- */
  function carteForme(){
    const c = el('section', 'ce-indicateur');
    const t = classement.find(x => x.code === equipe) || { v: 0, d: 0, dp: 0, pts: 0, pj: 0, bp: 0, bc: 0 };
    const tete = el('header');
    tete.append(logo(equipe), el('span', null, nom(equipe).toUpperCase()));
    const div = R.CONFERENCES.flatMap(cf => cf.divisions).find(dv => dv.equipes.includes(equipe));
    const rang = div ? R.classement(resultats, div.equipes).findIndex(x => x.code === equipe) + 1 : 0;
    const joues = mesMatchs().filter(m => m.joue).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num));
    let serie = 0, type = '';
    for(let i = joues.length - 1; i >= 0; i--){ const r = resultatPour(joues[i]) === 'v' ? 'V' : 'D'; if(!type) type = r; if(r !== type) break; serie++; }
    const pj = Math.max(1, t.pj);
    const cases = el('div', 'ce-led-grille');
    const caseLed = (lib, val, cls) => { const d = el('div', 'ce-led-case' + (cls ? ' ' + cls : '')); d.append(el('span', 'ce-led', String(val)), el('small', null, lib)); cases.append(d); };
    caseLed('V', t.v, 'is-grand'); caseLed('D', t.d, 'is-grand'); caseLed('DP', t.dp, 'is-grand'); caseLed('PTS', t.pts, 'is-grand is-rouge');
    caseLed(div ? 'Rang div.' : 'Rang', rang ? rang + (rang === 1 ? 'er' : 'e') : '–');
    caseLed('Série', serie ? type + serie : '–');
    caseLed('BP / m', (t.bp / pj).toFixed(1));
    caseLed('BC / m', (t.bc / pj).toFixed(1));
    const lampes = el('div', 'ce-lampes');
    joues.slice(-10).forEach((m, i) => { const r = resultatPour(m); const l = el('i', r); l.style.setProperty('--i', i); l.title = fCourt.format(parse(m.date)) + ' · ' + (r === 'v' ? 'victoire' : r === 'p' ? 'défaite en prol.' : 'défaite'); lampes.append(l); });
    c.append(tete, cases, el('small', 'ce-lampes-titre', '10 derniers matchs'), lampes);
    return c;
  }

  /* ---------- Glisser le masque sur un match (2e gardien) ---------- */
  function brancherGlisser(m, per){
    let fantome = null, cible = null;
    const cibles = () => [...document.querySelectorAll('.est-cible')];
    m.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if(!cibles().length){ toast('Aucun de tes matchs de la période ' + per.num + ' n’est dans cette semaine : change de semaine.'); return; }
      cibles().forEach(c => c.classList.add('is-cible'));
      fantome = masque('ce-masque is-glisse');
      document.body.append(fantome);
      bouger(ev);
      m.style.opacity = '0.25';
      window.addEventListener('pointermove', bouger);
      window.addEventListener('pointerup', lacher, { once: true });
    });
    m.addEventListener('keydown', ev => {
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault();
      const c = cibles()[0];
      if(c) declarer(c.dataset.num, per); else toast('Aucun de tes matchs de la période dans cette semaine.');
    });
    function bouger(ev){
      fantome.style.left = (ev.clientX - 34) + 'px'; fantome.style.top = (ev.clientY - 34) + 'px';
      const sous = document.elementFromPoint(ev.clientX, ev.clientY);
      const c = sous && sous.closest('.est-cible');
      if(c !== cible){ if(cible) cible.classList.remove('is-survol'); cible = c; if(cible) cible.classList.add('is-survol'); }
    }
    function lacher(){
      window.removeEventListener('pointermove', bouger);
      m.style.opacity = '';
      document.querySelectorAll('.is-cible, .is-survol').forEach(c => c.classList.remove('is-cible', 'is-survol'));
      if(cible){
        // Le masque « vole » jusqu'au coin du match.
        const r = cible.getBoundingClientRect();
        fantome.animate([{ left: fantome.style.left, top: fantome.style.top }, { left: (r.left + 6) + 'px', top: (r.top + 6) + 'px', transform: 'scale(.6) rotate(0deg)' }], { duration: 280, easing: 'cubic-bezier(.3,1.4,.5,1)' })
          .finished.then(() => { fantome.remove(); declarer(cible.dataset.num, per); cible = null; });
      }else{ fantome.remove(); }
    }
  }

  const SANS_FONCE = ['BOS_19341935-19391940', 'BOS_19401941-19471948', 'BOS_19481949', 'BOS_19491950-19941995', 'NYI_20102011-20162017', 'WSH_19951996-20062007'];
  const logoEpoque = (code, annee, fonce) => {
    const l = (LOGOS_LNH[code] || []).find(x => annee >= x[1] && annee <= x[2]);
    if(!l) return fonce ? 'Logos/lnh/fonce/' + code + '.svg' : logoSrc(code);
    return 'Logos/lnh/' + (fonce && !SANS_FONCE.includes(l[0]) ? 'fonce/' : '') + l[0] + '.svg';
  };
  function chandailEpoque(code, annee){
    const e = (EPOQUES[code] || []).find(x => annee >= x[0] && annee <= x[1]);
    const [corps, bandes, ligne] = e ? e.slice(2, 5) : CHANDAILS[code] || ['#1b1f24', '#FFFFFF', '#1b1f24'];
    const motif = e ? e[5] : MOTIFS[code] || MOTIF_PHOTO, teinte = { a: corps, b: bandes, c: ligne };
    return { corps, bandes, ligne, motif, logo: logoEpoque(code, annee, luminance(corps) < 150),
      poitrine: motif.p ? [motif.p[0], motif.p[1], teinte[motif.p[2]], teinte[motif.p[3]]] : null };
  }

  const epoquesDe = code => [...(LOGOS_LNH[code] || []).map(l => [l[1], (l[1] - 1) + '-' + (l[2] === l[1] ? String(l[2]).slice(2) : l[2])]), [ANNEE_ACTUELLE, 'Aujourd’hui']];
  // Maquette : le choix du DG est gardé sur cet appareil (la vraie version l'enregistrera dans le Sheet).
  // { retire: n° dans RETIRES (-1 = personnalisé), joueur, numero, annee, vue: 'face' | 'dos' }. Les couleurs sont toujours celles du vrai
  // chandail de l'époque (celles d'anciennes sauvegardes sont ignorées).
  const cleChandail = c => 'bureau_chandail_' + c;
  function chandailDe(code){
    let perso = {};
    try{ perso = JSON.parse(localStorage.getItem(cleChandail(code)) || '{}') || {}; }catch(e){}
    if(perso.joueur != null && perso.retire == null) perso.retire = -1;   // ancien format : nom et numéro libres
    const liste = RETIRES[code] || [], r = perso.retire >= 0 ? liste[perso.retire] : perso.retire == null ? liste[0] : null;
    const annee = r ? milieuCarriere(r) : Number(perso.annee) || ANNEE_ACTUELLE;
    // Vue : de dos (nom et numéro) par défaut pour un joueur retiré, de face (logo) sinon.
    const vue = VUES_CHANDAIL[perso.vue] ? perso.vue : r ? 'dos' : 'face';
    return Object.assign(chandailEpoque(code, annee), { retire: r ? liste.indexOf(r) : -1, joueur: r ? r[0] : perso.joueur || '', numero: r ? r[1] : perso.numero || '', annee, vue });

          const dedans = (iy < 213.5 ? palette[motif.col] : palette.a).map((c, k) => c * (iy < 213.5 ? 0.75 : 0.5 + 0.15 * lisse(214, 236, iy)) * ombre * chaud[k] + lustre * 0.5);
          tissuRgb = tissuRgb.map((c, k) => c * (1 - ouvert) + dedans[k] * ouvert);
        }
        rgb = m >= w ? tissuRgb : tissuRgb.map((c, k) => (c * m + d[i * 4 + k] * (w - m)) / w);
      }else{
        const sin = Math.max(-1, Math.min(1, (ix - s.logo.cx) / s.logo.rayon)), phi = Math.asin(sin), cosA = Math.cos(phi);
        const yH = s.haut[0] + s.haut[1] * cosA, yB = s.bas[0] + s.bas[1] * cosA;
        const corps = Math.abs((ix - s.logo.cx) / s.logo.rayon) < 1 && iy > yH && iy < yB;
        if(!corps && !dansPoly(s.anse, ix, iy)) continue;
        // Bords adoucis sur un pixel ; l'anse laisse voir le bois clair à travers (exclu par sa clarté).
        w = corps ? lisse(0, 1.2, iy - yH) * lisse(0, 1.2, yB - iy) * (1 - lisse(0.96, 1, Math.abs(sin))) : 1 - lisse(20, 38, L[i]);
        if(w < 0.02) continue;
        const diffus = corps ? (0.3 + 0.55 * Math.max(0, Math.cos(phi - 0.45))) * Math.pow(cosA, 0.3) : 0.5;
        const spec = Math.min(1, Math.max(0, L[i] - 8) / 75) * (corps ? 1 : 0.5);
        rgb = tasseC.map((c, k) => { const b = c * diffus * chaud[k]; return b + (255 - b) * spec; });
      }
      o[i * 4] = rgb[0]; o[i * 4 + 1] = rgb[1]; o[i * 4 + 2] = rgb[2]; o[i * 4 + 3] = w * 255;
    }
    // Pose une couleur (alpha a) par-dessus ce qui est déjà peint.
    const poser = (i, rgb, a) => {
      const fa = o[i * 4 + 3] / 255, na = a + fa * (1 - a);
      for(let k = 0; k < 3; k++) o[i * 4 + k] = (rgb[k] * a + o[i * 4 + k] * fa * (1 - a)) / (na || 1);
      o[i * 4 + 3] = na * 255;
    };
    const l = s.logo, x0 = Math.max(0, Math.floor((l.cx - l.larg / 2 - zx - 4) * K)), x1 = Math.min(W, Math.ceil((l.cx + l.larg / 2 - zx + 4) * K));
    const y0 = Math.max(0, Math.floor((l.cy - l.haut / 2 - zy - 6) * K)), y1 = Math.min(H, Math.ceil((l.cy + l.haut / 2 - zy + 6) * K));
    // Tissu : brodé (bord éclairé en haut, ombré en bas), ombre douce sur le tissu, trame ; les plis le décalent.
    const broder = (i, px, py, img, u, v, cx) => {
      const pli = Math.min(1.35, Math.max(0.7, fin[i] / (large[i] || 1)));
      const gx = px > 0 && px < W - 1 ? (fin[i + 1] - fin[i - 1]) / (large[i] || 1) : 0, gy = py > 0 && py < H - 1 ? (fin[i + W] - fin[i - W]) / (large[i] || 1) : 0;
      u += gx * 2.5 * K * cx; v += gy * 2.5 * K;
      const p = echantillon(img, u, v);
      // Même éclairage que le tissu (rapport au gris moyen) : les plis et les ombres passent sur l'écusson.
      let lum = 0.84 * Math.pow(Math.min(1.45, Math.max(0.3, L[i] / gris)), 0.85) * Math.pow(pli, 0.6);
      lum *= (1 - 0.15 * (echantillon(img, u, v - 0.8 * K)[3] - echantillon(img, u, v + 0.8 * K)[3])) * (1 + 0.04 * Math.sin((px + py) * 2.1));
      const ombre = echantillon(img, u - 0.4 * K, v - 1.2 * K)[3] * 0.25;
      if(p[3] < ombre) poser(i, [0, 0, 0], ombre - p[3]);
      if(p[3] > 0) poser(i, terne(p.slice(0, 3)).map((c, k) => Math.min(255, c * lum * chaud[k])), p[3]);
    };
    // 2. Le logo (et « LNHQ » sur la tasse) ; pas de logo au dos.
    if(!dos) for(let py = y0; py < y1; py++) for(let px = x0; px < x1; px++){
      const i = py * W + px, ix = zx + px / K, iy = zy + py / K;
      if(tissu){ broder(i, px, py, plat, (ix - l.cx + l.larg / 2) * K, (iy - l.cy + l.haut / 2) * K, 1); continue; }
      // Cylindre vu un peu de haut : x = axe + r·sin φ ; les lignes du logo s'arrondissent (b = 12 % du rayon).
      const sin = (ix - l.cx) / l.rayon;
      if(Math.abs(sin) > 0.97) continue;
      const phi = Math.asin(sin), cos = Math.cos(phi);
      const p = echantillon(plat, (phi * l.rayon + l.larg / 2) * K, (iy - l.cy + l.rayon * 0.12 * (1 - cos) + l.haut / 2) * K);
      if(p[3] <= 0) continue;
      // Lumière diffuse de l'avant-droite, bords assombris ; les reflets de la céramique passent par-dessus.
      const lum = (0.24 + 0.56 * Math.max(0, Math.cos(phi - 0.45))) * Math.pow(cos, 0.6), spec = Math.min(1, Math.max(0, fin[i] - 10) / 90);
      poser(i, p.slice(0, 3).map((c, k) => { const b = Math.min(255, c * lum * [1, 0.9, 0.76][k]); return b + (255 - b) * spec; }), p[3]);
    }
    // 3. Le numéro du chandail retiré sur les manches ; au dos, le nom et le grand numéro.
    const coudre = (img, m) => {
      const wN = img.width / K, hN = img.height / K;
      for(let py = Math.floor((m.cy - hN / 2 - zy - 2) * K); py < Math.ceil((m.cy + hN / 2 - zy + 2) * K); py++)
        for(let px = Math.floor((m.cx - wN * m.ecrase / 2 - zx - 2) * K); px < Math.ceil((m.cx + wN * m.ecrase / 2 - zx + 2) * K); px++){
          if(px < 0 || py < 0 || px >= W || py >= H) continue;
          const ix = zx + px / K, iy = zy + py / K;
          broder(py * W + px, px, py, img, ((ix - m.cx) / m.ecrase + wN / 2) * K, (iy - m.cy + hN / 2) * K, 1 / m.ecrase);
        }
    };
    numeros.forEach((img, n) => coudre(img, manches[n]));
    if(nomPlat) coudre(nomPlat.img, { cx: s.dos.nom.cx, cy: posNom.haut - nomPlat.haut + nomPlat.img.height / K / 2, ecrase: 1 });
    if(imgNumero) coudre(imgNumero, posNumero);
    const c = Object.assign(document.createElement('canvas'), { width: W, height: H });
    c.getContext('2d').putImageData(out, 0, 0);
    box.replaceChildren(c);
    if(tissu && !cible) plaqueRetire(ch);
  }
  // Aperçu des chandails pour valider couleurs, motifs et logos d'un coup d'œil : ?chandails=1 (le chandail affiché de chaque
  // équipe), ?chandails=actuels (les chandails d'aujourd'hui), ?chandails=tous (chaque joueur retiré, dans son chandail d'époque),
  // ?chandails=dos (les mêmes, de dos).
  async function apercuDesChandails(sorte){
    const fond = el('div', 'ch-apercu'), grille = el('div', 'ch-grille');
    fond.append(el('h2', null, sorte === 'tous' ? 'Tous les chandails retirés' : sorte === 'dos' ? 'Tous les chandails retirés, de dos' : sorte === 'actuels' ? 'Chandails actuels des 32 équipes' : 'Chandail du cadre de chaque équipe'), grille);
    const [zx, zy, zw, zh] = SURFACES['o-ecusson'].zone;
    const cartes = [];
    [...EQUIPES.keys()].sort().forEach(code => {
      const liste = sorte === 'tous' || sorte === 'dos' ? (RETIRES[code] || []).map(r => Object.assign(chandailEpoque(code, milieuCarriere(r)), { joueur: r[0], numero: r[1], annee: milieuCarriere(r), vue: sorte === 'dos' ? 'dos' : 'face' }))
        : sorte === 'actuels' ? [Object.assign(chandailEpoque(code, ANNEE_ACTUELLE), { joueur: '', numero: '', annee: ANNEE_ACTUELLE })] : [chandailDe(code)];
      liste.forEach(ch => cartes.push([code, ch]));
    });
    for(const [code, ch] of cartes){
      const carte = el('figure', 'ch-carte'), cadre = el('div', 'ch-cadre'), toile = el('div');
      cadre.style.aspectRatio = zw + ' / ' + zh;
      cadre.style.backgroundImage = `url("${FOND}")`;
      cadre.style.backgroundSize = (1672 / zw * 100) + '% auto';
      cadre.style.backgroundPosition = (zx / (1672 - zw) * 100) + '% ' + (zy / (941 - zh) * 100) + '%';
      cadre.append(toile);
      carte.append(cadre, el('figcaption', null, code + (ch.joueur ? ' · ' + ch.joueur + ' ' + ch.numero + ' · ' + (ch.annee - 1) + '-' + ch.annee : ' · ' + nom(code))));
      grille.append(carte);
    }
    document.body.append(fond);
    // Un à la fois : 150 chandails peints en même temps figeraient la page.
    for(let k = 0; k < cartes.length; k++) await sansErreur(peindreSurface('o-ecusson', cartes[k][0], grille.children[k].querySelector('.ch-cadre > div'), cartes[k][1]));
    fond.addEventListener('click', ev => { if(ev.target === fond) fond.remove(); });
  }
  // Plaque gravée au pied du cadre : le chandail retiré.
  function plaqueRetire(ch){
    const p = $('o-plaque');
    p.hidden = !ch.joueur && !ch.numero;
    p.replaceChildren(el('b', null, ch.numero ? 'Nº ' + ch.numero : ''), el('span', null, ch.joueur || ''));
  }

  /* ---------- Enveloppe : la feuille de match ---------- */
  // Le DG y trouve la vraie page de soumission (dg.lnhq.ca/resultat.html) en mode « feuille de match »,
  // avec le match en retard (ou celui de ce soir) déjà choisi.
  function feuilleMatch(){
    const m = retards()[0] || mesMatchs().find(x => !x.joue && x.date === AUJ);
    return ['Feuille de match', DG + 'resultat.html?feuille=1' + (m ? '&match=' + encodeURIComponent(m.num) : '')];
  }
  function apercuEnveloppe(box){
    const ret = estDG() ? retards() : [], pm = prochainMatch();
    box.closest('.bu-enveloppe').classList.toggle('retard', ret.length > 0);
    const versus = m => (m.v === equipe ? '@ ' : 'vs ') + adversaireDe(m);
    const sous = ret.length ? ret.length + ' match' + (ret.length > 1 ? 's' : '') + ' en retard · ' + versus(ret[0]) + ' (' + fMois.format(parse(ret[0].date)) + ')'
      : pm ? (pm.date === AUJ ? 'Ce soir' : fCourt.format(parse(pm.date))) + ' · ' + versus(pm) : '';
    const entete = el('span', 'env-entete');
    entete.append(Object.assign(el('img'), { src: LOGO_LIGUE, alt: '' }), el('span', null, 'LNHQ · Bureau de la ligue'));
    box.replaceChildren(entete, el('span', 'env-titre', estDG() ? 'Soumettre un résultat' : 'Feuille de match'), el('span', 'env-sous', sous));
    if(ret.length) box.append(el('span', 'env-tampon', 'En retard'));
  }
  // Public : la feuille du dernier match joué (les DG seuls soumettent).
  function zoomEnveloppe(){
    const dernier = mesMatchs().filter(x => x.joue).sort((a, b) => b.date.localeCompare(a.date) || Number(b.num) - Number(a.num))[0];
    if(dernier && resultats[dernier.num]){ matchZoom = dernier.num; return zoomMatch(); }
    return zoomConsole();
  }

  /* ---------- Écriteau : le nom du DG gravé dans le laiton ---------- */
  function apercuEcriteau(box){
    // La gravure rapetisse pour que le nom entier tienne sur la plaque (lettres capitales de Cinzel ≈ 0,72 em).
    const graver = dg => {
      const n = el('span', 'ecr-nom', dg || nom(equipe));
      n.style.fontSize = Math.min(0.86, 7.2 / (n.textContent.length * 0.72)).toFixed(3) + 'cqw';
      const blason = cote => Object.assign(el('img', 'ecr-blason ' + cote), { src: LOGO_LIGUE, alt: '' });
      box.replaceChildren(blason('g'), n, el('span', 'ecr-role', dg ? 'Directeur général · ' + nom(equipe) : 'Bureau du directeur général'), blason('d'));
    };
    graver('');
    unefois('dgs', () => gvizTable('sheet=DGs')).then(tab => {
      const c = cellules(tab).find(l => String(l[2] || '').trim().toUpperCase() === equipe) || [];
      graver(String(c[4] || '').trim());
    }).catch(() => {});
  }

  /* ---------- Journal : La Gazette LNHQ (rumeurs et marché des échanges) ----------
     Marché : onglet MARCHE (rempli par chaque DG sur dg.lnhq.ca/marche.html), lu par marche-donnees.js.
     Tant qu'aucune équipe n'a rien inscrit, la Gazette montre un exemple fictif (bien identifié). */
  const M = window.LNHQ_MARCHE;
  const RECHERCHES_EXEMPLE = [
    { pos: 'DD', role: 'top', ovMin: 80, n: '' }, { pos: 'C', style: 'fabricant', ageMax: 28, n: '' }, { pos: 'G', role: 'partant', ovMin: 82, n: 'Notre gardien se blesse trop souvent.' },
    { pos: 'AG', style: 'marqueur', contrat: 'expirant', n: '' }, { pos: 'CHOIX', n: 'Un choix de 1re ronde 2027' }, { pos: 'D', style: 'robuste', contrat: 'bas', n: '' },
    { pos: 'AD', role: 'top', tir: 'D', n: 'Pour compléter le 1er trio.' }, { pos: 'A', role: 'profondeur', contrat: 'bas', n: '' },
  ].map(r => Object.assign({ pos: '', role: '', style: '', tir: '', ovMin: 0, ageMax: 0, contrat: '', n: '' }, r));
  function exempleMarche(joueurs){
    const m = new Map(), rang = new Map(classement.map((t, i) => [t.code, i]));
    [...EQUIPES.keys()].filter(c => graine(c + 'gz') % 5 < 2).forEach(c => {
      const liste = joueurs.filter(j => j.equipe === c && !j.choix && !j.espoir).sort((a, b) => b.ov - a.ov);
      if(liste.length < 12) return;
      const g = graine(c + 'marche');
      const dispo = [liste[3 + g % 6], liste[9 + g % Math.max(1, liste.length - 10)]].filter(Boolean);
      const r = rang.get(c) ?? 16;
      m.set(c, { code: c, posture: r > 20 ? 'vendeur' : r < 8 ? 'acheteur' : 'neutre', note: '',
        disponibles: dispo.slice(0, 1 + g % 2).map((j, k) => ({ j: j.id, n: k ? '' : ['Ouvert à toute offre', 'Contre un choix de 1re ronde', 'Pour libérer de l’espace', ''][g % 4] })),
        recherches: [RECHERCHES_EXEMPLE[g % RECHERCHES_EXEMPLE.length]] });
    });
    return m;
  }
  const chargerGazette = () => unefois('gazette', async () => {
    const [marche, joueurs] = await Promise.all([M.chargerMarche(), M.chargerJoueurs()]);
    const parId = new Map(joueurs.filter(j => EQUIPES.has(j.equipe)).map(j => [j.id, j]));
    const exemple = !marche.size;
    return { marche: exemple ? exempleMarche([...parId.values()]) : marche, parId, exemple };
  });
  const rumeursDu = d => M.rumeurs(d.marche, d.parId, { nom, jour: AUJ, classement });
  const photoUne = async (j, cible, logoCode) => {
    const img = el('img');
    img.alt = '';
    if(j && !j.choix){
      const id = (await idsLnh([j.id])).get(j.id);
      if(id){ img.src = photoJoueur(id); img.onerror = () => { img.className = 'logo'; img.src = logoSrc(j.equipe); }; cible.replaceChildren(img); return; }
    }
    img.className = 'logo'; img.src = logoSrc(logoCode || equipe); cible.replaceChildren(img);
  };
  async function apercuJournal(){
    $('o-jr-titre').replaceChildren(document.createTextNode('La Gazette LNHQ'));
    const d = await chargerGazette(), r = rumeursDu(d)[0];
    $('o-jr-une').replaceChildren(el('span', null, r ? r.titre : 'Le marché est calme'));
    photoUne(r && r.joueur, $('o-jr-photo'), r ? r.equipes[0] : equipe);
  }

  function zoomJournal(){
    const page = el('article', 'gz');
    const tete = el('header', 'gz-tete');
    const jour = parse(AUJ).toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    tete.append(el('div', 'gz-filet', 'Édition du ' + jour), el('h2', 'gz-titre', 'La Gazette LNHQ'), el('div', 'gz-filet', 'Rumeurs · Marché des échanges · Le journal des DG'));
    const corps = el('div', 'gz-corps');
    corps.append(el('p', 'ce-vide', 'Impression en cours…'));
    page.append(tete, corps);
    chargerGazette().then(d => remplirGazette(corps, d)).catch(e => { console.warn(e); corps.replaceChildren(el('p', 'ce-vide', 'La Gazette n’a pas été livrée ce matin. Réessaie plus tard.')); });
    return [page];
  }
  function remplirGazette(corps, d){
    const rum = rumeursDu(d), blocs = [];
    if(d.exemple) blocs.push(el('p', 'gz-fictif', 'Exemple fictif : aucune équipe n’a encore inscrit son marché. Chaque DG le remplit depuis son Espace DG, et les rumeurs s’écrivent toutes seules.'));
    // Le DG : son propre marché, et le bouton pour le mettre à jour.
    if(estDG()){
      const mien = d.exemple ? null : d.marche.get(equipe);
      const b = el('div', 'gz-mien');
      b.append(el('span', null, mien ? `Ton marché : ${mien.disponibles.length} joueur${mien.disponibles.length > 1 ? 's' : ''} disponible${mien.disponibles.length > 1 ? 's' : ''} · ${mien.recherches.length} recherché${mien.recherches.length > 1 ? 's' : ''}` : 'Tu n’as encore rien inscrit sur le marché.'));
      const maj = el('button', 'ce-bouton is-principal', 'Mettre à jour mon marché'); maj.type = 'button';
      maj.addEventListener('click', () => ouvrirZoom('ordinateur', maj, ['Marché des échanges', DG + 'marche.html']));
      b.append(maj);
      blocs.push(b);
    }
    // La une.
    if(rum[0]){
      const une = el('section', 'gz-une'), fig = el('figure', 'gz-photo'), txt = el('div');
      photoUne(rum[0].joueur, fig, rum[0].equipes[0]);
      const logos = el('div', 'gz-logos'); rum[0].equipes.forEach(c => logos.append(logo(c)));
      txt.append(el('span', 'gz-rubrique', 'Rumeur du jour'), el('h3', null, rum[0].titre), el('p', 'gz-chapeau', rum[0].texte), logos);
      une.append(fig, txt);
      blocs.push(une);
    }else blocs.push(el('p', 'ce-vide', 'Aucune rumeur pour l’instant : le marché est calme.'));
    // Les autres rumeurs, en colonnes de journal.
    if(rum.length > 1){
      const col = el('section', 'gz-rumeurs');
      col.append(el('h3', 'gz-section', 'Dans les coulisses'));
      rum.slice(1, 9).forEach(r => { const a = el('div', 'gz-breve'); a.append(el('h4', null, r.titre), el('p', null, r.texte)); col.append(a); });
      blocs.push(col);
    }
    // Mariages possibles : ce qu'une équipe cherche, une autre l'offre.
    const mar = M.mariages(d.marche, d.parId).slice(0, 6);
    if(mar.length){
      const s = el('section', 'gz-mariages');
      s.append(el('h3', 'gz-section', 'Mariages possibles'));
      mar.forEach(x => {
        const l = el('div', 'gz-mariage');
        l.append(logo(x.vendeur), el('span', 'gz-fleche', '→'), logo(x.acheteur));
        const t = el('span'); t.append(el('b', null, x.joueur.choix ? x.joueur.nom : x.joueur.nom + ' (' + M.poCourt(x.joueur.po) + ', ' + x.joueur.ov + ')'), document.createTextNode(` · ${nom(x.acheteur)} cherche : ${M.decrire(x.recherche, true)}`));
        l.append(t); s.append(l);
      });
      blocs.push(s);
    }
    // Le marché, équipe par équipe : disponibles et recherchés.
    const marche = el('section', 'gz-marche');
    marche.append(el('h3', 'gz-section', 'Le marché des échanges'));
    const grille = el('div', 'gz-equipes');
    [...d.marche.values()].sort((a, b) => nom(a.code).localeCompare(nom(b.code), 'fr')).forEach(e => {
      const c = el('div', 'gz-equipe' + (e.code === equipe ? ' mienne' : ''));
      const h = el('h4'); h.append(logo(e.code), el('span', null, nom(e.code)));
      if(e.posture) h.append(el('em', 'gz-posture ' + e.posture, M.libelle('posture', e.posture)));
      c.append(h);
      if(e.note) c.append(el('p', 'gz-note', '« ' + e.note + ' »'));
      if(e.disponibles.length){
        const ul = el('ul', 'gz-dispo');
        e.disponibles.forEach(x => {
          const j = d.parId.get(x.j), li = el('li');
          if(!j || j.equipe !== e.code) return;   // joueur parti depuis
          li.append(el('b', null, j.choix ? j.nom : j.nom), el('small', null, j.choix ? 'Choix de repêchage' : [M.poCourt(j.po), j.ov + ' OV', j.age + ' ans', M.millions(j.salaire), j.ans ? j.ans + ' an' + (j.ans > 1 ? 's' : '') : ''].filter(Boolean).join(' · ')));
          if(x.n) li.append(el('i', null, x.n));
          ul.append(li);
        });
        c.append(el('span', 'gz-etiquette', 'Disponibles'), ul);
      }
      if(e.recherches.length){
        const ul = el('ul', 'gz-recherche');
        e.recherches.forEach(r => { const li = el('li'); li.append(el('b', null, M.decrire(r))); if(r.n) li.append(el('i', null, r.n)); ul.append(li); });
        c.append(el('span', 'gz-etiquette', 'Recherche'), ul);
      }
      grille.append(c);
    });
    if(!grille.children.length) grille.append(el('p', 'ce-vide', 'Aucune équipe sur le marché pour l’instant.'));
    marche.append(grille);
    blocs.push(marche);
    corps.replaceChildren(...blocs);
  }

  // Surfaces inclinées ou à plat dans l'image : leurs 4 coins (px de l'image, relatifs à leur zone),
  // dans l'ordre haut-gauche, haut-droite, bas-gauche, bas-droite.
  const PERSPECTIVES = {
    'o-depistage': [[2, 8], [201, 3], [20, 131], [229, 116]],     // tablette sur son support
    'o-cellulaire': [[0, 1], [72, 0], [18, 66], [110, 67]],       // téléphone à plat
    'o-align-g': [[163, 7], [346, 4], [42, 114], [315, 114]],     // cartable, page de gauche

    'o-jr-titre': [[23, 16], [189, 12], [25, 30], [194, 25]],     // journal : bandeau du titre
    'o-jr-photo': [[33, 37], [102, 36], [53, 75], [124, 73]],     // journal : photo de la une
    'o-jr-une': [[108, 36], [201, 32], [114, 51], [210, 47]],     // journal : manchette

    'o-cube': [[8, 8], [147, 8], [13, 76], [142, 76]],            // face du cube de pointage, par la fenêtre
  };
  function ajusterPerspectives(){
    const scene = $('scene');
    if(scene.hidden) return;
    const k = scene.clientWidth / 1672;
    Object.entries(PERSPECTIVES).forEach(([id, coins]) => {
      const n = $(id), w = n && n.offsetWidth, h = n && n.offsetHeight;
      if(!w || !h) return;
      const [[x0, y0], [x1, y1], [x3, y3], [x2, y2]] = coins.map(([x, y]) => [x * k, y * k]);
      // Homographie du carré unité vers le quadrilatère (0,0)→p0, (1,0)→p1, (1,1)→p2, (0,1)→p3.
      const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
      const den = dx1 * dy2 - dx2 * dy1;
      const g = (dx3 * dy2 - dx2 * dy3) / den, hh = (dx1 * dy3 - dx3 * dy1) / den;
      const a = x1 - x0 + g * x1, b = x3 - x0 + hh * x3, d = y1 - y0 + g * y1, e = y3 - y0 + hh * y3;
      n.style.transform = `matrix3d(${a / w},${d / w},0,${g / w},${b / h},${e / h},0,${hh / h},0,0,1,0,${x0},${y0},0,1)`;
    });
  }
  new ResizeObserver(() => { ajusterPerspectives(); ajusterNoms(); }).observe($('scene'));

  // Données de l'équipe : stats de la saison, joueurs sous contrat, espace sous le plafond.
  const chargerStats = () => unefois('stats', () => window.LNHQ_STATS_JOUEUR.charger());
  const chargerEspaces = () => unefois('espaces', () => LNHQ_ENCHERES.espacesPlafond().catch(() => ({})));
  const nombre = v => Number(String(v == null ? '' : v).replace(',', '.')) || 0;
  const nomCourt = n => { const v = n.indexOf(','); return v > 0 ? n.slice(v + 1).trim().charAt(0) + '. ' + n.slice(0, v).trim() : n; };
  const famille = n => { const v = n.indexOf(','); return v > 0 ? n.slice(0, v).trim() : n; };
  async function statsEquipe(){
    const { stats } = await chargerStats();
    const l = [...stats.values()].filter(j => j.equipe === equipe);
    return {
      patineurs: l.filter(j => !j.gardien).sort((a, b) => nombre(b.p) - nombre(a.p) || nombre(b.b) - nombre(a.b)),
      gardiens: l.filter(j => j.gardien).sort((a, b) => nombre(b.pj) - nombre(a.pj)),
    };
  }
  async function contratsEquipe(){
    const [joueurs, espaces] = await Promise.all([tousLesJoueurs(), chargerEspaces()]);
    const miens = joueurs.filter(j => j.equipe === equipe);
    const masse = miens.filter(j => !j.espoir).reduce((s, j) => s + j.salaire, 0);
    const espace = espaces[equipe] != null ? espaces[equipe] : null;
    return { miens, masse, espace, plafond: espace != null ? masse + espace : null };
  }

  // Règlements (onglet REGLEMENTS : A section, B titre, C texte, D visible). Les annexes A et B
  // donnent les paramètres et les dates importantes en lignes « **Libellé :** valeur ».
  const chargerReglements = () => unefois('reglements', async () => {
    const t = await gvizTable('sheet=REGLEMENTS');
    const articles = cellules(t).map(l => ({ section: l[0].trim(), titre: l[1].trim(), texte: l[2], visible: !/^(false|faux|non)$/i.test(l[3] || '') }))
      .filter(a => a.visible && a.section && (a.titre || a.texte));
    const annexe = lettre => {
      const a = articles.find(x => new RegExp('^ANNEXE ' + lettre + '\\b', 'i').test(x.section));
      return a ? [...a.texte.matchAll(/\*\*(.+?)\s*:\s*\*\*\s*(.+)/g)].map(m => ({ libelle: m[1].trim(), valeur: m[2].trim() })) : [];
    };
    return { articles: articles.filter(a => a.titre), parametres: annexe('A'), dates: annexe('B') };
  });
  // « 1er mars 2027 (22h) » → Date ; « À VENIR » → null.
  function dateFr(t){
    const m = /(\d{1,2})(?:er)?\s+([a-zéû]+)\s+(\d{4})/i.exec(t || '');
    const mois = m ? NOMS_MOIS.indexOf(m[2].toLowerCase()) : -1;
    return mois < 0 ? null : new Date(Number(m[3]), mois, Number(m[1]));
  }
  // Dates importantes (annexe B) et fin de la période de matchs en cours, avec le nombre de jours restants.
  async function datesImportantes(){
    const { dates } = await chargerReglements().catch(() => ({ dates: [] }));
    const l = dates.map(x => ({ libelle: x.libelle, valeur: x.valeur, date: dateFr(x.valeur) }));
    const per = periodeCourante();
    if(per) l.push({ libelle: 'Fin de la période ' + per.num, valeur: fJour.format(parse(per.fin)), date: parse(per.fin) });
    l.forEach(x => { x.jours = x.date ? ecartJours(AUJ, iso(x.date)) : null; });
    return l;
  }
  const dansJours = j => j === 0 ? 'aujourd’hui' : j === 1 ? 'demain' : 'dans ' + j + ' j';

  // Cube de pointage de l'aréna : le bouclier et la saison en cours.
  function apercuCube(box){

  // Bandeau DEL : les 5 derniers résultats, ou tous ceux de la dernière soirée s'il y en a plus,
  // entrecoupés des annonces (décomptes, dernière annonce). Le contenu est doublé pour boucler sans saut.
  async function apercuDel(box){
    const tous = matchs.filter(m => m.joue).sort((a, b) => b.date.localeCompare(a.date) || Number(b.num) - Number(a.num));
    const soiree = tous.length ? tous.filter(m => m.date === tous[0].date).length : 0;
    const joues = tous.slice(0, Math.max(5, soiree)).reverse();
    const d = el('div', 'del-defile');
    const resultat = m => {
      const s = el('span', m.v === equipe || m.d === equipe ? 'mien' : '');
      const gv = m.bv > m.bd;
      const cote = (t, g) => g ? el('b', null, t) : document.createTextNode(t);
      const score = el('em'); score.append(cote(m.v + ' ' + m.bv, gv), document.createTextNode(' – '), cote(m.bd + ' ' + m.d, !gv));
      s.append(el('i', null, fMois.format(parse(m.date)).toUpperCase()), score);
      if(m.fin) s.append(el('i', null, R.FINS[m.fin] || m.fin));
      return s;
    };
    const dessiner = annonces => {
      const items = [];
      const pas = Math.max(2, Math.ceil(joues.length / Math.max(1, annonces.length)));
      joues.forEach((m, i) => { if(i % pas === 0 && annonces[i / pas]) items.push(annonces[i / pas]); items.push(m); });
      annonces.slice(Math.ceil(joues.length / pas)).forEach(a => items.push(a));
      if(!items.length) items.push('LNHQ · la saison commence bientôt');

      const rendu = () => items.flatMap(x => [Object.assign(el('img', 'del-logo'), { src: LOGO_LIGUE, alt: '' }), typeof x === 'string' ? el('span', 'annonce', x) : resultat(x)]);
      d.replaceChildren(...rendu(), ...rendu());

    box.replaceChildren(d);

    const [dates, [ann]] = await Promise.all([datesImportantes(), chargerFils().catch(() => [[]])]);
    const annonces = dates.filter(x => x.jours != null && x.jours >= 0).sort((a, b) => a.jours - b.jours)
      .map(x => '⏳ ' + x.libelle.toUpperCase() + ' ' + dansJours(x.jours).toUpperCase());

  }

  // Boucle de diapos : une minuterie par écran (remplacée à chaque rendu) ; elle s'arrête au survol.
  // Rend une fonction aller(sens) pour les boutons de page (qui relance la minuterie).
  const minuteries = {};
  function boucler(box, ms, auChangement){
    clearInterval(minuteries[box.id]);
    const diapos = [...box.querySelectorAll('.diapo')];
    if(!diapos.length) return () => {};
    let i = 0;
    const montrer = () => { diapos.forEach((d, k) => d.classList.toggle('actif', k === i)); if(auChangement) auChangement(i, diapos.length); };
    const demarrer = () => {
      clearInterval(minuteries[box.id]);
      if(diapos.length > 1) minuteries[box.id] = setInterval(() => {
        if(!box.isConnected){ clearInterval(minuteries[box.id]); return; }
        if(box.closest('.bu-objet:hover')) return;
        i = (i + 1) % diapos.length; montrer();
      }, ms);
    };
    montrer(); demarrer();
    return sens => { i = (i + sens + diapos.length) % diapos.length; montrer(); demarrer(); };
  }
  // Bouton de page dans un écran : ne doit pas ouvrir le zoom de l'objet.
  const boutonPage = (txt, etiquette, action) => {

  const fiche = x => x ? `${x.v}-${x.d}-${x.dp}` : '0-0-0';
  const rangDe = (liste, code) => liste.findIndex(x => x.code === code) + 1;
  const ordinal = n => n === 1 ? '1er' : n + 'e';
  // Stats d'équipe de la ligue (écrans de fin de match), avec seulement les équipes qui ont joué.
  const dec = (v, n) => v.toFixed(n).replace('.', ',');

    ['Attaque (B/PJ)', 'bpMoy', 1, v => dec(v, 2)],

    ['Avantage num.', 'anPct', 1, v => dec(v, 1) + '%'],
    ['Désavantage', 'dnPct', 1, v => dec(v, 1) + '%'],
    ['Tirs / match', 'tirsMoy', 1, v => dec(v, 1)],
    ['Mises au jeu', 'mjPct', 1, v => dec(v, 1) + '%'],

  // Écran vertical des stats : boucle sur meneurs de la ligue, meneurs de l'équipe, équipes de la ligue, mon équipe.
  async function apercuMeneurs(box){

    const tableauStats = (patineurs, gardiens, avecLogo) => {

        gardiens.forEach(j => { const tr = el('tr'); tr.append(nomJ(j), el('td', null, j.v || '0'), el('td', null, j.moy || '–'), el('td', 'pts', j.parr || '–')); t.append(tr); });

    const { patineurs, gardiens } = await statsEquipe();

    CATS_EQUIPE.forEach(([lib, cle, sens, f]) => {

  function divisionDe(code){ return R.CONFERENCES.flatMap(c => c.divisions).find(d => d.equipes.includes(code)); }

  // Fil de la ligue : annonces, nouvelles et transactions, du plus récent au plus ancien.
  const sansBalises = t => String(t || '').replace(/<[^>]+>/g, ' ').replace(/[*_#>`]+/g, '').replace(/\s+/g, ' ').trim();
  const chargerFilTx = () => unefois('filTx', () => gvizTable('sheet=TRANSACTIONS').catch(() => ({ rows: [] })));
  async function filLigue(){
    const [[ann, nouv], tx] = await Promise.all([chargerFils(), chargerFilTx()]);
    const echanges = cellules(tx).map((l, i) => ({ type: 'transaction', date: dateGviz(tx.rows[i].c[0] && tx.rows[i].c[0].v), titre: l[3],
      details: (() => { try{ return JSON.parse(l[10] || '[]'); }catch(e){ return []; } })() })).filter(x => x.titre);
    return [...ann.map(x => Object.assign({}, x, { type: 'annonce' })), ...nouv.map(x => Object.assign({}, x, { type: 'nouvelle' })), ...echanges]
      .sort((a, b) => (b.date || 0) - (a.date || 0));

  const CATS_FIL = { annonce: ['Annonce', '#e03131'], nouvelle: ['Nouvelle', '#1c7ed6'], transaction: ['Transaction', '#2b8a3e'] };
  // Numéros LNH (onglet IDS_LNH, « Nom, Prénom » → numéro) des joueurs demandés seulement, gardés en mémoire.
  const numerosLnh = new Map();
  async function idsLnh(noms){
    const manquants = [...new Set(noms)].filter(n => !numerosLnh.has(n) && !n.includes('"'));
    if(manquants.length){
      try{
        const t = await gvizTable('sheet=IDS_LNH&tq=' + encodeURIComponent('select A, B where ' + manquants.map(n => `A = "${n}"`).join(' or ')));
        cellules(t).forEach(l => { if(/^\d{6,8}$/.test(l[1])) numerosLnh.set(l[0], l[1]); });

    details.forEach(m => { if(!m.vers) return; if(!parEquipe.has(m.vers)) parEquipe.set(m.vers, []); parEquipe.get(m.vers).push(m); });

  // Directs Twitch de la ligue. Maquette : ?direct=1 simule deux matchs en direct.

        vignette: 'https://static-cdn.jtvnw.net/previews-ttv/live_user_' + c.chaine + '-640x360.jpg' }));
    }
    return live;

  // Grand écran : LNHQ TV. Les matchs en direct sur Twitch ont priorité ; sinon le fil de la ligue en boucle.
  async function apercuTele(box){

    }

    const txAffichees = fil.filter(x => x.type === 'transaction').slice(0, 8);
    const ids = await idsLnh(txAffichees.flatMap(x => x.details.map(m => m.joueur).filter(Boolean)));
    const diapoFil = x => {
      const [lib, coul] = CATS_FIL[x.type];
      const d = el('div', 'diapo tv-nouv');
      const cat = el('span', 'tv-cat', lib); cat.style.setProperty('--cat', coul);

      d.append(cat, el('h4', null, x.titre.replace(/^Transaction\s*:\s*/i, '')));

  // Même taille d'écriture pour tous les noms des deux pages : celle qui fait tenir la plupart des noms
  // (pas sous 0,7 cqw) ; un nom encore trop long à cette taille est écrit un peu plus petit, seul.
  // Recalculé quand la scène change de taille.
  function ajusterNoms(){
    const noms = [...document.querySelectorAll('.bu-page .cart-nom')];
    const besoin = n => {   // taille qui fait tenir ce nom dans sa case (largeur naturelle, 1 px de marge)
      n.style.fontSize = '';
      const dispo = n.clientWidth;
      if(!dispo) return 0.9;
      n.style.width = 'max-content';
      const t = Math.min(0.9, 0.9 * (dispo - 1) / n.offsetWidth);
      n.style.width = '';
      return t;
    };
    const tailles = noms.map(besoin);
    if(!tailles.length) return;
    const commune = Math.max(0.7, Math.min(...tailles));
    noms.forEach((n, k) => { n.style.fontSize = Math.min(commune, tailles[k]).toFixed(3) + 'cqw'; });

  // Grand calendrier mural : le mois de l'équipe (scores, matchs à venir, retards) ; ‹ › change de mois en un clic.

  }
  const NOM_MOIS_CAP = m => NOMS_MOIS[m].charAt(0).toUpperCase() + NOMS_MOIS[m].slice(1);

  // Calendrier du mois (zoom) : logo de l'adversaire et score au marqueur ; aujourd'hui encerclé ; retards surlignés.
  function grilleMois(annee, mois, grand){
    const premier = new Date(annee, mois, 1);
    const debut = new Date(premier); debut.setDate(1 - (premier.getDay() + 6) % 7);
    const parDate = new Map(mesMatchs().map(m => [m.date, m]));
    const cases = [];
    const nbSemaines = Math.ceil(((premier.getDay() + 6) % 7 + new Date(annee, mois + 1, 0).getDate()) / 7);
    for(let k = 0; k < nbSemaines * 7; k++){
      const d = new Date(debut); d.setDate(debut.getDate() + k);
      const cle = iso(d), m = parDate.get(cle);
      const c = el('div', grand ? '' : 'cal-case');
      if(d.getMonth() !== mois) c.classList.add('hors');
      if(cle === AUJ) c.classList.add('auj');
      c.append(el('i', null, String(d.getDate())));
      if(m){
        const adv = m.v === equipe ? m.d : m.v;
        c.append(logo(adv));
        if(m.joue){ const r = resultatPour(m); const pour = m.v === equipe ? m.bv : m.bd, contre = m.v === equipe ? m.bd : m.bv; c.append(el('b', r, pour + '-' + contre)); }
        else if(cle < AUJ) c.classList.add('retard');
        else if(grand) c.append(el('small', null, (m.v === equipe ? '@ ' : 'vs ') + heureTexte(m.heure)));
        c.title = fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' : 'vs ') + nom(adv) + (m.joue ? ' · voir le résultat' : ' · rapport de dépistage');

  // Cahier des règlements : étiquette de la couverture (règlement du jour). Les annonces et
  // nouvelles passent à la télé, les décomptes au bandeau.
  const reglementDuJour = articles => articles.length ? articles[Math.floor(parse(AUJ).getTime() / 864e5) % articles.length] : null;
  async function apercuReglements(box){
    box.replaceChildren(el('b', null, 'Règlements'));
    const { articles } = await chargerReglements();

  // Dépistage : le prochain adversaire (ou celui d'un match en retard) comparé à nous.
  const adversaireDe = m => m.v === equipe ? m.d : m.v;
  const prochainsAdversaires = () => [...retards(), ...mesMatchs().filter(m => !m.joue && m.date >= AUJ).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num))];
  // Part (0-100) de la barre qui revient à « nous » : plus grande quand on est meilleur.
  const partNous = (nous, eux, sens) => { if(nous == null || eux == null || nous + eux === 0) return 50; return 100 * (sens > 0 ? nous : eux) / (nous + eux); };
  /* ---------- Dépistage : analyse de l'adversaire ----------
     Stats d'équipe des écrans de fin de match, plus des stats dérivées (% de tirs, % d'arrêts, PDO,
     part des tirs, possession) ; chaque catégorie est classée dans la ligue. */
  const signe = (v, n) => (v > 0 ? '+' : v < 0 ? '−' : '') + dec(Math.abs(v), n);
  const pct = v => dec(v, 1) + '%';
  const DEP_CATS = [
    // [libellé, clé, sens (1 = plus haut est mieux), format, nom court pour les forces et faiblesses]
    ['Différentiel / PJ', 'diffMoy', 1, v => signe(v, 2), 'Différentiel'],
    ['Buts pour / PJ', 'bpMoy', 1, v => dec(v, 2), 'Attaque'],
    ['Buts contre / PJ', 'bcMoy', -1, v => dec(v, 2), 'Défense'],
    ['% de tirs', 'tirPct', 1, pct, 'Finition'],
    ['% d’arrêts', 'arrPct', 1, pct, 'Gardiens'],
    ['PDO (chance)', 'pdo', 1, v => dec(v, 1), ''],
    ['Part des tirs', 'partTirs', 1, pct, 'Contrôle des tirs'],
    ['Tirs / PJ', 'tirsMoy', 1, v => dec(v, 1), 'Volume de tirs'],
    ['Tirs accordés / PJ', 'tirsContreMoy', -1, v => dec(v, 1), 'Tirs accordés'],
    ['Possession', 'possession', 1, pct, 'Possession'],
    ['Avantage numérique', 'anPct', 1, pct, 'Avantage num.'],
    ['Désavantage', 'dnPct', 1, pct, 'Désavantage'],
    ['Mises au jeu', 'mjPct', 1, pct, 'Mises au jeu'],
    ['Passes réussies', 'passesMoy', 1, pct, 'Passes'],
    ['Mises en échec / PJ', 'misesMoy', 1, v => dec(v, 1), 'Robustesse'],
    ['Pénalités (min/PJ)', 'penalitesMoy', -1, v => dec(v, 1), 'Discipline'],
  ];
  function statsLigue(){
    return R.statsEquipes(resultats, [...EQUIPES.keys()]).map(s => {
      const tirPct = s.tirsMoy ? 100 * s.bpMoy / s.tirsMoy : null, arrPct = s.tirsContreMoy ? 100 * (1 - s.bcMoy / s.tirsContreMoy) : null;
      return Object.assign(s, { diffMoy: s.pj ? s.bpMoy - s.bcMoy : null, tirPct, arrPct, pdo: tirPct != null && arrPct != null ? tirPct + arrPct : null,
        partTirs: s.tirsMoy && s.tirsContreMoy ? 100 * s.tirsMoy / (s.tirsMoy + s.tirsContreMoy) : null,
        possession: s.attaqueMoy && s.defenseMoy ? 100 * s.attaqueMoy / (s.attaqueMoy + s.defenseMoy) : null });
    });
  }
  // Rang d'une équipe dans une catégorie : { rang, n, val, p } (p = 1 pour le 1er, 0 pour le dernier).
  function rangCat(se, code, cle, sens){
    const liste = classerCat(se, cle, sens), rang = rangDe(liste, code);
    if(!rang) return null;
    return { rang, n: liste.length, val: liste[rang - 1][cle], p: liste.length > 1 ? (liste.length - rang) / (liste.length - 1) : 0.5 };
  }
  // Forces = premier quart de la ligue, faiblesses = dernier quart (le PDO, surtout de la chance, est exclu).
  function forcesFaiblesses(se, code){
    const l = DEP_CATS.filter(c => c[4]).map(([, cle, sens, f, court]) => { const r = rangCat(se, code, cle, sens); return r && Object.assign(r, { court, texte: f(r.val) }); }).filter(Boolean);
    const quart = x => Math.max(1, Math.ceil(x.n / 4));
    return { forces: l.filter(x => x.n > 3 && x.rang <= quart(x)).sort((a, b) => a.rang - b.rang).slice(0, 4),
      faiblesses: l.filter(x => x.n > 3 && x.rang > x.n - quart(x)).sort((a, b) => b.rang - a.rang).slice(0, 4) };
  }
  // Clés du match : notre point fort contre leur point faible, et l'inverse.
  const DUELS_DEP = [
    ['bpMoy', 1, 'Notre attaque', 'bcMoy', -1, 'leur défense'], ['bcMoy', -1, 'Notre défense', 'bpMoy', 1, 'leur attaque'],
    ['anPct', 1, 'Notre avantage num.', 'dnPct', 1, 'leur désavantage'], ['dnPct', 1, 'Notre désavantage', 'anPct', 1, 'leur avantage num.'],
    ['tirPct', 1, 'Notre finition', 'arrPct', 1, 'leurs gardiens'], ['arrPct', 1, 'Nos gardiens', 'tirPct', 1, 'leur finition'],
    ['tirsMoy', 1, 'Notre volume de tirs', 'tirsContreMoy', -1, 'leurs tirs accordés'], ['mjPct', 1, 'Nos mises au jeu', 'mjPct', 1, 'les leurs'],
    ['penalitesMoy', -1, 'Notre discipline', 'anPct', 1, 'leur avantage num.'],
  ];
  function clesDuMatch(se, adv){
    return DUELS_DEP.map(([cN, sN, libN, cE, sE, libE]) => {
      const a = rangCat(se, equipe, cN, sN), b = rangCat(se, adv, cE, sE);
      return a && b && a.n > 3 ? { ecart: a.p - b.p, texte: libN + ' (' + ordinal(a.rang) + ') contre ' + libE + ' (' + ordinal(b.rang) + ')' } : null;
    }).filter(Boolean).sort((x, y) => y.ecart - x.ecart);
  }
  // Matchs joués d'une équipe, du plus ancien au plus récent, de son point de vue.
  function matchsDe(code){
    return matchs.filter(x => x.joue && (x.v === code || x.d === code)).sort((a, b) => a.date.localeCompare(b.date) || Number(a.num) - Number(b.num)).map(x => {
      const i = x.v === code ? 0 : 1, pour = i ? x.bd : x.bv, contre = i ? x.bv : x.bd, st = (resultats[x.num] || {}).stats || {};
      const tirs = parseFloat((st.tirs || [])[i]), tirsC = parseFloat((st.tirs || [])[1 - i]);
      return { x, pour, contre, r: pour > contre ? 'v' : x.fin ? 'p' : 'd', adv: i ? x.v : x.d, dom: !!i, tirs: isNaN(tirs) ? null : tirs, tirsC: isNaN(tirsC) ? null : tirsC };
    });
  }
  const moyenne = (l, f) => { const v = l.map(f).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const fiche3 = l => l.filter(g => g.r === 'v').length + '-' + l.filter(g => g.r === 'd').length + '-' + l.filter(g => g.r === 'p').length;
  function serieEnCours(l){
    if(!l.length) return '';
    const gagne = l[l.length - 1].r === 'v';
    let n = 0; for(let k = l.length - 1; k >= 0 && (l[k].r === 'v') === gagne; k--) n++;
    return gagne ? (n > 1 ? n + ' victoires de suite' : '1 victoire') : (n > 1 ? n + ' matchs sans victoire' : '1 défaite');
  }

  async function apercuDepistage(box){
    const m = prochainsAdversaires()[0];
    const tete = el('div', 'dep-tete'); tete.append(el('span', null, 'Dépistage'), el('small', null, m ? (m.date < AUJ ? 'match en retard' : 'prochain adversaire') : ''));
    if(!m){ box.replaceChildren(tete, el('div', 'dep-adv', 'Plus de match à venir.')); return; }
    const adv = adversaireDe(m), t = classement.find(x => x.code === adv);
    const id = el('div', 'dep-adv'); const quand = m.date === AUJ ? 'ce soir' : fCourt.format(parse(m.date));
    // Leur forme : les 5 derniers matchs en pastilles.
    const forme5 = el('span', 'dep-forme'); matchsDe(adv).slice(-5).forEach(g => forme5.append(el('i', g.r)));
    const sous = el('small', null, fiche(t) + ' · ' + quand + (m.v === equipe ? ' @' : ' vs')); sous.append(forme5);
    id.append(logo(adv), el('b', null, nom(adv)), sous);
    const se = statsLigue();
    const nous = se.find(s => s.code === equipe) || {}, eux = se.find(s => s.code === adv) || {};
    const barres = el('div', 'dep-barres');
    [['Attaque', 'bpMoy', 1, v => dec(v, 2)], ['Défense', 'bcMoy', -1, v => dec(v, 2)], ['Part tirs', 'partTirs', 1, v => dec(v, 0) + '%'], ['Avantage', 'anPct', 1, v => dec(v, 1) + '%'], ['Désav.', 'dnPct', 1, v => dec(v, 1) + '%']].forEach(([lib, cle, sens, f]) => {
      const a = nous[cle], b = eux[cle];
      const r = el('div', 'dep-barre'), i = el('i'); i.style.setProperty('--p', partNous(a, b, sens).toFixed(0));
      const ecart = a != null && b != null ? sens * (a - b) : 0;
      r.append(el('span', null, lib), el('b', ecart > 0 ? 'mieux' : '', a != null ? f(a) : '–'), i, el('b', ecart < 0 ? 'mieux' : '', b != null ? f(b) : '–'));
      barres.append(r);
    });
    // Leur meilleure force et leur pire faiblesse.
    const ff = forcesFaiblesses(se, adv), pied = el('div', 'dep-pied');
    if(ff.forces[0]) pied.append(el('span', 'force', '▲ ' + ff.forces[0].court + ' ' + ordinal(ff.forces[0].rang)));
    if(ff.faiblesses[0]) pied.append(el('span', 'faible', '▼ ' + ff.faiblesses[0].court + ' ' + ordinal(ff.faiblesses[0].rang)));
    box.replaceChildren(tete, id, barres, pied);
  }

  // Courriels du DG (exemples tirés des vraies données).
  function courriels(){
    const l = [];
    const prochain = prochainMatch();
    const autre = prochain ? (prochain.v === equipe ? prochain.d : prochain.v) : [...EQUIPES.keys()].find(c => c !== equipe);
    l.push({ de: autre, titre: 'Offre de transaction — ' + nom(autre), apercu: 'Une offre t’attend (expire dans 41 h).', type: 'offre', nonlu: true });
    retards().forEach(m => l.push({ de: m.v === equipe ? m.d : m.v, titre: 'Match en retard — ' + fCourt.format(parse(m.date)), apercu: (m.v === equipe ? '@ ' : 'vs ') + nom(m.v === equipe ? m.d : m.v) + ' : résultat à soumettre.', type: 'retard', nonlu: true, num: m.num }));
    const per = periodeCourante();
    if(per && !declaration(equipe, per.num)) l.push({ de: 'LNHQ', titre: 'Rappel — 2e gardien, période ' + per.num, apercu: 'Aucun match déclaré pour la période (fin le ' + fMois.format(parse(per.fin)) + ').', type: 'gardien', nonlu: true });
    l.push({ de: 'LNHQ', titre: 'Envoyée — offre à ' + nom(autre), apercu: 'En attente de réponse.', type: 'envoyee', nonlu: false });
    return l;
  }
  function apercuOrdinateur(box){
    if(!estDG()){
      const v = el('div', 'verrou');
      const h = new Date();
      v.append(logo(equipe), el('b', null, String(h.getHours()).padStart(2, '0') + ':' + String(h.getMinutes()).padStart(2, '0')), el('small', null, '🔒 Bureau de ' + nom(equipe) + ' · verrouillé'));
      box.replaceChildren(v);
      return;
    }
    // Le bureau de l'Espace DG : les boutons de dg.lnhq.ca, chacun ouvre sa page dans le panneau ;
    // une pastille rouge quand une action attend (mêmes alertes que le cellulaire).
    const os = el('div', 'os');
    const barre = el('div', 'os-barre'), h = new Date();
    barre.append(Object.assign(el('img', 'os-ligue'), { src: LOGO_LIGUE, alt: 'LNHQ' }), logo(equipe), el('b', null, 'Espace DG · ' + nom(equipe)), el('span', null, String(h.getHours()).padStart(2, '0') + ':' + String(h.getMinutes()).padStart(2, '0')));

  const APPS_DG = [
    ['resultat.html', '📷', 'Soumettre un résultat'], ['gardien.html', '🥅', '2e gardien'], ['alignement.html', '📋', 'Mon alignement'], ['encheres.html', '💰', 'Enchères'],

  // Paramètres de l'annexe A utiles au cartable : effectif min/max, limite d'espoirs, plancher salarial.
  async function limitesLigue(){
    const { parametres } = await chargerReglements().catch(() => ({ parametres: [] }));
    const val = re => { const p = parametres.find(x => re.test(x.libelle)); return p ? p.valeur : ''; };
    const entier = t => { const m = /\d[\d\s]*/.exec(t); return m ? Number(m[0].replace(/\s/g, '')) : null; };
    return { min: entier(val(/^Minimum de joueurs/i)), max: entier(val(/^Maximum de joueurs/i)), espoirs: entier(val(/^Espoirs/i)), plancher: entier(val(/^Plancher/i)) };
  }

  // Alertes du DG : offre reçue, match en retard, 2e gardien pas déclaré, enchère dépassée.
  // urgent = rouge ; les autres allument le cellulaire en orange.
  async function alertesDG(){
    if(!estDG()) return [];
    const l = [];
    courriels().filter(c => c.type === 'offre' && c.nonlu).forEach(c => l.push({ icone: '🔁', titre: 'Offre de transaction', court: 'Offre', texte: nom(c.de) + ' · ' + c.apercu, objet: 'ordinateur', bouton: 'Voir l’offre', urgent: true }));
    retards().forEach(m => l.push({ icone: '⏰', titre: 'Match en retard', court: 'Retard', texte: fCourt.format(parse(m.date)) + ' · ' + (m.v === equipe ? '@ ' : 'vs ') + nom(m.v === equipe ? m.d : m.v), objet: 'console', bouton: 'Soumettre', urgent: true }));
    const per = periodeCourante();
    if(per && !declaration(equipe, per.num)) l.push({ icone: '🥅', titre: '2e gardien pas déclaré', court: '2e gardien', texte: 'Période ' + per.num + ' · fin le ' + fMois.format(parse(per.fin)), objet: 'postit', bouton: 'Déclarer', urgent: false });
    try{
      const [d] = await chargerEncheres();
      const misees = new Set(d.mises.filter(m => m.equipe === equipe).map(m => m.id));
      d.encheres.filter(e => e.statut === 'En cours' && misees.has(e.id) && e.equipe !== equipe && !e.egalite.includes(equipe))
        .forEach(e => l.push({ icone: '💰', titre: 'Enchère dépassée', court: 'Enchère', texte: prenomNom(e.joueur) + ' · ' + e.mise + ' par ' + e.equipe, objet: 'agents', bouton: 'Relancer', urgent: false }));
    }catch(e){ console.warn(e); }
    return l;
  }
  // Cellulaire : éteint s'il n'y a rien ; allumé et pulsant quand une alerte attend.
  async function apercuCellulaire(box){
    const cell = box.closest('.bu-cell');
    const heure = () => { const h = new Date(); return String(h.getHours()).padStart(2, '0') + ':' + String(h.getMinutes()).padStart(2, '0'); };
    const alertes = await alertesDG();
    cell.classList.toggle('allume', alertes.length > 0);
    cell.classList.toggle('calme', alertes.length > 0 && !alertes.some(a => a.urgent));
    if(!alertes.length){ box.replaceChildren(el('small', null, estDG() ? heure() : '🔒')); return; }
    box.replaceChildren(el('span', 'cell-nb', String(alertes.length)), el('span', 'cell-txt', alertes[0].icone + ' ' + alertes[0].court));
  }

  /* ---------- Téléphone : l'écran d'accueil ---------- */
  // Comme un téléphone : « Soumettre un résultat » toujours en haut, les notifications (ce qui attend une

    ['transactions.html', '🔁', 'Transactions', '#7048e8'], ['marche.html', '🏷️', 'Mon marché', '#d6336c'], ['ratings.html', '📊', 'Ratings', '#4263eb'], ['profil.html', '🪪', 'Ma fiche', '#495057'], ['publier.html', '✏️', 'Publier', '#f08c00'],

      const quand = el('div', 'mb-match-quand'), q = el('span');
      q.append(el('b', null, pm.date === AUJ ? 'Ce soir' : fCourt.format(parse(pm.date))), document.createTextNode(' · ' + serieContre(adv)));

    // Mon équipe : fiche, rang de division, forme.
    const div = divisionDe(equipe), rangDiv = div ? rangDe(R.classement(resultats, div.equipes), equipe) : 0;
    const we = el('button', 'mb-widget'); we.type = 'button';
    we.append(el('small', null, 'Mon équipe'), logo(equipe, 'mb-widget-logo'), el('span', 'mb-grand', fiche(t)),
      el('span', 'mb-widget-sous', (t ? t.pts : 0) + ' pts' + (rangDiv ? ' · ' + ordinal(rangDiv) + ' ' + div.nom.replace('Division ', '') : '')), forme());
    we.addEventListener('click', () => page(we, nom(equipe), 'equipe.html?team=' + slug));
    widgets.append(we);
    // Dernier match : résultat en gros, l'adversaire en filigrane.
    const dernier = mesMatchs().filter(x => x.joue).sort((a, b) => b.date.localeCompare(a.date) || Number(b.num) - Number(a.num))[0];
    if(dernier){
      const r = resultatPour(dernier), pour = dernier.v === equipe ? dernier.bv : dernier.bd, contre = dernier.v === equipe ? dernier.bd : dernier.bv, adv = adversaireDe(dernier);

    const ligue = el('div', 'mb-apps');
    [[iconeCalendrier(), 'Calendrier', '', 'calendrier.html'], ['🏆', 'Classement', '#f59f00', 'classement.html'], ['📈', 'Stats', '#12b886', 'stats.html'],
      ['🚨', 'Résultats', '#e03131', 'resultats.html?equipe=' + equipe], ['📢', 'Annonces', '#fa5252', './?fil=annonces'], ['📰', 'Nouvelles', '#339af0', './?fil=nouvelles'],
      ['🔄', 'Échanges', '#845ef7', './?fil=transactions'], ['🗞️', 'Gazette', '#5c4033', 'journal'], ['👕', 'Mon équipe', 'var(--ce-couleur)', 'equipe.html?team=' + slug + '&vue=alignement'],
      ...(estDG() ? [] : [['💰', 'Enchères', '#2f9e44', 'encheres.html']]), ['💵', 'Masse', '#37b24d', 'masse.html'], ['📒', 'Règlements', '#a0522d', 'reglements.html'], ['📺', 'LNHQ TV', '#343a40', 'tv.html'],
    ].forEach(([icone, nomApp, couleur, url]) => ligue.append(app(icone, nomApp, couleur, b => url === 'journal' ? ouvrirZoom('journal', b) : page(b, nomApp, url))));

    blocs.push(dock);

    // Les alertes : notifications et pastilles des apps.
    if(estDG()) alertesDG().then(l => {

    pile.replaceChildren(...blocs);

  /* ---------- Contenus des nouveaux objets (zoom) ---------- */
  const tableau = (entetes, lignes) => {
    const t = el('table', 'z-table');
    const th = el('tr'); entetes.forEach(x => th.append(el('th', null, x))); t.append(th);
    lignes.forEach(l => t.append(l));
    const w = el('div', 'z-defile'); w.append(t);
    return w;
  };
  const rangee = (cellules, cls) => {
    const tr = el('tr', cls || '');
    cellules.forEach(([v, c]) => { const td = el('td', c || ''); if(v instanceof Node) td.append(v); else td.textContent = v; tr.append(td); });
    return tr;
  };
  const avecLogo = (code, texte) => { const f = document.createDocumentFragment(); f.append(logo(code), document.createTextNode(texte)); return f; };

  function zoomResultats(){
    const blocs = [titreZoom('Résultats', 'les derniers matchs de la ligue')];
    const joues = matchs.filter(m => m.joue).sort((a, b) => b.date.localeCompare(a.date) || Number(b.num) - Number(a.num)).slice(0, 40);
    if(!joues.length){ blocs.push(el('p', 'ce-vide', 'Aucun match joué pour l’instant.')); return blocs; }
    let jour = '', lignes = [];
    const vider = () => { if(lignes.length){ blocs.push(el('h3', 'z-jour', fJour.format(parse(jour))), tableau(['Match', 'Score', ''], lignes)); lignes = []; } };
    joues.forEach(m => {
      if(m.date !== jour){ vider(); jour = m.date; }
      const nomM = el('span'); nomM.append(avecLogo(m.v, nom(m.v) + ' @ '), avecLogo(m.d, nom(m.d)));
      lignes.push(rangee([[nomM], [m.bv + ' – ' + m.bd, 'fort'], [R.FINS[m.fin] || '']], m.v === equipe || m.d === equipe ? 'moi' : ''));

  // Cartable (zoom) : plafond salarial et limites de la ligue, puis l'effectif par position et les contrats.
  function zoomEffectif(){
    const blocs = [titreZoom('Effectif', nom(equipe))];
    const resume = el('div', 'ce-carte');
    resume.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:24px;font-size:14px;margin-bottom:16px;container-type:inline-size';
    const zone = el('div', 'ce-cartes2'); zone.append(el('p', 'ce-vide', 'On ouvre le cartable…'));
    blocs.push(resume, zone);
    Promise.all([contratsEquipe(), limitesLigue()]).then(([{ miens, masse, espace, plafond }, lim]) => {
      const anneau = el('div', 'pla-anneau'); anneau.style.cssText = 'width:140px;height:140px;color:#fff';
      anneau.style.setProperty('--p', plafond ? Math.min(100, 100 * masse / plafond).toFixed(1) : 0);
