name = "lnhq-publier"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Joignable seulement par publier.lnhq.ca, derrière Cloudflare Access :
# l'adresse *.workers.dev permettrait de contourner Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "publier.lnhq.ca", custom_domain = true }]

# Chaque minute : fermeture des enchères dont le chrono est écoulé (voir scheduled()).
[triggers]
crons = ["* * * * *", "0 16 * * *"]  # 2e : rappels du 2e gardien, une fois par jour

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Valeurs affichées dans Zero Trust → Access → Applications → (l'application) → Vue d'ensemble.
ACCESS_TEAM_DOMAIN = "https://lnhq.cloudflareaccess.com"
ACCESS_AUD = "ba5688f1486b883058a48ba547af4531e1e6e957f61f481f162a161fdaff1766"

# Secrets (jamais dans ce fichier) : npx wrangler secret put SCRIPT_URL
#                                    npx wrangler secret put SCRIPT_SECRET
#                                    npx wrangler secret put WEBHOOK_AGENTS   (canal agents libres)
#                                    npx wrangler secret put WEBHOOK_GARDIENS (rappels du 2e gardien ;
#                                    sans lui, ils vont dans le canal des annonces)
