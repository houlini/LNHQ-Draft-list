<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration — LNHQ</title>
<link rel="icon" type="image/png" href="https://lnhq.ca/logo-lnhq.png">
<link rel="stylesheet" href="https://lnhq.ca/site.css?v=9">
<link rel="stylesheet" href="admin.css?v=1">
<script src="admin.js?v=1" defer></script>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-row">
      <a class="brand" href="https://lnhq.ca/">
        <img class="brand-logo" src="https://lnhq.ca/logo-lnhq.png" alt="LNHQ">
        <h1 class="app-title">LNHQ</h1>
      </a>
      <nav class="site-nav">
        <a class="nav-btn" href="https://lnhq.ca/">Voir le site</a>
      </nav>
    </div>
    <div class="meta-row"><span id="qui">Vérification de ton accès…</span></div>
  </header>

  <main class="adm-page">
    <div id="refus" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div id="refusTexte"></div>
    </div>

    <section id="migration" class="adm-carte" hidden>
      <div class="adm-tete">
        <h2 class="adm-titre">Migration vers Discord</h2>
        <label class="adm-filtre"><input type="checkbox" id="nonLies"> Non liés seulement</label>
      </div>
      <div class="adm-progres">
        <div class="adm-chiffre"><b id="pctLies">0 %</b><span id="txtLies"></span></div>
        <div class="adm-barre" role="progressbar" aria-labelledby="txtLies" id="barre" aria-valuemin="0" aria-valuemax="100"><i id="barreRemplie"></i></div>
        <p class="adm-note" id="txtEquipes"></p>
      </div>
      <p class="adm-note">Lien à donner aux DG : <strong>publier.lnhq.ca/lier-discord.html</strong> (connexion par courriel une dernière fois, puis un clic).</p>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead><tr><th class="is-texte">Équipe</th><th class="is-texte">Compte</th><th class="is-texte">Discord</th><th>Lié le</th></tr></thead>
          <tbody id="lignes"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

</body>
</html>
