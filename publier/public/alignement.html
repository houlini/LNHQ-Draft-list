<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alignement — LNHQ</title>
<link rel="icon" type="image/png" href="https://lnhq.ca/logo-lnhq.png">
<link rel="stylesheet" href="https://lnhq.ca/site.css?v=4">
<link rel="stylesheet" href="https://lnhq.ca/alignement.css">
<link rel="stylesheet" href="alignement-dg.css">
<script src="https://lnhq.ca/alignement.js" defer></script>
<script src="alignement-dg.js" defer></script>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-row">
      <a class="brand" href="https://lnhq.ca/">
        <img class="brand-logo" src="https://lnhq.ca/logo-lnhq.png" alt="LNHQ">
        <h1 class="app-title">LNHQ</h1>
      </a>
      <nav class="site-nav">
        <a class="nav-btn" id="lienEquipe" href="https://lnhq.ca/">Voir la page de l'équipe</a>
      </nav>
    </div>
    <div class="meta-row"><span id="qui">Vérification de ton accès…</span></div>
  </header>

  <div class="filter-band" id="barre" hidden>
    <select id="equipe" class="dg-equipe" aria-label="Équipe" hidden></select>
    <div class="dg-actions">
      <button type="button" class="dg-btn" id="annuler" disabled>Annuler les changements</button>
      <button type="button" class="dg-btn" id="auto">Alignement automatique</button>
      <button type="button" class="dg-btn dg-principal" id="enregistrer" disabled>Enregistrer</button>
    </div>
  </div>

  <main>
    <div id="refus" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div id="refusTexte"></div>
    </div>
    <div class="al-zone al-modifiable" id="zone" hidden>
      <p class="dg-aide" id="aide">Touche un joueur, puis un autre (dans l'alignement ou dans les réservistes) pour les échanger. N'oublie pas d'enregistrer.</p>
      <p id="message" class="dg-message" role="status" hidden></p>
      <div id="contenu"></div>
    </div>
  </main>
</div>

</body>
</html>
