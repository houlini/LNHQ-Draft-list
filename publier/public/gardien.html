<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2e gardien — LNHQ</title>
<link rel="icon" type="image/png" href="https://lnhq.ca/logo-lnhq.png">
<link rel="stylesheet" href="https://lnhq.ca/site.css?v=6">
<link rel="stylesheet" href="gardien.css">
<script src="https://lnhq.ca/gardiens-donnees.js" defer></script>
<script src="gardien.js" defer></script>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-row">
      <a class="brand" href="https://lnhq.ca/">
        <img class="brand-logo" src="https://lnhq.ca/logo-lnhq.png" alt="LNHQ">
        <h1 class="app-title">LNHQ</h1>
      </a>
      <nav class="site-nav">
        <a class="nav-btn" href="https://lnhq.ca/calendrier.html">Calendrier</a>
      </nav>
    </div>
    <div class="meta-row"><span id="qui">Vérification de ton accès…</span></div>
  </header>

  <main class="gar-page">
    <div id="refus" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div id="refusTexte"></div>
    </div>

    <p class="gar-intro" id="intro" hidden>
      Ton 2e gardien doit jouer au moins <strong>un match par période de 2 semaines</strong>.
      Choisis le match pour chaque période, même d'avance pour toute la saison. Tu peux changer
      ton choix jusqu'à la fin de la période ; ensuite elle est verrouillée.
    </p>
    <p id="message" class="gar-message" role="status" hidden></p>
    <div id="periodes"></div>
  </main>
</div>

</body>
</html>
