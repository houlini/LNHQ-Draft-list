<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css">
<script src="site-nav.js"></script>
<script src="gardiens-donnees.js"></script>
<style>
  /* ---------- Résumé (Masse salariale / Espace / stats) ---------- */
  .summary-stats{
    display:flex; flex-wrap:wrap; gap:10px;
    padding:14px clamp(16px,3vw,40px) 6px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 16px; min-width:100px;
  }
  .stat-card .stat-label{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  .stat-card .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; margin-top:2px; }
  .stat-card.is-money .stat-value{ color:var(--accent); }

  /* ---------- Groupes de matchs, en grille (plusieurs côte à côte si l'écran le permet) ---------- */
  #groupsWrap{
    display:grid; gap:20px; align-items:start;
    padding:0 clamp(16px,3vw,40px) 30px;
  }
  .section-block{ padding:0; }
  .section-title{
    display:flex; align-items:baseline; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    padding:9px 16px; border-radius:var(--radius) var(--radius) 0 0;
    font-weight:700; text-transform:uppercase; letter-spacing:0.02em; font-size:13.5px;
  }
  .section-title .section-count{ font-weight:500; opacity:0.85; text-transform:none; letter-spacing:0; font-size:12.5px; }
  .section-block .table-wrap{ border-radius:0 0 var(--radius) var(--radius); border-top:none; margin:0; }
  .section-block table{ width:100%; }
  tr.total-row td{ background:var(--stripe) !important; font-weight:700; border-top:2px solid var(--accent); }
  .section-empty{
    border:1px solid var(--line); border-top:none; border-radius:0 0 var(--radius) var(--radius);
    padding:16px; color:var(--ink-muted); font-size:14px; text-align:center; background:var(--surface);
  }

  /* ---------- Choix de repêchage ---------- */
  .picks-block{ padding:14px clamp(16px,3vw,40px) 30px; }
  .picks-list{
    list-style:none; margin:0; padding:0;
    border:1px solid var(--line); border-top:none; border-radius:0 0 var(--radius) var(--radius);
    background:var(--surface);
  }
  .picks-list li{ padding:10px 16px; border-bottom:1px solid var(--line); font-size:14.5px; }
  .picks-list li:last-child{ border-bottom:none; }

  /* ---------- Sélecteur d'équipe (bannière orange) ---------- */
  .team-switch-btn{
    background:var(--surface); color:var(--ink);
    font-size:16px; padding:10px 18px; border-radius:9px; gap:12px;
    text-transform:none; letter-spacing:0; font-weight:700;
  }
  .team-switch-btn:hover{ background:var(--surface); opacity:0.9; }
  .team-switch-logo{ width:28px; height:28px; object-fit:contain; }

  .team-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .team-modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:680px;
    max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .team-modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    font-weight:700; font-size:17px; position:sticky; top:0; background:var(--surface);
    color:var(--ink);
  }
  .team-modal-close{
    background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-muted);
    line-height:1; padding:4px;
  }
  .team-modal-close:hover{ color:var(--ink); }
  .team-modal-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:10px; padding:18px 20px;
  }
  .team-modal-grid a, .team-modal-grid span{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:16px 10px; border-radius:10px; border:1px solid var(--line);
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600; text-align:center;
  }
  .team-modal-grid a:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .team-modal-grid span.nav-dropdown-current{
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700;
  }
  .team-modal-grid .team-option-logo{ width:40px; height:40px; object-fit:contain; }

  /* ---------- Grand logo d'équipe ---------- */
  .team-hero{
    display:flex; align-items:center; gap:14px;
    padding:16px clamp(16px,3vw,40px) 0;
  }
  .team-hero-logo{ width:56px; height:56px; object-fit:contain; }
  .team-hero-name{
    font-family:'Oswald', 'IBM Plex Sans', sans-serif; text-transform:uppercase;
    font-size:26px; font-weight:500; margin:0; color:var(--ink);
  }

  /* ---------- Couleurs des statistiques résumé ---------- */
  .stat-card.is-positive .stat-value{ color:var(--positive); }
  .stat-card.is-negative .stat-value{ color:var(--negative); }

  /* ---------- Ordre de repêchage ---------- */
  .pick-num{
    display:inline-block; min-width:28px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; color:var(--ink-muted);
  }
  .team-cell{ display:flex; align-items:center; gap:8px; }
  .team-cell img{ width:20px; height:20px; object-fit:contain; flex-shrink:0; }
  .team-cell a{ color:inherit; text-decoration:none; font-weight:600; }
  .team-cell a:hover{ text-decoration:underline; color:var(--accent); }
  /* ---------- Calendrier par semaine ---------- */
  .sem-nav{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex:1 1 360px; max-width:560px; }
  .sem-nav select{ flex:1 1 0; min-width:0;
    height:42px; padding:0 10px; border-radius:9px; border:none; font-size:15px; font-weight:700;
    background:var(--surface); color:var(--ink); max-width:100%;
  }
  .sem-fleche{
    width:42px; height:42px; border-radius:9px; border:none; cursor:pointer;
    background:var(--surface); color:var(--ink); font-size:18px; font-weight:700;
  }
  .sem-fleche:disabled{ opacity:0.4; cursor:default; }
  .sem-fleche, .sem-aujourdhui{ flex-shrink:0; }
  @media (max-width:600px){ .sem-aujourdhui{ flex:1 1 100%; } }
  .sem-aujourdhui{
    height:42px; padding:0 14px; border-radius:9px; border:1px solid rgba(255,255,255,0.5); cursor:pointer;
    background:transparent; color:inherit; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
  }

  #groupsWrap{ display:flex; flex-direction:column; align-items:stretch; gap:26px; padding:16px clamp(12px,3vw,40px) 30px; }
  .sem-titre{
    margin:0 0 10px; font-family:'Oswald', 'IBM Plex Sans', sans-serif; font-weight:500;
    font-size:19px; text-transform:uppercase; letter-spacing:0.02em;
  }
  .sem-titre span{ font-family:'IBM Plex Sans', sans-serif; font-size:14px; font-weight:400; color:var(--ink-muted); text-transform:none; margin-left:6px; }
  .sem-jours{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap:14px; align-items:start; }
  .jour{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .jour.is-aujourdhui{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .jour-tete{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:8px 12px; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .jour-tete span{ font-weight:500; text-transform:none; letter-spacing:0; opacity:0.85; }
  .match{
    display:grid; grid-template-columns:54px minmax(0, 1fr) 22px 12px 22px minmax(0, 1fr);
    align-items:center; gap:4px; padding:7px 10px; border-top:1px solid var(--line); font-size:14px;
  }
  .match:first-of-type{ border-top:none; }
  .match-heure{ font-size:12px; color:var(--ink-muted); white-space:nowrap; }
  .match-equipe{ display:flex; align-items:center; gap:6px; min-width:0; }
  .match-equipe.domicile{ justify-content:flex-start; }
  .match-equipe img{ width:20px; height:20px; object-fit:contain; flex-shrink:0; }
  .match-equipe a, .match-equipe span{ color:inherit; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .match-equipe a:hover{ color:var(--accent); text-decoration:underline; }
  .match-equipe.is-gagnant{ font-weight:700; }
  .match-equipe.is-choisie a{ color:var(--accent); font-weight:700; }
  .match-score{ font-family:'IBM Plex Mono', monospace; font-weight:700; text-align:center; }
  .match-at{ text-align:center; color:var(--ink-muted); font-size:12px; }
  .match-note{ grid-column:2 / -1; font-size:12px; font-style:italic; color:var(--ink-muted); }
  .match-2eg{
    flex-shrink:0; font-size:10px; font-weight:800; letter-spacing:0.03em; padding:1px 5px; border-radius:999px;
    background:#2F9E44; color:#fff;
  }

  /* ---------- Encadré du 2e gardien ---------- */
  .gar-boite{
    margin:16px clamp(12px,3vw,40px) 0; padding:14px 16px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    display:grid; grid-template-columns:1fr; gap:14px;
  }
  @media (min-width:900px){ .gar-boite.a-deux{ grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); } }
  .gar-titre{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; margin:0 0 8px; }
  .gar-titre strong{ font-family:'Oswald', 'IBM Plex Sans', sans-serif; font-weight:500; font-size:17px; text-transform:uppercase; letter-spacing:0.02em; }
  .gar-titre span{ font-size:13px; color:var(--ink-muted); }
  .gar-titre a{ margin-left:auto; font-size:13px; font-weight:700; color:var(--accent); text-decoration:none; }
  .gar-titre a:hover{ text-decoration:underline; }
  .gar-ligne{ display:flex; align-items:flex-start; gap:8px; margin-top:6px; }
  .gar-ligne > b{ flex-shrink:0; width:84px; font-size:12.5px; padding-top:5px; }
  .gar-ligne.is-fait > b{ color:#2F9E44; }
  .gar-ligne.is-a-faire > b{ color:var(--accent); }
  .gar-ligne.is-illegal > b{ color:#E03131; }
  .gar-logos{ display:flex; flex-wrap:wrap; gap:4px; }
  .gar-logos span{ display:inline-flex; align-items:center; gap:3px; padding:2px 6px 2px 3px; border:1px solid var(--line); border-radius:999px; font-size:11px; font-weight:700; font-family:'IBM Plex Mono', monospace; }
  .gar-logos img{ width:18px; height:18px; object-fit:contain; }
  .gar-ligne.is-fait .gar-logos span{ border-color:rgba(47,158,68,0.5); }
  .gar-ligne.is-illegal .gar-logos span{ border-color:#E03131; color:#E03131; }
  .gar-vide{ font-size:13px; color:var(--ink-muted); padding-top:4px; }
  .gar-prec{ border-top:1px solid var(--line); padding-top:12px; }
  @media (min-width:900px){ .gar-boite.a-deux .gar-prec{ border-top:none; padding-top:0; border-left:1px solid var(--line); padding-left:14px; } }

  /* Nom complet sur grand écran, code (TOR) sur téléphone. */
  .nom-court{ display:none; }
  @media (max-width:600px){
    .match{ grid-template-columns:50px minmax(0, 1fr) 24px 10px 24px minmax(0, 1fr); padding:7px 8px; font-size:13.5px; }
    .nom-long{ display:none; }
    .nom-court{ display:inline; }
  }</style>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="calendrier"></site-header>

  <div class="filter-band">
    <button class="nav-btn team-switch-btn" id="teamSwitchBtn" aria-haspopup="dialog">
      <img class="team-switch-logo" id="teamSwitchLogo" alt="" hidden>
      <span id="teamSwitchLabel">Toutes les équipes</span>
      <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="sem-nav">
      <button type="button" class="sem-fleche" id="semPrec" aria-label="Semaine précédente">‹</button>
      <select id="filterWeek" aria-label="Semaine"></select>
      <button type="button" class="sem-fleche" id="semSuiv" aria-label="Semaine suivante">›</button>
      <button type="button" class="sem-aujourdhui" id="semAujourdhui">Cette semaine</button>
    </div>
  </div>

  <div class="team-modal-backdrop" id="teamModalBackdrop" hidden>
    <div class="team-modal" role="dialog" aria-modal="true" aria-label="Choisir une équipe">
      <div class="team-modal-header">
        <span>Choisir une équipe</span>
        <button class="team-modal-close" id="teamModalClose" aria-label="Fermer">✕</button>
      </div>
      <div class="team-modal-grid" id="teamModalGrid"></div>
    </div>
  </div>

  <main id="content">
    <div id="loader">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div id="errorText">Impossible de charger les données.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div id="dataWrap" hidden>
      <section class="gar-boite" id="gardiens" hidden></section>
      <div id="groupsWrap"></div>
    </div>

    <p class="empty-state" id="emptyState" hidden></p>
  </main>
</div>

<script>
/* =========================================================================
   CONFIGURATION
   ========================================================================= */
const CONFIG = {
  SHEET_ID: '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A',
  GID: '1528349633', // onglet "SCHEDULE"
};

const els = {
  app: document.querySelector('.app'),
  title: document.getElementById('sheetTitle'),
  teamSwitchBtn: document.getElementById('teamSwitchBtn'),
  teamSwitchLogo: document.getElementById('teamSwitchLogo'),
  teamSwitchLabel: document.getElementById('teamSwitchLabel'),
  teamModalBackdrop: document.getElementById('teamModalBackdrop'),
  teamModalClose: document.getElementById('teamModalClose'),
  teamModalGrid: document.getElementById('teamModalGrid'),
  filterWeek: document.getElementById('filterWeek'),
  semPrec: document.getElementById('semPrec'),
  semSuiv: document.getElementById('semSuiv'),
  semAujourdhui: document.getElementById('semAujourdhui'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  errorText: document.getElementById('errorText'),
  retryBtn: document.getElementById('retryBtn'),
  dataWrap: document.getElementById('dataWrap'),
  groupsWrap: document.getElementById('groupsWrap'),
  emptyState: document.getElementById('emptyState'),
};

els.title.textContent = 'LNHQ';
document.title = 'Calendrier';

// Nom complet d'équipe (tel qu'écrit dans le calendrier) → slug de sa page.
const TEAM_NAME_TO_SLUG = {
  'anaheim ducks':'anaheim', 'boston bruins':'boston', 'buffalo sabres':'buffalo',
  'calgary flames':'calgary', 'carolina hurricanes':'carolina', 'chicago blackhawks':'chicago',
  'colorado avalanche':'colorado', 'columbus blue jackets':'columbus', 'dallas stars':'dallas',
  'detroit red wings':'detroit', 'edmonton oilers':'edmonton', 'florida panthers':'florida',
  'los angeles kings':'los-angeles', 'minnesota wild':'minnesota', 'montréal canadiens':'montreal',
  'montreal canadiens':'montreal', 'nashville predators':'nashville', 'new jersey devils':'new-jersey',
  'new york islanders':'ny-islanders', 'new york rangers':'ny-rangers', 'ottawa senators':'ottawa',
  'philadelphia flyers':'philadelphia', 'pittsburgh penguins':'pittsburgh', 'san jose sharks':'san-jose',
  'seattle kraken':'seattle', 'st. louis blues':'st-louis', 'st louis blues':'st-louis',
  'tampa bay lightning':'tampa-bay', 'toronto maple leafs':'toronto', 'utah mammoth':'utah',
  'utah hockey club':'utah', 'vancouver canucks':'vancouver', 'vegas golden knights':'vegas',
  'washington capitals':'washington', 'winnipeg jets':'winnipeg',
};
const SLUG_TO_CODE = {
  montreal:'MTL', toronto:'TOR', ottawa:'OTT', boston:'BOS', buffalo:'BUF', detroit:'DET',
  florida:'FLA', 'tampa-bay':'TBL', carolina:'CAR', columbus:'CBJ', 'new-jersey':'NJD',
  'ny-islanders':'NYI', 'ny-rangers':'NYR', philadelphia:'PHI', pittsburgh:'PIT',
  washington:'WSH', utah:'UTA', chicago:'CHI', colorado:'COL', dallas:'DAL', minnesota:'MIN',
  nashville:'NSH', 'st-louis':'STL', winnipeg:'WPG', anaheim:'ANA', calgary:'CGY',
  edmonton:'EDM', 'los-angeles':'LAK', 'san-jose':'SJS', seattle:'SEA', vancouver:'VAN',
  vegas:'VGK',
};
function teamLogoPath(code){ return 'Logos/' + code + '.png'; }
// Surnom affiché dans les matchs (le nom complet ne tient pas à côté de l'adversaire).
const SURNOMS = {
  anaheim:'Ducks', boston:'Bruins', buffalo:'Sabres', calgary:'Flames', carolina:'Hurricanes', chicago:'Blackhawks',
  colorado:'Avalanche', columbus:'Blue Jackets', dallas:'Stars', detroit:'Red Wings', edmonton:'Oilers', florida:'Panthers',
  'los-angeles':'Kings', minnesota:'Wild', montreal:'Canadiens', nashville:'Predators', 'new-jersey':'Devils',
  'ny-islanders':'Islanders', 'ny-rangers':'Rangers', ottawa:'Senators', philadelphia:'Flyers', pittsburgh:'Penguins',
  'san-jose':'Sharks', seattle:'Kraken', 'st-louis':'Blues', 'tampa-bay':'Lightning', toronto:'Maple Leafs', utah:'Mammoth',
  vancouver:'Canucks', vegas:'Golden Knights', washington:'Capitals', winnipeg:'Jets',
};

function teamCell(fullName){
  const wrap = document.createElement('span');
  wrap.className = 'team-cell';
  const slug = TEAM_NAME_TO_SLUG[(fullName || '').trim().toLowerCase()];
  const code = slug ? SLUG_TO_CODE[slug] : null;
  if(code){
    const img = document.createElement('img');
    img.src = teamLogoPath(code);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { img.style.display = 'none'; };
    wrap.appendChild(img);
  }
  if(slug){
    const a = document.createElement('a');
    a.href = 'equipe.html?team=' + slug;
    a.textContent = fullName;
    wrap.appendChild(a);
  }else{
    const span = document.createElement('span');
    span.textContent = fullName;
    wrap.appendChild(span);
  }
  return wrap;
}

/* =========================================================================
   Lecture du calendrier : blocs de période séparés par une ligne d'en-tête
   ========================================================================= */
function cellsToRows(table){
  return table.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? String(c.v) : '')) : ''));
}

function parseSchedule(rows){
  const games = [];
  rows.forEach(r => {
    const date = (r[1] || '').trim().slice(0, 10);
    const away = (r[3] || '').trim();
    // Les lignes d'en-tête (« Time » en colonne C) n'ont pas de date : ignorées.
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || away === '') return;
    games.push({
      num: (r[0] || '').trim(),
      date,
      time: (r[2] || '').trim(),
      away,
      awayScore: (r[5] || '').trim(),
      homeScore: (r[9] || '').trim(),
      home: (r[8] || '').trim(),
      note: (r[13] || '').trim(),
      semaine: lundi(date),
    });
  });
  return games;
}

const state = { games: [], team: '', semaine: '' };

function buildUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${CONFIG.GID}&headers=0&t=${Date.now()}`;
}
const CACHE_KEY = 'calCache_' + CONFIG.SHEET_ID + '_' + CONFIG.GID;
function loadFromCache(){
  try{ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveToCache(rows){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ rows, ts: Date.now() })); }catch(e){}
}

function applyData(rows){
  state.games = parseSchedule(rows);
  buildFilters();
  // 2e gardien : périodes (lignes « Time » du calendrier) et déclarations des DG.
  state.matchsG = window.LNHQ_GARDIENS ? LNHQ_GARDIENS.lireCalendrier(rows) : [];
  chargerGardiens();
}

/* ---------- 2e gardien (déclarations sur publier.lnhq.ca/gardien.html) ---------- */
async function chargerGardiens(){
  if(!window.LNHQ_GARDIENS) return;
  state.decl = await LNHQ_GARDIENS.chargerDeclarations();
  state.declMatch = new Set(Object.values(state.decl).map(d => d.match + '|' + d.equipe));
  renderGardiens();
  if(!els.dataWrap.hidden) render();
}

function logosEquipes(codes, details){
  const box = el('div', 'gar-logos');
  codes.forEach(c => {
    const puce = el('span');
    puce.title = (window.LNHQ_TEAMS || []).find(t => t.code === c)?.name + (details && details[c] ? ' : ' + details[c] : '');
    const img = el('img');
    img.src = teamLogoPath(c);
    img.alt = '';
    puce.append(img, c);
    box.append(puce);
  });
  return box;
}

function ligneGardien(classe, libelle, codes, details, vide){
  const ligne = el('div', 'gar-ligne ' + classe);
  ligne.append(el('b', null, `${libelle} (${codes.length})`));
  ligne.append(codes.length ? logosEquipes(codes, details) : el('span', 'gar-vide', vide));
  return ligne;
}

function renderGardiens(){
  const box = document.getElementById('gardiens');
  const G = window.LNHQ_GARDIENS;
  if(!G || !state.matchsG || !state.matchsG.length){ box.hidden = true; return; }
  const auj = G.aujourdhui();
  const periodes = G.periodes(state.matchsG);
  const courante = periodes.find(p => p.fin >= auj);
  const precedente = periodes.filter(p => p.fin < auj).pop();
  const codes = (window.LNHQ_TEAMS || []).map(t => t.code);
  const decl = state.decl || {};
  const jours = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
  box.replaceChildren();

  if(courante){
    const bloc = el('div');
    const titre = el('div', 'gar-titre');
    const reste = jours(auj, courante.fin);
    const quand = courante.debut > auj ? 'commence le ' + court.format(parseDate(courante.debut))
      : reste === 0 ? 'se termine aujourd’hui' : `se termine dans ${reste} jour${reste > 1 ? 's' : ''}`;
    titre.append(el('strong', null, '2e gardien · Période ' + courante.num),
      el('span', null, `${etiquetteSemaine(courante.debut).split(' au ')[0]} au ${court.format(parseDate(courante.fin))} · ${quand}`));
    const lien = el('a', null, 'Déclarer mon match →');
    lien.href = 'https://publier.lnhq.ca/gardien.html';
    titre.append(lien);
    const faits = codes.filter(c => decl[c + '|' + courante.num]);
    const details = {};
    faits.forEach(c => { const d = decl[c + '|' + courante.num]; details[c] = court.format(parseDate(d.date)) + ' vs ' + d.adversaire; });
    bloc.append(titre,
      ligneGardien('is-fait', '✅ Fait', faits, details, 'Aucune équipe pour l’instant.'),
      ligneGardien('is-a-faire', '⏳ À faire', codes.filter(c => !decl[c + '|' + courante.num]), null, 'Toutes les équipes ont déclaré leur match.'));
    box.append(bloc);
  }
  if(precedente){
    const bloc = el('div', 'gar-prec');
    const titre = el('div', 'gar-titre');
    titre.append(el('strong', null, 'Période ' + precedente.num + ' terminée'),
      el('span', null, `${court.format(parseDate(precedente.debut))} au ${court.format(parseDate(precedente.fin))}`));
    const illegales = codes.filter(c => !decl[c + '|' + precedente.num]);
    bloc.append(titre, ligneGardien('is-illegal', '❌ Illégales', illegales, null, '✅ Toutes les équipes ont fait jouer leur 2e gardien.'));
    box.append(bloc);
  }
  box.classList.toggle('a-deux', !!(courante && precedente));
  box.hidden = !box.children.length;
}

async function loadData({ background=false } = {}){
  if(!background) toggle({ loading:true });
  try{
    const res = await fetch(buildUrl());
    if(!res.ok) throw new Error('http_' + res.status);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
    if(!match) throw new Error('format_inattendu');
    const json = JSON.parse(match[1]);
    if(json.status === 'error'){
      throw new Error(json.errors && json.errors[0] && json.errors[0].reason || 'erreur_gviz');
    }
    const rows = cellsToRows(json.table);
    applyData(rows);
    saveToCache(rows);
    toggle({ loading:false });
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background) toggle({ loading:false, error:true });
  }
}

function toggle({ loading=false, error=false } = {}){
  els.loader.hidden = !loading;
  els.errorBox.hidden = !error;
  const showData = !loading && !error;
  els.dataWrap.hidden = !showData;
  if(showData) render();
}

/* ---------- Filtres ---------- */
// Sélecteur d'équipe : même fenêtre centrée avec logos que sur la page équipe.
function selectTeam(fullName, label, code){
  state.team = fullName;
  els.teamSwitchLabel.textContent = label;
  if(code){
    els.teamSwitchLogo.src = teamLogoPath(code);
    els.teamSwitchLogo.hidden = false;
    els.teamSwitchLogo.onerror = () => { els.teamSwitchLogo.hidden = true; };
  }else{
    els.teamSwitchLogo.hidden = true;
  }
  els.teamModalBackdrop.hidden = true;
  render();
}

function buildTeamModal(){
  els.teamModalGrid.innerHTML = '';
  // Option "toutes les équipes" en premier
  const all = document.createElement('a');
  all.href = '#';
  const allLabel = document.createElement('span');
  allLabel.textContent = 'Toutes les équipes';
  all.appendChild(allLabel);
  all.addEventListener('click', e => { e.preventDefault(); selectTeam('', 'Toutes les équipes', null); });
  els.teamModalGrid.appendChild(all);

  // Nom complet tel qu'il apparaît dans le calendrier, pour que le filtre corresponde.
  const fullNames = Array.from(new Set(state.games.flatMap(g => [g.away, g.home])))
    .filter(Boolean).sort((a, b) => a.localeCompare(b, 'fr-FR'));
  fullNames.forEach(fullName => {
    const slug = TEAM_NAME_TO_SLUG[fullName.trim().toLowerCase()];
    const code = slug ? SLUG_TO_CODE[slug] : null;
    const a = document.createElement('a');
    a.href = '#';
    if(code){
      const img = document.createElement('img');
      img.className = 'team-option-logo';
      img.src = teamLogoPath(code);
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => { img.style.display = 'none'; };
      a.appendChild(img);
    }
    const label = document.createElement('span');
    label.textContent = fullName;
    a.appendChild(label);
    a.addEventListener('click', e => { e.preventDefault(); selectTeam(fullName, fullName, code); });
    els.teamModalGrid.appendChild(a);
  });
}

els.teamSwitchBtn.addEventListener('click', e => { e.stopPropagation(); els.teamModalBackdrop.hidden = false; });
els.teamModalClose.addEventListener('click', () => { els.teamModalBackdrop.hidden = true; });
els.teamModalBackdrop.addEventListener('click', e => { if(e.target === els.teamModalBackdrop) els.teamModalBackdrop.hidden = true; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') els.teamModalBackdrop.hidden = true; });

/* ---------- Semaines (lundi au dimanche) ---------- */
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const court = new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'short' });
function parseDate(str){
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Lundi de la semaine d'une date (AAAA-MM-JJ).
function lundi(str){
  const d = parseDate(str);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return iso(d);
}
function etiquetteSemaine(lun){
  const fin = parseDate(lun);
  fin.setDate(fin.getDate() + 6);
  return court.format(parseDate(lun)) + ' au ' + court.format(fin);
}
function formatJour(str){
  const d = parseDate(str);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
// « 8:00 PM » → minutes, pour classer les matchs d'une journée par heure.
function minutes(heure){
  const m = /(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(heure || '');
  if(!m) return 9999;
  let h = Number(m[1]) % 12;
  if(/pm/i.test(m[3] || '')) h += 12;
  else if(!m[3]) h = Number(m[1]);
  return h * 60 + Number(m[2]);
}

let semaines = [];       // lundis ayant au moins un match, dans l'ordre
let filtersBuilt = false;
const aujourdhui = iso(new Date());

// Semaine affichée par défaut : celle d'aujourd'hui, sinon la prochaine qui a des
// matchs (avant la saison : la première ; après : la dernière).
function semaineCourante(){
  const lun = lundi(aujourdhui);
  return semaines.find(s => s >= lun) || semaines[semaines.length - 1] || '';
}

function buildFilters(){
  semaines = Array.from(new Set(state.games.map(g => g.semaine))).sort();
  els.filterWeek.replaceChildren(
    ...semaines.map((s, i) => new Option(`Semaine ${i + 1} · ${etiquetteSemaine(s)}`, s)),
    new Option('Toute la saison', 'tout'));
  if(state.semaine !== 'tout' && !semaines.includes(state.semaine)) state.semaine = semaineCourante();
  if(filtersBuilt) return;
  filtersBuilt = true;
  buildTeamModal();
  els.filterWeek.addEventListener('change', () => { state.semaine = els.filterWeek.value; render(); });
  els.semPrec.addEventListener('click', () => deplacer(-1));
  els.semSuiv.addEventListener('click', () => deplacer(1));
  els.semAujourdhui.addEventListener('click', () => { state.semaine = semaineCourante(); render(); });
}

function deplacer(sens){
  const i = state.semaine === 'tout' ? semaines.indexOf(semaineCourante()) : semaines.indexOf(state.semaine) + sens;
  state.semaine = semaines[Math.max(0, Math.min(semaines.length - 1, i))];
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- Rendu ---------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function equipe(fullName, cote, gagnant, num){
  const slug = TEAM_NAME_TO_SLUG[(fullName || '').trim().toLowerCase()];
  const code = slug ? SLUG_TO_CODE[slug] : '';
  const wrap = el('span', 'match-equipe ' + cote + (gagnant ? ' is-gagnant' : '') + (state.team && fullName === state.team ? ' is-choisie' : ''));
  if(code){
    const img = el('img');
    img.src = teamLogoPath(code);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { img.style.visibility = 'hidden'; };
    wrap.append(img);
  }
  const lien = el(slug ? 'a' : 'span');
  if(slug) lien.href = 'equipe.html?team=' + slug;
  lien.title = fullName;
  lien.append(el('span', 'nom-long', (slug && SURNOMS[slug]) || fullName), el('span', 'nom-court', code || fullName));
  wrap.append(lien);
  // Match déclaré pour le 2e gardien de cette équipe.
  if(code && state.declMatch && state.declMatch.has(num + '|' + code)){
    const b = el('span', 'match-2eg', '2e G');
    b.title = '2e gardien';
    wrap.append(b);
  }
  return wrap;
}

function ligneMatch(g){
  const a = Number(g.awayScore), h = Number(g.homeScore);
  const joue = g.awayScore !== '' && g.homeScore !== '' && !isNaN(a) && !isNaN(h);
  const ligne = el('div', 'match');
  ligne.append(
    el('span', 'match-heure', joue ? 'Final' : g.time),
    equipe(g.away, 'visiteur', joue && a > h, g.num),
    el('span', 'match-score', joue ? g.awayScore : ''),
    el('span', 'match-at', '@'),
    el('span', 'match-score', joue ? g.homeScore : ''),
    equipe(g.home, 'domicile', joue && h > a, g.num));
  if(g.note) ligne.append(el('span', 'match-note', g.note));
  return ligne;
}

function render(){
  els.filterWeek.value = state.semaine;
  const i = semaines.indexOf(state.semaine);
  els.semPrec.disabled = state.semaine !== 'tout' && i <= 0;
  els.semSuiv.disabled = state.semaine !== 'tout' && i >= semaines.length - 1;

  const tout = state.semaine === 'tout';
  const games = state.games.filter(g =>
    (!state.team || g.away === state.team || g.home === state.team) && (tout || g.semaine === state.semaine));

  // Semaine → journée → matchs (classés par heure).
  const parSemaine = new Map();
  games.forEach(g => {
    if(!parSemaine.has(g.semaine)) parSemaine.set(g.semaine, new Map());
    const jours = parSemaine.get(g.semaine);
    if(!jours.has(g.date)) jours.set(g.date, []);
    jours.get(g.date).push(g);
  });

  els.groupsWrap.replaceChildren(...[...parSemaine.entries()].sort().map(([sem, jours]) => {
    const bloc = el('section', 'sem');
    const nb = [...jours.values()].reduce((t, l) => t + l.length, 0);
    const titre = el('h2', 'sem-titre', 'Semaine ' + (semaines.indexOf(sem) + 1));
    titre.append(el('span', null, `${etiquetteSemaine(sem)} · ${nb} match${nb > 1 ? 's' : ''}`));
    const grille = el('div', 'sem-jours');
    [...jours.entries()].sort().forEach(([date, liste]) => {
      const jour = el('div', 'jour' + (date === aujourdhui ? ' is-aujourdhui' : ''));
      const tete = el('div', 'jour-tete', formatJour(date) + (date === aujourdhui ? ' · aujourd’hui' : ''));
      tete.append(el('span', null, liste.length + ' match' + (liste.length > 1 ? 's' : '')));
      jour.append(tete);
      liste.sort((x, y) => minutes(x.time) - minutes(y.time)).forEach(g => jour.append(ligneMatch(g)));
      grille.append(jour);
    });
    bloc.append(titre, grille);
    return bloc;
  }));

  const total = state.games.length;
  els.rowCount.textContent = state.team
    ? `${games.length} match${games.length > 1 ? 's' : ''} affiché${games.length > 1 ? 's' : ''}`
    : `${total} matchs dans la saison`;
  els.emptyState.hidden = games.length !== 0;
  if(!games.length) els.emptyState.textContent = state.team ? 'Aucun match de cette équipe cette semaine.' : 'Aucun match cette semaine.';
}
els.retryBtn.addEventListener('click', () => loadData());

const cached = loadFromCache();
if(cached && cached.rows){
  applyData(cached.rows);
  toggle({ loading:false });
  els.lastUpdated.textContent = 'Dernières données enregistrées — actualisation en cours…';
  loadData({ background:true });
}else{
  loadData();
}
</script>
