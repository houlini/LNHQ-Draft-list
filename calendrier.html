<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<link rel="stylesheet" href="site.css">
<script src="site-nav.js"></script>
<style>
  /* ---------- Résumé (Masse salariale / Espace / stats) ---------- */
  .summary-stats{
    display:flex; flex-wrap:wrap; gap:10px;
    padding:14px clamp(16px,3vw,40px) 6px;
  }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 16px; min-width:100px;
  }
  .stat-card .stat-label{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  .stat-card .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; margin-top:2px; }
  .stat-card.is-money .stat-value{ color:var(--accent); }

  /* ---------- Groupes de matchs, en grille (plusieurs côte à côte si l'écran le permet) ---------- */
  #groupsWrap{
    display:grid; gap:20px; align-items:start;
    padding:0 clamp(16px,3vw,40px) 30px;
  }
  .section-block{ padding:0; }
  .section-title{
    display:flex; align-items:baseline; gap:8px;
    background:var(--accent); color:var(--accent-ink);
    padding:9px 16px; border-radius:var(--radius) var(--radius) 0 0;
    font-weight:700; text-transform:uppercase; letter-spacing:0.02em; font-size:13.5px;
  }
  .section-title .section-count{ font-weight:500; opacity:0.85; text-transform:none; letter-spacing:0; font-size:12.5px; }
  .section-block .table-wrap{ border-radius:0 0 var(--radius) var(--radius); border-top:none; margin:0; }
  .section-block table{ width:100%; }
  tr.total-row td{ background:var(--stripe) !important; font-weight:700; border-top:2px solid var(--accent); }
  .section-empty{
    border:1px solid var(--line); border-top:none; border-radius:0 0 var(--radius) var(--radius);
    padding:16px; color:var(--ink-muted); font-size:14px; text-align:center; background:var(--surface);
  }

  /* ---------- Choix de repêchage ---------- */
  .picks-block{ padding:14px clamp(16px,3vw,40px) 30px; }
  .picks-list{
    list-style:none; margin:0; padding:0;
    border:1px solid var(--line); border-top:none; border-radius:0 0 var(--radius) var(--radius);
    background:var(--surface);
  }
  .picks-list li{ padding:10px 16px; border-bottom:1px solid var(--line); font-size:14.5px; }
  .picks-list li:last-child{ border-bottom:none; }

  /* ---------- Sélecteur d'équipe (bannière orange) ---------- */
  .team-switch-btn{
    background:var(--surface); color:var(--ink);
    font-size:16px; padding:10px 18px; border-radius:9px; gap:12px;
    text-transform:none; letter-spacing:0; font-weight:700;
  }
  .team-switch-btn:hover{ background:var(--surface); opacity:0.9; }
  .team-switch-logo{ width:28px; height:28px; object-fit:contain; }

  .team-modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .team-modal{
    background:var(--surface); border-radius:14px; width:100%; max-width:680px;
    max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }
  .team-modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--line);
    font-weight:700; font-size:17px; position:sticky; top:0; background:var(--surface);
    color:var(--ink);
  }
  .team-modal-close{
    background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-muted);
    line-height:1; padding:4px;
  }
  .team-modal-close:hover{ color:var(--ink); }
  .team-modal-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:10px; padding:18px 20px;
  }
  .team-modal-grid a, .team-modal-grid span{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:16px 10px; border-radius:10px; border:1px solid var(--line);
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600; text-align:center;
  }
  .team-modal-grid a:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .team-modal-grid span.nav-dropdown-current{
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700;
  }
  .team-modal-grid .team-option-logo{ width:40px; height:40px; object-fit:contain; }

  /* ---------- Grand logo d'équipe ---------- */
  .team-hero{
    display:flex; align-items:center; gap:14px;
    padding:16px clamp(16px,3vw,40px) 0;
  }
  .team-hero-logo{ width:56px; height:56px; object-fit:contain; }
  .team-hero-name{
    font-family:'Oswald', 'IBM Plex Sans', sans-serif; text-transform:uppercase;
    font-size:26px; font-weight:500; margin:0; color:var(--ink);
  }

  /* ---------- Couleurs des statistiques résumé ---------- */
  .stat-card.is-positive .stat-value{ color:var(--positive); }
  .stat-card.is-negative .stat-value{ color:var(--negative); }

  /* ---------- Ordre de repêchage ---------- */
  .pick-num{
    display:inline-block; min-width:28px; text-align:center;
    font-family:'IBM Plex Mono', monospace; font-weight:700; color:var(--ink-muted);
  }
  .team-cell{ display:flex; align-items:center; gap:8px; }
  .team-cell img{ width:20px; height:20px; object-fit:contain; flex-shrink:0; }
  .team-cell a{ color:inherit; text-decoration:none; font-weight:600; }
  .team-cell a:hover{ text-decoration:underline; color:var(--accent); }
  /* ---------- Calendrier ---------- */
  /* 4 colonnes : Visiteur | but | Domicile | but. Le tableau remplit son bloc, et les
     blocs sont limités en largeur puis centrés pour que la bande de titre ne soit plus
     démesurée par rapport au contenu sur grand écran. */
  #groupsWrap{ grid-template-columns:repeat(auto-fit, minmax(340px, 460px)); justify-content:center; }
  .cal-block table{ table-layout:auto; width:100%; }
  .cal-block th, .cal-block td{ white-space:nowrap; vertical-align:middle; line-height:1.3; }
  .cal-block th:nth-child(2), .cal-block td:nth-child(2),
  .cal-block th:nth-child(4), .cal-block td:nth-child(4){ text-align:center; width:34px; }
  .cal-block .team-cell img{ width:18px; height:18px; }
  .cal-score{ font-family:'IBM Plex Mono', monospace; font-weight:700; }
  .cal-final{ color:var(--ink-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  .date-row td{
    background:var(--stripe) !important; font-weight:700; text-transform:uppercase;
    font-size:11.5px; letter-spacing:0.03em; color:var(--ink-muted); text-align:left !important;
  }
  .cal-note{ color:var(--ink-muted); font-size:11.5px; font-style:italic; white-space:normal; }
</style>
</head>
<body>

<div class="app">
  <site-header class="app-header" current-page="calendrier"></site-header>

  <div class="filter-band">
    <button class="nav-btn team-switch-btn" id="teamSwitchBtn" aria-haspopup="dialog">
      <img class="team-switch-logo" id="teamSwitchLogo" alt="" hidden>
      <span id="teamSwitchLabel">Toutes les équipes</span>
      <svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="filter-bar" id="filterBar">
      <div class="filter-control">
        <label for="filterPeriod">Période</label>
        <select id="filterPeriod"><option value="">Toutes</option></select>
      </div>
    </div>
  </div>

  <div class="team-modal-backdrop" id="teamModalBackdrop" hidden>
    <div class="team-modal" role="dialog" aria-modal="true" aria-label="Choisir une équipe">
      <div class="team-modal-header">
        <span>Choisir une équipe</span>
        <button class="team-modal-close" id="teamModalClose" aria-label="Fermer">✕</button>
      </div>
      <div class="team-modal-grid" id="teamModalGrid"></div>
    </div>
  </div>

  <main id="content">
    <div id="loader">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div id="errorText">Impossible de charger les données.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div id="dataWrap" hidden>
      <div id="groupsWrap"></div>
    </div>

    <p class="empty-state" id="emptyState" hidden></p>
  </main>
</div>

<script>
/* =========================================================================
   CONFIGURATION
   ========================================================================= */
const CONFIG = {
  SHEET_ID: '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A',
  GID: '1528349633', // onglet "SCHEDULE"
};

const els = {
  app: document.querySelector('.app'),
  title: document.getElementById('sheetTitle'),
  teamSwitchBtn: document.getElementById('teamSwitchBtn'),
  teamSwitchLogo: document.getElementById('teamSwitchLogo'),
  teamSwitchLabel: document.getElementById('teamSwitchLabel'),
  teamModalBackdrop: document.getElementById('teamModalBackdrop'),
  teamModalClose: document.getElementById('teamModalClose'),
  teamModalGrid: document.getElementById('teamModalGrid'),
  filterPeriod: document.getElementById('filterPeriod'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  errorText: document.getElementById('errorText'),
  retryBtn: document.getElementById('retryBtn'),
  dataWrap: document.getElementById('dataWrap'),
  groupsWrap: document.getElementById('groupsWrap'),
  emptyState: document.getElementById('emptyState'),
};

els.title.textContent = 'LNHQ';
document.title = 'Calendrier';

// Nom complet d'équipe (tel qu'écrit dans le calendrier) → slug de sa page.
const TEAM_NAME_TO_SLUG = {
  'anaheim ducks':'anaheim', 'boston bruins':'boston', 'buffalo sabres':'buffalo',
  'calgary flames':'calgary', 'carolina hurricanes':'carolina', 'chicago blackhawks':'chicago',
  'colorado avalanche':'colorado', 'columbus blue jackets':'columbus', 'dallas stars':'dallas',
  'detroit red wings':'detroit', 'edmonton oilers':'edmonton', 'florida panthers':'florida',
  'los angeles kings':'los-angeles', 'minnesota wild':'minnesota', 'montréal canadiens':'montreal',
  'montreal canadiens':'montreal', 'nashville predators':'nashville', 'new jersey devils':'new-jersey',
  'new york islanders':'ny-islanders', 'new york rangers':'ny-rangers', 'ottawa senators':'ottawa',
  'philadelphia flyers':'philadelphia', 'pittsburgh penguins':'pittsburgh', 'san jose sharks':'san-jose',
  'seattle kraken':'seattle', 'st. louis blues':'st-louis', 'st louis blues':'st-louis',
  'tampa bay lightning':'tampa-bay', 'toronto maple leafs':'toronto', 'utah mammoth':'utah',
  'utah hockey club':'utah', 'vancouver canucks':'vancouver', 'vegas golden knights':'vegas',
  'washington capitals':'washington', 'winnipeg jets':'winnipeg',
};
const SLUG_TO_CODE = {
  montreal:'MTL', toronto:'TOR', ottawa:'OTT', boston:'BOS', buffalo:'BUF', detroit:'DET',
  florida:'FLA', 'tampa-bay':'TBL', carolina:'CAR', columbus:'CBJ', 'new-jersey':'NJD',
  'ny-islanders':'NYI', 'ny-rangers':'NYR', philadelphia:'PHI', pittsburgh:'PIT',
  washington:'WSH', utah:'UTA', chicago:'CHI', colorado:'COL', dallas:'DAL', minnesota:'MIN',
  nashville:'NSH', 'st-louis':'STL', winnipeg:'WPG', anaheim:'ANA', calgary:'CGY',
  edmonton:'EDM', 'los-angeles':'LAK', 'san-jose':'SJS', seattle:'SEA', vancouver:'VAN',
  vegas:'VGK',
};
function teamLogoPath(code){ return 'Logos/' + code + '.png'; }

function teamCell(fullName){
  const wrap = document.createElement('span');
  wrap.className = 'team-cell';
  const slug = TEAM_NAME_TO_SLUG[(fullName || '').trim().toLowerCase()];
  const code = slug ? SLUG_TO_CODE[slug] : null;
  if(code){
    const img = document.createElement('img');
    img.src = teamLogoPath(code);
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => { img.style.display = 'none'; };
    wrap.appendChild(img);
  }
  if(slug){
    const a = document.createElement('a');
    a.href = 'equipe.html?team=' + slug;
    a.textContent = fullName;
    wrap.appendChild(a);
  }else{
    const span = document.createElement('span');
    span.textContent = fullName;
    wrap.appendChild(span);
  }
  return wrap;
}

/* =========================================================================
   Lecture du calendrier : blocs de période séparés par une ligne d'en-tête
   ========================================================================= */
function cellsToRows(table){
  return table.rows.map(r => (r.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? String(c.v) : '')) : ''));
}

function parseSchedule(rows){
  const games = [];
  let period = 0;
  rows.forEach(r => {
    const date = (r[1] || '').trim();
    const away = (r[3] || '').trim();
    // Une ligne d'en-tête ("Time" en colonne C) marque le début d'une nouvelle période.
    if((r[2] || '').trim().toLowerCase() === 'time'){ period++; return; }
    if(!/^\d{4}-\d{2}-\d{2}/.test(date) || away === '') return;
    games.push({
      num: (r[0] || '').trim(),
      date,
      time: (r[2] || '').trim(),
      away,
      awayScore: (r[5] || '').trim(),
      homeScore: (r[9] || '').trim(),
      home: (r[8] || '').trim(),
      note: (r[13] || '').trim(),
      period: Math.max(1, period),
    });
  });
  return games;
}

const state = { games: [], team: '', period: '' };

function buildUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${CONFIG.GID}&headers=0&t=${Date.now()}`;
}
const CACHE_KEY = 'calCache_' + CONFIG.SHEET_ID + '_' + CONFIG.GID;
function loadFromCache(){
  try{ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveToCache(rows){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ rows, ts: Date.now() })); }catch(e){}
}

function applyData(rows){
  state.games = parseSchedule(rows);
  buildFilters();
}

async function loadData({ background=false } = {}){
  if(!background) toggle({ loading:true });
  try{
    const res = await fetch(buildUrl());
    if(!res.ok) throw new Error('http_' + res.status);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
    if(!match) throw new Error('format_inattendu');
    const json = JSON.parse(match[1]);
    if(json.status === 'error'){
      throw new Error(json.errors && json.errors[0] && json.errors[0].reason || 'erreur_gviz');
    }
    const rows = cellsToRows(json.table);
    applyData(rows);
    saveToCache(rows);
    toggle({ loading:false });
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background) toggle({ loading:false, error:true });
  }
}

function toggle({ loading=false, error=false } = {}){
  els.loader.hidden = !loading;
  els.errorBox.hidden = !error;
  const showData = !loading && !error;
  els.dataWrap.hidden = !showData;
  if(showData) render();
}

/* ---------- Filtres ---------- */
// Sélecteur d'équipe : même fenêtre centrée avec logos que sur la page équipe.
function selectTeam(fullName, label, code){
  state.team = fullName;
  els.teamSwitchLabel.textContent = label;
  if(code){
    els.teamSwitchLogo.src = teamLogoPath(code);
    els.teamSwitchLogo.hidden = false;
    els.teamSwitchLogo.onerror = () => { els.teamSwitchLogo.hidden = true; };
  }else{
    els.teamSwitchLogo.hidden = true;
  }
  els.teamModalBackdrop.hidden = true;
  render();
}

function buildTeamModal(){
  els.teamModalGrid.innerHTML = '';
  // Option "toutes les équipes" en premier
  const all = document.createElement('a');
  all.href = '#';
  const allLabel = document.createElement('span');
  allLabel.textContent = 'Toutes les équipes';
  all.appendChild(allLabel);
  all.addEventListener('click', e => { e.preventDefault(); selectTeam('', 'Toutes les équipes', null); });
  els.teamModalGrid.appendChild(all);

  // Nom complet tel qu'il apparaît dans le calendrier, pour que le filtre corresponde.
  const fullNames = Array.from(new Set(state.games.flatMap(g => [g.away, g.home])))
    .filter(Boolean).sort((a, b) => a.localeCompare(b, 'fr-FR'));
  fullNames.forEach(fullName => {
    const slug = TEAM_NAME_TO_SLUG[fullName.trim().toLowerCase()];
    const code = slug ? SLUG_TO_CODE[slug] : null;
    const a = document.createElement('a');
    a.href = '#';
    if(code){
      const img = document.createElement('img');
      img.className = 'team-option-logo';
      img.src = teamLogoPath(code);
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => { img.style.display = 'none'; };
      a.appendChild(img);
    }
    const label = document.createElement('span');
    label.textContent = fullName;
    a.appendChild(label);
    a.addEventListener('click', e => { e.preventDefault(); selectTeam(fullName, fullName, code); });
    els.teamModalGrid.appendChild(a);
  });
}

els.teamSwitchBtn.addEventListener('click', e => { e.stopPropagation(); els.teamModalBackdrop.hidden = false; });
els.teamModalClose.addEventListener('click', () => { els.teamModalBackdrop.hidden = true; });
els.teamModalBackdrop.addEventListener('click', e => { if(e.target === els.teamModalBackdrop) els.teamModalBackdrop.hidden = true; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') els.teamModalBackdrop.hidden = true; });

let filtersBuilt = false;
function buildFilters(){
  if(filtersBuilt) return;
  filtersBuilt = true;

  buildTeamModal();

  const periods = Array.from(new Set(state.games.map(g => g.period))).sort((a, b) => a - b);
  periods.forEach(p => {
    const inPeriod = state.games.filter(g => g.period === p);
    const first = inPeriod[0], last = inPeriod[inPeriod.length - 1];
    const opt = document.createElement('option');
    opt.value = String(p);
    opt.textContent = `Période ${p} (${formatShortDate(first.date)} – ${formatShortDate(last.date)})`;
    els.filterPeriod.appendChild(opt);
  });

  els.filterPeriod.addEventListener('change', () => { state.period = els.filterPeriod.value; render(); });
}

/* ---------- Formatage des dates ---------- */
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function parseDate(str){
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatShortDate(str){
  const d = parseDate(str);
  return `${d.getDate()} ${MONTHS[d.getMonth()].substr(0,4)}`;
}
function formatLongDate(str){
  const d = parseDate(str);
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

/* ---------- Rendu ---------- */
function filteredGames(){
  return state.games.filter(g => {
    if(state.team && g.away !== state.team && g.home !== state.team) return false;
    if(state.period && String(g.period) !== state.period) return false;
    return true;
  });
}

function groupGames(games){
  const map = new Map();
  games.forEach(g => {
    const key = 'p' + g.period;
    if(!map.has(key)){
      const inPeriod = state.games.filter(x => x.period === g.period);
      const label = `Période ${g.period} — ${formatShortDate(inPeriod[0].date)} au ${formatShortDate(inPeriod[inPeriod.length-1].date)}`;
      map.set(key, { label, games: [] });
    }
    map.get(key).games.push(g);
  });
  return Array.from(map.values());
}

function render(){
  const games = filteredGames();
  const groups = groupGames(games);
  els.groupsWrap.innerHTML = '';

  groups.forEach(group => {
    const block = document.createElement('div');
    block.className = 'section-block cal-block';

    const title = document.createElement('div');
    title.className = 'section-title';
    const name = document.createElement('span');
    name.textContent = group.label;
    const count = document.createElement('span');
    count.className = 'section-count';
    count.textContent = group.games.length + (group.games.length > 1 ? ' matchs' : ' match');
    title.appendChild(name);
    title.appendChild(count);
    block.appendChild(title);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'table-wrap';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    ['Visiteur', '', 'Domicile', ''].forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    const tbody = document.createElement('tbody');

    // À l'intérieur d'un groupe, on sépare visuellement chaque journée (sauf en vue "jour",
    // où le titre du groupe est déjà la date).
    let lastDate = null;
    group.games.forEach((g, idx) => {
      if(g.date !== lastDate){
        lastDate = g.date;
        const dateTr = document.createElement('tr');
        dateTr.className = 'date-row';
        const td = document.createElement('td');
        td.colSpan = 4;
        td.textContent = formatLongDate(g.date);
        dateTr.appendChild(td);
        tbody.appendChild(dateTr);
      }
      const tr = document.createElement('tr');
      if(idx < 20) tr.classList.add('row-in');

      const tdAway = document.createElement('td');
      tdAway.appendChild(teamCell(g.away));
      const tdAwayScore = document.createElement('td');
      tdAwayScore.className = 'cal-score';
      tdAwayScore.textContent = g.awayScore;
      const tdHome = document.createElement('td');
      tdHome.appendChild(teamCell(g.home));
      if(g.note){
        const note = document.createElement('div');
        note.className = 'cal-note';
        note.textContent = g.note;
        tdHome.appendChild(note);
      }
      const tdHomeScore = document.createElement('td');
      tdHomeScore.className = 'cal-score';
      tdHomeScore.textContent = g.homeScore;

      tr.append(tdAway, tdAwayScore, tdHome, tdHomeScore);
      tbody.appendChild(tr);
    });

    table.appendChild(thead);
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    block.appendChild(tableWrap);
    els.groupsWrap.appendChild(block);
  });

  const total = state.games.length;
  const shown = games.length;
  els.rowCount.textContent = (state.team || state.period)
    ? `${shown} match${shown > 1 ? 's' : ''} sur ${total}`
    : `${total} match${total > 1 ? 's' : ''}`;

  els.emptyState.hidden = shown !== 0;
  if(shown === 0) els.emptyState.textContent = 'Aucun match pour cette sélection.';
}

els.retryBtn.addEventListener('click', () => loadData());

const cached = loadFromCache();
if(cached && cached.rows){
  applyData(cached.rows);
  toggle({ loading:false });
  els.lastUpdated.textContent = 'Dernières données enregistrées — actualisation en cours…';
  loadData({ background:true });
}else{
  loadData();
}
</script>
</body>
</html>
