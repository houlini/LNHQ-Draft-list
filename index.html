<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repêchage</title>
<link rel="icon" type="image/png" href="logo-lnhq.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@400;500&family=Roboto:wght@500;700&display=swap');

  :root{
    --bg:#FAFAF7;
    --surface:#FFFFFF;
    --ink:#181B20;
    --ink-muted:#6B7178;
    --accent:#E8590C;
    --accent-soft:#FBEADC;
    --accent-ink:#FFFFFF;
    --stripe:#F1EEE7;
    --line:#E5E2D9;
    --danger:#A3402F;
    --danger-soft:#F6E9E6;
    --radius:10px;
    --row-py:6px; --row-px:10px; --row-font:12.5px;
    --nav-dark:#2D333B;
    --nav-ink:#FFFFFF;
    --nav-ink-muted:rgba(255,255,255,0.72);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181B;
      --surface:#1D2125;
      --ink:#EDEBE4;
      --ink-muted:#9AA0A6;
      --accent:#FF7A33;
      --accent-soft:#3A2416;
      --accent-ink:#181B20;
      --stripe:#1A1D20;
      --line:#2C3033;
      --danger:#E08B78;
      --danger-soft:#2E211E;
    }
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{margin:0;padding:0; height:100%;}
  html{ font-size:16px; }
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
    font-size:clamp(15px, 1.1vw + 12px, 17px);
    line-height:1.5;
  }
  button, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .app{
    width:100%; max-width:none; margin:0;
    display:flex; flex-direction:column;
    flex:1; min-height:0;
  }

  /* ---------- En-tête ---------- */
  .app-header{
    flex-shrink:0;
    background:var(--nav-dark);
    padding:clamp(10px,2vw,16px) clamp(16px,3vw,40px) 10px;
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; }
  .brand-logo{ width:32px; height:32px; flex-shrink:0; object-fit:contain; }
  .app-title{
    color:var(--nav-ink);
    text-transform:uppercase;
    font-family:'Oswald', 'IBM Plex Sans', sans-serif;
    font-size:clamp(26px, 3.2vw + 12px, 40px); font-weight:400; letter-spacing:0;
    margin:0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .site-nav{ display:flex; align-items:center; gap:2px; flex-shrink:0; flex-wrap:wrap; }
  .nav-item{ position:relative; }

  .nav-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:none; cursor:pointer;
    color:var(--nav-ink); font-weight:700; text-transform:uppercase;
    font-size:12.5px; letter-spacing:0.03em;
    padding:8px 6px; border-radius:6px;
    white-space:nowrap; text-decoration:none;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.1); }
  .nav-btn .nav-caret, .nav-btn .nav-icon{ width:13px; height:13px; flex-shrink:0; }
  .nav-btn.is-loading .nav-icon{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ to { transform:rotate(360deg); } }

  .site-nav .nav-btn{ font-family:'Roboto', 'IBM Plex Sans', sans-serif; font-weight:700; letter-spacing:0.02em; }
  .nav-dropdown{ font-family:'Roboto', 'IBM Plex Sans', sans-serif; }

  .nav-dropdown{
    position:absolute; top:100%; right:0; margin-top:6px;
    background:var(--nav-dark); border:1px solid rgba(255,255,255,0.15);
    border-radius:8px; box-shadow:0 10px 28px rgba(0,0,0,0.35);
    padding:6px; min-width:170px; z-index:50;
    display:flex; flex-direction:column; gap:1px;
  }
  .nav-dropdown a, .nav-dropdown .nav-dropdown-current{
    display:block; padding:9px 12px; border-radius:6px;
    color:var(--nav-ink); text-decoration:none; font-size:13.5px; font-weight:500;
    text-transform:none; letter-spacing:normal; white-space:nowrap;
  }
  .nav-dropdown a:hover{ background:rgba(255,255,255,0.12); }
  .nav-dropdown .nav-dropdown-current{
    background:rgba(255,255,255,0.08); font-weight:700; color:var(--accent); cursor:default;
  }
  .nav-dropdown.teams-grid{
    display:grid; grid-template-columns:repeat(2, minmax(120px,1fr));
    min-width:280px; max-height:70vh; overflow-y:auto;
  }

  .meta-row{
    margin:10px 2px 0; font-size:clamp(12px, 0.3vw + 12px, 13.5px); color:var(--nav-ink);
    opacity:0.82;
    display:flex; justify-content:space-between; gap:8px;
  }

  /* ---------- Bannière orange : recherche, affichage, densité, filtres ---------- */
  .filter-band{
    flex-shrink:0;
    background:var(--accent);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
    padding:12px clamp(16px,3vw,40px);
  }
  .search-field{ position:relative; min-width:0; flex:1 1 200px; max-width:280px; }
  .search-field svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; stroke:var(--ink-muted); pointer-events:none;
  }
  .search-field input{
    width:100%; height:40px; padding:0 14px 0 38px;
    border:1px solid transparent; border-radius:9px;
    background:var(--surface); color:var(--ink); font-size:16px;
  }
  .filter-band .nav-btn{ border:1px solid rgba(255,255,255,0.4); }
  .filter-band .nav-btn:hover{ background:rgba(255,255,255,0.15); }
  .filter-band .nav-btn[aria-pressed="true"]{ background:rgba(255,255,255,0.25); }

  .filter-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
  }
  .filter-control{ display:flex; align-items:center; gap:6px; }
  .filter-control label{
    font-size:12.5px; color:var(--nav-ink); opacity:0.85; white-space:nowrap;
  }
  .filter-control select{
    height:36px; padding:0 28px 0 10px;
    border:1px solid rgba(255,255,255,0.5); border-radius:8px;
    background:var(--surface); color:var(--ink); font-size:13.5px;
    cursor:pointer;
  }
  .filter-control.filter-range input[type="range"]{
    width:140px; accent-color:var(--nav-dark);
  }
  .filter-control.filter-range .filter-range-value{
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    color:var(--nav-ink); min-width:80px;
  }

  /* ---------- Contenu ---------- */
  main{
    padding:10px clamp(16px,3vw,40px) 20px;
    flex:1; min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .status-box{
    display:flex; gap:10px; align-items:flex-start;
    padding:16px; border-radius:var(--radius); font-size:15px; line-height:1.55;
  }
  .status-box.error{ background:var(--danger-soft); color:var(--danger); }
  .status-box svg{width:20px; height:20px; flex-shrink:0; margin-top:1px;}
  .status-box .retry{
    margin-top:8px; display:inline-block; font-weight:600; cursor:pointer;
    text-decoration:underline; color:inherit; background:none; border:none; font-size:15px; padding:0;
  }

  .empty-state{ text-align:center; padding:48px 16px; color:var(--ink-muted); font-size:15px; }

  /* ---------- Squelette de chargement ---------- */
  .skeleton-row{
    height:38px; border-radius:6px; margin-bottom:8px;
    background:linear-gradient(90deg, var(--surface) 25%, var(--accent-soft) 37%, var(--surface) 63%);
    background-size:400% 100%;
    animation:shimmer 1.3s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  /* ---------- Tableau (large écran) ---------- */
  .table-wrap{ display:none; overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table{ width:auto; border-collapse:collapse; font-size:var(--row-font); }
  thead th{
    position:sticky; top:0;
    background:var(--stripe); text-align:left; font-weight:700;
    padding:calc(var(--row-py) + 2px) var(--row-px); border-bottom:2px solid var(--accent);
    cursor:pointer; user-select:none; white-space:nowrap;
    color:var(--ink);
  }
  thead th:hover{ color:var(--accent); }
  thead th .sort-mark{ margin-left:4px; color:var(--accent); }
  tbody td{
    padding:var(--row-py) var(--row-px); border-bottom:1px solid var(--line);
    vertical-align:top; white-space:nowrap;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:nth-child(even){ background:var(--stripe); }
  tbody tr:hover{ background:var(--accent-soft); }
  td.is-numeric, th.is-numeric{
    font-family:'IBM Plex Mono', monospace; text-align:right; font-variant-numeric:tabular-nums;
  }

  /* Colonnes mises en évidence (ex: D, Y) */
  td.col-highlight{
    background:var(--accent) !important; color:var(--accent-ink) !important;
    font-weight:600;
  }
  th.col-highlight{ background:var(--accent) !important; color:var(--accent-ink) !important; }
  th.col-highlight .sort-mark{ color:var(--accent-ink); }
  th.col-highlight:hover{ color:var(--accent-ink); }
  .row-field .value.is-highlight{
    background:var(--accent); color:var(--accent-ink);
    padding:2px 8px; border-radius:6px; font-weight:600;
  }
  .flag-icon{ border-radius:2px; vertical-align:middle; display:inline-block; }

  /* Première colonne gelée : reste visible pendant le défilement horizontal (utile sur mobile) */
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:2;
    background:var(--surface);
    box-shadow:2px 0 4px -2px rgba(0,0,0,0.18);
  }
  thead th:first-child{ z-index:3; }
  tbody tr:hover td:first-child{ background:var(--accent-soft); }

  .row-in{ animation:rowIn 0.35s ease both; }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .row-in{ animation:none; }
    .skeleton-row{ animation:none; }
  }

  /* ---------- Liste (mobile) ---------- */
  .list-wrap{ display:block; }
  .row-card{
    padding:16px 4px; border-bottom:1px solid var(--line);
  }
  .row-card:last-child{ border-bottom:none; }
  .row-title{ font-weight:600; font-size:18px; line-height:1.4; margin-bottom:9px; }
  .team-link{ color:inherit; text-decoration:none; }
  .team-link:hover{ text-decoration:underline; color:var(--accent); }
  .row-field{
    display:flex; justify-content:space-between; gap:16px;
    padding:5px 0; font-size:15px;
  }
  .row-field .label{ color:var(--ink-muted); flex-shrink:0; }
  .row-field .value{ text-align:right; }
  .row-field .value.is-numeric{
    font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;
  }

  /* Vue tableau imposée pour tout le monde, quel que soit l'appareil ou la largeur
     d'écran (la vue fiche n'est plus proposée). Sur mobile, le tableau défile
     horizontalement, avec la première colonne gelée. */
  .table-wrap{ display:block !important; }
  .list-wrap{ display:none !important; }
  /* Doit rester APRÈS la règle ci-dessus : à priorité égale, la dernière gagne, et
     l'attribut hidden doit continuer de masquer le tableau pendant le chargement. */
  [hidden]{ display:none !important; }

  @media (max-width:380px){
    .nav-btn .nav-btn-label{ font-size:11.5px; }
  }

  /* Confort accru pour grand écran : uniquement la vue liste mobile,
     le tableau desktop reste piloté par le bouton de densité */
  @media (min-width:1200px){
    .row-title{ font-size:19px; }
  }
</style>
</head>

<div class="app">

  SHEET_ID: '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A',

  // Le gid correspond à l'onglet (visible après "#gid=" dans l'URL). 0 = premier onglet.
  GID: '1424606319',

  // Colonnes à afficher comme un petit drapeau plutôt que du texte.

  // Colonnes à mettre en évidence (fond orange, texte blanc). Même syntaxe que HIDDEN_COLUMNS.

  HIGHLIGHT_COLUMNS: [3, 24],

function eaLinkFor(row){
  // Colonne B ("JOUEUR"), au format "Nom, Prénom" — on la convertit en "Prénom Nom"
  // pour chercher dans la base EA_PLAYERS (colonne A n'est plus utilisée, désormais vide).
  const raw = (row.raw[1] || '').trim();
  if(!raw) return null;
  const parts = raw.split(',');
  const key = (parts.length >= 2
    ? (parts[1].trim() + ' ' + parts[0].trim())
    : raw
  ).toLowerCase();
  const value = EA_PLAYERS[key];
  return value ? 'https://www.ea.com/games/nhl/ratings/player-ratings/' + value : null;
}

function buildUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${CONFIG.GID}&t=${Date.now()}`;
}

/* ---------- Cache local : affichage instantané au chargement suivant ---------- */
const CACHE_KEY = 'sheetCache_' + CONFIG.SHEET_ID + '_' + CONFIG.GID;

function loadFromCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToCache(table){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ table, ts: Date.now() }));
  }catch(e){ /* stockage indisponible ou plein : on ignore silencieusement */ }
}

async function loadData({ background=false } = {}){
  if(!background) toggle({ loading:true });
  try{
    const res = await fetch(buildUrl());
    if(!res.ok) throw new Error('http_' + res.status);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
    if(!match) throw new Error('format_inattendu');
    const json = JSON.parse(match[1]);
    if(json.status === 'error'){
      throw new Error(json.errors && json.errors[0] && json.errors[0].reason || 'erreur_gviz');
    }
    parseTable(json.table);
    saveToCache(json.table);
    toggle({ loading:false });
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background){
      toggle({ loading:false, error:true });
    }
    // En arrière-plan : on garde les données déjà affichées (issues du cache) et on retentera au prochain chargement.
  }
}

function makeColumnMatcher(list, rawLabels){
  const indices = new Set((list || []).filter(v => typeof v === 'number'));
  const labels = new Set((list || []).filter(v => typeof v === 'string').map(v => v.trim().toLowerCase()));
  return i => indices.has(i) || labels.has(rawLabels[i].trim().toLowerCase());
}

function parseTable(table){
  const rawLabels = table.cols.map((c, i) => c.label || c.id || ('Colonne ' + (i + 1)));
  state.rawLabels = rawLabels;
  const isHidden = makeColumnMatcher(CONFIG.HIDDEN_COLUMNS, rawLabels);
  const isFlag = makeColumnMatcher(CONFIG.FLAG_COLUMNS, rawLabels);
  const isHighlight = makeColumnMatcher(CONFIG.HIGHLIGHT_COLUMNS, rawLabels);

  state.columns = rawLabels
    .map((label, i) => ({
      rawLabel: label,
      label,
      isNumeric: table.cols[i].type === 'number',
      isFlag: isFlag(i),
      isHighlight: isHighlight(i),
    }))
    .filter((_, i) => !isHidden(i));

  state.rows = table.rows.map(r => {
    const raw = (r.c || []).map(cell =>
      cell ? (cell.f != null ? cell.f : (cell.v != null ? String(cell.v) : '')) : ''
    );
    const display = raw.filter((_, i) => !isHidden(i));
    return { display, raw };
  });

  renderFilterBar();
  applyFilterAndSort();
}

function parseNumericCell(raw){
  if(raw === '' || raw == null) return null;
  const n = parseFloat(String(raw).replace(/[^\d.-]/g, ''));
  return Number.isNaN(n) ? null : n;
}

function formatMoney(n){
  return new Intl.NumberFormat('fr-CA').format(Math.round(n)) + ' $';
}

function renderFilterBar(){
  els.filterBar.innerHTML = '';
  let any = false;

  (CONFIG.FILTER_COLUMNS || []).forEach(name => {
    const colIndex = state.rawLabels.findIndex(
      l => l.trim().toLowerCase() === String(name).trim().toLowerCase()
    );
    if(colIndex === -1) return;
    any = true;

    const order = (CONFIG.FILTER_VALUE_ORDER || {})[name];
    const values = Array.from(
      new Set(state.rows.map(r => r.raw[colIndex]).filter(v => v !== ''))
    ).sort((a, b) => {
      if(order){
        const ia = order.findIndex(o => o.toLowerCase() === a.trim().toLowerCase());
        const ib = order.findIndex(o => o.toLowerCase() === b.trim().toLowerCase());
        if(ia !== -1 || ib !== -1){
          if(ia === -1) return 1;
          if(ib === -1) return -1;
          return ia - ib;
        }
      }
      return a.localeCompare(b, 'fr-FR');
    });

    const wrap = document.createElement('div');
    wrap.className = 'filter-control';

    const label = document.createElement('label');
    label.textContent = (CONFIG.FILTER_LABELS || {})[name] || state.rawLabels[colIndex];
    label.htmlFor = 'filter-col-' + colIndex;

    const select = document.createElement('select');
    select.id = 'filter-col-' + colIndex;

    const optAll = document.createElement('option');
    optAll.value = '';
    optAll.textContent = 'Tous';
    select.appendChild(optAll);

    values.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      if(state.activeFilters.get(colIndex) === v) opt.selected = true;
      select.appendChild(opt);
    });

    select.addEventListener('change', () => {
      if(select.value === '') state.activeFilters.delete(colIndex);
      else state.activeFilters.set(colIndex, select.value);
      render();
    });

    wrap.appendChild(label);
    wrap.appendChild(select);
    els.filterBar.appendChild(wrap);
  });

  (CONFIG.MAX_FILTER_COLUMNS || []).forEach(entry => {
    const colIndex = state.rawLabels.findIndex(
      l => l.trim().toLowerCase() === String(entry.column).trim().toLowerCase()
    );
    if(colIndex === -1) return;

    const numbers = state.rows
      .map(r => parseNumericCell(r.raw[colIndex]))
      .filter(n => n !== null);
    if(!numbers.length) return;
    const dataMin = Math.min(...numbers);
    const dataMax = Math.max(...numbers);
    if(dataMin === dataMax) return;
    any = true;

    const step = Math.max(1, Math.round((dataMax - dataMin) / 100));
    const current = state.activeMaxFilters.has(colIndex) ? state.activeMaxFilters.get(colIndex) : dataMax;

    const wrap = document.createElement('div');
    wrap.className = 'filter-control filter-range';

    const label = document.createElement('label');
    label.textContent = entry.label;
    label.htmlFor = 'filter-max-' + colIndex;

    const input = document.createElement('input');
    input.type = 'range';
    input.id = 'filter-max-' + colIndex;
    input.min = dataMin;
    input.max = dataMax;
    input.step = step;
    input.value = current;

    const valueSpan = document.createElement('span');
    valueSpan.className = 'filter-range-value';
    valueSpan.textContent = formatMoney(current);

    input.addEventListener('input', () => {
      valueSpan.textContent = formatMoney(Number(input.value));
    });
    input.addEventListener('change', () => {
      const v = Number(input.value);
      if(v >= dataMax) state.activeMaxFilters.delete(colIndex);
      else state.activeMaxFilters.set(colIndex, v);
      render();
    });

    wrap.appendChild(label);
    wrap.appendChild(input);
    wrap.appendChild(valueSpan);
    els.filterBar.appendChild(wrap);
  });

  els.filterBar.hidden = !any;
}

// Codes pays à 3 lettres (norme CIO/IIHF, utilisée dans le hockey) → code ISO à 2 lettres
const NAT_TO_ISO2 = {
  can:'ca', usa:'us', swe:'se', fin:'fi', rus:'ru', cze:'cz', svk:'sk', ger:'de', sui:'ch',
  fra:'fr', den:'dk', nor:'no', lat:'lv', blr:'by', kaz:'kz', aut:'at', ita:'it', svn:'si',
  hun:'hu', pol:'pl', jpn:'jp', kor:'kr', chn:'cn', gbr:'gb', ned:'nl', ukr:'ua', est:'ee',
  ltu:'lt', rou:'ro', cro:'hr', srb:'rs', bul:'bg', esp:'es', aus:'au', nzl:'nz', rsa:'za',
  mex:'mx', bra:'br', arg:'ar', chi:'cl', isl:'is', irl:'ie', bel:'be', por:'pt', gre:'gr',
  tur:'tr', isr:'il', ind:'in', tha:'th', hkg:'hk', tpe:'tw', sgp:'sg', mas:'my', phi:'ph',
  ina:'id', mgl:'mn', geo:'ge', arm:'am', aze:'az', uzb:'uz', kgz:'kg', tkm:'tm', tjk:'tj',
  mda:'md', lux:'lu', mlt:'mt', cyp:'cy', and:'ad', mon:'mc', lie:'li', smr:'sm', bih:'ba',
  mkd:'mk', mne:'me', alb:'al',
};

function appendFlag(container, raw){
  const code = (raw || '').trim().toLowerCase();
  const iso2 = code.length === 2 ? code : NAT_TO_ISO2[code];
  if(iso2 && /^[a-z]{2}$/.test(iso2)){
    const img = document.createElement('img');
    img.src = `https://flagcdn.com/24x18/${iso2}.png`;
    img.alt = raw.toUpperCase();
    img.title = raw.toUpperCase();
    img.width = 24; img.height = 18;
    img.loading = 'lazy';
    img.className = 'flag-icon';
    img.onerror = () => { container.textContent = raw; };
    container.appendChild(img);
  }else{
    container.textContent = raw;
  }
}

function applyFilterAndSort(){
  const q = state.query.trim().toLocaleLowerCase('fr-FR');
  let rows = state.rows.filter(r => {
    for(const [colIndex, val] of state.activeFilters){
      if((r.raw[colIndex] || '') !== val) return false;
    }
    for(const [colIndex, maxVal] of state.activeMaxFilters){
      const v = parseNumericCell(r.raw[colIndex]);
      if(v !== null && v > maxVal) return false;
    }
    if(q && !r.display.some(v => v.toLocaleLowerCase('fr-FR').includes(q))) return false;
    return true;
  });

  if(state.sortCol >= 0){
    const col = state.sortCol;
    const numeric = state.columns[col] && state.columns[col].isNumeric;
    rows.sort((a, b) => {
      const av = a.display[col] || '';
      const bv = b.display[col] || '';
      if(numeric){
        return (parseFloat(av.replace(/[^\d.-]/g,'')) - parseFloat(bv.replace(/[^\d.-]/g,''))) * state.sortDir;
      }
      return av.localeCompare(bv, 'fr-FR') * state.sortDir;
    });
  }
  state.filtered = rows;
}

function toggle({ loading=false, error=false } = {}){
  els.loader.hidden = !loading;
  els.errorBox.hidden = !error;
  const showData = !loading && !error;
  els.tableWrap.hidden = !showData;
  els.listWrap.hidden = !showData;
  if(showData) render();
}

function render(){
  applyFilterAndSort();
  renderTableHead();
  renderTableBody();
  renderList();

  const total = state.rows.length;
  const shown = state.filtered.length;
  els.rowCount.textContent = state.query
    ? `${shown} résultat${shown > 1 ? 's' : ''} sur ${total}`
    : `${total} ligne${total > 1 ? 's' : ''}`;

  els.emptyState.hidden = shown !== 0;
  if(shown === 0){
    els.emptyState.textContent = state.query
      ? `Aucun résultat pour « ${state.query} ».`
      : 'Aucune donnée à afficher.';
  }
}

function renderTableHead(){
  els.tableHeadRow.innerHTML = '';
  state.columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col.label;
    if(col.isHighlight) th.classList.add('col-highlight');
    if(state.sortCol === i){
      const mark = document.createElement('span');
      mark.className = 'sort-mark';
      mark.textContent = state.sortDir === 1 ? '↑' : '↓';
      th.appendChild(mark);
    }
    th.addEventListener('click', () => {
      state.sortDir = (state.sortCol === i) ? -state.sortDir : 1;
      state.sortCol = i;
      render();
    });
    els.tableHeadRow.appendChild(th);
  });
}

function renderTableBody(){
  els.tableBody.innerHTML = '';
  state.filtered.forEach((row, idx) => {
    const tr = document.createElement('tr');
    if(idx < 20) tr.classList.add('row-in');
    if(idx < 20) tr.style.animationDelay = (idx * 25) + 'ms';
    row.display.forEach((val, i) => {
      const td = document.createElement('td');
      const col = state.columns[i];
      const link = i === 0 ? eaLinkFor(row) : null;
      if(link){
        const a = document.createElement('a');
        a.href = link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = val;
        a.className = 'team-link';
        td.appendChild(a);
      }else if(col && col.isFlag){
        appendFlag(td, val);
      }else{
        td.textContent = val;
        if(col && col.isNumeric) td.classList.add('is-numeric');
      }
      if(col && col.isHighlight) td.classList.add('col-highlight');
      tr.appendChild(td);
    });
    els.tableBody.appendChild(tr);
  });
}

function renderList(){
  els.listWrap.innerHTML = '';
  state.filtered.forEach((row, idx) => {
    const card = document.createElement('div');
    card.className = 'row-card';
    if(idx < 20) card.classList.add('row-in');
    if(idx < 20) card.style.animationDelay = (idx * 25) + 'ms';

    const title = document.createElement('div');
    title.className = 'row-title';
    const titleLink = eaLinkFor(row);
    if(titleLink){
      const a = document.createElement('a');
      a.href = titleLink;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = row.display[0] || '—';
      a.className = 'team-link';
      title.appendChild(a);
    }else{
      title.textContent = row.display[0] || '—';
    }
    card.appendChild(title);

    row.display.slice(1).forEach((val, i) => {
      if(val === '') return;
      const col = state.columns[i + 1];
      const field = document.createElement('div');
      field.className = 'row-field';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = col ? col.label : '';
      const value = document.createElement('span');
      value.className = 'value'
        + (col && col.isNumeric ? ' is-numeric' : '')
        + (col && col.isHighlight ? ' is-highlight' : '');
      if(col && col.isFlag){
        appendFlag(value, val);
      }else{
        value.textContent = val;
      }
      field.appendChild(label);
      field.appendChild(value);
      card.appendChild(field);
    });
    els.listWrap.appendChild(card);
  });
}

let searchTimer;
els.search.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    render();
  }, 200);
});

els.retryBtn.addEventListener('click', () => loadData());

const cached = loadFromCache();
if(cached && cached.table){
  parseTable(cached.table);
  toggle({ loading:false });
  els.lastUpdated.textContent = 'Dernières données enregistrées — actualisation en cours…';
  loadData({ background:true });
}else{
  loadData();
}
</script>
