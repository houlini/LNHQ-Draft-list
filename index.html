<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visionneuse de feuille</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#FAFAF7;
    --surface:#FFFFFF;
    --ink:#181B20;
    --ink-muted:#6B7178;
    --accent:#1F6E5C;
    --accent-soft:#E7F1EE;
    --line:#E5E2D9;
    --danger:#A3402F;
    --danger-soft:#F6E9E6;
    --radius:10px;
    --row-py:6px; --row-px:10px; --row-font:12.5px;
  }
  .app.is-comfortable{
    --row-py:13px; --row-px:16px; --row-font:15px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181B;
      --surface:#1D2125;
      --ink:#EDEBE4;
      --ink-muted:#9AA0A6;
      --accent:#57B79E;
      --accent-soft:#1E2C29;
      --line:#2C3033;
      --danger:#E08B78;
      --danger-soft:#2E211E;
    }
  }

  *{box-sizing:border-box;}
  [hidden]{ display:none !important; }
  html,body{margin:0;padding:0; height:100%;}
  html{ font-size:16px; }
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
    font-size:clamp(15px, 1.1vw + 12px, 17px);
    line-height:1.5;
  }
  button, input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .app{
    width:100%; max-width:none; margin:0;
    display:flex; flex-direction:column;
    flex:1; min-height:0;
  }

  /* ---------- En-tête ---------- */
  .app-header{
    flex-shrink:0;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:clamp(10px,2vw,16px) clamp(16px,3vw,40px) 10px;
  }
  .header-row{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:"title title" "search refresh";
    row-gap:12px; column-gap:10px;
    align-items:center;
  }
  .app-title{
    grid-area:title;
    font-size:clamp(19px, 2vw + 12px, 26px); font-weight:600; letter-spacing:-0.01em;
    margin:0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .search-field{
    grid-area:search;
    position:relative; min-width:0;
  }
  .search-field svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; stroke:var(--ink-muted); pointer-events:none;
  }
  .search-field input{
    width:100%; height:44px; padding:0 14px 0 38px;
    border:1px solid var(--line); border-radius:9px;
    background:var(--surface); color:var(--ink); font-size:16px;
  }
  .header-actions{
    grid-area:refresh;
    display:flex; gap:8px;
  }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink-muted); cursor:pointer; flex-shrink:0;
  }
  .icon-btn[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-muted);}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn.is-loading svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{ to { transform:rotate(360deg); } }

  @media (min-width:560px){
    .header-row{
      grid-template-columns:auto 1fr auto;
      grid-template-areas:"title search refresh";
    }
    .search-field{ max-width:300px; justify-self:end; }
  }

  .meta-row{
    margin:10px 2px 0; font-size:clamp(12px, 0.3vw + 12px, 13.5px); color:var(--ink-muted);
    display:flex; justify-content:space-between; gap:8px;
  }

  /* ---------- Contenu ---------- */
  main{
    padding:10px clamp(16px,3vw,40px) 20px;
    flex:1; min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .status-box{
    display:flex; gap:10px; align-items:flex-start;
    padding:16px; border-radius:var(--radius); font-size:15px; line-height:1.55;
  }
  .status-box.error{ background:var(--danger-soft); color:var(--danger); }
  .status-box svg{width:20px; height:20px; flex-shrink:0; margin-top:1px;}
  .status-box .retry{
    margin-top:8px; display:inline-block; font-weight:600; cursor:pointer;
    text-decoration:underline; color:inherit; background:none; border:none; font-size:15px; padding:0;
  }

  .empty-state{ text-align:center; padding:48px 16px; color:var(--ink-muted); font-size:15px; }

  /* ---------- Squelette de chargement ---------- */
  .skeleton-row{
    height:38px; border-radius:6px; margin-bottom:8px;
    background:linear-gradient(90deg, var(--surface) 25%, var(--accent-soft) 37%, var(--surface) 63%);
    background-size:400% 100%;
    animation:shimmer 1.3s ease infinite;
  }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  /* ---------- Tableau (large écran) ---------- */
  .table-wrap{ display:none; overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table{ width:auto; border-collapse:collapse; font-size:var(--row-font); }
  thead th{
    position:sticky; top:0;
    background:var(--surface); text-align:left; font-weight:600;
    padding:calc(var(--row-py) + 2px) var(--row-px); border-bottom:1px solid var(--line);
    cursor:pointer; user-select:none; white-space:nowrap;
    color:var(--ink-muted);
  }
  thead th:hover{ color:var(--ink); }
  thead th .sort-mark{ margin-left:4px; color:var(--accent); }
  tbody td{
    padding:var(--row-py) var(--row-px); border-bottom:1px solid var(--line);
    vertical-align:top; white-space:nowrap;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--accent-soft); }
  td.is-numeric, th.is-numeric{
    font-family:'IBM Plex Mono', monospace; text-align:right; font-variant-numeric:tabular-nums;
  }

  /* Première colonne gelée : reste visible pendant le défilement horizontal (utile sur mobile) */
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:2;
    background:var(--surface);
    box-shadow:2px 0 4px -2px rgba(0,0,0,0.18);
  }
  thead th:first-child{ z-index:3; }
  tbody tr:hover td:first-child{ background:var(--accent-soft); }

  .row-in{ animation:rowIn 0.35s ease both; }
  @keyframes rowIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){
    .row-in{ animation:none; }
    .skeleton-row{ animation:none; }
  }

  /* ---------- Liste (mobile) ---------- */
  .list-wrap{ display:block; }
  .row-card{
    padding:16px 4px; border-bottom:1px solid var(--line);
  }
  .row-card:last-child{ border-bottom:none; }
  .row-title{ font-weight:600; font-size:18px; line-height:1.4; margin-bottom:9px; }
  .row-field{
    display:flex; justify-content:space-between; gap:16px;
    padding:5px 0; font-size:15px;
  }
  .row-field .label{ color:var(--ink-muted); flex-shrink:0; }
  .row-field .value{ text-align:right; }
  .row-field .value.is-numeric{
    font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;
  }

  /* Bascule table / liste selon la largeur d'écran (mode "auto") */
  @media (min-width:700px){
    .table-wrap{ display:block; }
    .list-wrap{ display:none; }
  }

  /* Modes forcés par le bouton de vue : gagnent sur la largeur d'écran, quel que soit l'appareil */
  .app.view-table .table-wrap{ display:block !important; }
  .app.view-table .list-wrap{ display:none !important; }
  .app.view-list .table-wrap{ display:none !important; }
  .app.view-list .list-wrap{ display:block !important; }

  @media (max-width:380px){
    .icon-btn{ width:40px; height:40px; }
  }

  /* Confort accru pour grand écran : uniquement la vue liste mobile,
     le tableau desktop reste piloté par le bouton de densité */
  @media (min-width:1200px){
    .row-title{ font-size:19px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title" id="sheetTitle">Tableau de bord</h1>
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="searchInput" placeholder="Rechercher…" aria-label="Rechercher dans les données">
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="viewBtn" aria-label="Changer le mode d'affichage" title="Affichage automatique">
        </button>
        <button class="icon-btn" id="densityBtn" aria-pressed="false" aria-label="Basculer entre vue compacte et confortable" title="Vue compacte / confortable">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="Actualiser les données" title="Actualiser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="meta-row">
      <span id="rowCount" aria-live="polite"></span>
      <span id="lastUpdated"></span>
    </div>
  </header>

  <main id="content">
    <div id="loader">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>

    <div id="errorBox" class="status-box error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <div id="errorText">Impossible de charger les données.</div>
        <button class="retry" id="retryBtn">Réessayer</button>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" hidden>
      <table>
        <thead><tr id="tableHeadRow"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="list-wrap" id="listWrap" hidden></div>

    <p class="empty-state" id="emptyState" hidden></p>
  </main>
</div>

<script>
/* =========================================================================
   CONFIGURATION — à adapter à votre Google Sheet
   ========================================================================= */
const CONFIG = {
  // L'ID se trouve dans l'URL de votre feuille :
  // https://docs.google.com/spreadsheets/d/CET_ID_ICI/edit#gid=0
  SHEET_ID: '1WEyoL9bgrGSQmX2HmEWxW7cCRp1hw9fQAQti6y9eD4A',

  // Le gid correspond à l'onglet (visible après "#gid=" dans l'URL). 0 = premier onglet.
  GID: '1424606319',

  // Titre affiché en haut du widget.
  TITLE: 'LNHQ',

  // Colonnes à ne jamais afficher : un nombre = position (0 = colonne A, 1 = colonne B, ...),
  // un texte = nom exact de l'en-tête (insensible à la casse).
  // Ici : A, C, F, J, L, M, O, Q, R, S, T, U, V, X
  HIDDEN_COLUMNS: [0, 2, 5, 6, 9, 11, 12, 14, 16, 17, 18, 19, 20, 21, 22, 23],

};
/* ========================================================================= */

const els = {
  app: document.querySelector('.app'),
  title: document.getElementById('sheetTitle'),
  search: document.getElementById('searchInput'),
  viewBtn: document.getElementById('viewBtn'),
  densityBtn: document.getElementById('densityBtn'),
  refresh: document.getElementById('refreshBtn'),
  rowCount: document.getElementById('rowCount'),
  lastUpdated: document.getElementById('lastUpdated'),
  loader: document.getElementById('loader'),
  errorBox: document.getElementById('errorBox'),
  errorText: document.getElementById('errorText'),
  retryBtn: document.getElementById('retryBtn'),
  tableWrap: document.getElementById('tableWrap'),
  tableHeadRow: document.getElementById('tableHeadRow'),
  tableBody: document.getElementById('tableBody'),
  listWrap: document.getElementById('listWrap'),
  emptyState: document.getElementById('emptyState'),
};

/* ---------- Mode d'affichage : auto (selon la largeur) / tableau forcé / liste forcée ---------- */
const VIEW_MODES = ['auto', 'table', 'list'];
const VIEW_LABELS = {
  auto: 'Affichage automatique (selon la largeur d\u2019écran)',
  table: 'Vue tableau forcée',
  list: 'Vue liste forcée',
};
const VIEW_ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>',
  table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/><line x1="15" y1="10" x2="15" y2="20"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="4" rx="1"/><rect x="4" y="10" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg>',
};

function loadViewMode(){
  try{
    const saved = localStorage.getItem('sheetViewMode');
    if(VIEW_MODES.includes(saved)) return saved;
  }catch(e){}
  return 'auto';
}
function saveViewMode(mode){
  try{ localStorage.setItem('sheetViewMode', mode); }catch(e){}
}

let viewMode = loadViewMode();
function applyViewMode(){
  els.app.classList.remove('view-table', 'view-list');
  if(viewMode === 'table') els.app.classList.add('view-table');
  else if(viewMode === 'list') els.app.classList.add('view-list');
  els.viewBtn.innerHTML = VIEW_ICONS[viewMode];
  els.viewBtn.title = VIEW_LABELS[viewMode];
  els.viewBtn.setAttribute('aria-label', VIEW_LABELS[viewMode] + ', cliquer pour changer');
}
els.viewBtn.addEventListener('click', () => {
  viewMode = VIEW_MODES[(VIEW_MODES.indexOf(viewMode) + 1) % VIEW_MODES.length];
  applyViewMode();
  saveViewMode(viewMode);
});
applyViewMode();

function setDensity(comfortable){
  els.app.classList.toggle('is-comfortable', comfortable);
  els.densityBtn.setAttribute('aria-pressed', String(comfortable));
  els.densityBtn.title = comfortable ? 'Passer en vue compacte' : 'Passer en vue confortable';
}
els.densityBtn.addEventListener('click', () => {
  setDensity(els.densityBtn.getAttribute('aria-pressed') !== 'true');
});
setDensity(false); // compact par défaut : affiche le plus de lignes possible

els.title.textContent = CONFIG.TITLE;

const state = {
  columns: [],   // [{ label, isNumeric }]
  rows: [],      // [{ display: [...], numeric: [...] }]
  filtered: [],
  sortCol: -1,
  sortDir: 1,
  query: '',
};

function buildUrl(){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&gid=${CONFIG.GID}&t=${Date.now()}`;
}

/* ---------- Cache local : affichage instantané au chargement suivant ---------- */
const CACHE_KEY = 'sheetCache_' + CONFIG.SHEET_ID + '_' + CONFIG.GID;

function loadFromCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToCache(table){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ table, ts: Date.now() }));
  }catch(e){ /* stockage indisponible ou plein : on ignore silencieusement */ }
}

async function loadData({ background=false } = {}){
  if(!background) toggle({ loading:true });
  try{
    const res = await fetch(buildUrl());
    if(!res.ok) throw new Error('http_' + res.status);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);\s*$/);
    if(!match) throw new Error('format_inattendu');
    const json = JSON.parse(match[1]);
    if(json.status === 'error'){
      throw new Error(json.errors && json.errors[0] && json.errors[0].reason || 'erreur_gviz');
    }
    parseTable(json.table);
    saveToCache(json.table);
    toggle({ loading:false });
    els.lastUpdated.textContent = 'Mis à jour à ' + new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit' }).format(new Date());
  }catch(err){
    console.error(err);
    if(!background){
      toggle({ loading:false, error:true });
    }
    // En arrière-plan : on garde les données déjà affichées (issues du cache) et on retentera au prochain chargement.
  }
}

function parseTable(table){
  const hiddenList = CONFIG.HIDDEN_COLUMNS || [];
  const hiddenIndices = new Set(hiddenList.filter(v => typeof v === 'number'));
  const hiddenLabels = new Set(
    hiddenList.filter(v => typeof v === 'string').map(v => v.trim().toLowerCase())
  );
  const rawLabels = table.cols.map((c, i) => c.label || c.id || ('Colonne ' + (i + 1)));
  const isHidden = i => hiddenIndices.has(i) || hiddenLabels.has(rawLabels[i].trim().toLowerCase());

  state.columns = rawLabels
    .map((label, i) => ({ label, isNumeric: table.cols[i].type === 'number' }))
    .filter((_, i) => !isHidden(i));

  state.rows = table.rows.map(r => {
    const display = [];
    (r.c || []).forEach((cell, i) => {
      if(isHidden(i)) return;
      if(!cell){ display.push(''); return; }
      display.push(cell.f != null ? cell.f : (cell.v != null ? String(cell.v) : ''));
    });
    return { display };
  });

  applyFilterAndSort();
}

function applyFilterAndSort(){
  const q = state.query.trim().toLocaleLowerCase('fr-FR');
  let rows = !q ? state.rows.slice() : state.rows.filter(r =>
    r.display.some(v => v.toLocaleLowerCase('fr-FR').includes(q))
  );

  if(state.sortCol >= 0){
    const col = state.sortCol;
    const numeric = state.columns[col] && state.columns[col].isNumeric;
    rows.sort((a, b) => {
      const av = a.display[col] || '';
      const bv = b.display[col] || '';
      if(numeric){
        return (parseFloat(av.replace(/[^\d.-]/g,'')) - parseFloat(bv.replace(/[^\d.-]/g,''))) * state.sortDir;
      }
      return av.localeCompare(bv, 'fr-FR') * state.sortDir;
    });
  }
  state.filtered = rows;
}

function toggle({ loading=false, error=false } = {}){
  els.loader.hidden = !loading;
  els.errorBox.hidden = !error;
  const showData = !loading && !error;
  els.tableWrap.hidden = !showData;
  els.listWrap.hidden = !showData;
  if(showData) render();
}

function render(){
  applyFilterAndSort();
  renderTableHead();
  renderTableBody();
  renderList();

  const total = state.rows.length;
  const shown = state.filtered.length;
  els.rowCount.textContent = state.query
    ? `${shown} résultat${shown > 1 ? 's' : ''} sur ${total}`
    : `${total} ligne${total > 1 ? 's' : ''}`;

  els.emptyState.hidden = shown !== 0;
  if(shown === 0){
    els.emptyState.textContent = state.query
      ? `Aucun résultat pour « ${state.query} ».`
      : 'Aucune donnée à afficher.';
  }
}

function renderTableHead(){
  els.tableHeadRow.innerHTML = '';
  state.columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col.label;
    if(col.isNumeric) th.classList.add('is-numeric');
    if(state.sortCol === i){
      const mark = document.createElement('span');
      mark.className = 'sort-mark';
      mark.textContent = state.sortDir === 1 ? '↑' : '↓';
      th.appendChild(mark);
    }
    th.addEventListener('click', () => {
      state.sortDir = (state.sortCol === i) ? -state.sortDir : 1;
      state.sortCol = i;
      render();
    });
    els.tableHeadRow.appendChild(th);
  });
}

function renderTableBody(){
  els.tableBody.innerHTML = '';
  state.filtered.forEach((row, idx) => {
    const tr = document.createElement('tr');
    if(idx < 20) tr.classList.add('row-in');
    if(idx < 20) tr.style.animationDelay = (idx * 25) + 'ms';
    row.display.forEach((val, i) => {
      const td = document.createElement('td');
      td.textContent = val;
      if(state.columns[i] && state.columns[i].isNumeric) td.classList.add('is-numeric');
      tr.appendChild(td);
    });
    els.tableBody.appendChild(tr);
  });
}

function renderList(){
  els.listWrap.innerHTML = '';
  state.filtered.forEach((row, idx) => {
    const card = document.createElement('div');
    card.className = 'row-card';
    if(idx < 20) card.classList.add('row-in');
    if(idx < 20) card.style.animationDelay = (idx * 25) + 'ms';

    const title = document.createElement('div');
    title.className = 'row-title';
    title.textContent = row.display[0] || '—';
    card.appendChild(title);

    row.display.slice(1).forEach((val, i) => {
      if(val === '') return;
      const col = state.columns[i + 1];
      const field = document.createElement('div');
      field.className = 'row-field';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = col ? col.label : '';
      const value = document.createElement('span');
      value.className = 'value' + (col && col.isNumeric ? ' is-numeric' : '');
      value.textContent = val;
      field.appendChild(label);
      field.appendChild(value);
      card.appendChild(field);
    });
    els.listWrap.appendChild(card);
  });
}

let searchTimer;
els.search.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value;
    render();
  }, 200);
});

function refresh(){
  els.refresh.classList.add('is-loading');
  loadData({ background:true }).finally(() => els.refresh.classList.remove('is-loading'));
}
els.refresh.addEventListener('click', refresh);
els.retryBtn.addEventListener('click', () => loadData());

const cached = loadFromCache();
if(cached && cached.table){
  parseTable(cached.table);
  toggle({ loading:false });
  els.lastUpdated.textContent = 'Dernières données enregistrées — actualisation en cours…';
  loadData({ background:true });
}else{
  loadData();
}
</script>
</body>
</html>
